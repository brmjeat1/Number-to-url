<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #1a1a1a; /* لون الخلفية المعتمد */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-title {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .highlight-text {
            font-size: 32px; /* تكبير الحجم بين العاكفين */
            font-weight: bold;
            color: #4CAF50; /* لون مميز للتركيز */
        }

        .main-container {
            background-color: #ffffff;
            width: 92%; /* إظهاره يميناً وشمالاً بشكل متوازن */
            min-height: 450px; /* طول مقارب للون الأخضر */
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); /* ظل منبثق */
            padding: 40px 20px; /* زيادة المساحة فوق وتحت */
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-bottom: 40px;
        }

        .x-logo {
            margin-top: 20px;
            text-decoration: none;
        }

        .x-logo svg {
            width: 30px;
            height: 30px;
            fill: #000000; /* لون أيقونة X */
            transition: transform 0.3s;
        }

        .x-logo:hover svg {
            transform: scale(1.1);
        }

        .footer-signature {
            color: #ffffff;
            font-size: 12px;
            text-align: center;
            margin-top: auto;
            padding: 20px;
            line-height: 1.6;
        }

        /* تنسيق الروابط */
        a {
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="header-title">
        توجيه <span class="highlight-text">"الأرقام إلى روابط"</span> لمنصة إلكتروني
    </div>

    <div class="main-container">
        <p>ارجع لطلب الصفحة الان</p>

        <a href="https://x.com/your_profile" class="x-logo" target="_blank">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
            </svg>
        </a>
    </div>

    <div class="footer-signature">
        تم تطوير المحرك البرمجي بواسطة Electrwni,، الكويت، بنية بمعمارية عالية الأداء، Built with High-Performance Architecture, by electrwni, kuwait
    </div>

</body>
</html>
