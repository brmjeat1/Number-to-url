<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني - مدير الروابط والتحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #072AC8; 
            --primary-light: #1e46f5;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.7);
            --text-dark: #0f172a !important;
            --text-muted: #475569 !important;
            --success: #16a34a;
            --danger: #dc2626;
        }
        
        body { 
            margin: 0; 
            font-family: 'Tajawal', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #f8fafc !important;
            background-image: 
                radial-gradient(at top left, #e0f2fe 0px, transparent 50%),
                radial-gradient(at bottom right, #eff6ff 0px, transparent 50%) !important;
            background-attachment: fixed;
        }

        /* الهيدر العلوي ويحتوي على صفحة التحويل للبايو مبرزة */
        .header-box { 
            background: rgba(255, 255, 255, 0.7) !important; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            width: 100%; 
            min-height: 70px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 10px 24px; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
        }
        
        .brand-area { display: flex; align-items: center; gap: 8px; color: var(--text-dark); font-weight: 700; }
        .brand-area i { color: var(--primary); font-size: 1.3rem; }

        /* حاوية رابط البايو للزوار مبرزة في الأعلى */
        .bio-link-container {
            background: rgba(7, 42, 200, 0.06);
            border: 1px dashed var(--primary);
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .bio-title { font-size: 0.8rem; font-weight: 700; color: var(--primary); }
        .bio-url { font-size: 0.9rem; font-weight: 700; color: var(--text-dark); direction: ltr; }
        .btn-copy-top { background: var(--primary); color: #fff; border: none; padding: 4px 10px; border-radius: 6px; font-family: 'Tajawal'; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-copy-top:hover { background: var(--primary-light); }
        
        .logout-btn {
            background: rgba(220, 38, 38, 0.08); color: var(--danger); border: none;
            padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer;
            font-family: 'Tajawal', sans-serif; transition: all 0.2s;
        }
        .logout-btn:hover { background: var(--danger); color: #fff; }

        .dashboard-container {
            width: 92%; max-width: 600px; margin: 40px auto;
        }

        .white-wrapper { 
            background: var(--glass-bg) !important; backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 24px; box-shadow: 0 25px 50px rgba(15, 23, 42, 0.06); 
            padding: 30px; box-sizing: border-box; 
        }

        .section-title {
            color: var(--text-dark); font-weight: 700; font-size: 1.2rem;
            margin-top: 0; margin-bottom: 25px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 12px;
        }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--text-dark); }

        input {
            width: 100%; padding: 12px 14px; font-size: 0.95rem; font-family: 'Tajawal', sans-serif;
            border: 2px solid rgba(7, 42, 200, 0.08) !important; border-radius: 12px !important; outline: none;
            background: #fff !important; color: var(--text-dark) !important; box-sizing: border-box;
            font-weight: 500;
        }
        input:focus { border-color: var(--primary) !important; box-shadow: 0 0 15px rgba(7, 42, 200, 0.06) !important; }
        input[readonly] { background: rgba(0,0,0,0.02) !important; border-color: rgba(0,0,0,0.05) !important; color: var(--text-muted) !important; }

        .btn-save {
            width: 100%; padding: 14px; background: var(--success); color: white; border: none;
            border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer;
            font-family: 'Tajawal', sans-serif; margin-top: 10px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
            transition: all 0.2s;
        }
        .btn-save:hover { background: #15803d; transform: translateY(-1px); }

        .footer { 
            background: rgba(255, 255, 255, 0.7); border-top: 1px solid var(--glass-border); 
            width: 100%; padding: 20px; color: var(--text-muted); font-size: 0.85rem; 
            text-align: center; box-sizing: border-box; margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- الهيدر مدمج به صفحة التحويل للبايو بشكل بارز جداً للمشاركة الفورية -->
    <div class="header-box">
        <div class="brand-area"><i class="fa-solid fa-bolt"></i> إلكتروني</div>
        
        <div class="bio-link-container">
            <span class="bio-title"><i class="fa-solid fa-link"></i> صفحة التحويل (للبايو):</span>
            <span class="bio-url" id="topBioUrl">electrwni.link/index.html</span>
            <button class="btn-copy-top" onclick="copyBio()">نسخ الرابط</button>
        </div>

        <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <div class="dashboard-container">
        <div class="white-wrapper">
            <div class="section-title"><i class="fa-solid fa-folder-gear" style="color:var(--primary);"></i> مدير روابط ومحرك المنصة</div>
            
            <div class="form-group">
                <label>حساب الأدمن الحالي</label>
                <input type="email" id="adminEmail" readonly value="جاري الجلب من Firebase...">
            </div>

            <div class="form-group">
                <label>تخصيص وربط الدومين الفرعي الشخصي</label>
                <input type="text" placeholder="مثال: mylink.com" id="userDomain">
            </div>

            <div class="form-group">
                <label>إيميل الطوارئ واستعادة المعرفات</label>
                <input type="email" placeholder="أدخل البريد البديل لحماية الروابط">
            </div>

            <div class="form-group">
                <label>تحديث كلمة المرور الحالية</label>
                <input type="password" placeholder="••••••••">
            </div>

            <button class="btn-save" onclick="alert('تم حفظ البيانات وتحديث مدير الروابط بالخادم!')">حفظ وإطلاق التغييرات التفاعلية</button>
        </div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت بنية بمعمارية عالية الأداء <br>
        Built with High-Performance Architecture, by electrwni, kuwait
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        firebase.initializeApp(firebaseConfig);

        // التحقق التلقائي الصارم من حالة الأدمن لمنع الدخول العشوائي
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('adminEmail').value = user.email;
            } else {
                window.location.href = 'signin.html';
            }
        });

        function logout() {
            firebase.auth().signOut().then(() => { window.location.href = 'signin.html'; });
        }

        function copyBio() {
            const dummy = document.createElement('input');
            const text = window.location.origin + "/index.html"; 
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);
            alert("تم نسخ رابط صفحة التحويل العامة الخاصة بالبايو: " + text);
        }
    </script>
</body>
</html>
