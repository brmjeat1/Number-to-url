<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة التحكم — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<style>
:root{
  --primary:#3d5af1;--primary-light:#6c8fff;--bg:#ffffff;--bg2:#f9f9f9;
  --border:#e8ecf5;--text:#0f1535;--text2:#3a4270;--muted:#9aa2c8;
  --success:#0ab87a;--error:#e8436a;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Tajawal',sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;
}

/* ========== TOPBAR ========== */
.topbar{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;padding:12px 20px;display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.05);
}

.topbar-brand{font-family:'Space Mono',monospace;font-size:1rem;font-weight:900;}

.topbar-btns{display:flex;gap:8px;}

.btn{
  padding:8px 16px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:0.85rem;
  transition:all .2s;
}

.btn-white{background:#fff;color:var(--primary);}
.btn-white:active{transform:scale(0.95);}

.btn-logout{background:rgba(255,255,255,0.2);color:#fff;border:1px solid rgba(255,255,255,0.4);}
.btn-logout:active{transform:scale(0.95);}

/* ========== CONTAINER ========== */
.container{max-width:900px;margin:0 auto;padding:24px 20px;}

/* ========== NAV TABS ========== */
.nav-tabs{
  display:flex;gap:10px;margin-bottom:24px;border-bottom:2px solid var(--border);
  overflow-x:auto;padding-bottom:0;
}

.nav-tab{
  background:transparent;border:none;color:var(--text2);
  padding:12px 16px;font-weight:700;cursor:pointer;
  border-bottom:3px solid transparent;transition:all .2s;font-size:0.95rem;
}

.nav-tab:active{transform:scale(0.98);}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary);}

/* ========== PAGES ========== */
.page{display:none;}
.page.active{display:block;}

/* ========== EXPANDABLE BOX ========== */
.expandable{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  margin-bottom:16px;overflow:hidden;
}

.expandable-header{
  padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;transition:all .2s;
}

.expandable-header:hover{background:#f5f5f5;}
.expandable-header.open{background:var(--primary-light);color:#fff;}

.expandable-title{font-size:1rem;font-weight:900;display:flex;align-items:center;gap:8px;}

.expandable-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;flex-shrink:0;
}

.expandable-toggle{font-size:1.2rem;transition:transform .3s;}
.expandable-header.open .expandable-toggle{transform:rotate(180deg);}

.expandable-content{
  display:none;padding:20px;max-height:0;overflow:hidden;transition:all .3s;
  border-top:1px solid var(--border);background:var(--bg);
}

.expandable-header.open+.expandable-content{
  display:block;max-height:3000px;
}

/* ========== FORM ========== */
.form-group{margin-bottom:14px;}

label{
  display:block;font-size:0.85rem;font-weight:700;margin-bottom:6px;
  color:var(--text2);
}

input[type=text],input[type=url],input[type=number],input[type=email],input[type=tel],textarea,select{
  width:100%;padding:10px 12px;border:1.5px solid var(--border);
  border-radius:8px;font-family:'Tajawal',sans-serif;font-size:0.9rem;
  outline:none;transition:border .2s;background:var(--bg);
}

input:focus,textarea:focus,select:focus{border-color:var(--primary);}

textarea{resize:vertical;min-height:60px;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr;}
}

/* ========== BUTTONS ========== */
.btn-add{
  background:var(--success);color:#fff;padding:12px 24px;border:none;
  border-radius:8px;cursor:pointer;font-weight:700;font-family:'Tajawal',sans-serif;
  width:100%;transition:all .2s;font-size:0.95rem;
}

.btn-add:active{transform:scale(0.98);}

.btn-pdf{
  background:var(--error);color:#fff;padding:12px 24px;border:none;
  border-radius:8px;cursor:pointer;font-weight:700;font-family:'Tajawal',sans-serif;
  width:100%;margin-top:16px;font-size:0.95rem;transition:all .2s;
}

.btn-pdf:active{transform:scale(0.98);}

/* ========== ITEMS ========== */
.item{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .2s;
  display:flex;justify-content:space-between;align-items:center;
}

.item:hover{border-color:var(--primary);background:#f9f9f9;}
.item.open{background:var(--primary-light);color:#fff;border-color:var(--primary);}

.item-header{flex:1;font-weight:700;font-size:0.95rem;}
.item-toggle{font-size:1.1rem;transition:transform .3s;}
.item.open .item-toggle{transform:rotate(180deg);}

.item-details{
  display:none;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(0,0,0,0.1);
}

.item.open .item-details{display:block;}

.detail-row{display:flex;gap:8px;margin-bottom:6px;font-size:0.85rem;}
.detail-label{font-weight:700;min-width:60px;}

.btn-delete{
  background:var(--error);color:#fff;padding:6px 12px;border:none;
  border-radius:6px;cursor:pointer;font-size:0.8rem;font-weight:700;
  transition:all .2s;
}

.btn-delete:active{transform:scale(0.95);}

/* ========== TABLE ========== */
table{width:100%;border-collapse:collapse;font-size:0.85rem;margin-top:12px;}

th,td{padding:10px;text-align:right;border-bottom:1px solid var(--border);}

th{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;font-weight:900;
}

tr:hover{background:var(--bg2);}

/* ========== PAGINATION ========== */
.pagination{
  display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap;
}

.pagination button{
  padding:6px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg);cursor:pointer;font-weight:700;font-size:0.9rem;
  transition:all .2s;
}

.pagination button.active{
  background:var(--primary);color:#fff;border-color:var(--primary);
}

.pagination button:active{transform:scale(0.95);}

/* ========== EMPTY ========== */
.empty{text-align:center;padding:30px;color:var(--muted);}

/* ========== TOAST ========== */
.toast{
  position:fixed;bottom:20px;left:20px;background:var(--text);
  color:var(--bg);padding:12px 20px;border-radius:8px;
  font-weight:700;font-size:0.9rem;opacity:0;transform:translateY(20px);
  transition:all .3s;z-index:100;
}

.toast.show{opacity:1;transform:translateY(0);}

/* ========== أداة قص الصور (Cropper Modal) ========== */
.crop-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;
  display:none;align-items:center;justify-content:center;padding:16px;
}
.crop-overlay.open{display:flex;}

.crop-box{
  background:var(--bg);border-radius:14px;max-width:480px;width:100%;
  max-height:90vh;overflow:hidden;display:flex;flex-direction:column;
}

.crop-header{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:900;}

.crop-image-area{
  flex:1;min-height:0;background:#1a1a1a;display:flex;align-items:center;justify-content:center;
  max-height:400px;overflow:hidden;
}
.crop-image-area img{display:block;max-width:100%;}

.crop-actions{
  padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;
}

.crop-btn{
  flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:0.9rem;transition:all .2s;
}
.crop-btn:active{transform:scale(0.97);}
.crop-btn-confirm{background:var(--success);color:#fff;}
.crop-btn-cancel{background:var(--bg2);color:var(--text);border:1px solid var(--border);}

@media(max-width:600px){
  .container{padding:16px 12px;}
  .expandable-header{padding:12px 14px;}
  .expandable-content{padding:14px;}
  table{font-size:0.8rem;}
  th,td{padding:8px;}
}
</style>
</head>

<!-- ========== TOPBAR ========== -->

<!-- ========== CROPPER.JS (أداة قص الصور) ========== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<script>
const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth();
const db=firebase.firestore();

// ========================================================================
// هوية المستخدم بالكامل تُشتق من auth.currentUser.uid فقط.
// لا نثق بـ localStorage كمصدر هوية إطلاقاً — هو فقط cache للعرض.
// ========================================================================
let currentUid=null;
let user=null,allLinks=[],currentPage=1;
let allSocials=[],pendingSocIcon=null;

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

// ========== بوابة المصادقة الحقيقية ==========
auth.onAuthStateChanged(async (fbUser)=>{
  if(!fbUser){
    // لا يوجد جلسة Firebase حقيقية ->ارجع لتسجيل الدخول دائماً
    localStorage.removeItem('elUserUsername');
    window.location.href='signin.html';
    return;
  }
  if(!fbUser.emailVerified){
    toast('يرجى تأكيد بريدك أولاً');
    await auth.signOut();
    window.location.href='signin.html';
    return;
  }
  currentUid=fbUser.uid;
  await loadUserData();
});

async function loadUserData(){
  try{
    const ref=db.collection('users').doc(currentUid);
    const doc=await ref.get();
    if(!doc.exists){
      toast('بيانات الحساب غير موجودة');
      await auth.signOut();
      window.location.href='signin.html';
      return;
    }

    user=doc.data();
    localStorage.setItem('elUserUsername',user.username); // cache فقط، ليس مصدر الهوية

    allLinks=(user.links||[]).sort((a,b)=>a.num-b.num);
    allSocials=user.socials||[];

    document.getElementById('pfUser').value=user.username||'';
    document.getElementById('myFullLink').textContent='electrwni.link/page.html#'+user.username;
    document.getElementById('pfEmail').value=user.email||'';
    document.getElementById('pfName').value=user.displayName||'';
    document.getElementById('pfPhone').value=user.phone||'';
    document.getElementById('pfBio').value=user.bio||'';
    document.getElementById('pfLocation').value=user.location||'';

    if(user.bannerImage)document.getElementById('bannerPreview').style.backgroundImage=`url(${user.bannerImage})`;
    if(user.avatar){
      document.getElementById('avatarPreview').innerHTML=`<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
    }else if(user.displayName){
      document.getElementById('avatarPreview').textContent=user.displayName[0].toUpperCase();
    }

    renderRegistry();
    renderStats();
    renderSocials();

    // مزامنة فورية: أي تغيير بقاعدة البيانات (من جهاز آخر مثلاً) ينعكس هنا تلقائياً
    ref.onSnapshot(d=>{
      if(d.exists){
        user=d.data();
        allLinks=(user.links||[]).sort((a,b)=>a.num-b.num);
        allSocials=user.socials||[];
        renderRegistry();
        renderStats();
        renderSocials();
      }
    });

  }catch(e){
    console.error('loadUserData error:',e);
    toast('خطأ بتحميل البيانات: '+e.message);
  }
}

// ========== دالة حفظ موحّدة، تستخدم uid الحقيقي دائماً ==========
async function saveField(fields){
  if(!currentUid){toast('لست مسجل دخول');return false;}
  try{
    await db.collection('users').doc(currentUid).update(fields);
    return true;
  }catch(e){
    console.error('saveField error:',e);
    toast('فشل الحفظ: '+e.message);
    return false;
  }
}

// ========== التنقل بين الصفحات ==========
function showPage(n,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  if(el)el.classList.add('active');
}

// ========== سجل الروابط ==========
function renderRegistry(){
  if(!allLinks.length){
    document.getElementById('linksRegistry').innerHTML='<div class="empty">لا توجد روابط</div>';
    return;
  }
  document.getElementById('linksRegistry').innerHTML=allLinks.map(l=>`
    <div class="item" onclick="this.classList.toggle('open')">
      <div style="flex:1;">
        <div class="item-header">${l.num} — ${l.label}${l.featured?' <span style="font-size:0.7rem;background:var(--primary);color:#fff;padding:2px 6px;border-radius:6px;">مميّز</span>':''}</div>
        <div class="item-details">
          <div class="detail-row"><span class="detail-label">الوصف:</span> ${l.desc||'-'}</div>
          <div class="detail-row"><span class="detail-label">الرابط:</span> <a href="${l.url}" target="_blank" style="color:var(--primary);">فتح</a></div>
          <div class="detail-row"><span class="detail-label">المشاهدات:</span> ${l.clicks||0}</div>
          <button class="btn-delete" onclick="toggleFeatured(${l.id},event)" style="margin-top:8px;background:var(--primary);">${l.featured?'إلغاء التمييز':'تمييز كـ اخترنا لك'}</button>
          <button class="btn-delete" onclick="deleteLink(${l.id},event)" style="margin-top:8px;">حذف</button>
        </div>
      </div>
      <div class="item-toggle">▼</div>
    </div>
  `).join('');
}

async function toggleFeatured(id,event){
  event.stopPropagation();
  const link=allLinks.find(l=>l.id===id);
  if(!link)return;
  link.featured=!link.featured;
  renderRegistry();
  toast('جاري الحفظ...');
  const ok=await saveField({links:allLinks});
  if(ok)toast(link.featured?'تم التمييز':'تم إلغاء التمييز');
}

function renderStats(){
  currentPage=1;
  const ps=parseInt(document.getElementById('pageSize').value)||10;
  const totalPages=Math.ceil(allLinks.length/ps)||1;
  const start=(currentPage-1)*ps;
  const pageLinks=allLinks.slice(start,start+ps);

  if(!allLinks.length){
    document.getElementById('statsTbody').innerHTML='<tr><td colspan="5" class="empty">لا توجد روابط</td></tr>';
    document.getElementById('pagination').innerHTML='';
    return;
  }

  document.getElementById('statsTbody').innerHTML=pageLinks.map(l=>`
    <tr>
      <td><strong>${l.num}</strong></td>
      <td>${l.label}</td>
      <td>${(l.desc||'').substring(0,20)}</td>
      <td><a href="${l.url}" target="_blank" style="color:var(--primary);">رابط</a></td>
      <td>${l.clicks||0}</td>
    </tr>
  `).join('');

  let paginationHtml='';
  for(let i=1;i<=totalPages;i++){
    paginationHtml+=`<button ${i===currentPage?'class="active"':''} onclick="goPage(${i})">${i}</button>`;
  }
  document.getElementById('pagination').innerHTML=paginationHtml;
}

function updateStats(){renderStats();}

function goPage(page){
  currentPage=page;
  const ps=parseInt(document.getElementById('pageSize').value)||10;
  const start=(currentPage-1)*ps;
  const pageLinks=allLinks.slice(start,start+ps);
  document.getElementById('statsTbody').innerHTML=pageLinks.map(l=>`
    <tr>
      <td><strong>${l.num}</strong></td>
      <td>${l.label}</td>
      <td>${(l.desc||'').substring(0,20)}</td>
      <td><a href="${l.url}" target="_blank" style="color:var(--primary);">رابط</a></td>
      <td>${l.clicks||0}</td>
    </tr>
  `).join('');
  document.querySelectorAll('.pagination button').forEach((b,i)=>b.classList.toggle('active',i+1===page));
  document.querySelector('table').scrollIntoView({behavior:'smooth'});
}

function goToStats(){
  showPage('stats',document.querySelectorAll('.nav-tab')[3]);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ========== إضافة/حذف رابط ==========
async function addLink(){
  const num=parseInt(document.getElementById('linkNum').value);
  const title=document.getElementById('linkTitle').value.trim();
  const desc=document.getElementById('linkDesc').value.trim();
  const url=document.getElementById('linkUrl').value.trim();
  const featured=document.getElementById('linkFeatured').checked;

  if(!num||num<1||num>9){toast('الرقم يجب أن يكون بين 1 و 9');return;}
  if(!title){toast('العنوان إلزامي، اكتب عنواناً للرابط');return;}
  if(title.length<2){toast('العنوان قصير جداً');return;}
  if(!url){toast('الرابط إلزامي، اكتب الرابط');return;}
  try{ new URL(url); }catch(_){ toast('صيغة الرابط غير صحيحة (يجب أن يبدأ بـ https://)');return; }

  const exist=allLinks.find(l=>l.num===num);
  if(exist)allLinks=allLinks.filter(l=>l.id!==exist.id);
  allLinks.push({id:Date.now(),num,label:title,desc,url,featured,clicks:0});

  document.getElementById('linkNum').value='';
  document.getElementById('linkTitle').value='';
  document.getElementById('linkDesc').value='';
  document.getElementById('linkUrl').value='';
  document.getElementById('linkFeatured').checked=false;

  toast('جاري الحفظ...');
  const ok=await saveField({links:allLinks});
  if(ok)toast('تمت إضافة الرابط!');
}

async function deleteLink(id,event){
  event.stopPropagation();
  if(!confirm('حذف هذا الرابط؟'))return;
  const backup=allLinks;
  allLinks=allLinks.filter(l=>l.id!==id);
  renderRegistry();renderStats();
  toast('جاري الحذف...');
  const ok=await saveField({links:allLinks});
  if(ok)toast('تم الحذف!');
  else allLinks=backup;
}

// ========== حسابات التواصل ==========
function openSocialForm(){
  document.getElementById('socName').value='';
  document.getElementById('socUrl').value='';
  document.getElementById('socIcon').value='';
  document.getElementById('socIconPreview').style.display='none';
  pendingSocIcon=null;
  document.getElementById('socialFormBox').style.display='block';
}

function closeSocialForm(){
  document.getElementById('socialFormBox').style.display='none';
  pendingSocIcon=null;
}

function previewSocIcon(inp){
  const f=inp.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    pendingSocIcon=e.target.result;
    document.getElementById('socIconImg').src=pendingSocIcon;
    document.getElementById('socIconPreview').style.display='block';
  };
  r.readAsDataURL(f);
}

function renderSocials(){
  if(!allSocials.length){
    document.getElementById('socialsRegistry').innerHTML='<div class="empty">لا توجد حسابات بعد</div>';
    return;
  }
  document.getElementById('socialsRegistry').innerHTML=allSocials.map(s=>`
    <div class="item" style="cursor:default;">
      <div style="display:flex;align-items:center;gap:12px;flex:1;">
        <div style="width:48px;height:48px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);">
          ${s.icon?`<img src="${s.icon}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-weight:900;color:var(--primary);">${s.name[0].toUpperCase()}</span>`}
        </div>
        <div style="flex:1;">
          <div style="font-weight:700;">${s.name}</div>
          <div style="font-size:0.75rem;color:var(--muted);direction:ltr;text-align:right;word-break:break-all;">${s.url}</div>
        </div>
      </div>
      <button class="btn-delete" onclick="deleteSocial('${s.id}')"></button>
    </div>
  `).join('');
}

async function saveSocial(){
  const name=document.getElementById('socName').value.trim();
  const url=document.getElementById('socUrl').value.trim();
  if(!name){toast('اكتب اسم الحساب');return;}
  if(!url){toast('اكتب رابط الحساب');return;}
  try{ new URL(url); }catch(_){ toast('صيغة الرابط غير صحيحة');return; }

  allSocials.push({id:Date.now()+'',name,url,icon:pendingSocIcon||''});
  closeSocialForm();
  toast('جاري الحفظ...');
  const ok=await saveField({socials:allSocials});
  if(ok)toast('تمت إضافة الحساب!');
}

async function deleteSocial(id){
  if(!confirm('حذف هذا الحساب؟'))return;
  const backup=allSocials;
  allSocials=allSocials.filter(s=>s.id!==id);
  renderSocials();
  toast('جاري الحذف...');
  const ok=await saveField({socials:allSocials});
  if(ok)toast('تم الحذف!');
  else allSocials=backup;
}

// ========== التصميم (الغلاف والصورة الشخصية) ==========
// ========== أداة قص الصور ==========
let cropperInstance=null;
let cropTargetType=null; // 'banner' أو 'avatar'

function selectBanner(inp){
  const f=inp.files[0];
  if(!f)return;
  if(f.size>5*1024*1024){toast('الصورة كبيرة جداً (الحد الأقصى 5MB)');inp.value='';return;}
  cropTargetType='banner';
  openCropper(f,3/1,'حدد منطقة صورة الغلاف');
}

function selectAvatar(inp){
  const f=inp.files[0];
  if(!f)return;
  if(f.size>5*1024*1024){toast('الصورة كبيرة جداً (الحد الأقصى 5MB)');inp.value='';return;}
  cropTargetType='avatar';
  openCropper(f,1/1,'حدد منطقة الصورة الشخصية');
}

function openCropper(file,aspectRatio,title){
  const reader=new FileReader();
  reader.onload=e=>{
    document.getElementById('cropTitle').textContent=title;
    const img=document.getElementById('cropImage');
    img.src=e.target.result;
    document.getElementById('cropOverlay').classList.add('open');

    if(cropperInstance){cropperInstance.destroy();cropperInstance=null;}

    // ننتظر تحميل الصورة فعلياً بالـ DOM قبل تفعيل Cropper عليها
    img.onload=()=>{
      cropperInstance=new Cropper(img,{
        aspectRatio:aspectRatio,
        viewMode:1,
        autoCropArea:1,
        background:false,
        responsive:true,
      });
    };
  };
  reader.readAsDataURL(file);
}

function cancelCrop(){
  if(cropperInstance){cropperInstance.destroy();cropperInstance=null;}
  document.getElementById('cropOverlay').classList.remove('open');
  document.getElementById('cropImage').src='';
  // نفرّغ حقل الملف عشان لو المستخدم يحاول يرفع نفس الملف مرة ثانية يشتغل onchange
  if(cropTargetType==='banner')document.getElementById('bannerInput').value='';
  if(cropTargetType==='avatar')document.getElementById('avatarInput').value='';
  cropTargetType=null;
}

async function confirmCrop(){
  if(!cropperInstance){toast('حدث خطأ بأداة القص');return;}

  // نحدد دقة إخراج مناسبة: البنر عريض، الأفتار مربع صغير، عشان الحجم بقاعدة البيانات يبقى معقول
  const outputWidth=cropTargetType==='banner'?900:400;
  const canvas=cropperInstance.getCroppedCanvas({
    width:outputWidth,
    imageSmoothingQuality:'high',
  });

  const dataUrl=canvas.toDataURL('image/jpeg',0.85);

  cropperInstance.destroy();
  cropperInstance=null;
  document.getElementById('cropOverlay').classList.remove('open');
  document.getElementById('cropImage').src='';

  if(cropTargetType==='banner'){
    user.bannerImage=dataUrl;
    document.getElementById('bannerPreview').style.backgroundImage=`url(${dataUrl})`;
    document.getElementById('bannerInput').value='';
    toast('جاري الحفظ...');
    const ok=await saveField({bannerImage:dataUrl});
    if(ok)toast('تم حفظ الغلاف!');
  }else if(cropTargetType==='avatar'){
    user.avatar=dataUrl;
    document.getElementById('avatarPreview').innerHTML=`<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;">`;
    document.getElementById('avatarInput').value='';
    toast('جاري الحفظ...');
    const ok=await saveField({avatar:dataUrl});
    if(ok)toast('تم حفظ الصورة الشخصية!');
  }
  cropTargetType=null;
}

async function saveDesign(){
  toast('جاري الحفظ...');
  const ok=await saveField({bannerImage:user.bannerImage||'',avatar:user.avatar||''});
  if(ok)toast('تم حفظ التصميم!');
}

// ========== الملف الشخصي ==========
async function saveProfile(){
  const displayName=document.getElementById('pfName').value.trim();
  const phone=document.getElementById('pfPhone').value.trim();
  const bio=document.getElementById('pfBio').value.trim();
  const location=document.getElementById('pfLocation').value.trim();

  toast('جاري الحفظ...');
  const ok=await saveField({displayName,phone,bio,location});
  if(ok){
    user.displayName=displayName;user.phone=phone;user.bio=bio;user.location=location;
    toast('تم حفظ ملفك الشخصي!');
  }
}

// ========== تسجيل الخروج الحقيقي ==========
function openMyPage(){
  if(!user||!user.username){toast('جاري التحميل، حاول بعد لحظة');return;}
  window.open('page.html#'+user.username,'_blank');
}

function copyMyLink(){
  if(!user||!user.username){toast('جاري التحميل، حاول بعد لحظة');return;}
  const link='https://electrwni.link/page.html#'+user.username;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=>{
      toast('تم نسخ الرابط');
    }).catch(()=>{
      fallbackCopy(link);
    });
  }else{
    fallbackCopy(link);
  }
}

function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';
  ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    toast('تم نسخ الرابط');
  }catch(e){
    toast('تعذر النسخ، انسخه يدوياً: '+text);
  }
  document.body.removeChild(ta);
}

function logout(){
  if(!confirm('هل تريد تسجيل الخروج؟'))return;
  auth.signOut().then(()=>{
    localStorage.removeItem('elUserUsername');
    window.location.href='index.html';
  }).catch(e=>{
    toast('خطأ بتسجيل الخروج: '+e.message);
  });
}
