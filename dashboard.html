<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrwni - Number to URL</title>
    <style>
        /* التنسيق العام للخلفية */
        body {
            background-color: #121212; /* خلفية داكنة فخمة */
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
            color: white;
        }

        /* زر سلسلة المواقع العلوي */
        .top-nav {
            align-self: flex-end;
            margin-left: 5%;
            margin-bottom: 30px;
        }
        .nav-btn {
            background: #ffffff;
            color: #000;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            cursor: pointer;
        }

        /* العنوان العلوي المنسق */
        .header-title {
            font-size: 24px;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.8;
            width: 90%;
        }

        /* تكبير ما بين العاكفين */
        .highlight {
            font-size: 34px; /* حجم أكبر وبارز */
            color: #4CAF50; /* اللون الأخضر المعتمد */
            font-weight: bold;
            display: inline-block;
            margin: 0 5px;
            vertical-align: middle;
        }

        /* المربع الأبيض الاحترافي */
        .main-card {
            background-color: #ffffff;
            width: 88%; /* إظهار الخلفية يميناً ويساراً */
            max-width: 450px;
            min-height: 420px; /* طول متناسق مع العناصر */
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); /* ظل منبثق قوي */
            padding: 50px 30px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            margin-bottom: 50px;
        }

        /* نص المحتوى المستوحى من الصورة */
        .content-description {
            color: #333;
            font-size: 18px;
            text-align: center;
            line-height: 1.7;
            font-weight: 500;
        }

        /* شعار X */
        .x-link svg {
            width: 40px;
            height: 40px;
            fill: #000;
            transition: transform 0.3s;
        }
        .x-link:hover svg {
            transform: scale(1.15);
        }

        /* التوقيع في الأسفل باللون الأبيض */
        .footer-sig {
            color: #ffffff;
            font-size: 11px;
            text-align: center;
            width: 90%;
            margin-top: auto;
            padding-bottom: 20px;
            line-height: 1.6;
            direction: ltr; /* لضمان تنسيق النص العربي والإنجليزي معاً */
        }

        .footer-sig span {
            direction: rtl;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="nav-btn">سلسلة مواقع &lsaquo;</div>
    </div>

    <div class="header-title">
        توجيه <span class="highlight">"الأرقام إلى روابط"</span> لمنصة إلكتروني
    </div>

    <div class="main-card">
        <div class="content-description">
            زر تفاعلي لبايو انستقرام تضع بالموقع الرقم ويحيلك إلى رابط مخصص.
            <br><br>
            ارجع لطلب الصفحة الان
        </div>
        
        <a href="https://x.com/your_profile" class="x-link" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
        </a>
    </div>

    <div class="footer-sig">
        <span>تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت، بنية بمعمارية عالية الأداء،</span> 
        Built with High-Performance Architecture, by electrwni, kuwait
    </div>

</body>
</html>
