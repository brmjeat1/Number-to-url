<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التوجيه الرقمي لروابط منصة إلكتروني</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* المستطيل العلوي (نمط أبل) */
        .header-rect {
            background-color: #072AC8;
            width: 100%;
            height: 44px; /* الارتفاع القياسي لشريط خيارات أبل */
        }

        /* الخط الأصفر السفلي */
        .yellow-divider {
            background-color: #FCF300;
            width: 100%;
            height: 3px;
        }

        /* حاوية المحتوى */
        .content {
            margin-top: 60px;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 30px;
        }

        /* صندوق إدخال الرقم */
        .input-field {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #072AC8;
            border-radius: 12px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .input-field:focus {
            box-shadow: 0 0 10px rgba(7, 42, 200, 0.2);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header-rect"></div>
    <div class="yellow-divider"></div>

    <div class="content">
        <h1>التوجيه الرقمي لروابط منصة إلكتروني</h1>
        
        <input type="number" 
               id="linkId" 
               class="input-field" 
               placeholder="ضع الرقم هنا..." 
               oninput="checkAndRedirect()">

        <p class="footer-text">سيتم تحويلك تلقائياً فور كتابة الرقم</p>
    </div>

    <script>
        function checkAndRedirect() {
            const input = document.getElementById('linkId');
            const value = input.value;
            
            // التوجيه التلقائي (عدل النطاق أدناه للرابط الفعلي)
            if (value.length >= 1) { 
                // تأخير بسيط لراحة المستخدم أثناء الكتابة
                setTimeout(() => {
                    window.location.href = "https://electrwni.com/" + value;
                }, 500);
            }
        }
    </script>

</body>
</html>
