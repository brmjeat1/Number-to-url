<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مدير الروابط — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#3d5af1;--primary-light:#6c8fff;--bg:#f5f5f5;--surface:#ffffff;
  --text:#0f1535;--text2:#3a4270;--muted:#9aa2c8;--success:#0ab87a;
  --error:#e8436a;--warning:#ffc107;
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;padding-bottom:20px;
}

/* ========== TOPBAR ========== */
.topbar{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;padding:14px 20px;display:flex;justify-content:space-between;
  align-items:center;position:sticky;top:0;z-index:50;
}

.topbar-brand{font-family:'Space Mono',monospace;font-size:1rem;font-weight:900;}

.topbar-btns{display:flex;gap:8px;}

.btn{
  padding:8px 16px;border:none;border-radius:8px;cursor:pointer;
  font-family:'Tajawal',sans-serif;font-weight:700;font-size:0.85rem;
  transition:all .2s;touch-action:manipulation;
}

.btn-white{background:#fff;color:var(--primary);}
.btn-white:active{transform:scale(0.95);}

.btn-logout{background:rgba(232,67,106,0.2);color:#fff;border:1px solid rgba(232,67,106,0.4);}
.btn-logout:active{transform:scale(0.95);}

/* ========== CONTAINER ========== */
.container{max-width:900px;margin:0 auto;padding:20px;}

/* ========== EXPANDABLE BOX ========== */
.expandable{
  background:var(--surface);border-radius:14px;margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);overflow:hidden;
}

.expandable-header{
  padding:18px 20px;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;background:linear-gradient(135deg,#f9f9f9,#ffffff);
  border-bottom:2px solid #f0f0f0;transition:all .2s;
}

.expandable-header:hover{background:#f5f5f5;}
.expandable-header.open{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;}

.expandable-title{font-size:1.1rem;font-weight:900;display:flex;align-items:center;gap:8px;}

.expandable-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;transition:transform .3s;
}

.expandable-header.open .expandable-icon{transform:rotate(180deg);}

.expandable-toggle{font-size:1.4rem;transition:transform .3s;}
.expandable-header.open .expandable-toggle{transform:rotate(180deg);}

.expandable-content{
  display:none;padding:20px;max-height:0;overflow:hidden;transition:all .3s;
}

.expandable-header.open+.expandable-content{
  display:block;max-height:2000px;
}

/* ========== FORM GROUPS ========== */
.form-group{margin-bottom:14px;}

.form-group label{display:block;font-size:0.85rem;font-weight:700;margin-bottom:6px;color:var(--text2);}

input[type=text],input[type=url],input[type=number],textarea,select{
  width:100%;padding:10px 12px;border:1.5px solid #e0e0e0;border-radius:8px;
  font-family:'Tajawal',sans-serif;font-size:0.9rem;outline:none;transition:border .2s;
}

input:focus,textarea:focus,select:focus{border-color:var(--primary);}

textarea{resize:vertical;min-height:60px;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr;}
}

/* ========== BUTTONS ========== */
.btn-add{
  background:var(--success);color:#fff;padding:12px 24px;border:none;
  border-radius:8px;cursor:pointer;font-weight:700;font-family:'Tajawal',sans-serif;
  width:100%;transition:all .2s;font-size:0.95rem;
}

.btn-add:active{transform:scale(0.98);}

.btn-pdf{
  background:var(--error);color:#fff;padding:14px 28px;border:none;
  border-radius:8px;cursor:pointer;font-weight:700;font-family:'Tajawal',sans-serif;
  width:100%;margin-top:16px;font-size:0.95rem;transition:all .2s;
}

.btn-pdf:active{transform:scale(0.98);}

/* ========== COLLAPSIBLE ITEMS ========== */
.item{
  background:#f9f9f9;border:1px solid #e0e0e0;border-radius:8px;padding:12px 14px;
  margin-bottom:8px;cursor:pointer;transition:all .2s;display:flex;
  justify-content:space-between;align-items:center;
}

.item:hover{background:#f5f5f5;border-color:var(--primary);}
.item.open{background:var(--primary-light);color:#fff;border-color:var(--primary);}

.item-header{flex:1;font-weight:700;font-size:0.95rem;}
.item-toggle{font-size:1.2rem;transition:transform .3s;}
.item.open .item-toggle{transform:rotate(180deg);}

.item-details{
  display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.1);
}

.item.open .item-details{display:block;}

.detail-row{display:flex;gap:8px;margin-bottom:8px;font-size:0.9rem;}
.detail-label{font-weight:700;min-width:60px;}
.detail-value{flex:1;word-break:break-all;}

.btn-delete{
  background:var(--error);color:#fff;padding:6px 12px;border:none;
  border-radius:6px;cursor:pointer;font-size:0.8rem;font-weight:700;
}

/* ========== TABLE ========== */
table{width:100%;border-collapse:collapse;font-size:0.85rem;margin-top:12px;}

th,td{padding:10px;text-align:right;border-bottom:1px solid #e0e0e0;}

th{
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;font-weight:900;
}

tr:hover{background:#f5f5f5;}

.col-num{font-weight:900;color:var(--primary);max-width:40px;}

/* ========== PAGINATION ========== */
.pagination{
  display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap;
}

.pagination button{
  padding:6px 10px;border:1px solid #e0e0e0;border-radius:6px;
  background:#fff;cursor:pointer;font-weight:700;font-size:0.9rem;
  transition:all .2s;
}

.pagination button.active{
  background:var(--primary);color:#fff;border-color:var(--primary);
}

.pagination button:active{transform:scale(0.95);}

/* ========== EMPTY STATE ========== */
.empty{
  text-align:center;padding:30px;color:var(--muted);
}

/* ========== TOAST ========== */
.toast{
  position:fixed;bottom:20px;left:20px;background:var(--text);
  color:var(--bg);padding:12px 20px;border-radius:8px;
  font-weight:700;font-size:0.9rem;opacity:0;transform:translateY(20px);
  transition:all .3s;z-index:100;
}

.toast.show{opacity:1;transform:translateY(0);}

/* ========== RESPONSIVE ========== */
@media(max-width:600px){
  .container{padding:16px 12px;}
  .expandable-header{padding:14px 16px;}
  .expandable-content{padding:16px;}
  .form-row{grid-template-columns:1fr;}
  table{font-size:0.8rem;}
  th,td{padding:8px;}
}
</style>
</head>
<body>

<!-- ========== TOPBAR ========== -->
<div class="topbar">
  <div class="topbar-brand">electrwni.link</div>
  <div class="topbar-btns">
    <button class="btn btn-white" onclick="window.location.href='page.html'">👁 صفحتك</button>
    <button class="btn btn-logout" onclick="logout()">🚪 خروج</button>
  </div>
</div>

<!-- ========== CONTAINER ========== -->
<div class="container">

  <!-- ===== BOX 1: ADD LINK ===== -->
  <div class="expandable">
    <div class="expandable-header" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'block':'none'">
      <div class="expandable-title">
        <div class="expandable-icon">➕</div>
        <span>أضف رابط</span>
      </div>
      <div class="expandable-toggle">▼</div>
    </div>
    <div class="expandable-content" style="display:block;">
      <div class="form-row">
        <div class="form-group">
          <label>الرقم (1-9)</label>
          <input type="number" id="linkNum" placeholder="1" min="1" max="9">
        </div>
        <div class="form-group">
          <label>العنوان (20 حرف)</label>
          <input type="text" id="linkTitle" placeholder="اكتب العنوان" maxlength="20">
        </div>
      </div>
      <div class="form-group">
        <label>الوصف</label>
        <textarea id="linkDesc" placeholder="اوصف الرابط"></textarea>
      </div>
      <div class="form-group">
        <label>الرابط</label>
        <input type="url" id="linkUrl" placeholder="https://example.com" dir="ltr">
      </div>
      <button class="btn-add" onclick="addLink()">✅ إضافة الرابط</button>
    </div>
  </div>

  <!-- ===== BOX 2: LINKS REGISTRY ===== -->
  <div class="expandable">
    <div class="expandable-header" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'block':'none'">
      <div class="expandable-title">
        <div class="expandable-icon">📋</div>
        <span>سجل الروابط</span>
      </div>
      <div class="expandable-toggle">▼</div>
    </div>
    <div class="expandable-content">
      <div style="font-size:0.8rem;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:6px;">
        📊 <span>دراسة جدوى لجماهيرية وفاعلية نشاط روابطك</span>
      </div>
      <div id="linksRegistry"></div>
      <button class="btn-pdf" onclick="goToStats()">📥 PDF</button>
    </div>
  </div>

  <!-- ===== BOX 3: STATISTICS ===== -->
  <div class="expandable">
    <div class="expandable-header" onclick="this.classList.toggle('open');this.nextElementSibling.style.display=this.classList.contains('open')?'block':'none'">
      <div class="expandable-title">
        <div class="expandable-icon">📊</div>
        <span>إحصائيات</span>
      </div>
      <div class="expandable-toggle">▼</div>
    </div>
    <div class="expandable-content">
      <div class="form-group">
        <label>عدد الروابط في الصفحة</label>
        <select id="pageSize" onchange="updateStats()">
          <option value="10">10 روابط</option>
          <option value="25">25 رابط</option>
          <option value="50">50 رابط</option>
          <option value="100">100 رابط</option>
        </select>
      </div>

      <table>
        <thead>
          <tr>
            <th class="col-num">الرقم</th>
            <th>العنوان</th>
            <th>الوصف</th>
            <th>الرابط</th>
            <th>المشاهدات</th>
          </tr>
        </thead>
        <tbody id="statsTbody">
          <tr><td colspan="5" class="empty">لا توجد روابط</td></tr>
        </tbody>
      </table>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

</div>

<!-- ========== TOAST ========== -->
<div class="toast" id="toast"></div>

<!-- ========== FIREBASE ========== -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const db=firebase.firestore();

let user=null,currentUsername='',allLinks=[],currentPage=1,pageSize=10;

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

async function load(){
  currentUsername=localStorage.getItem('elUserUsername');
  if(!currentUsername||!localStorage.getItem('elLoggedIn')){
    window.location.href='signin.html';
    return;
  }

  try{
    const ref=db.collection('users').doc(currentUsername);
    const doc=await ref.get();
    if(!doc.exists){window.location.href='signin.html';return;}
    
    user=doc.data();
    allLinks=(user.links||[]).sort((a,b)=>a.num-b.num);
    renderRegistry();
    renderStats();

    ref.onSnapshot(d=>{
      if(d.exists){
        user=d.data();
        allLinks=(user.links||[]).sort((a,b)=>a.num-b.num);
        renderRegistry();
        renderStats();
      }
    });
  }catch(e){
    console.error(e);
    toast('❌ خطأ: '+e.message);
  }
}

function renderRegistry(){
  if(!allLinks.length){
    document.getElementById('linksRegistry').innerHTML='<div class="empty">لا توجد روابط</div>';
    return;
  }

  document.getElementById('linksRegistry').innerHTML=allLinks.map(l=>`
    <div class="item" onclick="this.classList.toggle('open')">
      <div>
        <div class="item-header">${l.num} — ${l.label}</div>
        <div class="item-details">
          <div class="detail-row"><span class="detail-label">الوصف:</span><span class="detail-value">${l.desc||'-'}</span></div>
          <div class="detail-row"><span class="detail-label">الرابط:</span><span class="detail-value"><a href="${l.url}" target="_blank" style="color:var(--primary);text-decoration:none;">فتح</a></span></div>
          <div class="detail-row"><span class="detail-label">المشاهدات:</span><span class="detail-value">${l.clicks||0}</span></div>
          <button class="btn-delete" onclick="deleteLink(${l.id},event)">🗑️ حذف</button>
        </div>
      </div>
      <div class="item-toggle">▼</div>
    </div>
  `).join('');
}

function renderStats(){
  currentPage=1;
  const pageSize=parseInt(document.getElementById('pageSize').value)||10;
  const totalPages=Math.ceil(allLinks.length/pageSize);
  const start=(currentPage-1)*pageSize;
  const pageLinks=allLinks.slice(start,start+pageSize);

  if(!allLinks.length){
    document.getElementById('statsTbody').innerHTML='<tr><td colspan="5" class="empty">لا توجد روابط</td></tr>';
    document.getElementById('pagination').innerHTML='';
    return;
  }

  document.getElementById('statsTbody').innerHTML=pageLinks.map(l=>`
    <tr>
      <td class="col-num">${l.num}</td>
      <td>${l.label}</td>
      <td>${l.desc||'-'}</td>
      <td><a href="${l.url}" target="_blank" style="color:var(--primary);text-decoration:none;">رابط</a></td>
      <td>${l.clicks||0}</td>
    </tr>
  `).join('');

  let paginationHtml='';
  for(let i=1;i<=totalPages;i++){
    paginationHtml+=`<button ${i===currentPage?'class="active"':''} onclick="goPage(${i})">${i}</button>`;
  }
  document.getElementById('pagination').innerHTML=paginationHtml;
}

function updateStats(){
  renderStats();
}

function goPage(page){
  currentPage=page;
  renderStats();
  document.querySelector('table').scrollIntoView({behavior:'smooth'});
}

function goToStats(){
  const statsBox=document.querySelectorAll('.expandable')[2];
  statsBox.querySelector('.expandable-header').classList.add('open');
  statsBox.querySelector('.expandable-content').style.display='block';
  statsBox.scrollIntoView({behavior:'smooth'});
}

async function addLink(){
  const num=parseInt(document.getElementById('linkNum').value);
  const title=document.getElementById('linkTitle').value.trim();
  const desc=document.getElementById('linkDesc').value.trim();
  const url=document.getElementById('linkUrl').value.trim();

  if(!num||!title||!url){toast('⚠️ ملء الحقول المطلوبة');return;}

  const exist=allLinks.find(l=>l.num===num);
  if(exist){allLinks=allLinks.filter(l=>l.id!==exist.id);}

  allLinks.push({id:Date.now(),num,label:title,desc,url,clicks:0});

  document.getElementById('linkNum').value='';
  document.getElementById('linkTitle').value='';
  document.getElementById('linkDesc').value='';
  document.getElementById('linkUrl').value='';

  toast('💾 جاري الحفظ...');
  try{
    await db.collection('users').doc(currentUsername).update({links:allLinks});
    toast('✅ تمت الإضافة!');
  }catch(e){
    toast('❌ خطأ: '+e.message);
  }
}

async function deleteLink(id,event){
  event.stopPropagation();
  if(!confirm('حذف الرابط؟'))return;
  allLinks=allLinks.filter(l=>l.id!==id);
  toast('💾 جاري الحفظ...');
  try{
    await db.collection('users').doc(currentUsername).update({links:allLinks});
    toast('✅ تم الحذف!');
  }catch(e){
    toast('❌ خطأ: '+e.message);
  }
}

function logout(){
  if(!confirm('تسجيل الخروج؟'))return;
  localStorage.removeItem('elLoggedIn');
  localStorage.removeItem('elUserUsername');
  window.location.href='index.html';
}

load();
</script>
</body>
</html>
