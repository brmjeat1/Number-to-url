<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني | لوحة الإدارة الذكية</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; direction: rtl; color: #334155; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; color: white; padding: 15px 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        .panel { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #0f172a; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; font-weight: 600; margin-top: 5px; }
        button:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: right; font-size: 13px; }
        th { background-color: #f8fafc; color: #64748b; }
        .action-btn { padding: 4px 8px; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 12px; display: inline-block; }
        .btn-go { background-color: #3b82f6; }
        .btn-delete { background-color: #ef4444; margin-right: 4px; }
        .btn-copy { background-color: #10b981; margin-right: 4px; }
        .bio-preview-card { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; border-radius: 12px; padding: 20px; text-align: center; }
        .badge { background: #334155; padding: 3px 8px; border-radius: 4px; font-family: monospace; font-size: 11px; color: #cbd5e1; }
        #protected-content { display: none; }
    </style>
</head>
<body>

    <div id="protected-content">
        <div class="header">
            <h2>مدير الروابط الذكي | إلكتروني</h2>
            <div>
                <span>المشترك: <strong id="user-display-name">..</strong></span>
                <span style="margin-right:15px;">معرف النظام: <span id="user-id-badge" class="badge">..</span></span>
                <button onclick="logout()" style="width:auto; background:#ef4444; margin-right:15px; padding: 6px 12px; margin-top:0;">خروج</button>
            </div>
        </div>

        <div class="grid-layout">
            <div class="panel">
                <h3>إضافة توجيه رقمي جديد لقاعدة البيانات</h3>
                <div class="form-group">
                    <label>الرقم الرقمي المستهدف:</label>
                    <input type="number" id="link-number" placeholder="مثال: 5">
                </div>
                <div class="form-group">
                    <label>رابط الوجهة الطويل (URL):</label>
                    <input type="url" id="link-url" placeholder="https://t.me/username">
                </div>
                <button onclick="saveLink()">حفظ وتوليد المسار</button>

                <table>
                    <thead>
                        <tr>
                            <th>الرقم الرقمي</th>
                            <th>رابط المنصة الفرعي</th>
                            <th>الوجهة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="links-table-body"></tbody>
                </table>
            </div>

            <div class="panel bio-preview-card">
                <h4 style="margin-top:0; color:#38bdf8;">🔗 رابط البايو المخصص لزوارك</h4>
                <p style="font-size:12px; color:#94a3b8; line-height:1.5;">انسخ الرابط التالي وضعه في بايو حساباتك ليتيح للزوار فتح الروابط عبر أرقامك مباشرة:</p>
                <input type="text" id="shareable-bio-url" readonly style="background:rgba(255,255,255,0.1); color:#fff; border:none; text-align:center; font-size:12px; margin-bottom:10px;">
                <button onclick="copyBioUrl()" style="background:#3b82f6; font-size:13px; padding:8px;">نسخ رابط بايو الزوار</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();
        let currentUserId = "";

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserId = user.uid;
                document.getElementById('protected-content').style.display = 'block';
                document.getElementById('user-display-name').innerText = user.email.split('@')[0];
                document.getElementById('user-id-badge').innerText = currentUserId;
                
                // توليد رابط البايو المباشر للمستخدم الحالي
                const baseUrl = window.location.origin + window.location.pathname.replace('dashboard.html', 'index.html');
                document.getElementById('shareable-bio-url').value = baseUrl;

                loadUserLinks();
            } else {
                window.location.href = "signin.html";
            }
        });

        function saveLink() {
            const number = document.getElementById('link-number').value.trim();
            const url = document.getElementById('link-url').value.trim();

            if (!number || !url) { alert("يرجى ملء الحقول المطلوبة!"); return; }

            db.ref('users/' + currentUserId + '/links/' + number).set(url).then(() => {
                alert("تم الحفظ بنجاح وتحديث بيانات الزوار!");
                document.getElementById('link-number').value = "";
                document.getElementById('link-url').value = "";
            }).catch(err => alert("خطأ بالصلاحيات: " + err.message));
        }

        function loadUserLinks() {
            db.ref('users/' + currentUserId + '/links').on('value', (snapshot) => {
                const tbody = document.getElementById('links-table-body');
                tbody.innerHTML = "";
                const baseUrl = window.location.origin + window.location.pathname.replace('dashboard.html', '');

                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const key = child.key;
                        const targetUrl = child.val();
                        const generatedPlatformUrl = `${baseUrl}#${currentUserId}/${key}`;

                        const row = `
                            <tr>
                                <td><strong>${key}</strong></td>
                                <td><span style="color:#10b981; font-size:12px;">${generatedPlatformUrl}</span></td>
                                <td><span style="color:#64748b;">${targetUrl}</span></td>
                                <td>
                                    <button onclick="navigator.clipboard.writeText('${generatedPlatformUrl}'); alert('تم نسخ الرابط الرقمي بنجاح!');" class="action-btn btn-copy">نسخ</button>
                                    <a href="${targetUrl}" target="_blank" class="action-btn btn-go">اذهب</a>
                                    <button onclick="deleteLink('${key}')" class="action-btn btn-delete">حذف</button>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#94a3b8;">لا توجد أرقام مسجلة حالياً.</td></tr>`;
                }
            });
        }

        function deleteLink(key) {
            if (confirm("هل تود حذف هذا التوجيه الرقمي الفعال؟")) {
                db.ref('users/' + currentUserId + '/links/' + key).remove();
            }
        }

        function copyBioUrl() {
            const copyText = document.getElementById("shareable-bio-url");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("تم نسخ رابط بايو الزوار الخاص بك للمشاركة!");
        }

        function logout() { auth.signOut().then(() => { window.location.href = "signin.html"; }); }
    </script>
</body>
</html>
