<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رقم روابطك - العلامة التجارية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #072AC8; 
            --accent: #FCF300; 
            --sky: #1E96FC; 
            --box-yellow: #FFF041;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            /* الخلفية المطلوبة */
            background-color: #030014;
            background-image: 
                radial-gradient(at 15% 20%, #012f7b 0px, transparent 60%), 
                radial-gradient(at 85% 25%, #0056d6 0px, transparent 55%), 
                radial-gradient(at 50% 85%, #52d6fc 0px, transparent 50%);
            background-attachment: fixed;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: center;
            color: white;
        }

        /* المستطيل الزجاجي الأساسي */
        .glass-container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px 0;
        }

        .header-text { font-size: 1.2rem; font-weight: 500; margin-bottom: 20px; color: #fff; }
        .highlight-text { color: var(--sky); font-weight: bold; }

        .input-group { width: 100%; margin-bottom: 25px; }
        input { 
            width: 100%; padding: 15px; font-size: 1.2rem; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 12px; text-align: center; 
            background: rgba(255, 255, 255, 0.05);
            color: white; outline: none; box-sizing: border-box;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.5); }

        .btn-go { 
            width: 100%; padding: 15px; background: var(--primary); 
            color: #fff; border: none; border-radius: 12px; 
            font-size: 1.2rem; font-weight: bold; margin-top: 15px; 
            cursor: pointer; transition: 0.3s;
        }
        .btn-go:hover { background: #051ea3; transform: translateY(-2px); }

        .qr-section { 
            padding: 15px; background: white; border-radius: 15px; 
            margin-bottom: 25px; display: inline-block;
        }
        .qr-section p { font-size: 0.9rem; color: #333; font-weight: bold; margin: 0 0 8px 0; }
        #qr-code-img { width: 120px; height: 120px; }

        .social-links { display: flex; gap: 15px; margin-bottom: 25px; }
        .social-icon { 
            background: rgba(255, 255, 255, 0.1); width: 44px; height: 44px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: var(--accent); border: 1px solid rgba(255, 255, 255, 0.2); 
        }

        .order-link { color: var(--sky); text-decoration: none; font-weight: bold; margin-bottom: 30px; display: block; }

        /* منطقة "رقم روابطك" الزجاجية */
        .info-box-wrapper {
            display: flex; align-items: center; justify-content: center;
            direction: ltr; transform: scale(0.9);
        }
        .yellow-part {
            background: var(--box-yellow); color: var(--primary); font-weight: bold;
            padding: 12px 20px; border-radius: 15px; font-size: 1.3rem;
            z-index: 2; box-shadow: -2px 0 10px rgba(0,0,0,0.2);
        }
        .blue-part {
            background: rgba(59, 130, 246, 0.8); color: #ffffff; padding: 12px 22px;
            border-radius: 15px 0 0 15px; margin-right: -10px; font-size: 1.1rem;
            min-width: 260px; display: flex; align-items: center; justify-content: flex-start; direction: rtl;
        }

        .dynamic-text { 
            white-space: nowrap; overflow: hidden; display: inline-block; 
            border-left: 3px solid white;
            animation: typing 4s steps(30) infinite, cursor-logic 4s step-end infinite;
        }

        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }
        @keyframes cursor-logic {
            0%, 45% { border-left-color: #ffffff; } 
            46%, 100% { border-left-color: var(--box-yellow); }
        }

        .footer { 
            margin-top: auto; padding: 20px; font-size: 0.8rem; 
            color: rgba(255, 255, 255, 0.5); text-align: center; width: 100%; 
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="header-text">توجيه <span class="highlight-text">الأرقام إلى روابط</span></div>

        <div class="input-group">
            <input type="number" id="linkId" placeholder="أدخل الرقم هنا...">
            <button class="btn-go" onclick="redirect()">انتقل الآن</button>
        </div>

        <div class="qr-section">
            <p>باركود الموقع</p>
            <img id="qr-code-img" src="" alt="الباركود">
        </div>

        <div class="social-links">
            <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <a href="#" class="order-link">أطلب ترقيم روابطك الآن <i class="fa-brands fa-instagram"></i></a>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">خطواتك تسبق منافسيك ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </div>

    <div class="footer">
        Electrwni, Kuwait © 2026<br>
        High-Performance Architecture
    </div>

    <script>
        window.onload = function() {
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}&color=072ac8`;
        };

        const phrases = [
            "خطواتك تسبق منافسيك ..",
            "حساباتك برقم واحد ..",
            "بساطة سرعة وصول ..",
            "تميزك يربك الخصوم ..",
            "رقم يختصر مسافاتك .."
        ];
        
        let i = 0;
        const typingEl = document.getElementById('typing-text');
        setInterval(() => {
            i = (i + 1) % phrases.length;
            typingEl.innerText = phrases[i];
        }, 4000);

        function redirect() {
            const val = document.getElementById('linkId').value;
            if(val) window.location.href = "https://electrwni.com/" + val;
        }
    </script>
</body>
</html>
