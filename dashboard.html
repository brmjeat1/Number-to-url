<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التوجيه الرقمي لروابط منصة إلكتروني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #072AC8; --accent: #FCF300; --sky: #1E96FC; --light-blue: #A2D6F9; --box-blue: #3B82F6; --box-yellow: #FFF041; }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            /* الخلفية المطلوبة */
            background-image: radial-gradient(circle at top right, rgb(0,3,125) 0%, rgb(0,3,125) 48%, rgb(7,31,149) 48%, rgb(7,31,149) 53%, rgb(230,255,0) 53%, rgb(230,255,0) 56%, rgb(34,30,252) 56%, rgb(34,30,252) 69%, rgb(6,14,216) 69%, rgb(6,14,216) 100%);
            background-attachment: fixed;
            justify-content: space-between;
        }

        /* النافذة البيضاء المنبثقة (85% على الجوال، بحد أقصى 450px) */
        .white-wrapper {
            background: #ffffff;
            width: 85%;
            max-width: 450px;
            margin: 40px auto;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            box-sizing: border-box;
        }
        
        .header-box { background: var(--primary); width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: center; padding: 10px 0; }
        .header-text { color: #ffffff; font-size: 1.1rem; font-weight: 500; }
        .highlight-text { color: var(--light-blue); font-size: 1.4rem; font-weight: bold; margin: 0 5px; }
        .yellow-line { background: var(--accent); width: 100%; height: 3px; }

        .input-group { margin-top: 10px; width: 100%; }
        input { width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid var(--primary); border-radius: 12px; text-align: center; outline: none; box-sizing: border-box; }
        .btn-go { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 1.2rem; font-weight: bold; margin-top: 15px; cursor: pointer; margin-bottom: 20px; }
        
        .qr-section { padding: 12px; border: 1px solid #eee; border-radius: 15px; display: inline-block; margin-bottom: 20px; }
        .qr-section p { font-size: 0.9rem; color: #333; font-weight: bold; margin-bottom: 8px; }
        #qr-code-img { width: 115px; height: 115px; }

        .social-links { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .social-icon { 
            background: var(--primary); width: 44px; height: 44px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: var(--accent); border: 2px solid var(--sky); 
        }
        .social-icon svg { width: 20px; height: 20px; fill: var(--accent); }

        .order-link { display: block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: bold; font-size: 1.05rem; }

        .info-box-wrapper {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 10px; filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.1));
            direction: ltr; transform: scale(0.85);
        }
        .yellow-part {
            background: var(--box-yellow); color: var(--primary); font-weight: bold;
            padding: 10px 18px; border-radius: 15px; font-size: 1.45rem;
            z-index: 2; box-shadow: -2px 0 5px rgba(0,0,0,0.1);
        }
        .blue-part {
            background: var(--box-blue); color: #ffffff; padding: 10px 22px;
            border-radius: 15px 0 0 15px; margin-right: -10px; font-size: 1.25rem;
            min-width: 200px; display: flex; align-items: center; justify-content: center; direction: rtl;
        }

        .dynamic-text { white-space: nowrap; overflow: hidden; display: inline-block; animation: typing 4s steps(30) infinite; }
        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }

        .footer { 
            background: #fafafa; 
            width: 100%; 
            padding: 25px 15px; 
            color: var(--sky); 
            font-size: 0.85rem; 
            font-weight: bold; 
            border-top: 1px solid #eee; 
            text-align: center; 
            line-height: 1.6;
            box-sizing: border-box;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="header-text">توجيه <span class="highlight-text">الأرقام إلى روابط</span> لمنصة إلكتروني</div>
    </div>
    <div class="yellow-line"></div>

    <div class="white-wrapper">
        <div class="input-group">
            <input type="number" id="linkId" placeholder="أدخل الرقم هنا...">
            <button class="btn-go" onclick="redirect()">انتقل الآن</button>
        </div>

        <div class="qr-section">
            <p>باركود الموقع</p>
            <img id="qr-code-img" src="" alt="الباركود التلقائي">
        </div>

        <div class="social-links">
            <a href="https://x.com/electrwni?s=21" target="_blank" class="social-icon">
                <svg viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.292 19.494h2.039L6.486 3.24H4.298l13.311 17.407z"/></svg>
            </a>
            <a href="https://www.instagram.com/electrwni?igsh=MWphNXkxMmNhdHloOA%3D%3D&utm_source=qr" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <a href="https://ig.me/m/electrwni?text=السلام%20عليكم%20،%20استفسار%20عن%20منصة%20ترقيم%20الروابط" target="_blank" class="order-link">
            أطلب ترقيم روابطك الآن <i class="fa-brands fa-instagram"></i>
        </a>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">حقق وصول أسرع لبيتك الرقمي ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت<br>
        أُنشئ بمعمارية عالية الأداء. Built with High-Performance Architecture, by electrwni, kuwait

    </div>

    <script>
        window.onload = function() {
            const currentUrl = window.location.href;
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}&color=072ac8`;
        };

        const phrases = ["حقق وصول أسرع لبيتك الرقمي ..", "امتلك بايو احترافي الآن ..", "أوصل جمهورك لمستودع روابطك ..", "سوق لدعاياتك بلمحة بصر .."];
        let i = 0;
        const typingEl = document.getElementById('typing-text');
        function updateText() { i = (i + 1) % phrases.length; typingEl.innerText = phrases[i]; }
        setInterval(updateText, 4000);

        function redirect() {
            const val = document.getElementById('linkId').value;
            if(val) window.location.href = "https://electrwni.com/" + val;
            else alert("يرجى إدخال الرقم");
        }
    </script>
</body>
</html>
