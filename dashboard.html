<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Electrwni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #072AC8; --gray-bg: #f3f4f6; --text-dark: #1f2937; }
        body { background: var(--gray-bg); color: var(--text-dark); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        /* الهيدر العلوي */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 10px 25px; width: 100%; box-sizing: border-box; border-bottom: 1px solid #e5e7eb; }
        .brand { font-weight: bold; color: var(--primary); font-size: 1.2rem; }
        .btn-logout { background: #ef4444; color: white; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }

        /* المستطيل الأبيض المركزي */
        .white-card { background: #ffffff; width: 90%; max-width: 500px; margin: 30px auto; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 30px; box-sizing: border-box; }
        
        .section-title { border-bottom: 2px solid var(--gray-bg); padding-bottom: 10px; margin: 20px 0 15px; color: var(--primary); font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #6b7280; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #d1d5db; background: #f9fafb; box-sizing: border-box; outline: none; }
        
        .action-row { display: flex; gap: 10px; margin-top: 8px; }
        .btn-small { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: bold; transition: 0.3s; }
        .btn-copy { background: #e5e7eb; color: var(--text-dark); }
        .btn-go { background: var(--primary); color: white; }

        .footer-link { display: block; text-align: center; margin-top: 20px; color: #6b7280; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand"><i class="fas fa-bolt"></i> إلكتروني</div>
        <button class="btn-logout" onclick="logout()">خروج</button>
    </div>

    <div class="white-card">
        <h2 style="text-align: center; margin-top: 0;">لوحة الإدارة</h2>
        
        <!-- القسم الأول: الروابط -->
        <div class="section-title"><i class="fas fa-link"></i> رابطك المعروض Bio</div>
        
        <div class="input-group">
            <label>١- سجل دومينك</label>
            <input type="text" placeholder="mylink.com" id="userDomain">
        </div>

        <div class="input-group">
            <label>واجهة البايو</label>
            <input type="text" readonly value="https://electrwni.link/u/user" id="bioUrl">
            <div class="action-row">
                <button class="btn-small btn-copy" onclick="copy('bioUrl')">نسخ</button>
                <button class="btn-small btn-go" onclick="window.open('#','_blank')">ذهاب</button>
            </div>
        </div>

        <div class="input-group">
            <label>صفحة المدير</label>
            <input type="text" readonly value="https://electrwni.link/admin" id="adminUrl">
            <div class="action-row">
                <button class="btn-small btn-copy" onclick="copy('adminUrl')">نسخ</button>
                <button class="btn-small btn-go" onclick="window.location.href='admin.html'">ذهاب</button>
            </div>
        </div>

        <!-- القسم الثاني: الأمان -->
        <div class="section-title"><i class="fas fa-shield-alt"></i> الأمان</div>
        
        <div class="input-group">
            <label>٢- إيميل الحالي</label>
            <input type="email" id="displayEmail" readonly>
        </div>

        <div class="input-group">
            <label>إيميل بديل</label>
            <input type="email" placeholder="أدخل إيميل الطوارئ">
        </div>

        <div class="input-group">
            <label>٣- كلمة السر القديمة</label>
            <div style="position: relative;">
                <input type="password" id="oldPass" value="********">
                <i class="fas fa-eye" style="position: absolute; left: 10px; top: 12px; cursor: pointer; color: #9ca3af;" onclick="togglePass()"></i>
            </div>
        </div>

        <div class="input-group">
            <label>أدخل كلمة السر الجديدة</label>
            <input type="password">
        </div>

        <div class="input-group">
            <label>أدخل كلمة السر مرة أخرى</label>
            <input type="password">
        </div>

        <button style="width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px;">حفظ التغييرات</button>

        <a href="index.html" class="footer-link"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        firebase.initializeApp(firebaseConfig);

        // جلب بيانات المستخدم
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('displayEmail').value = user.email;
            } else {
                window.location.href = 'singin.html';
            }
        });

        function logout() {
            firebase.auth().signOut().then(() => { window.location.href = 'singin.html'; });
        }

        function copy(id) {
            const copyText = document.getElementById(id);
            copyText.select();
            document.execCommand("copy");
            alert("تم النسخ: " + copyText.value);
        }

        function togglePass() {
            const x = document.getElementById("oldPass");
            x.type = x.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
