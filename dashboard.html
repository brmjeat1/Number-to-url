<!-- استدعاء مكتبات Firebase في لوحة التحكم -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
  // إعدادات Firebase الخاصة بمشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
    authDomain: "electrwni-link.firebaseapp.com",
    databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "electrwni-link",
    storageBucket: "electrwni-link.firebasestorage.app",
    messagingSenderId: "712490301263",
    appId: "1:712490301263:web:2084210da3f687285ab73a",
    measurementId: "G-LCCGHWKH87"
  };
  
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let user = null;
  let editLinkId = null;
  let selNum = null;
  let currentUsername = localStorage.getItem('elUserUsername') || 'demo';

  // إدارة الثيم والمظهر
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  function toggleTheme(){
    const c = document.documentElement.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('theme', n);
    document.getElementById('themeBtn').textContent = n === 'dark' ? '☀️' : '🌙';
  }

  // جلب البيانات وحفظها سحابياً من Firebase بدلاً من الذاكرة المحلية
  async function fetchUserFromCloud(){
    const doc = await db.collection('users').doc(currentUsername).get();
    if(doc.exists){
      user = doc.data();
    } else {
      window.location.href = 'signup.html';
    }
  }

  async function saveUserToCloud(updatedData){
    await db.collection('users').doc(currentUsername).set(updatedData, { merge: true });
    user = updatedData;
  }

  async function init(){
    if(!localStorage.getItem('elLoggedIn')){ window.location.href='signin.html'; return; }
    
    // جلب البيانات حياً من السيرفر السحابي لمنع حلقة الطرد
    await fetchUserFromCloud();
    
    if(!user){ window.location.href='signup.html'; return; }
    if(!user.links) user.links = [];
    if(!user.socials) user.socials = [];

    const handle = 'electrwni.link/' + user.username;
    document.getElementById('sbName').textContent = user.displayName || user.username;
    document.getElementById('sbHandle').textContent = handle;
    document.getElementById('sbAvatar').textContent = (user.displayName || user.username)[0].toUpperCase();
    document.getElementById('bioUrl').textContent = handle;
    document.getElementById('previewNavBtn').href = 'page.html#' + user.username;

    // تعبئة حقول الملف الشخصي
    document.getElementById('pfName').value = user.displayName || '';
    document.getElementById('pfUser').value = user.username || '';
    document.getElementById('pfBio').value = user.bio || '';
    document.getElementById('pfEmail').value = user.email || '';
    document.getElementById('pfAvatar').value = user.avatar || '';

    document.getElementById('sPlatform').addEventListener('change', function(){
      const wa = this.value === 'whatsapp';
      const web = this.value === 'website';
      document.getElementById('sInputLabel').textContent = wa ? 'رقم الهاتف (مع كود الدولة)' : web ? 'الرابط الكامل' : 'اسم المستخدم';
      document.getElementById('sUsername').placeholder = wa ? '+966xxxxxxxxx' : web ? 'https://example.com' : '@username';
    });

    render();
  }

  function render(){
    const links = (user.links || []).sort((a,b) => a.num - b.num);
    const socials = user.socials || [];
    const totalClicks = links.reduce((s,l) => s + (l.clicks || 0), 0);
    const topLink = [...links].sort((a,b) => (b.clicks || 0) - (a.clicks || 0))[0];

    // لوحة الإحصائيات الفورية
    document.getElementById('stLinks').textContent = links.length;
    document.getElementById('stClicks').textContent = totalClicks;
    document.getElementById('stTop').textContent = topLink ? '#' + topLink.num : '—';
    document.getElementById('stSocials').textContent = socials.length;
    document.getElementById('aTotal').textContent = totalClicks;
    document.getElementById('aTopLink').textContent = topLink ? topLink.label : '—';
    document.getElementById('aTopClicks').textContent = topLink ? topLink.clicks || 0 : 0;
    document.getElementById('aActive').textContent = links.filter(l => (l.clicks || 0) > 0).length;

    // بناء جدول الروابط الرقمية
    const tbody = document.getElementById('linksTbody');
    if(!links.length){
      tbody.innerHTML = '';
      document.getElementById('linksEmpty').style.display = 'block';
      document.querySelector('.links-table').style.display = 'none';
    } else {
      document.getElementById('linksEmpty').style.display = 'none';
      document.querySelector('.links-table').style.display = '';
      tbody.innerHTML = links.map(l => `
        <tr>
          <td><span class="num-badge">${l.num}</span></td>
          <td class="td-label">${l.label}</td>
          <td class="td-desc">${l.desc || '—'}</td>
          <td class="td-url" title="${l.url}">${l.url}</td>
          <td><span class="clicks-badge">↗ ${l.clicks || 0}</span></td>
          <td><button class="btn btn-qr" onclick="showQR(${l.id})">█ QR</button></td>
          <td class="td-actions">
            <button class="btn btn-ghost btn-sm" onclick="editLink(${l.id})">تعديل</button>
            <button class="btn btn-danger" onclick="deleteLink(${l.id})">حذف</button>
          </td>
        </tr>
      `).join('');
    }

    // شريط تقدم الإحصائيات البيانية
    const maxC = Math.max(...links.map(l => l.clicks || 0), 1);
    document.getElementById('analyticsBody').innerHTML = links.length ? links.map(l => `
      <div style="margin-bottom:14px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
          <span class="num-badge">${l.num}</span>
          <span style="font-weight:700;flex:1;">${l.label}</span>
          <span class="clicks-badge">↗ ${l.clicks || 0} ضغطة</span>
        </div>
        <div style="height:6px;background:var(--border);border-radius:3px;">
          <div style="height:100%;width:${Math.round(((l.clicks || 0) / maxC) * 100)}%;background:var(--accent);border-radius:3px;transition:width .6s;"></div>
        </div>
      </div>
    `).join('') : '<div class="empty"><div class="e-icon">📊</div><p>لا توجد بيانات بعد</p></div>';

    // جدول حسابات التواصل الاجتماعي
    const st = document.getElementById('socialsTbody');
    const icons = {instagram:'📷', tiktok:'🎵', twitter:'✖', youtube:'▶', snapchat:'👻', whatsapp:'💬', telegram:'✈', linkedin:'💼', facebook:'👤', website:'🌐'};
    const names = {instagram:'إنستقرام', tiktok:'تيك توك', twitter:'تويتر/X', youtube:'يوتيوب', snapchat:'سناب شات', whatsapp:'واتساب', telegram:'تيليقرام', linkedin:'لينكدإن', facebook:'فيسبوك', website:'موقع إلكتروني'};
    if(!socials.length){
      st.innerHTML = '';
      document.getElementById('socialsEmpty').style.display = 'block';
    } else {
      document.getElementById('socialsEmpty').style.display = 'none';
      st.innerHTML = socials.map(s => `
        <tr>
          <td><span class="social-icon">${icons[s.platform] || '🌐'}</span> <span style="font-weight:700;margin-right:8px;">${names[s.platform] || s.platform}</span></td>
          <td style="font-family:'Space Mono',monospace;font-size:0.85rem;direction:ltr;text-align:right;color:var(--accent);">${s.username}</td>
          <td><button class="btn btn-danger" onclick="deleteSocial('${s.id}')">حذف</button></td>
        </tr>
      `).join('');
    }
  }

  function showPage(name, el){
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    if(el) el.classList.add('active');
    const cfg = {links:['إدارة الروابط','أضف وعدّل روابطك المرقّمة',true], analytics:['الإحصائيات','أداء روابطك وزياراتك',false], socials:['شبكات التواصل','روابط حساباتك على المنصات',false], profile:['الملف الشخصي','تعديل معلوماتك وهويتك',false]};
    const c = cfg[name];
    document.getElementById('pageTitle').textContent = c[0];
    document.getElementById('pageSub').textContent = c[1];
    document.getElementById('topAction').style.display = c[2] ? '' : 'none';
    return false;
  }

  function openLinkModal(id = null){
    editLinkId = id; selNum = null;
    const links = user.links || [];
    const taken = links.filter(l => l.id !== id).map(l => l.num);
    let html = '';
    for(let i = 1; i <= 9; i++){
      const t = taken.includes(i);
      html += `<button class="npick${t ? ' taken' : ''}" ${t ? 'disabled' : ''} onclick="pickNum(${i},this)">${i}</button>`;
    }
    document.getElementById('numPicker').innerHTML = html;
    if(id){
      const lnk = links.find(l => l.id === id);
      document.getElementById('linkModalTitle').textContent = 'تعديل الرابط';
      document.getElementById('mLabel').value = lnk.label;
      document.getElementById('mDesc').value = lnk.desc || '';
      document.getElementById('mUrl').value = lnk.url;
      selNum = lnk.num;
      setTimeout(() => {
        document.querySelectorAll('.npick').forEach(b => {
          if(parseInt(b.textContent) === lnk.num) b.classList.add('sel');
        });
      }, 50);
    } else {
      document.getElementById('linkModalTitle').textContent = 'إضافة رابط جديد';
      document.getElementById('mLabel').value = '';
      document.getElementById('mDesc').value = '';
      document.getElementById('mUrl').value = '';
    }
    document.getElementById('linkModal').classList.add('open');
  }
  
  function closeLinkModal(){ document.getElementById('linkModal').classList.remove('open'); }
  function pickNum(n,btn){ document.querySelectorAll('.npick').forEach(b => b.classList.remove('sel')); btn.classList.add('sel'); selNum = n; }
  
  async function saveLink(){
    const label = document.getElementById('mLabel').value.trim();
    const desc = document.getElementById('mDesc').value.trim();
    const url = document.getElementById('mUrl').value.trim();
    if(!selNum){ toast('اختر رقماً'); return; }
    if(!label){ toast('أدخل اسم الرابط'); return; }
    if(!url || !url.startsWith('http')){ toast('أدخل رابطاً صحيحاً (يبدأ بـ http)'); return; }
    
    if(!user.links) user.links = [];
    if(editLinkId){
      const i = user.links.findIndex(l => l.id === editLinkId);
      user.links[i] = {...user.links[i], num:selNum, label, desc, url};
      toast('✅ تم تحديث الرابط');
    } else {
      user.links.push({id:Date.now(), num:selNum, label, desc, url, clicks:0});
      toast('✅ تم إضافة الرابط');
    }
    await saveUserToCloud(user); closeLinkModal(); render();
  }

  async function deleteLink(id){
    if(!confirm('حذف هذا الرابط؟')) return;
    user.links = user.links.filter(l => l.id !== id);
    await saveUserToCloud(user); render(); toast('🗑 تم الحذف');
  }

  function openSocialModal(){ document.getElementById('socialModal').classList.add('open'); }
  
  async function saveSocial(){
    const p = document.getElementById('sPlatform').value;
    const u = document.getElementById('sUsername').value.trim();
    if(!u){ toast('أدخل اسم المستخدم أو الرابط'); return; }
    if(!user.socials) user.socials = [];
    user.socials.push({id:Date.now() + '', platform:p, username:u});
    await saveUserToCloud(user);
    document.getElementById('socialModal').classList.remove('open');
    document.getElementById('sUsername').value = '';
    render(); toast('✅ تمت الإضافة');
  }

  async function deleteSocial(id){
    user.socials = user.socials.filter(s => s.id !== id);
    await saveUserToCloud(user); render(); toast('🗑 تم الحذف');
  }

  function showQR(id){
    const lnk = user.links.find(l => l.id === id);
    if(!lnk) return;
    document.getElementById('qrTitle').textContent = 'باركود رابط #' + lnk.num + ': ' + lnk.label;
    document.getElementById('qrCanvas').innerHTML = '';
    document.getElementById('qrNumOverlay').textContent = lnk.num;
    new QRCode(document.getElementById('qrCanvas'), {
      text: lnk.url,
      width:200, height:200,
      colorDark:'#000000', colorLight:'#ffffff',
      correctLevel:QRCode.CorrectLevel.H
    });
    document.getElementById('qrModal').classList.add('open');
  }

  function downloadQR(){
    const canvas = document.querySelector('#qrCanvas canvas');
    if(!canvas){ alert('جاري تجهيز الباركود...'); return; }
    const link = document.createElement('a');
    link.download = 'barcode-electrwni.png';
    link.href = canvas.toDataURL();
    link.click();
    toast('✅ تم تحميل الباركود');
  }

  async function saveProfile(){
    const newUsername = document.getElementById('pfUser').value.trim().toLowerCase();
    
    user.displayName = document.getElementById('pfName').value.trim();
    user.bio = document.getElementById('pfBio').value.trim();
    user.email = document.getElementById('pfEmail').value.trim();
    user.avatar = document.getElementById('pfAvatar').value.trim();
    
    if(newUsername !== currentUsername){
      // نقل الحساب إلى معرف يوزرنيم جديد سحابياً عند التغيير
      await db.collection('users').doc(newUsername).set(user);
      await db.collection('users').doc(currentUsername).delete();
      currentUsername = newUsername;
      localStorage.setItem('elUserUsername', newUsername);
    } else {
      await saveUserToCloud(user);
    }
    
    document.getElementById('sbName').textContent = user.displayName;
    document.getElementById('sbHandle').textContent = 'electrwni.link/' + user.username;
    document.getElementById('bioUrl').textContent = 'electrwni.link/' + user.username;
    document.getElementById('previewNavBtn').href = 'page.html#' + user.username;
    toast('✅ تم حفظ التغييرات سحابياً');
  }

  function copyLink(){ navigator.clipboard.writeText('https://' + document.getElementById('bioUrl').textContent).then(() => toast('📋 تم نسخ الرابط')); }
  function openPageInNew(){ window.open('page.html#' + user.username, '_blank'); }
  function shareLink(){ if(navigator.share) navigator.share({title:'صفحة بايو', url:'https://' + document.getElementById('bioUrl').textContent}); else copyLink(); }
  function logout(){ localStorage.removeItem('elLoggedIn'); localStorage.removeItem('elUserUsername'); window.location.href='signin.html'; }
  function closeIfOverlay(e,id){ if(e.target.id === id) document.getElementById(id).classList.remove('open'); }
  function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2600); }

  init();
</script>
