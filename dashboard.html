<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة التحكم — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --primary: #3d5af1; --bg: #f9f9f9; --text: #0f1535; }
  body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
  .container { max-width: 600px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
  .nav { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
  .nav-btn { background: none; border: none; padding: 10px; font-weight: 700; cursor: pointer; color: #777; transition: 0.3s; }
  .nav-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
  .page { display: none; }
  .page.active { display: block; }
  .form-group { margin-bottom: 15px; }
  input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; outline: none; box-sizing: border-box; }
  .btn-save { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: 0.3s; }
  .btn-save:hover { background: #2a41b5; }
</style>
</head>
<body>

<div class="container">
  <div class="nav">
    <button class="nav-btn active" onclick="showPage('links', this)">📋 الروابط</button>
    <button class="nav-btn" onclick="showPage('design', this)">🎨 التصميم</button>
    <button class="nav-btn" onclick="showPage('accounts', this)">🔗 الحسابات</button>
  </div>

  <div id="page-links" class="page active"><h3>إدارة الروابط</h3><p>هنا ستظهر روابطك المسجلة.</p></div>
  <div id="page-design" class="page"><h3>إعدادات التصميم</h3><p>تخصيص الشعار والأفاتار.</p></div>
  
  <div id="page-accounts" class="page">
    <h3>إضافة حساب تواصل جديد</h3>
    <div class="form-group">
      <input type="text" id="accName" placeholder="اسم المنصة (مثال: Instagram)">
      <input type="url" id="accUrl" placeholder="رابط الحساب (URL)">
      <label style="font-size:0.8rem; margin-top:10px; display:block;">أيقونة الحساب (صورة):</label>
      <input type="file" id="accIcon" accept="image/*">
      <button class="btn-save" onclick="addAccount()">✅ حفظ الحساب</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script>
  // تذكر: ضع إعدادات Firebase الخاصة بك هنا بدقة
  const firebaseConfig = { 
    // apiKey: "...",
    // authDomain: "...",
    // projectId: "...",
    // storageBucket: "...",
    // messagingSenderId: "...",
    // appId: "..."
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  function showPage(id, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    btn.classList.add('active');
  }

  async function addAccount() {
    const user = auth.currentUser;
    if (!user) { alert('⚠️ يرجى تسجيل الدخول أولاً'); return; }

    const name = document.getElementById('accName').value;
    const url = document.getElementById('accUrl').value;
    const fileInput = document.getElementById('accIcon');
    const file = fileInput.files[0];
    
    if(!name || !url) { alert('⚠️ يرجى تعبئة الاسم والرابط'); return; }

    // دالة لحفظ البيانات بعد تحويل الصورة لـ Base64
    const saveData = (iconBase64 = '') => {
      db.collection('users').doc(user.uid).set({
        accounts: firebase.firestore.FieldValue.arrayUnion({ 
          name: name, 
          url: url, 
          icon: iconBase64,
          timestamp: new Date() 
        })
      }, { merge: true }).then(() => {
        alert('✅ تم حفظ الحساب بنجاح!');
        document.getElementById('accName').value = '';
        document.getElementById('accUrl').value = '';
        fileInput.value = '';
      }).catch(e => alert('خطأ في الاتصال بقاعدة البيانات: ' + e.message));
    };

    if(file) {
      const reader = new FileReader();
      reader.onload = (e) => saveData(e.target.result);
      reader.readAsDataURL(file);
    } else {
      saveData(); // حفظ بدون أيقونة إذا لم يرفع المستخدم صورة
    }
  }
</script>
</body>
</html>
