<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رقم روابطك - التنسيق النهائي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #072AC8; 
            --accent: #FCF300; 
            --box-yellow: #FFF041;
            --dark-blue: #051ea3;
            --deep-footer-blue: #021d4d;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-image: linear-gradient(0deg, rgba(3, 121, 241,0.5) 0%, rgba(3, 121, 241,0.5) 9%,transparent 9%, transparent 16%,rgba(11, 75, 199,0.5) 16%, rgba(11, 75, 199,0.5) 49%,rgba(9, 86, 209,0.5) 49%, rgba(9, 86, 209,0.5) 100%),linear-gradient(135deg, rgb(3, 121, 241) 0%, rgb(3, 121, 241) 31%,rgb(13, 63, 188) 31%, rgb(13, 63, 188) 37%,transparent 37%, transparent 56%,rgb(9, 86, 209) 56%, rgb(9, 86, 209) 100%),linear-gradient(90deg, rgb(255,255,255),rgb(255,255,255));
            background-attachment: fixed;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: flex-start; /* لرفع المحتوى للأعلى */
            padding-top: 40px;
        }

        .main-title {
            color: white;
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-align: center;
        }

        .white-container {
            background: #ffffff;
            border-radius: 25px;
            padding: 35px 25px; /* رفع المسافة من الأعلى والأسفل */
            max-width: 360px;
            width: 85%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input { 
            width: 100%; padding: 14px; font-size: 1rem; 
            border: 2px solid #eee; border-radius: 12px; 
            text-align: center; outline: none; margin-bottom: 10px;
        }

        .btn-go { 
            width: 100%; padding: 14px; background: var(--primary); 
            color: #fff; border: none; border-radius: 12px; 
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }

        /* تصغير الباركود وإضافة العبارة */
        .qr-section { margin: 15px 0; text-align: center; }
        #qr-code-img { width: 85px; height: 85px; } /* تصغير حجم الباركود */
        .copy-hint { 
            font-size: 0.8rem; color: var(--primary); 
            margin-top: 5px; cursor: pointer; font-weight: bold;
        }

        .social-links { 
            display: flex; gap: 15px; margin-bottom: 20px; 
            background: var(--dark-blue); padding: 8px 18px; border-radius: 30px;
        }
        .social-icon { background: var(--accent); width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; color: white; }

        /* تنسيق "رقم روابطك" المطور */
        .info-box-wrapper {
            display: flex; align-items: center; justify-content: center;
            direction: ltr; width: 100%; margin-top: 10px;
        }
        .yellow-part {
            background: var(--box-yellow); color: var(--primary); font-weight: 800; /* زيادة السمك */
            padding: 12px 20px; border-radius: 15px; font-size: 1.25rem; z-index: 2;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        .blue-part {
            background: var(--primary); color: #ffffff; padding: 12px 15px;
            border-radius: 15px 0 0 15px; margin-right: -10px; font-size: 1.05rem;
            min-width: 210px; display: flex; align-items: center; justify-content: flex-start; direction: rtl;
            font-weight: 600;
        }

        .dynamic-text { 
            white-space: nowrap; overflow: hidden; display: inline-block; 
            border-left: 3px solid white;
            animation: typing 8s steps(30) infinite, cursor-logic 8s step-end infinite;
        }

        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }
        @keyframes cursor-logic { 0%, 45% { border-left-color: #ffffff; } 46%, 100% { border-left-color: var(--box-yellow); } }

        /* الفوتر بالأزرق الغامق والتظليل */
        .footer { 
            margin-top: 35px; padding: 15px; font-size: 0.85rem; 
            color: var(--deep-footer-blue); /* أزرق غامق */
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8); /* تظليل فاتح ليبرز اللون الغامق */
            text-align: center; line-height: 1.6; font-weight: bold;
            width: 90%; max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="main-title">صفحة توجيه الأرقام إلى روابط لمنصة إلكتروني</div>

    <div class="white-container">
        <input type="number" id="linkId" placeholder="أدخل الرقم هنا...">
        <button class="btn-go" onclick="redirect()">انتقل الآن</button>

        <div class="qr-section">
            <img id="qr-code-img" src="" alt="QR">
            <div class="copy-hint" onclick="copyURL()">انسخ الرابط <i class="fa-regular fa-copy"></i></div>
        </div>

        <div class="social-links">
            <a href="https://x.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://instagram.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">حساباتك برقم واحد ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni,، الكويت، بنية بمعمارية عالية الأداء. <br>
        Built with High-Performance Architecture, by electrwni, kuwait, 2026.
    </div>

    <script>
        window.onload = function() {
            const currentPath = window.location.href.split('?')[0];
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentPath)}&color=072ac8`;
        };

        const phrases = ["حساباتك برقم واحد ..", "خطواتك تسبق منافسيك ..", "بساطة سرعة وصول ..", "رقم يختصر مسافاتك .."];
        let i = 0;
        setInterval(() => {
            i = (i + 1) % phrases.length;
            document.getElementById('typing-text').innerText = phrases[i];
        }, 8000);

        function copyURL() {
            navigator.clipboard.writeText(window.location.href);
            alert("تم نسخ الرابط بنجاح!");
        }

        function redirect() {
            const val = document.getElementById('linkId').value;
            if(val) window.location.href = "https://electrwni.com/" + val;
        }
    </script>
</body>
</html>
