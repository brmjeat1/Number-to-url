<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Electrwni | تحويل الأرقام</title>
    <style>
        /* 1. الخلفية المتدرجة (عبثنا بها وأعدناها الآن) */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #001f3f 0%, #0071e3 50%, #00d4ff 100%);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
        }

        /* 2. العنوان العلوي (أبيض وسماوي) */
        .top-header {
            position: absolute;
            top: 40px;
            text-align: center;
        }
        .top-header h1 {
            font-size: 28px;
            margin: 0;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .top-header span { color: #00d4ff; }

        /* 3. المستطيل الأبيض (85% مع الجوانب) */
        .main-card {
            background: #ffffff;
            width: 85%;
            max-width: 380px;
            border-radius: 24px;
            padding: 30px 20px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            color: #1d1d1f;
        }

        /* 4. مربع الرابط (تلبية طلباتك السابقة) */
        .input-group { margin-bottom: 20px; }
        input#linkId {
            width: 100%;
            padding: 15px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .btn-go {
            width: 100%;
            background: #0071e3;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        /* 5. توزيع الأيقونات والباركود المصغر */
        .social-assets {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
        }
        .icon-circle {
            width: 40px;
            height: 40px;
            background: #0071e3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .qr-small {
            width: 50px;
            height: 50px;
            border: 1px solid #e5e5e5;
            padding: 5px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* 6. العبارة السفلية (مصفوفة بالكامل) */
        .footer-text {
            position: absolute;
            bottom: 30px;
            text-align: center;
            width: 100%;
            font-size: 11px;
            line-height: 1.6;
        }
        .footer-text p { margin: 2px 0; color: rgba(255,255,255,0.8); }

        /* الشاشة المنبثقة للباركود */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img { width: 250px; border-radius: 15px; margin-bottom: 20px; }
        .copy-toast { color: #00d4ff; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-header">
        <h1>Electrwni <span>Digital</span></h1>
    </div>

    <div class="main-card">
        <div class="input-group">
            <input type="text" id="linkId" placeholder="أدخل الرقم هنا للتحويل...">
        </div>
        <button class="btn-go" onclick="handleRedirect()">انتقل الآن</button>

        <div class="social-assets">
            <a href="#" class="icon-circle">X</a>
            <a href="#" class="icon-circle">In</a>
            <a href="#" class="icon-circle">Tg</a>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://electrwni.com" 
                 class="qr-small" onclick="openQR()">
        </div>
        
        <p style="font-size: 12px; color: #86868b;">أطلب ترقيم روابطك الآن @Insta</p>
    </div>

    <div class="footer-text">
        <p>تم تطوير المحرك البرمجي بواسطة <strong>Electrwni</strong>، الكويت</p>
        <p>بنية بمعمارية عالية الأداء</p>
        <p>Built with High-Performance Architecture, by electrwni, kuwait</p>
    </div>

    <!-- نافذة الباركود المنبثقة -->
    <div id="qrModal" class="modal" onclick="this.style.display='none'">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://electrwni.com">
        <div class="copy-toast" onclick="copyLink()">رابط الموقع: نسخ الآن 📋</div>
    </div>

    <script>
        function handleRedirect() {
            const val = document.getElementById('linkId').value;
            const links = JSON.parse(localStorage.getItem('electrwni_data')) || [];
            const target = links.find(l => l.code === val);
            if(target) { window.location.href = target.url; } 
            else { alert("الرابط غير موجود في النظام"); }
        }

        function openQR() {
            document.getElementById('qrModal').style.display = 'flex';
        }

        function copyLink() {
            navigator.clipboard.writeText("https://electrwni.com");
            alert("تم نسخ الرابط بنجاح!");
        }
    </script>
</body>
</html>
