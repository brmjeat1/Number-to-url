<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>لوحة التحكم - electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Tajawal',sans-serif;background:#f9f9f9;padding:20px;}
  .container{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:15px;}
  .nav{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid #ddd;padding-bottom:10px;}
  .btn{padding:10px 15px;cursor:pointer;border:none;border-radius:8px;background:#3d5af1;color:#fff;}
  .form-group{margin-bottom:15px;}
  input{width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:8px;}
</style>
</head>
<body>
<div class="container">
  <div class="nav">
    <button class="btn" onclick="showPage('links')">📋 الروابط</button>
    <button class="btn" onclick="showPage('design')">🎨 التصميم</button>
    <button class="btn" onclick="showPage('accounts')">🔗 الحسابات</button>
  </div>

  <div id="page-accounts">
    <h3>إدارة حسابات التواصل</h3>
    <div class="form-group">
      <input type="text" id="accName" placeholder="اسم المنصة">
      <input type="url" id="accUrl" placeholder="رابط الحساب">
      <label>أيقونة الحساب:</label>
      <input type="file" id="accIcon" accept="image/*">
      <button class="btn" onclick="addAccount()" style="margin-top:10px;width:100%;">إضافة الحساب</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script>
const db = firebase.firestore();
const auth = firebase.auth();

async function addAccount() {
  const user = auth.currentUser;
  if (!user) { alert('يرجى تسجيل الدخول'); return; }

  const name = document.getElementById('accName').value;
  const url = document.getElementById('accUrl').value;
  const file = document.getElementById('accIcon').files[0];
  
  if(!name || !url) { alert('املأ البيانات'); return; }

  const processAdd = async (iconBase64 = '') => {
    // التعديل الأمني هنا: استخدام UID المستخدم كمعرف للوثيقة
    const userRef = db.collection('users').doc(user.uid); 
    await userRef.set({
      accounts: firebase.firestore.FieldValue.arrayUnion({ name, url, icon: iconBase64 })
    }, { merge: true });
    alert('✅ تم الحفظ بأمان!');
  };

  if(file) {
    const reader = new FileReader();
    reader.onload = (e) => processAdd(e.target.result);
    reader.readAsDataURL(file);
  } else {
    processAdd();
  }
}

function showPage(p) { /* منطق التنقل الخاص بك */ }
</script>
</body>
</html>
