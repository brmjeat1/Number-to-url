<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رقم روابطك - النسخة المحدثة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #072AC8; 
            --box-yellow: #fdf131; 
            --dark-blue: #051ea3;
            --success-green: #28a745;
            --error-red: #dc3545;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-image: linear-gradient(0deg, rgba(3, 121, 241,0.5) 0%, rgba(3, 121, 241,0.5) 9%,transparent 9%, transparent 16%,rgba(11, 75, 199,0.5) 16%, rgba(11, 75, 199,0.5) 49%,rgba(9, 86, 209,0.5) 49%, rgba(9, 86, 209,0.5) 100%),linear-gradient(135deg, rgb(3, 121, 241) 0%, rgb(3, 121, 241) 31%,rgb(13, 63, 188) 31%, rgb(13, 63, 188) 37%,transparent 37%, transparent 56%,rgb(9, 86, 209) 56%, rgb(9, 86, 209) 100%),linear-gradient(90deg, rgb(255,255,255),rgb(255,255,255));
            background-attachment: fixed; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: flex-start; padding: 40px 0;
        }

        .main-title { color: #fff; font-size: 1.15rem; font-weight: bold; margin-bottom: 25px; text-shadow: 0 2px 5px rgba(0,0,0,0.4); text-align: center; }

        .white-container {
            background: #ffffff; border-radius: 25px; padding: 35px 25px;
            width: 82%; max-width: 370px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column; align-items: center; z-index: 5;
        }

        input { 
            width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #f0f0f0; 
            border-radius: 12px; text-align: center; outline: none; margin-bottom: 12px;
            box-sizing: border-box; background: #fafafa;
        }

        .btn-go { 
            width: 100%; padding: 15px; background: var(--primary); color: #fff; 
            border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }

        .status-alert {
            width: 100%; padding: 12px; border-radius: 10px; margin-top: 15px;
            font-size: 0.9rem; font-weight: bold; text-align: center; display: none;
        }
        .alert-success { background: rgba(40, 167, 69, 0.1); color: var(--success-green); border: 1px solid var(--success-green); }
        .alert-error { background: rgba(220, 53, 69, 0.1); color: var(--error-red); border: 1px solid var(--error-red); }

        .qr-section { margin: 15px 0; text-align: center; }
        #qr-code-img { width: 85px; height: 85px; border: 1px solid #eee; padding: 5px; border-radius: 10px; }

        /* تنسيق الأيقونات الجديد - بدون حاوية زرقاء */
        .social-icons-row { display: flex; gap: 15px; margin: 10px 0 20px 0; }
        .social-icon { 
            width: 38px; height: 38px; border-radius: 50%; 
            background: var(--primary); /* اللون الأزرق داخل الدائرة */
            border: 2px solid var(--box-yellow); /* اللون الأصفر حدود الدائرة */
            display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: white; /* لون الشعار أبيض */
            font-size: 1.1rem; transition: transform 0.2s;
        }
        .social-icon:hover { transform: scale(1.1); }

        .info-box-wrapper {
            display: flex; align-items: center; justify-content: center;
            direction: ltr; width: 100%; transform: scale(0.9);
        }
        .yellow-part { background: var(--box-yellow); color: var(--primary); font-weight: 800; padding: 12px 20px; border-radius: 15px; font-size: 1.2rem; z-index: 2; }
        .blue-part { background: var(--primary); color: #ffffff; padding: 12px 18px; border-radius: 15px 0 0 15px; margin-right: -10px; font-size: 1rem; min-width: 210px; display: flex; align-items: center; justify-content: flex-start; direction: rtl; }

        .dynamic-text { white-space: nowrap; overflow: hidden; display: inline-block; border-left: 3px solid white; animation: typing 8s steps(30) infinite; }
        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }

        /* الفوتر باللون الأبيض */
        .footer { margin-top: 35px; padding: 15px; font-size: 0.85rem; color: #ffffff; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4); text-align: center; line-height: 1.6; font-weight: bold; width: 90%; max-width: 600px; }
    </style>
</head>
<body>

    <div class="main-title">صفحة توجيه الأرقام إلى روابط لمنصة إلكتروني</div>

    <div class="white-container">
        <input type="number" id="linkId" placeholder="أدخل الرقم المطلوب هنا...">
        <button class="btn-go" onclick="startRedirectProcess()">انتقل الآن</button>

        <div id="statusAlert" class="status-alert"></div>

        <div class="qr-section">
            <img id="qr-code-img" src="" alt="QR">
            <p style="color:#888; font-size: 0.7rem; margin-top: 5px;">باركود الصفحة الحالية</p>
        </div>

        <div class="social-icons-row">
            <a href="https://x.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://instagram.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">حساباتك برقم واحد ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni,، الكويت، بنية بمعمارية عالية الأداء. Built with High-Performance Architecture, by electrwni, kuwait, 2026.
    </div>

    <script>
        window.onload = function() {
            const currentPath = window.location.href.split('?')[0];
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentPath)}&color=072ac8`;
        };

        const phrases = ["حساباتك برقم واحد ..", "خطواتك تسبق منافسيك ..", "بساطة سرعة وصول ..", "رقم يختصر مسافاتك .."];
        let i = 0;
        setInterval(() => {
            i = (i + 1) % phrases.length;
            document.getElementById('typing-text').innerText = phrases[i];
        }, 8000);

        function startRedirectProcess() {
            const val = document.getElementById('linkId').value;
            const alertBox = document.getElementById('statusAlert');
            
            if (!val || val.trim() === "") {
                alertBox.className = "status-alert alert-error";
                alertBox.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> عذراً.. يرجى إدخال رقم صحيح';
                alertBox.style.display = "block";
                return;
            }

            let seconds = 3;
            alertBox.className = "status-alert alert-success";
            alertBox.style.display = "block";
            
            const timer = setInterval(() => {
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> تم اعتماد الرقم.. جاري التحويل خلال ${seconds} ثانية`;
                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.href = "https://electrwni.com/" + val;
                }
                seconds--;
            }, 1000);
        }
    </script>
</body>
</html>
