<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Electrwni - لوحة الإدارة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #f0f7ff; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
        
        .main-app {
            width: 100%; max-width: 450px; background: white; border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); overflow: hidden; border: 6px solid #333;
        }

        /* التصميم العلوي المنحني كما في الصورة */
        .top-wave {
            background: #00224d; color: white; padding: 50px 20px 80px; text-align: center;
            position: relative; clip-path: ellipse(100% 70% at 50% 30%);
        }

        .content { padding: 20px; text-align: center; }
        .section-title { margin-top: -40px; position: relative; z-index: 5; }
        .section-title img { width: 100px; margin-bottom: 10px; background: white; border-radius: 20px; padding: 10px; }

        /* تنسيق الحقول المطابق للصورة */
        .input-bar {
            background: #eef6ff; padding: 15px; border-radius: 15px;
            display: flex; gap: 10px; margin: 20px 0; align-items: center;
        }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        #inID { width: 60px; text-align: center; }
        #inURL { flex: 1; }
        .btn-add { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* الفوتر المنحني */
        .footer-wave {
            background: #eef6ff; padding: 50px 20px 20px; text-align: center; font-size: 0.7rem; color: #666;
            clip-path: ellipse(100% 100% at 50% 100%); margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="main-app">
        <div class="top-wave">
            <h2 style="font-size: 1.8rem;">Electrwni</h2>
            <p>نظام إدارة التوجيه الرقمي لروابط منصة إلكتروني</p>
        </div>
        <div class="content">
            <div class="section-title">
                <img src="https://img.icons8.com/color/144/checked-user-male--v1.png">
                <h3 style="color: #0056D2;">أدخل الروابط</h3>
            </div>
            <div class="input-bar">
                <button class="btn-add">أضف</button>
                <input type="url" id="inURL" placeholder="الرابط">
                <input type="number" id="inID" placeholder="الرقم">
            </div>
            <div class="section-title" style="margin-top: 20px;">
                <img src="https://img.icons8.com/color/144/line-chart.png" style="width: 60px;">
                <h3 style="color: #0056D2;">إحصاءات الروابط</h3>
            </div>
        </div>
        <div class="footer-wave">
            <p>تم تطوير المحرك البرمجي بواسطة Electrwni ، الكويت</p>
            <p>Built with High-Performance Architecture by electrwni, kuwait</p>
        </div>
    </div>
</body>
</html>
