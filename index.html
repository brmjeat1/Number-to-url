<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        window.location.replace('signin.html');
    </script>
    
    <title>منصة إلكتروني الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #072AC8; 
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.7);
            --text-dark: #0f172a !important;
            --text-muted: #475569 !important;
        }
        body { 
            margin: 0; 
            font-family: 'Tajawal', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #f8fafc !important;
            background-image: 
                radial-gradient(at top left, #e0f2fe 0px, transparent 50%),
                radial-gradient(at bottom right, #eff6ff 0px, transparent 50%) !important;
            background-attachment: fixed;
            align-items: center; 
            justify-content: center; 
        }
        .loading-box {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 35px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.04);
        }
        .spinner {
            border: 4px solid rgba(7, 42, 200, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loading-box">
        <div class="spinner"></div>
        <div style="color: var(--text-dark); font-weight: 700; font-size: 1.1rem;">جاري تحويلك إلى صفحة تسجيل الدخول...</div>
        <div style="color: var(--text-muted); font-size: 0.85rem; margin-top: 6px;">منصة إلكتروني الرقمية</div>
    </div>

</body>
</html>
