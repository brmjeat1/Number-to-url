<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توجيه الأرقام - إلكتروني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #072AC8; --accent: #FCF300; --sky: #1E96FC; --white: #FFFFFF; }
        body { font-family: sans-serif; background-color: var(--primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: var(--white); }
        
        /* الإطار الأبيض بالظل العائم */
        .container { background: var(--white); width: 85%; max-width: 400px; border-radius: 30px; padding: 30px; color: #333; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); position: relative; }
        
        .header-text { color: var(--primary); font-weight: bold; margin-bottom: 15px; display: block; }
        input { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 12px; font-size: 18px; text-align: center; box-sizing: border-box; outline: none; transition: border 0.3s; }
        input:focus { border-color: var(--primary); }
        
        .btn-main { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; margin-top: 15px; cursor: pointer; transition: transform 0.2s; }
        .btn-main:active { transform: scale(0.98); }

        /* أيقونات التواصل مع أيقونة الباركود */
        .social-icons { display: flex; justify-content: center; gap: 20px; margin: 25px 0; }
        .icon-btn { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--primary); color: white; cursor: pointer; text-decoration: none; font-size: 20px; }
        .icon-barcode { background: var(--primary); }

        /* النافذة المنبثقة للباركود */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; text-align: center; width: 280px; }
        .qr-placeholder { width: 200px; height: 200px; margin-bottom: 15px; }
        .btn-copy { background: var(--sky); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }

        .footer-note { font-size: 11px; margin-top: 20px; color: #666; width: 100%; }
        .error-msg { color: red; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <span class="header-text">أدخل الرقم الآن</span>
    
    <!-- حقل الإدخال الذكي -->
    <input type="text" id="numInput" placeholder="أدخل الرقم هنا..." inputmode="numeric" onfocus="showSuggestions()">
    <div id="errorBox" class="error-msg">لا يوجد هذا الرقم بالمدخلات</div>
    
    <button class="btn-main" id="goBtn">انتقل الآن</button>

    <div class="social-icons">
        <a href="#" class="icon-btn"><i class="fab fa-telegram-plane"></i></a>
        <a href="#" class="icon-btn"><i class="fab fa-instagram"></i></a>
        <a href="#" class="icon-btn"><i class="fab fa-x-twitter"></i></a>
        <!-- أيقونة الباركود المجاورة والمشابهة -->
        <div class="icon-btn icon-barcode" onclick="toggleModal()"><i class="fas fa-qrcode"></i></div>
    </div>

    <!-- نص التطوير في سطر واحد -->
    <div class="footer-note">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت بنية بمعمارية عالية الأداء Built with High-Performance Architecture, by electrwni, kuwait
    </div>
</div>

<!-- نافذة الباركود المنبثقة -->
<div id="qrModal" class="modal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://electrwni.com" alt="QR Code" class="qr-placeholder">
        <button class="btn-copy" onclick="copyLink()">نسخ الرابط</button>
        <p style="font-size: 12px; color: #666;">اضغط مطولاً لحفظ الباركود</p>
    </div>
</div>

<script>
    const input = document.getElementById('numInput');
    const btn = document.getElementById('goBtn');
    const errorBox = document.getElementById('errorBox');

    // 1. التعرف على الأرقام فقط
    input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
    });

    // 2. ربط زر Enter بالانتقال
    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') executeGo();
    });
    btn.addEventListener('click', executeGo);

    function executeGo() {
        const val = input.value;
        if (val === "123") { // مثال للرقم الصحيح
            window.location.href = "https://electrwni.com";
        } else {
            errorBox.style.display = 'block';
        }
    }

    // 3. الإدخال التلقائي (محاكاة ظهور الأرقام)
    function showSuggestions() {
        console.log("Suggestions active for numbers");
    }

    // 4. التحكم بالباركود والنسخ
    function toggleModal() { document.getElementById('qrModal').style.display = 'flex'; }
    function closeModal(e) { document.getElementById('qrModal').style.display = 'none'; }
    
    function copyLink() {
        navigator.clipboard.writeText("https://electrwni.com");
        alert("تم نسخ الرابط بنجاح!");
    }
</script>

</body>
</html>
