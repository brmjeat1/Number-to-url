<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إلكتروني | تحويل الأرقام إلى روابط</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: white; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .welcome-card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); max-width: 500px; width: 90%; }
        h1 { font-size: 28px; margin-bottom: 15px; font-weight: bold; }
        p { font-size: 16px; color: #e0e0e0; margin-bottom: 30px; line-height: 1.6; }
        .btn-group { display: flex; gap: 15px; justify-content: center; }
        .btn { padding: 12px 30px; border-radius: 10px; font-size: 16px; font-weight: bold; text-decoration: none; cursor: pointer; transition: 0.3s; }
        .btn-primary { background-color: #ffffff; color: #203a43; }
        .btn-secondary { background-color: transparent; color: #ffffff; border: 2px solid #ffffff; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        .status { margin-top: 20px; font-size: 14px; color: #ffeb3b; }
    </style>
</head>
<body>

    <div class="welcome-card" id="main-ui">
        <h1>مرحباً بك في منصة إلكتروني</h1>
        <p>يرجى إدخال الرقم في نهاية الرابط للتوجيه التلقائي، أو قم بإنشاء حسابك لإدارة روابطك الرقمية الخاصة وتوجيهها بكل سهولة.</p>
        <div class="btn-group">
            <a href="dashboard.html" class="btn btn-primary">لوحة التحكم</a>
            <a href="signin.html" class="btn btn-secondary">تسجيل الدخول / جديد</a>
        </div>
        <div id="status-msg" class="status"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // فحص الهاش في الرابط للتوجيه التلقائي: مثال: electrwni.link/#userId/5
        const hashData = window.location.hash.substring(1); 
        
        if (hashData && hashData.includes('/')) {
            const parts = hashData.split('/');
            const userId = parts[0];
            const linkNumber = parts[1];
            
            document.getElementById('status-msg').innerText = "جاري فحص وتوجيه الرابط الرقمي...";

            db.ref('users/' + userId + '/links/' + linkNumber).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    window.location.href = snapshot.val();
                } else {
                    document.getElementById('status-msg').innerText = "عذراً، هذا الرقم غير مسجل أو منتهي.";
                }
            }).catch((err) => {
                document.getElementById('status-msg').innerText = "خطأ في الاتصال بقاعدة البيانات.";
            });
        }
    </script>
</body>
</html>
