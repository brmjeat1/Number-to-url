<!-- الصقه في ملف index.html بالكامل -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrwni | تحويل الأرقام إلى روابط</title>
    <!-- الصق هنا روابط CSS الخاصة بك أو التنسيقات القديمة -->
    <style>
        /* كود التنسيق الذي يجعل شكل الموقع كما في صورتك */
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
        .card { background: white; border-radius: 20px; padding: 20px; margin: 20px auto; max-width: 350px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-main { background: #0047ff; color: white; padding: 15px; border-radius: 10px; width: 100%; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <input type="text" id="linkId" placeholder="أدخل الرقم هنا..." style="width:90%; padding:10px; margin-bottom:10px; border-radius:8px; border:1px solid #ccc;">
    <button class="btn-main" onclick="redirect()">انتقل الآن</button>
    
    <div style="margin-top:20px;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://electrwni.com" alt="QR Code">
        <p style="font-size:12px; color:#666;">باركود الموقع</p>
    </div>
</div>

<footer style="font-size: 11px; color: #0071e3; margin-top: 50px;">
    تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت<br>
    بنية بمعمارية عالية الأداء
</footer>

<script>
    function redirect() {
        const val = document.getElementById('linkId').value;
        const links = JSON.parse(localStorage.getItem('electrwni_data')) || [];
        const target = links.find(l => l.code === val);
        
        if (target) {
            window.location.href = target.url;
        } else {
            alert("يرجى إدخال رقم صحيح؛ هذا الرقم غير مسجل حالياً.");
        }
    }
</script>
</body>
</html>
