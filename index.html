<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>electrwni.link — منصة تسويق المشاريع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Light.otf') format('opentype');
    font-weight:300;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Regular.otf') format('opentype');
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Medium.otf') format('opentype');
    font-weight:500;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Bold.otf') format('opentype');
    font-weight:700;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Black.otf') format('opentype');
    font-weight:900;
    font-display:swap;
  }
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:106.25%;} /* Apple-scale baseline (~17px) */
body{font-family:'ThmanyahSerif',-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Tajawal',sans-serif;background:#ffffff;color:#0f1535;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.container{max-width:500px;width:100%;background:#f9f9f9;border-radius:20px;padding:48px 32px;text-align:center;border:1px solid #e8ecf5;}
.brand{margin-bottom:40px;}
.brand-title{font-size:2.2rem;font-weight:700;margin-bottom:12px;letter-spacing:-1px;line-height:1.3;}
.brand-title .light{color:#6c8fff;display:block;}
.brand-title .dark{color:#0f1535;display:block;}
.brand-subtitle{font-family:ui-monospace,'SF Mono','Space Mono',monospace;font-size:1.2rem;font-weight:700;color:#6c8fff;margin-bottom:32px;}
.buttons{display:flex;flex-direction:column;gap:12px;}
.btn{padding:14px 28px;border:none;border-radius:10px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:'ThmanyahSerif',-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Tajawal',sans-serif;transition:all .2s;}
.btn-primary{background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#ffffff;}
.btn-primary:active{transform:scale(0.98);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(61,90,241,0.2);}
.btn-secondary{background:#f0f4ff;color:#3d5af1;border:2px solid #3d5af1;}
.btn-secondary:active{transform:scale(0.98);}
@media(max-width:600px){.container{padding:32px 20px;}.brand-title{font-size:1.8rem;}.brand-subtitle{font-size:1rem;}}

/* ========== FINDER / QUICK SIGNUP ========== */
.finder-title{font-size:0.98rem;font-weight:700;color:#0f1535;margin-bottom:4px;}
.finder-title-en{display:block;font-size:0.72rem;font-weight:400;color:#9aa2c8;margin-bottom:14px;}
.finder-box{
  display:flex;align-items:stretch;border-radius:14px;overflow:hidden;direction:ltr;
  border:2px solid #e8ecf5;background:#fff;transition:border-color .2s,box-shadow .2s;
}
.finder-box.focused{border-color:#3d5af1;box-shadow:0 0 0 3px rgba(61,90,241,0.12);}
.finder-domain{
  background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#ffffff;
  display:flex;align-items:center;padding:0 12px;white-space:nowrap;
  font-family:ui-monospace,'SF Mono','Space Mono',monospace;font-weight:700;
  font-size:0.82rem;flex-shrink:0;
}
.finder-input{
  flex:1;min-width:0;border:none;outline:none;background:#ffffff;
  padding:14px 10px;font-family:ui-monospace,'SF Mono','Space Mono',monospace;
  font-weight:700;font-size:0.92rem;color:#0f1535;text-align:left;
}
.finder-input::placeholder{color:#9aa2c8;font-weight:400;}
.finder-verify{
  border:none;background:#ffffff;color:#3d5af1;padding:0 16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;
}
.finder-verify svg{width:20px;height:20px;}
.finder-verify:active{transform:scale(0.88);}
.finder-verify:disabled{opacity:0.35;cursor:not-allowed;}
.finder-verify.loading svg{animation:finderSpin 0.7s linear infinite;}
@keyframes finderSpin{to{transform:rotate(360deg);}}
.finder-msg{font-size:0.78rem;font-weight:700;text-align:center;opacity:0;transform:translateY(-4px);transition:all .2s;height:0;overflow:hidden;}
.finder-msg.show{opacity:1;transform:translateY(0);height:auto;margin-top:10px;}
.finder-msg.error{color:#e8436a;}
.finder-msg.success{color:#0ab87a;}

/* التسجيل السريع (يُبنى ديناميكياً في DOM فقط عند الحاجة — لا يوجد أي حقل إيميل/كلمة مرور عند تحميل الصفحة) */
.quick-signup{display:flex;flex-direction:column;gap:10px;margin-top:14px;text-align:right;}
.quick-signup input{
  width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;
  font-family:'ThmanyahSerif',-apple-system,BlinkMacSystemFont,'SF Pro Text','Tajawal',sans-serif;
  font-size:0.9rem;outline:none;transition:border .2s;background:#fff;color:#0f1535;
}
.quick-signup input:focus{border-color:#3d5af1;box-shadow:0 0 0 3px rgba(61,90,241,0.1);}
.quick-signup .qs-btn{
  width:100%;padding:13px;background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#fff;
  border:none;border-radius:10px;font-weight:700;font-size:0.92rem;cursor:pointer;
  font-family:'ThmanyahSerif',-apple-system,BlinkMacSystemFont,'SF Pro Text','Tajawal',sans-serif;transition:all .2s;
}
.quick-signup .qs-btn:active{transform:scale(0.98);}
.quick-signup .qs-btn:disabled{opacity:0.5;cursor:not-allowed;}
.qs-msg{font-size:0.78rem;font-weight:700;text-align:center;min-height:0;}
.qs-msg.error{color:#e8436a;}
.qs-msg.success{color:#0ab87a;}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="brand-title">
      <span class="light">منصة</span>
      <span class="dark">إلكتروني</span>
    </div>
    <div class="brand-subtitle">Electrwni</div>

    <div class="finder-title">تحقق من توفر اسم المستخدم<span class="finder-title-en">Check Username Availability</span></div>
    <div class="finder-box" id="finderBox">
      <div class="finder-domain">electrwni.link/</div>
      <input
        type="text"
        id="finderInput"
        class="finder-input"
        placeholder="username"
        name="pageQuery"
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        inputmode="text"
        maxlength="20"
      >
      <button type="button" class="finder-verify" id="finderVerifyBtn" title="تحقق · Verify" aria-label="تحقق · Verify">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </button>
    </div>
    <div class="finder-msg" id="finderMsg"></div>

    <!-- منطقة التسجيل السريع: فارغة عند تحميل الصفحة، تُبنى بالكامل عبر JS فقط بعد تحقق ناجح -->
    <div id="quickSignupSlot"></div>
  </div>

  <div class="buttons">
    <button class="btn btn-primary" onclick="window.location.href='signin.html'">🔓 تسجيل الدخول · Sign In</button>
    <button class="btn btn-secondary" id="createAccountBtn">✨ إنشاء حساب · Create Account</button>
  </div>
</div>


<script>
(function(){
  // ===== 1) عناصر DOM وربط الأحداث أولاً — يعمل دائماً بغض النظر عن حالة Firebase =====
  const reserved=['admin','root','api','www','app','demo','test','page','signin','signup','dashboard','index'];
  const finderBox=document.getElementById('finderBox');
  const finderInput=document.getElementById('finderInput');
  const finderBtn=document.getElementById('finderVerifyBtn');
  const finderMsg=document.getElementById('finderMsg');
  const quickSignupSlot=document.getElementById('quickSignupSlot');
  const createAccountBtn=document.getElementById('createAccountBtn');

  let finderBusy=false;
  let availableUsername=null; // يُضبط فقط عندما يكون الاسم متاحاً فعلياً

  // أيقونات SVG احترافية بدل الإيموجي
  const ICONS = {
    success: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8.3 12.3l2.4 2.4 4.7-5.2"></path></svg>',
    error: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="9" y1="9" x2="15" y2="15"></line><line x1="15" y1="9" x2="9" y2="15"></line></svg>'
  };

  finderInput.addEventListener('input',()=>{
    const clean=finderInput.value.toLowerCase().replace(/[^a-z0-9_]/g,'');
    if(clean!==finderInput.value)finderInput.value=clean;
    hideFinderMsg();
    hideQuickSignup();
  });
  finderInput.addEventListener('focus',()=>finderBox.classList.add('focused'));
  finderInput.addEventListener('blur',()=>finderBox.classList.remove('focused'));
  finderInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();verifyUsername();}
  });
  finderBtn.addEventListener('click',verifyUsername);

  // نقل اليوزر المفحوص والمتاح إلى صفحة إنشاء الحساب الكاملة، توفيراً للوقت
  if(createAccountBtn){
    createAccountBtn.addEventListener('click', ()=>{
      // مرّر معامل المصدر التسويقي (?ref=) لصفحة التسجيل لو الزائر جا من رابط حملة (فليّر/شراكة)
      let refQ='';
      try{
        const ref=new URLSearchParams(window.location.search).get('ref');
        if(ref) refQ='&ref='+encodeURIComponent(ref);
      }catch(e){}
      const target = availableUsername
        ? ('signup.html?u=' + encodeURIComponent(availableUsername) + refQ)
        : ('signup.html' + (refQ ? '?'+refQ.slice(1) : ''));
      window.location.href = target;
    });
  }

  function hideFinderMsg(){finderMsg.className='finder-msg';finderMsg.innerHTML='';}
  function showFinderMsg(text,type){
    const icon = ICONS[type] || ICONS.error;
    finderMsg.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;justify-content:center;">${icon}<span>${text}</span></span>`;
    finderMsg.className='finder-msg show '+type;
  }

  function hideQuickSignup(){
    quickSignupSlot.innerHTML='';
    availableUsername=null;
  }

  // يبني حقول البريد وكلمة المرور ديناميكياً فقط عند الحاجة الفعلية (بعد التأكد من توفر الاسم)
  function showQuickSignup(){
    quickSignupSlot.innerHTML = `
      <div class="quick-signup" id="quickSignup">
        <input type="email" id="qsEmail" placeholder="بريدك الإلكتروني · Email" autocomplete="off" dir="ltr">
        <input type="password" id="qsPassword" placeholder="كلمة المرور (6 أحرف+) · Password" autocomplete="new-password" dir="ltr">
        <button type="button" class="qs-btn" id="qsSubmitBtn">⚡ إنشاء الحساب واستخدام الاسم · Claim Username</button>
        <div class="qs-msg" id="qsMsg"></div>
      </div>`;
    const qsEmail=document.getElementById('qsEmail');
    const qsPassword=document.getElementById('qsPassword');
    const qsSubmitBtn=document.getElementById('qsSubmitBtn');
    qsSubmitBtn.addEventListener('click',quickSignup);
    qsPassword.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();quickSignup();}});
    qsEmail.focus({preventScroll:true}); // تركيز صريح هنا فقط، بعد فعل مباشر من المستخدم (ضغط زر التحقق)
  }

  function setQsLoading(v){
    const btn=document.getElementById('qsSubmitBtn');
    if(!btn)return;
    btn.disabled=v;
    btn.textContent=v?'⏳ جاري الإنشاء...':'⚡ إنشاء الحساب واستخدام الاسم · Claim Username';
  }
  function showQsMsg(text,type){
    const el=document.getElementById('qsMsg');
    if(!el)return;
    if(!text){ el.innerHTML=''; el.className='qs-msg'; return; }
    const icon = ICONS[type] || ICONS.error;
    el.innerHTML = `<span style="display:inline-flex;align-items:center;gap:6px;justify-content:center;">${icon}<span>${text}</span></span>`;
    el.className='qs-msg '+(type||'');
  }

  // ===== 2) تهيئة Firebase بأمان تام — أي خطأ هنا لا يعطّل الأزرار أعلاه =====
  let auth=null, db=null, firebaseReady=false, fbDoc=null, fbGetDoc=null, fbSetDoc=null, fbCreateUser=null, fbSendVerification=null;
  (async function initFirebase(){
    try{
      const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js");
      const { getAuth, createUserWithEmailAndPassword, sendEmailVerification } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js");
      const { getFirestore, doc, getDoc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
      const app = initializeApp(cfg);
      auth = getAuth(app);
      db = getFirestore(app);
      fbDoc = doc; fbGetDoc = getDoc; fbSetDoc = setDoc;
      fbCreateUser = createUserWithEmailAndPassword; fbSendVerification = sendEmailVerification;
      firebaseReady=true;
    }catch(e){
      console.error('Firebase init failed:', e);
    }
  })();

  // ===== 3) المنطق الفعلي =====
  window.verifyUsername = verifyUsername; // إتاحة عامة احتياطية
  async function verifyUsername(){
    if(finderBusy)return;
    const username=finderInput.value.trim().toLowerCase();
    hideQuickSignup();
    if(!username){showFinderMsg('اكتب اسم المستخدم أولاً · Enter a username','error');return;}
    if(!/^[a-z0-9_]{3,20}$/.test(username)){showFinderMsg('اسم غير صالح (3-20، حروف/أرقام/_) · Invalid username','error');return;}
    if(reserved.includes(username)){showFinderMsg('هذا الاسم محجوز للمنصة · Reserved name','error');return;}
    if(!firebaseReady){showFinderMsg('تعذر الاتصال بالخادم، أعد تحميل الصفحة · Connection error, reload the page','error');return;}

    finderBusy=true;
    finderBtn.disabled=true;
    finderBtn.classList.add('loading');
    hideFinderMsg();
    try{
      const docSnap=await fbGetDoc(fbDoc(db,'usernames',username));
      if(docSnap.exists()){
        showFinderMsg('هذا الاسم محجوز، جرّب اسماً آخر · Username already taken','error');
      }else{
        availableUsername=username;
        showFinderMsg('اسم المستخدم متاح! أكمل التسجيل السريع بالأسفل · Username available! Finish below','success');
        showQuickSignup();
      }
    }catch(e){
      console.error('verifyUsername error:', e);
      const codeInfo = (e && e.code) ? ` (${e.code})` : '';
      showFinderMsg('تعذر التحقق' + codeInfo + '، حاول مرة أخرى · Check failed, try again','error');
    }
    finderBusy=false;
    finderBtn.disabled=false;
    finderBtn.classList.remove('loading');
  }

  async function quickSignup(){
    if(!firebaseReady){showQsMsg('تعذر الاتصال بالخادم، أعد تحميل الصفحة · Connection error','error');return;}
    if(!availableUsername){showQsMsg('تحقق من اسم المستخدم أولاً · Check username first','error');return;}
    const qsEmail=document.getElementById('qsEmail');
    const qsPassword=document.getElementById('qsPassword');
    const email=qsEmail.value.trim();
    const password=qsPassword.value;
    if(!email||!password){showQsMsg('يرجى ملء البريد وكلمة المرور · Fill all fields','error');return;}
    if(password.length<6){showQsMsg('كلمة المرور 6 أحرف على الأقل · Min 6 chars','error');return;}

    setQsLoading(true);
    showQsMsg('','');
    try{
      const idx=await fbGetDoc(fbDoc(db,'usernames',availableUsername));
      if(idx.exists()){
        showQsMsg('للأسف تم حجز هذا الاسم للتو، جرّب اسماً آخر · Just got taken, try another','error');
        setQsLoading(false);
        hideQuickSignup();
        return;
      }
      const cred=await fbCreateUser(auth,email,password);
      const uid=cred.user.uid;
      await fbSetDoc(fbDoc(db,'users',uid),{
        uid, username:availableUsername, email, displayName:availableUsername,
        bio:'', avatar:'', bannerImage:'', links:[], socials:[], phones:[], website:'', mapUrl:'',
        createdAt:new Date().toISOString()
      },{merge:true});
      await fbSetDoc(fbDoc(db,'usernames',availableUsername),{uid});
      try{ await fbSendVerification(cred.user); }catch(e){}
      try{ localStorage.setItem('elUserUsername',availableUsername); }catch(e){}
      showQsMsg('تم إنشاء حسابك! جاري الدخول... · Account created!','success');
      setTimeout(()=>{window.location.href='dashboard.html';},600);
    }catch(e){
      setQsLoading(false);
      if(e.code==='auth/email-already-in-use')showQsMsg('هذا البريد مستخدم بالفعل · Email already in use','error');
      else if(e.code==='auth/weak-password')showQsMsg('كلمة المرور ضعيفة جداً · Weak password','error');
      else if(e.code==='auth/invalid-email')showQsMsg('صيغة البريد غير صحيحة · Invalid email','error');
      else showQsMsg('خطأ' + (e.code?` (${e.code})`:'') + ': '+e.message,'error');
    }
  }
})();
</script>
</body>
</html>
