<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        /* العنوان العلوي المنسق */
        .header-title {
            color: #ffffff;
            font-size: 20px;
            margin-bottom: 25px;
            text-align: center;
            width: 90%;
        }

        .highlight {
            font-size: 28px; /* تكبير ما بين العاكفين */
            color: #4CAF50;
            font-weight: bold;
        }

        /* المربع الأبيض المنبثق المعدل */
        .main-card {
            background-color: #ffffff;
            width: 86%; /* تقصير العرض لإظهار الخلفية من الجوانب */
            max-width: 420px;
            border-radius: 30px;
            box-shadow: 0 20px 45px rgba(0,0,0,0.8); /* ظل منبثق قوي */
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px; /* إظهار الخلفية بالأسفل */
        }

        /* مربع إدخال الأرقام منسق */
        .input-field {
            width: 80%;
            padding: 15px;
            border: 2px solid #eeeeee;
            border-radius: 12px;
            font-size: 22px;
            text-align: center;
            outline: none;
            background-color: #fcfcfc;
            transition: 0.3s;
        }

        .input-field:focus {
            border-color: #4CAF50;
        }

        /* زر اذهب الآن */
        .action-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 50px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            width: 80%;
        }

        .action-btn:active { transform: scale(0.96); }

        /* زر اطلب خدمة ترقيم الروابط - ينقل لإنستقرام */
        .order-service-btn {
            background-color: #f0f0f0;
            color: #333;
            padding: 10px 20px;
            border: 1px dashed #4CAF50;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-top: 10px;
            transition: 0.3s;
            display: inline-block;
        }

        .order-service-btn:hover { background-color: #e8f5e9; }

        /* شعار X وتفعيل اللمس */
        .social-links { margin-top: 5px; }
        .x-link svg {
            width: 28px;
            height: 28px;
            fill: #000;
            transition: 0.3s;
        }
        .x-link:hover svg { fill: #4CAF50; }

        /* التوقيع منسق تحت المربع */
        .footer-sig {
            color: #ffffff;
            font-size: 11px;
            text-align: center;
            width: 90%;
            margin-top: auto;
            padding-bottom: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header-title">
        توجيه <span class="highlight">"الأرقام إلى روابط"</span> لمنصة إلكتروني
    </div>

    <div class="main-card">
        <div style="color: #666; font-size: 14px;">أدخل الرقم بالأسفل</div>
        
        <input type="number" class="input-field" placeholder="000" id="numInput">
        
        <button class="action-btn" onclick="goToLink()">اذهب الآن</button>
        
        <a href="https://www.instagram.com/electrwni" class="order-service-btn" target="_blank">
            اطلب خدمة ترقيم الروابط الآن
        </a>

        <div class="social-links">
            <a href="https://x.com/electrwni" class="x-link" target="_blank">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
            </a>
        </div>
    </div>

    <div class="footer-sig">
        تم تطوير المحرك البرمجي بواسطة Electrwni,، الكويت، بنية بمعمارية عالية الأداء، Built with High-Performance Architecture, by electrwni, kuwait
    </div>

    <script>
        function goToLink() {
            const num = document.getElementById('numInput').value;
            if(num) {
                // منطق التوجيه للرقم
                window.location.href = "https://brmjeat1.github.io/" + num;
            } else {
                alert('يرجى إدخال الرقم');
            }
        }
    </script>
</body>
</html>
