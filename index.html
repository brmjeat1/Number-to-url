<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توجيه الأرقام - تصميم زجاجي فاخر</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #072AC8; 
            --box-yellow: #fdf131; /* لون الصورة الموحد للأيقونات */
            --dark-blue: #051ea3;
            /* ألوان التصميم الزجاجي */
            --glass-bg: rgba(255, 255, 255, 0.08); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: 15px;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-image: linear-gradient(0deg, rgba(3, 121, 241,0.5) 0%, rgba(3, 121, 241,0.5) 9%,transparent 9%, transparent 16%,rgba(11, 75, 199,0.5) 16%, rgba(11, 75, 199,0.5) 49%,rgba(9, 86, 209,0.5) 49%, rgba(9, 86, 209,0.5) 100%),linear-gradient(135deg, rgb(3, 121, 241) 0%, rgb(3, 121, 241) 31%,rgb(13, 63, 188) 31%, rgb(13, 63, 188) 37%,transparent 37%, transparent 56%,rgb(9, 86, 209) 56%, rgb(9, 86, 209) 100%),linear-gradient(90deg, rgb(255,255,255),rgb(255,255,255));
            background-attachment: fixed;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: flex-start; /* لتمشية المستطيل الزجاجي */
            padding-top: 50px;
        }

        .main-title {
            color: white;
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 2;
        }

        /* حاوية زجاجية ممددة للأعلى والأسفل (تفويض التصميم) */
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px 30px; /* زيادة الطول للأعلى والأسفل */
            max-width: 400px;
            width: 88%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .header-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: white; }

        input { 
            width: 100%; padding: 15px; font-size: 1.1rem; 
            border: 1px solid var(--glass-border); border-radius: 12px; 
            text-align: center; outline: none; margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05); /* إدخال زجاجي */
            color: white; box-sizing: border-box;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.5); }

        .btn-go { 
            width: 100%; padding: 15px; background: var(--dark-blue); /* أزرق قاتم متناسق */
            color: #fff; border: none; border-radius: 12px; 
            font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: background 0.3s;
        }
        .btn-go:hover { background: #03146e; }

        .qr-section { margin: 20px 0; text-align: center; z-index: 15; }
        #qr-code-img { width: 90px; height: 90px; } 

        /* تنسيق الأيقونات الجديد مع تفعيل الروابط */
        .social-links { 
            display: flex; gap: 15px; margin-bottom: 20px; 
            background: rgba(0,0,0,0.2); padding: 10px 25px; border-radius: 30px;
        }
        .social-icon { 
            background: transparent; border: 1px solid var(--glass-border); 
            width: 38px; height: 38px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: var(--box-yellow); /* لون الأيقونات الموحد */
            font-size: 1.2rem; transition: 0.3s;
        }
        .social-icon:hover { transform: scale(1.1); background: rgba(255,255,255,0.05); }

        .order-link { color: var(--sky); text-decoration: none; font-weight: bold; font-size: 0.95rem; margin-bottom: 25px; display: block; z-index: 15;}

        /* منطقة "رقم روابطك" المتناغمة */
        .info-box-wrapper {
            display: flex; align-items: center; justify-content: center;
            direction: ltr; width: 100%; margin-top: 15px; transform: scale(0.9);
        }
        .yellow-part {
            background: var(--box-yellow); color: var(--dark-blue); font-weight: bold;
            padding: 12px 18px; border-radius: 15px; font-size: 1.25rem; z-index: 2;
        }
        .blue-part {
            background: var(--glass-bg); backdrop-filter: blur(5px); color: #ffffff; padding: 12px 18px;
            border-radius: 15px 0 0 15px; margin-right: -10px; font-size: 1.05rem;
            min-width: 230px; display: flex; align-items: center; justify-content: flex-start; direction: rtl;
        }

        .dynamic-text { 
            white-space: nowrap; overflow: hidden; display: inline-block; 
            border-left: 3px solid white;
            animation: typing 8s steps(30) infinite, cursor-logic 8s step-end infinite;
        }

        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }
        @keyframes cursor-logic { 0%, 45% { border-left-color: #ffffff; } 46%, 100% { border-left-color: var(--box-yellow); } }

        /* الفوتر المحسن (التفويض) */
        .footer { 
            margin-top: auto; padding: 30px; font-size: 0.8rem; 
            color: rgba(255, 255, 255, 0.7); /* أبيض شفاف */
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            text-align: center; line-height: 1.7; font-weight: bold;
            width: 90%; max-width: 700px;
        }
    </style>
</head>
<body>

    <div class="main-title">صفحة توجيه الأرقام إلى روابط لمنصة إلكتروني</div>

    <div class="glass-container">
        <div class="header-text">توجيه الأرقام إلى روابط</div>

        <input type="number" id="linkId" placeholder="أدخل الرقم هنا...">
        <button class="btn-go" onclick="redirect()">انتقل الآن</button>

        <div class="qr-section">
            <img id="qr-code-img" src="" alt="QR">
            <p style="color:#fff; font-size: 0.7rem; margin-top: 8px;">باركود الموقع</p>
        </div>

        <div class="social-links">
            <a href="https://x.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://instagram.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <a href="https://instagram.com/electrwni" target="_blank" class="order-link">أطلب ترقيم روابطك الآن <i class="fa-brands fa-instagram"></i></a>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">حساباتك برقم واحد ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni,، الكويت، بنية بمعمارية عالية الأداء. <br>
        Built with High-Performance Architecture, by electrwni, kuwait, 2026.
    </div>

    <script>
        window.onload = function() {
            const currentPath = window.location.href.split('?')[0];
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentPath)}&color=ffffff&bgcolor=00000000`; // باركود أبيض شفاف
        };

        const phrases = ["حساباتك برقم واحد ..", "خطواتك تسبق منافسيك ..", "بساطة سرعة وصول ..", "رقم يختصر مسافاتك .."];
        let i = 0;
        setInterval(() => {
            i = (i + 1) % phrases.length;
            document.getElementById('typing-text').innerText = phrases[i];
        }, 8000);

        function redirect() {
            const val = document.getElementById('linkId').value;
            if(val) window.location.href = "https://electrwni.com/" + val;
        }
    </script>
</body>
</html>
