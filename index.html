
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني - التوجيه الرقمي</title>
    <!-- استيراد خط تجول لتعزيز المظهر الرسمي -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #072AC8; 
            --primary-light: #1e46f5;
            --accent: #facc15; 
            --sky: #1E96FC; 
            --light-blue: #e0f2fe; 
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-dark: #0f172a;
            --text-muted: #475569;
        }
        
        body { 
            margin: 0; 
            font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: space-between; 
            /* خلفية فاتحة رسمية ومريحة مع تدرج شبكي ناعم */
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at top right, #e0f2fe 0px, transparent 50%),
                radial-gradient(at bottom left, #eff6ff 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* هيدر زجاجي فاتح فاخر */
        .header-box { 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            width: 100%; 
            min-height: 65px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px 0; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
        }
        
        .header-text { color: var(--text-dark); font-size: 1.1rem; font-weight: 500; }
        .highlight-text { color: var(--primary); font-size: 1.3rem; font-weight: 700; margin: 0 5px; }
        
        /* واجهة المستخدم الزجاجية الفاتحة (Light Glassmorphism) */
        .white-wrapper { 
            background: var(--glass-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 88%; 
            max-width: 420px; 
            margin: 40px auto; 
            border-radius: 28px; 
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.06); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 24px; 
            box-sizing: border-box; 
            min-height: 500px; 
            justify-content: center; 
            position: relative;
        }

        .welcome-title {
            color: var(--primary); 
            font-weight: 700; 
            font-size: 1.15rem;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        /* حقل إدخال رسمي محسّن */
        .input-container {
            width: 100%;
            position: relative;
        }

        input { 
            width: 100%; 
            padding: 16px 20px; 
            font-size: 1.25rem; 
            font-weight: 600;
            border: 2px solid rgba(7, 42, 200, 0.15); 
            border-radius: 16px; 
            text-align: center; 
            outline: none; 
            box-sizing: border-box; 
            background: rgba(255, 255, 255, 0.8);
            color: var(--text-dark);
            transition: all 0.3s ease;
        }

        /* تأثير التوهج الأزرق الرسمي */
        input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 20px rgba(7, 42, 200, 0.12);
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 1.1rem;
        }

        /* تغذية تجربة المستخدم: معاينة حية تفاعلية */
        .live-preview {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .live-preview span {
            color: var(--primary);
            font-weight: 700;
        }

        .error-msg { color: #dc2626; font-size: 0.9rem; margin-top: 10px; display: none; font-weight: 600; }
        
        /* زر الانتقال الرسمي */
        .btn-go { 
            width: 100%; 
            padding: 16px; 
            background: var(--primary); 
            color: #fff; 
            border: none; 
            border-radius: 16px; 
            font-size: 1.2rem; 
            font-weight: 700; 
            margin-top: 20px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 4px 12px rgba(7, 42, 200, 0.2);
        }

        .btn-go:hover { 
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(7, 42, 200, 0.3);
        }
        
        .btn-go:active { transform: translateY(1px); }

        /* روابط التسجيل والدخول المحسنة */
        .auth-links { display: flex; width: 100%; justify-content: space-around; margin-top: 25px; border-top: 1px solid rgba(0, 0, 0, 0.06); padding-top: 20px; }
        .auth-btn { text-decoration: none; color: var(--primary); font-weight: 700; font-size: 0.9rem; padding: 10px 20px; border: 2px solid var(--primary); border-radius: 12px; transition: all 0.2s ease; }
        .auth-btn:hover { background: rgba(7, 42, 200, 0.05); }
        .auth-btn.signup { background: var(--primary); color: #fff; }
        .auth-btn.signup:hover { background: var(--primary-light); }

        /* أيقونات التواصل الاجتماعي العائمة */
        .social-links { display: flex; justify-content: center; gap: 15px; margin: 25px 0 10px 0; align-items: center; } 
        .social-icon { 
            background: #ffffff; 
            width: 48px; 
            height: 48px; 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none; 
            color: var(--primary); 
            border: 1px solid rgba(0, 0, 0, 0.05); 
            cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        
        .social-icon:hover {
            transform: translateY(-3px);
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(7, 42, 200, 0.15);
        }
        .social-icon svg { width: 18px; fill: currentColor; transition: fill 0.3s; }

        /* فوتر زجاجي رسمي مريح للقرأة */
        .footer { 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            width: 100%; 
            padding: 20px; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            text-align: center; 
            line-height: 1.7; 
            box-sizing: border-box; 
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.01);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="header-text">توجيه <span class="highlight-text">الأرقام إلى روابط</span> لمنصة إلكتروني</div>
    </div>

    <div class="white-wrapper">
        <div class="welcome-title">خدمة مقدمة من Electrwni</div>
        
        <div class="input-container">
            <input type="text" id="linkId" inputmode="numeric" placeholder="أدخل الرقم هنا...">
            <!-- المعاينة الحية للرابط -->
            <div class="live-preview" id="livePreview">المسار الحالي: electrwni.link/<span id="runtimeNum">...</span></div>
        </div>
        
        <div id="error-msg" class="error-msg"></div>
        <button class="btn-go" id="btnGo">انتقل الآن</button>

        <div class="auth-links">
            <a href="singin.html" class="auth-btn">تسجيل دخول</a>
            <a href="signup.html" class="auth-btn signup">تسجيل جديد</a>
        </div>

        <div class="social-links">
            <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
            <a href="https://www.instagram.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://x.com/electrwni" target="_blank" class="social-icon">
                <svg viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.292 19.494h2.039L6.486 3.24H4.298l13.311 17.407z"/></svg>
            </a>
            <div class="social-icon" id="qrBtn"><i class="fas fa-qrcode"></i></div>
        </div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت بنية بمعمارية عالية الأداء <br>
        Built with High-Performance Architecture, by electrwni, kuwait
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const input = document.getElementById('linkId');
        const btnGo = document.getElementById('btnGo');
        const errorMsg = document.getElementById('error-msg');
        const runtimeNum = document.getElementById('runtimeNum');

        // وظيفة التحقق من وجود رقم في الرابط (التوجيه التلقائي)
        async function checkAutoRedirect() {
            const path = window.location.pathname.replace('/', '').trim();
            if (path && !isNaN(path)) {
                try {
                    const snap = await get(child(ref(db), `links/${path}`));
                    if (snap.exists()) {
                        let target = snap.val();
                        if (!target.startsWith('http')) target = 'https://' + target;
                        window.location.href = target;
                    }
                } catch (e) { console.error("Auto-redirect Error:", e); }
            }
        }
        checkAutoRedirect();

        input.addEventListener('input', (e) => {
            let v = e.target.value;
            const ar = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
            for (let i = 0; i < 10; i++) v = v.replace(ar[i], i);
            e.target.value = v.replace(/[^0-9]/g, '');
            
            // تحديث المعاينة الحية
            if(e.target.value === "") {
                errorMsg.style.display = 'none';
                runtimeNum.innerText = "...";
            } else {
                runtimeNum.innerText = e.target.value;
            }
        });

        btnGo.onclick = async () => {
            const val = input.value.trim();
            if(!val) return;

            errorMsg.style.display = 'block';
            errorMsg.style.color = "var(--primary)";
            errorMsg.innerText = "جاري التحقق...";

            try {
                const snap = await get(child(ref(db), `links/${val}`));
                if (snap.exists()) {
                    let targetUrl = snap.val();
                    if (!targetUrl.startsWith('http')) targetUrl = 'https://' + targetUrl;
                    window.location.href = targetUrl;
                } else { 
                    errorMsg.innerText = "الرقم غير مسجل"; 
                    errorMsg.style.color = "#dc2626"; 
                }
            } catch (e) { 
                errorMsg.innerText = "خطأ في الاتصال"; 
                errorMsg.style.color = "#dc2626"; 
            }
        };

        document.getElementById('qrBtn').onclick = () => {
            alert("ميزة المسح الضوئي قيد التطوير للارتباط بالدومين الجديد!");
        };
    </script>
</body>
</html>
