<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Electrwni | Bio</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg: #000000; --glass: rgba(28, 28, 30, 0.8); --accent: #0a84ff; --text-main: #ffffff; --text-sub: #8e8e93; }
        body { background-color: var(--bg); color: var(--text-main); font-family: -apple-system, system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 40px 20px; }
        .profile-container { text-align: center; margin-bottom: 30px; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--accent); padding: 3px; margin-bottom: 15px; }
        .nickname { font-size: 22px; font-weight: 700; }
        .description { font-size: 14px; color: var(--text-sub); margin-top: 8px; max-width: 280px; }
        .links-wrapper { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; }
        .link-item { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); padding: 16px; border-radius: 14px; text-decoration: none; color: var(--text-main); font-weight: 600; text-align: center; transition: 0.3s; }
        .link-item:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        .brand-footer { margin-top: auto; padding-top: 40px; opacity: 0.4; font-size: 11px; letter-spacing: 2px; }
        #loading { color: var(--accent); margin-top: 20px; }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="https://ui-avatars.com/api/?name=E&background=0a84ff&color=fff" class="avatar">
        <div class="nickname" id="userName">جاري التحميل...</div>
        <div class="description" id="userBio">منصة Electrwni للروابط الذكية</div>
    </div>
    <div id="loading">يرجى الانتظار...</div>
    <div class="links-wrapper" id="linksList"></div>
    <div class="brand-footer">POWERED BY ELECTRWNI</div>

<script>
    // بياناتك المستخرجة من الصور السابقة
    const firebaseConfig = {
        apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
        authDomain: "electrwni-link.firebaseapp.com",
        projectId: "electrwni-link",
        storageBucket: "electrwni-link.firebasestorage.app",
        messagingSenderId: "712490301263",
        appId: "1:712490301263:web:2436fa7db9aae4a7b539c9",
        databaseURL: "https://electrwni-link-default-rtdb.firebaseio.com" // تأكد من هذا الرابط في صفحة Database
    };
    
    firebase.initializeApp(firebaseConfig);

    const params = new URLSearchParams(window.location.search);
    const userNick = params.get('u') || 'khaled'; 

    const db = firebase.database().ref('users/' + userNick);

    db.on('value', (snapshot) => {
        const data = snapshot.val();
        document.getElementById('loading').style.display = 'none';
        if (data) {
            document.getElementById('userName').innerText = "@" + userNick;
            document.getElementById('userBio').innerText = data.bio || "مرحباً بكم في صفحتي";
            const list = document.getElementById('linksList');
            list.innerHTML = '';
            if (data.links) {
                Object.keys(data.links).forEach(key => {
                    const link = data.links[key];
                    list.innerHTML += `<a href="${link.url}" target="_blank" class="link-item">${link.title}</a>`;
                });
            }
        } else {
            document.getElementById('userName').innerText = "المستخدم غير موجود";
        }
    });
</script>
</body>
</html>
