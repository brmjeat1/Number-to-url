<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني | منصة الروابط الرقمية</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; direction: rtl; }
        .bio-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); max-width: 450px; width: 90%; text-align: center; display: none; }
        .logo-area { font-size: 32px; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .bio-desc { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .links-list { display: flex; flex-direction: column; gap: 15px; }
        .bio-link { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px; border-radius: 12px; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px; transition: 0.3s ease; display: block; }
        .bio-link:hover { background: #fff; color: #0f172a; transform: translateY(-2px); }
        .footer-gate { margin-top: 30px; font-size: 12px; }
        .footer-gate a { color: #64748b; text-decoration: none; transition: 0.2s; }
        .footer-gate a:hover { color: #fff; }
        #loading-screen { font-size: 16px; color: #38bdf8; font-weight: 600; }
    </style>
</head>
<body>

    <div id="loading-screen">جاري فحص المسار الرقمي...</div>

    <div class="bio-container" id="bio-ui">
        <div class="logo-area">electrwni</div>
        <div class="bio-desc">منصتك الاحترافية لتحويل الأرقام التلقائية إلى روابط رقمية ذكية</div>
        
        <div class="links-list">
            <a href="https://electrwni.link" class="bio-link" target="_blank">الموقع الرسمي للخدمة</a>
            <a href="#" class="bio-link" id="dynamic-sample-link" style="display:none;">رابط توجيه تجريبي</a>
        </div>

        <div class="footer-gate">
            <a href="signin.html">بوابة الشركاء وتدوين الروابط ←</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const hashData = window.location.hash.substring(1); 

        // إذا كان هناك هاش وتوجيه رقمي لمشترك معين
        if (hashData && hashData.includes('/')) {
            const parts = hashData.split('/');
            const userId = parts[0];
            const linkNumber = parts[1];

            db.ref('users/' + userId + '/links/' + linkNumber).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    window.location.href = snapshot.val();
                } else {
                    showBioPage("عذراً، هذا الرقم التوجيهي غير مسجل أو مفقود.");
                }
            }).catch(() => {
                showBioPage("حدث خطأ في جلب بيانات التوجيه.");
            });
        } else {
            // دخول مباشر على الدومين الرئيسي دون هاش رقمي
            showBioPage();
        }

        function showBioPage(errMessage = "") {
            document.getElementById('loading-screen').style.display = 'none';
            const bioUi = document.getElementById('bio-ui');
            bioUi.style.display = 'block';
            if(errMessage) {
                document.querySelector('.bio-desc').innerText = errMessage;
                document.querySelector('.bio-desc').style.color = '#ef4444';
            }
        }
    </script>
</body>
</html>
