<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رقم روابطك - التصميم المطور</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #072AC8; 
            --accent: #FCF300; 
            --sky: #1E96FC; 
            --box-yellow: #FFF041;
            --deep-blue: #030014;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--deep-blue);
            background-image: 
                radial-gradient(at 15% 20%, #012f7b 0px, transparent 60%), 
                radial-gradient(at 85% 25%, #0056d6 0px, transparent 55%), 
                radial-gradient(at 50% 85%, #52d6fc 0px, transparent 50%);
            background-attachment: fixed;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: center;
        }

        /* حاوية المحتوى البيضاء - مصغرة بظل */
        .white-container {
            background: #ffffff; /* بياض غامق غير شفاف */
            border-radius: 20px;
            padding: 15px 20px; /* تقليل الجوانب وفوق وتحت */
            max-width: 380px; /* تقليل العرض قليلاً */
            width: 85%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); /* ظل عميق لإبراز الحاوية */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header-text { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; color: var(--deep-blue); }
        .highlight-text { color: var(--primary); }

        .input-group { width: 100%; margin-bottom: 20px; }
        input { 
            width: 100%; padding: 12px; font-size: 1.1rem; 
            border: 2px solid #eee; 
            border-radius: 10px; text-align: center; 
            background: #f9f9f9;
            color: #333; outline: none; box-sizing: border-box;
        }

        .btn-go { 
            width: 100%; padding: 12px; background: var(--primary); 
            color: #fff; border: none; border-radius: 10px; 
            font-size: 1.1rem; font-weight: bold; margin-top: 10px; 
            cursor: pointer;
        }

        .qr-section { 
            padding: 10px; border: 1px solid #f0f0f0; border-radius: 12px; 
            margin-bottom: 20px;
        }
        .qr-section p { font-size: 0.8rem; color: #666; font-weight: bold; margin: 0 0 5px 0; }
        #qr-code-img { width: 100px; height: 100px; }

        .social-links { display: flex; gap: 12px; margin-bottom: 20px; }
        .social-icon { 
            background: #f0f4ff; width: 38px; height: 38px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: var(--primary); border: 1px solid #d0d7f0; 
        }

        .order-link { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 0.95rem; margin-bottom: 25px; }

        /* منطقة "رقم روابطك" */
        .info-box-wrapper {
            display: flex; align-items: center; justify-content: center;
            direction: ltr; transform: scale(0.8); /* تصغير القسم السفلي ليتناسب مع الحاوية */
        }
        .yellow-part {
            background: var(--box-yellow); color: var(--primary); font-weight: bold;
            padding: 10px 15px; border-radius: 12px; font-size: 1.2rem;
            z-index: 2;
        }
        .blue-part {
            background: var(--primary); color: #ffffff; padding: 10px 18px;
            border-radius: 12px 0 0 12px; margin-right: -8px; font-size: 1rem;
            min-width: 240px; display: flex; align-items: center; justify-content: flex-start; direction: rtl;
        }

        .dynamic-text { 
            white-space: nowrap; overflow: hidden; display: inline-block; 
            border-left: 3px solid white;
            animation: typing 4s steps(30) infinite, cursor-logic 4s step-end infinite;
        }

        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }
        @keyframes cursor-logic {
            0%, 45% { border-left-color: #ffffff; } 
            46%, 100% { border-left-color: var(--box-yellow); }
        }

        .footer { 
            margin-top: 20px; padding: 10px; font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.6); text-align: center;
        }
    </style>
</head>
<body>

    <div class="white-container">
        <div class="header-text">توجيه <span class="highlight-text">الأرقام إلى روابط</span></div>

        <div class="input-group">
            <input type="number" id="linkId" placeholder="أدخل الرقم هنا...">
            <button class="btn-go" onclick="redirect()">انتقل الآن</button>
        </div>

        <div class="qr-section">
            <p>باركود الموقع</p>
            <img id="qr-code-img" src="" alt="الباركود">
        </div>

        <div class="social-links">
            <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <a href="#" class="order-link">أطلب ترقيم روابطك الآن <i class="fa-brands fa-instagram"></i></a>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">خطواتك تسبق منافسيك ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </div>

    <div class="footer">
        Electrwni, Kuwait © 2026<br>
        High-Performance Architecture
    </div>

    <script>
        window.onload = function() {
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}&color=072ac8`;
        };

        const phrases = [
            "خطواتك تسبق منافسيك ..",
            "حساباتك برقم واحد ..",
            "بساطة سرعة وصول ..",
            "تميزك يربك الخصوم ..",
            "رقم يختصر مسافاتك .."
        ];
        
        let i = 0;
        const typingEl = document.getElementById('typing-text');
        setInterval(() => {
            i = (i + 1) % phrases.length;
            typingEl.innerText = phrases[i];
        }, 4000);

        function redirect() {
            const val = document.getElementById('linkId').value;
            if(val) window.location.href = "https://electrwni.com/" + val;
        }
    </script>
</body>
</html>
