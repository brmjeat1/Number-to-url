<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<style>
  .typewriter-container {
    display: flex;
    align-items: center;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 24px;
    color: #333;
  }

  .text-wrapper {
    border-left: 3px solid white; /* الخط الأولي */
    white-space: nowrap;
    overflow: hidden;
    margin-right: 10px;
    animation: 
      typing 3.5s steps(30, end) infinite,
      cursor-color 3.5s step-end infinite;
  }

  @keyframes typing {
    0%, 100% { width: 0; }
    50%, 70% { width: 100%; }
  }

  @keyframes cursor-color {
    0%, 49% { border-left-color: white; } /* عند الفتح من اليمين */
    50%, 100% { border-left-color: yellow; } /* عند الإغلاق من الشمال */
  }

  /* عباراتك المدمجة */
  .text-wrapper::after {
    content: "صدارة رقمية بلا منافس";
    animation: change-text 14s infinite;
  }

  @keyframes change-text {
    0%, 25% { content: "خطواتك تسبق منافسيك"; }
    26%, 50% { content: "حساباتك برقم واحد"; }
    51%, 75% { content: "بساطة سرعة وصول"; }
    76%, 100% { content: "صدارة رقمية بلا منافس"; }
  }
</style>
</head>
<body>

<div class="typewriter-container">
  <span>رقم روابطك: </span>
  <div class="text-wrapper"></div>
</div>

</body>
</html>
