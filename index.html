<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني | التوجيه الرقمي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* التنسيقات الأصلية مع الحفاظ على الهوية البصرية */
        :root { --primary: #00037D; --accent: #FCF300; --sky: #1E96FC; --error-red: #ff4d4d; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; background: radial-gradient(circle at top right, #00037D 0%, #071F95 50%, #221EFC 100%) fixed; }
        .white-wrapper { background: #ffffff; width: 90%; max-width: 450px; margin: 40px auto; border-radius: 28px; padding: 35px 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; z-index: 10; }
        input { width: 100%; padding: 18px; font-size: 1.3rem; border: 2.5px solid var(--primary); border-radius: 15px; text-align: center; outline: none; margin-bottom: 10px; transition: 0.3s; }
        .btn-go { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 15px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .error-message { color: var(--error-red); font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; display: none; }
        .footer { background: rgba(255, 255, 255, 0.9); width: 100%; padding: 20px; text-align: center; font-size: 0.85rem; font-weight: bold; color: var(--primary); }
        input.error-shake { border-color: var(--error-red); animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    </style>
</head>
<body>

    <main class="white-wrapper">
        <h2 style="color: var(--primary); margin-bottom: 20px;">أدخل رقم التوجيه</h2>
        <input type="number" id="linkId" placeholder="مثال: 101">
        <div id="errorMsg" class="error-message">الرقم غير مسجل في النظام</div>
        <button class="btn-go" onclick="redirect()">انتقل الآن <i class="fas fa-arrow-left"></i></button>
    </main>

    <footer class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت<br>
        بنية بمعمارية عالية الأداء
    </footer>

    <!-- مكتبات Firebase (يجب أن تتطابق مع الآدمن) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        // ملاحظة: ضع نفس الـ Config الذي وضعته في صفحة الآدمن هنا
        const firebaseConfig = {
            databaseURL: "https://your-project-id.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function redirect() {
            const input = document.getElementById('linkId');
            const errorMsg = document.getElementById('errorMsg');
            const val = input.value.trim();

            if(!val) {
                showError("يرجى إدخال رقم");
                return;
            }

            // البحث الفوري في السحابة
            db.ref('links/' + val).once('value').then((snapshot) => {
                const targetUrl = snapshot.val();
                
                if(targetUrl) {
                    // التوجيه للرابط المخزن
                    errorMsg.style.display = 'none';
                    window.location.href = targetUrl;
                } else {
                    showError("هذا الرقم غير مرتبط برابط حالياً");
                }
            }).catch((error) => {
                showError("خطأ في الاتصال بالسحابة");
                console.error(error);
            });
        }

        function showError(msg) {
            const input = document.getElementById('linkId');
            const errorMsg = document.getElementById('errorMsg');
            input.classList.add('error-shake');
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
            setTimeout(() => input.classList.remove('error-shake'), 400);
        }
    </script>
</body>
</html>
