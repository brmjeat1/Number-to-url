<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        .header-title {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 30px;
            text-align: center;
            width: 90%;
        }

        .highlight {
            font-size: 28px;
            color: #4CAF50;
            font-weight: bold;
        }

        /* المربع الأبيض التفاعلي */
        .main-card {
            background-color: #ffffff;
            width: 88%;
            max-width: 450px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        /* مربع إدخال الأرقام */
        .input-field {
            width: 80%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 20px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-field:focus {
            border-color: #4CAF50;
        }

        /* زر اذهب الآن */
        .action-btn {
            background-color: #4CAF50;
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .action-btn:hover {
            background-color: #45a049;
        }

        /* شعار X */
        .x-link svg {
            width: 30px;
            height: 30px;
            fill: #000;
            margin-top: 10px;
        }

        /* التوقيع */
        .footer-sig {
            color: #ffffff;
            font-size: 11px;
            text-align: center;
            width: 90%;
            margin-top: auto;
            padding: 20px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header-title">
        توجيه <span class="highlight">"الأرقام إلى روابط"</span> لمنصة إلكتروني
    </div>

    <div class="main-card">
        <div style="color: #666; font-size: 14px;">أدخل الرقم بالأسفل</div>
        
        <input type="number" class="input-field" placeholder="000" id="numInput">
        
        <button class="action-btn" onclick="goToLink()">اذهب الآن</button>
        
        <a href="https://x.com/your_profile" class="x-link" target="_blank">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
        </a>
    </div>

    <div class="footer-sig">
        تم تطوير المحرك البرمجي بواسطة Electrwni,، الكويت، بنية بمعمارية عالية الأداء، Built with High-Performance Architecture, by electrwni, kuwait
    </div>

    <script>
        function goToLink() {
            const num = document.getElementById('numInput').value;
            if(num) {
                // هنا تضع منطق الروابط الخاص بك
                alert('سيتم توجيهك للرقم: ' + num);
            } else {
                alert('يرجى إدخال رقم أولاً');
            }
        }
    </script>
</body>
</html>
