<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrwni - تحويل الروابط</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="public-page">

    <div class="public-container">
        <div class="brand-header">
            <div class="logo">Electrwni</div>
            <p>أدخل الرقم للتوجه للرابط المطلوب</p>
        </div>

        <div class="main-action-card">
            <input type="number" id="targetNumber" placeholder="أدخل الرقم هنا..." class="public-input">
            <button onclick="redirectToUrl()" class="public-btn">انطلق الآن</button>
        </div>

        <footer class="public-footer">
            مدعوم بواسطة منصة إلكتروني الرقمية
        </footer>
    </div>

    <script>
        function redirectToUrl() {
            const num = document.getElementById('targetNumber').value;
            if(num) {
                // هنا يتم الربط مع قاعدة البيانات أو ملف JSON لجلب الرابط
                alert('سيتم تحويلك للرابط المرتبط بالرقم: ' + num);
            } else {
                alert('يرجى إدخال الرقم أولاً');
            }
        }
    </script>
</body>
</html>
