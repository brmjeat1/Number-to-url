<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- تهيئة محركات البحث SEO -->
    <title>إلكتروني | التوجيه الرقمي للأرقام والروابط</title>
    <meta name="description" content="منصة إلكتروني لتوجيه الأرقام إلى روابط وتوفير بايو احترافي وبنية عالية الأداء في الكويت.">
    <meta name="keywords" content="إلكتروني, توجيه الروابط, ترقيم الروابط, الكويت, بايو احترافي, روابط ذكية">
    <link rel="canonical" href="https://electrwni.com">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #00037D; 
            --accent: #FCF300; 
            --sky: #1E96FC; 
            --light-blue: #A2D6F9; 
            --box-blue: #3B82F6; 
            --box-yellow: #FFF041; 
            --error-red: #ff4d4d;
        }
        
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            background-image: radial-gradient(circle at top right, rgb(0,3,125) 0%, rgb(0,3,125) 48%, rgb(7,31,149) 48%, rgb(7,31,149) 53%, rgb(230,255,0) 53%, rgb(230,255,0) 56%, rgb(34,30,252) 56%, rgb(34,30,252) 69%, rgb(6,14,216) 69%, rgb(6,14,216) 100%);
            background-attachment: fixed;
            justify-content: space-between;
            overflow-x: hidden;
        }

        .white-wrapper {
            background: #ffffff;
            width: 90%;
            max-width: 450px;
            margin: 40px auto;
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 35px 25px;
            box-sizing: border-box;
            z-index: 10;
        }
        
        .header-box { background: var(--primary); width: 100%; min-height: 65px; display: flex; align-items: center; justify-content: center; padding: 10px 0; }
        .header-text { color: #ffffff; font-size: 1.1rem; font-weight: 500; text-align: center; }
        .highlight-text { color: var(--light-blue); font-size: 1.4rem; font-weight: bold; margin: 0 5px; }
        .yellow-line { background: var(--accent); width: 100%; height: 4px; }

        .input-group { width: 100%; margin-bottom: 10px; position: relative; }
        input { 
            width: 100%; padding: 18px; font-size: 1.3rem; 
            border: 2.5px solid var(--primary); border-radius: 15px; 
            text-align: center; outline: none; box-sizing: border-box;
            transition: 0.3s;
        }
        
        /* تأثير عند الخطأ */
        input.error-shake { border-color: var(--error-red); animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .error-message { color: var(--error-red); font-size: 0.85rem; font-weight: bold; margin-bottom: 15px; display: none; }

        .btn-go { 
            width: 100%; padding: 16px; background: var(--primary); 
            color: #fff; border: none; border-radius: 15px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
            transition: 0.2s;
        }

        .qr-section { padding: 15px; border: 1.5px dashed #ccc; border-radius: 20px; margin-bottom: 25px; text-align: center; }
        #qr-code-img { width: 130px; height: 130px; border-radius: 10px; }

        .social-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 25px; }
        .social-icon { background: var(--primary); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); border: 2px solid var(--sky); text-decoration: none; }
        .social-icon svg { width: 22px; height: 22px; fill: var(--accent); }

        .info-box-wrapper { display: flex; align-items: center; justify-content: center; direction: ltr; transform: scale(0.9); }
        .yellow-part { background: var(--box-yellow); color: var(--primary); font-weight: 900; padding: 12px 20px; border-radius: 18px; font-size: 1.5rem; z-index: 2; }
        .blue-part { background: var(--box-blue); color: #ffffff; padding: 12px 25px; border-radius: 18px 0 0 18px; margin-right: -15px; font-size: 1.3rem; min-width: 220px; display: flex; align-items: center; justify-content: center; direction: rtl; }

        .dynamic-text { white-space: nowrap; overflow: hidden; display: inline-block; animation: typing 4s steps(30) infinite; }
        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }

        .footer { background: rgba(250, 250, 250, 0.95); width: 100%; padding: 30px 20px; color: var(--primary); font-size: 0.9rem; font-weight: bold; border-top: 1px solid #eee; text-align: center; line-height: 1.8; box-sizing: border-box; }
    </style>
</head>
<body>

    <header class="header-box">
        <h1 class="header-text">توجيه <span class="highlight-text">الأرقام إلى روابط</span> لمنصة إلكتروني</h1>
    </header>
    <div class="yellow-line"></div>

    <main class="white-wrapper">
        <div class="input-group">
            <input type="number" id="linkId" placeholder="أدخل الرقم هنا..." aria-label="رقم الرابط">
        </div>
        <div id="errorMsg" class="error-message">عذراً، يرجى إدخال رقم صحيح للمتابعة</div>
        
        <button class="btn-go" onclick="redirect()">انتقل الآن</button>

        <div class="qr-section" style="margin-top: 20px;">
            <p style="font-size: 0.9rem; font-weight: bold;">باركود الموقع</p>
            <img id="qr-code-img" src="" alt="QR Code">
        </div>

        <nav class="social-links">
            <a href="https://x.com/electrwni" target="_blank" class="social-icon"><svg viewBox="0 0 24 24"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932 6.064-6.932zm-1.292 19.494h2.039L6.486 3.24H4.298l13.311 17.407z"/></svg></a>
            <a href="https://www.instagram.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </nav>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">حقق وصول أسرع لبيتك الرقمي ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </main>

    <footer class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت<br>
        بنية بمعمارية عالية الأداء<br>
        Built with High-Performance Architecture, by electrwni, kuwait
    </footer>

    <script>
        window.onload = function() {
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}&color=00037d`;
        };

        const phrases = ["حقق وصول أسرع لبيتك الرقمي ..", "امتلك بايو احترافي الآن ..", "أوصل جمهورك لمستودع روابطك ..", "سوق لدعاياتك بلمحة بصر .."];
        let pIdx = 0;
        setInterval(() => { 
            pIdx = (pIdx + 1) % phrases.length; 
            document.getElementById('typing-text').innerText = phrases[pIdx]; 
        }, 4000);

        function redirect() {
            const input = document.getElementById('linkId');
            const errorMsg = document.getElementById('errorMsg');
            const val = input.value.trim();

            if(!val || isNaN(val)) {
                // تفعيل تأثير الخطأ
                input.classList.add('error-shake');
                errorMsg.style.display = 'block';
                setTimeout(() => input.classList.remove('error-shake'), 400);
            } else {
                errorMsg.style.display = 'none';
                window.location.href = "https://electrwni.com/" + val;
            }
        }
    </script>
</body>
</html>
