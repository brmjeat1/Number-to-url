<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رقم روابطك - النسخة النهائية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --primary: #072AC8; 
            --accent: #FCF300; 
            --sky: #1E96FC; 
            --box-yellow: #FFF041;
            --deep-blue: #030014;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--deep-blue);
            /* توسيع الخلفية لتشمل الجوانب بالكامل */
            background-image: 
                radial-gradient(at 10% 20%, #012f7b 0px, transparent 70%), 
                radial-gradient(at 90% 25%, #0056d6 0px, transparent 65%), 
                radial-gradient(at 50% 90%, #52d6fc 0px, transparent 60%);
            background-attachment: fixed;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            align-items: center; 
            justify-content: flex-start; /* لترك مساحة جانبية مريحة */
            padding: 40px 0;
        }

        /* الحاوية البيضاء - المستطيل المركزي */
        .white-container {
            background: #ffffff;
            border-radius: 25px;
            padding: 25px 30px;
            max-width: 400px;
            width: 88%; /* يترك مسافة جانبية كما طلبت */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 5;
        }

        .header-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; color: var(--primary); }

        .input-group { width: 100%; margin-bottom: 20px; }
        input { 
            width: 100%; padding: 15px; font-size: 1.1rem; 
            border: 2px solid #eee; border-radius: 12px; 
            text-align: center; background: #fdfdfd;
            outline: none; box-sizing: border-box;
        }

        .btn-go { 
            width: 100%; padding: 15px; background: var(--primary); 
            color: #fff; border: none; border-radius: 12px; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
        }

        .qr-section { 
            padding: 12px; background: white; border: 1px solid #f0f0f0; 
            border-radius: 15px; margin: 20px 0;
        }
        #qr-code-img { width: 110px; height: 110px; }

        .social-links { display: flex; gap: 15px; margin-bottom: 20px; }
        .social-icon { 
            background: #f0f4ff; width: 42px; height: 42px; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; color: var(--primary); border: 1px solid #d0d7f0; 
        }

        .order-link { color: var(--primary); text-decoration: none; font-weight: bold; margin-bottom: 25px; }

        /* منطقة الترقيم الملونة */
        .info-box-wrapper {
            display: flex; align-items: center; justify-content: center;
            direction: ltr; transform: scale(0.85); width: 100%;
        }
        .yellow-part {
            background: var(--box-yellow); color: var(--primary); font-weight: bold;
            padding: 12px 18px; border-radius: 15px; font-size: 1.3rem; z-index: 2;
        }
        .blue-part {
            background: var(--primary); color: #ffffff; padding: 12px 20px;
            border-radius: 15px 0 0 15px; margin-right: -10px; font-size: 1.1rem;
            min-width: 250px; display: flex; align-items: center; justify-content: flex-start; direction: rtl;
        }

        .dynamic-text { 
            white-space: nowrap; overflow: hidden; display: inline-block; 
            border-left: 3px solid white;
            animation: typing 4s steps(30) infinite, cursor-logic 4s step-end infinite;
        }

        @keyframes typing { 0%, 10% { width: 0; } 45%, 55% { width: 100%; } 90%, 100% { width: 0; } }
        @keyframes cursor-logic {
            0%, 45% { border-left-color: #ffffff; } 
            46%, 100% { border-left-color: var(--box-yellow); }
        }

        /* الفوتر مع النص المسترجع */
        .footer { 
            margin-top: 30px; 
            padding: 20px; 
            font-size: 0.85rem; 
            color: rgba(255, 255, 255, 0.8); 
            text-align: center;
            line-height: 1.8;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <div class="white-container">
        <div class="header-text">توجيه الأرقام إلى روابط</div>

        <div class="input-group">
            <input type="number" id="linkId" placeholder="أدخل الرقم هنا...">
            <button class="btn-go" onclick="redirect()">انتقل الآن</button>
        </div>

        <div class="qr-section">
            <p style="color:#666; font-size: 0.8rem; font-weight: bold; margin-top: 0;">باركود الموقع</p>
            <img id="qr-code-img" src="" alt="QR">
        </div>

        <div class="social-links">
            <a href="#" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>

        <a href="#" class="order-link">أطلب ترقيم روابطك الآن <i class="fa-brands fa-instagram"></i></a>

        <div class="info-box-wrapper">
            <div class="blue-part">
                <span class="dynamic-text" id="typing-text">خطواتك تسبق منافسيك ..</span>
            </div>
            <div class="yellow-part">رقم روابطك</div>
        </div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni,، الكويت، 2026، بنية بمعمارية عالية الأداء،<br>
        Built with High-Performance Architecture, by electrwni, kuwait
    </div>

    <script>
        window.onload = function() {
            const qrImg = document.getElementById('qr-code-img');
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(window.location.href)}&color=072ac8`;
        };

        const phrases = [
            "خطواتك تسبق منافسيك ..",
            "حساباتك برقم واحد ..",
            "بساطة سرعة وصول ..",
            "تميزك يربك الخصوم ..",
            "رقم يختصر مسافاتك .."
        ];
        
        let i = 0;
        const typingEl = document.getElementById('typing-text');
        setInterval(() => {
            i = (i + 1) % phrases.length;
            typingEl.innerText = phrases[i];
        }, 4000);

        function redirect() {
            const val = document.getElementById('linkId').value;
            if(val) window.location.href = "https://electrwni.com/" + val;
        }
    </script>
</body>
</html>
