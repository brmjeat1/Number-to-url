<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستعرض التطبيقات - تحويل</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f9; }
        input { padding: 10px; font-size: 18px; border: 1px solid #ccc; border-radius: 5px; text-align: center; width: 200px; }
        button { margin-top: 15px; padding: 10px 25px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h3>أدخل الرقم للانتقال</h3>
    <input type="number" id="codeNumber" placeholder="أدخل الرقم هنا...">
    <button onclick="redirect()">تحويل</button>

    <script>
        function redirect() {
            var num = document.getElementById("codeNumber").value;

            // قائمة الأرقام والروابط (عدل عليها كما تشاء)
            if (num == "1") {
                window.location.href = "https://www.google.com";
            } 
            else if (num == "2") {
                window.location.href = "https://www.apple.com";
            } 
            else if (num == "3") {
                window.location.href = "https://www.github.com";
            }
            else {
                alert("عذراً، هذا الرقم غير مسجل!");
            }
        }
    </script>

</body>
</html>
