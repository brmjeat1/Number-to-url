<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electrwni | مستعرض الروابط</title>
    <style>
        :root {
            --primary-bg: #007bff;
            --neon-glow: 0 0 15px #00e5ff, 0 0 30px #00e5ff;
            --ig-gradient: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* الإطار المنقط - استعادة الشكل الأصلي */
        body::before {
            content: '';
            position: absolute;
            top: 15px; bottom: 15px; left: 15px; right: 15px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            pointer-events: none;
            border-radius: 15px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            gap: 25px;
            z-index: 1;
        }

        /* صندوق الإدخال - استعادة التوهج السماوي */
        input {
            width: 100%;
            padding: 22px;
            font-size: 20px;
            background: white;
            border: none;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--neon-glow);
            color: #333;
            box-sizing: border-box;
            font-weight: bold;
            outline: none;
        }

        .go-btn {
            background-color: #00d9ff;
            color: white;
            border: 2px dashed white;
            padding: 18px 60px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        /* أيقونات التواصل الاجتماعي */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        .icon {
            width: 65px; height: 65px;
            border-radius: 15px;
            background-color: var(--primary-bg);
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            overflow: hidden;
        }

        /* الشعارات بيضاء في السكون */
        .icon img {
            width: 35px; height: 35px;
            filter: brightness(0) invert(1);
            transition: all 0.4s ease;
        }

        .username {
            font-size: 12px;
            color: white;
            margin-top: 8px;
            font-weight: bold;
            visibility: hidden; /* مخفي حتى اللمسة الأولى */
            opacity: 0;
            transition: 0.3s;
        }

        /* كلاس التفعيل عند اللمسة الأولى */
        .active .username { visibility: visible; opacity: 1; }
        .active .icon img { filter: none; }
        
        .active.ig-link .icon { background: var(--ig-gradient); border-color: transparent; }
        .active.x-link .icon { background: #000; border-color: #444; }
        .active.tg-link .icon { background: #0088cc; border-color: transparent; }

    </style>
</head>
<body>

<div class="container">
    <div class="input-box" style="width:100%">
        <input type="number" id="codeNumber" placeholder="أدخل رقم التحويل" autofocus>
    </div>

    <button class="go-btn" onclick="redirect()">أذهب</button>

    <div class="social-icons">
        <!-- Instagram -->
        <div class="icon-wrapper ig-link" onclick="handleSocialClick(this, 'https://www.instagram.com/electrwni')">
            <div class="icon">
                <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
            </div>
            <span class="username">@electrwni</span>
        </div>
        
        <!-- X (شعار X الصريح) -->
        <div class="icon-wrapper x-link" onclick="handleSocialClick(this, 'https://x.com/electrwni')">
            <div class="icon">
                <img src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="X">
            </div>
            <span class="username">@electrwni</span>
        </div>

        <!-- Telegram (شعار البرقية) -->
        <div class="icon-wrapper tg-link" onclick="handleSocialClick(this, 'https://t.me/electrwni')">
            <div class="icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
            </div>
            <span class="username">@electrwni</span>
        </div>
    </div>
</div>

<script>
    // نظام اللمسة الأولى للإظهار والثانية للفتح
    function handleSocialClick(element, url) {
        if (element.classList.contains('active')) {
            window.open(url, '_blank');
        } else {
            // إزالة الحالة النشطة من البقية وتفعيل العنصر الحالي
            document.querySelectorAll('.icon-wrapper').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        }
    }

    function redirect() {
        var num = document.getElementById("codeNumber").value;
        const links = JSON.parse(localStorage.getItem('myLinks')) || {};
        if (links[num]) {
            window.location.href = links[num];
        } else {
            alert("عذراً، هذا الرقم غير مسجل!");
        }
    }

    document.getElementById("codeNumber").addEventListener("keypress", function(event) {
        if (event.key === "Enter") { redirect(); }
    });
</script>

</body>
</html>
