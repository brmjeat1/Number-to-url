<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رقم روابطك - منصة إلكتروني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #072AC8; --box-yellow: #fdf131; --success-green: #28a745; --error-red: #dc3545; }
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background-image: linear-gradient(0deg, rgba(3, 121, 241,0.5) 0%, rgba(3, 121, 241,0.5) 9%,transparent 9%, transparent 16%,rgba(11, 75, 199,0.5) 16%, rgba(11, 75, 199,0.5) 49%,rgba(9, 86, 209,0.5) 49%, rgba(9, 86, 209,0.5) 100%),linear-gradient(135deg, rgb(3, 121, 241) 0%, rgb(3, 121, 241) 31%,rgb(13, 63, 188) 31%, rgb(13, 63, 188) 37%,transparent 37%, transparent 56%,rgb(9, 86, 209) 56%, rgb(9, 86, 209) 100%),linear-gradient(90deg, rgb(255,255,255),rgb(255,255,255));
            background-attachment: fixed; display: flex; flex-direction: column; min-height: 100vh; align-items: center; padding: 40px 0;
        }
        .white-container {
            background: #ffffff; border-radius: 25px; padding: 35px 25px;
            width: 85%; max-width: 370px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            display: flex; flex-direction: column; align-items: center;
        }
        .main-title { color: #072AC8; font-weight: bold; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; border: 2px solid #f0f0f0; border-radius: 12px; text-align: center; margin-bottom: 12px; outline: none; }
        .btn-go { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .status-alert { width: 100%; padding: 10px; border-radius: 10px; margin-top: 15px; font-size: 0.85rem; font-weight: bold; text-align: center; display: none; }
        .alert-success { background: rgba(40, 167, 69, 0.1); color: var(--success-green); border: 1px solid var(--success-green); }
        .alert-error { background: rgba(220, 53, 69, 0.1); color: var(--error-red); border: 1px solid var(--error-red); }
        .qr-section { margin: 20px 0; text-align: center; }
        #qr-code-img { width: 90px; height: 90px; }
        .social-icons-row { display: flex; gap: 15px; margin: 10px 0 20px 0; }
        .social-icon { 
            width: 40px; height: 40px; border-radius: 50%; background: var(--primary); 
            border: 2px solid var(--box-yellow); display: flex; align-items: center; 
            justify-content: center; text-decoration: none; color: white; font-size: 1.2rem;
        }
        .footer { margin-top: 35px; color: #ffffff; font-weight: bold; text-align: center; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="white-container">
        <div class="main-title">توجيه الأرقام إلى روابط</div>
        <input type="number" id="linkId" placeholder="أدخل الرقم هنا...">
        <button class="btn-go" onclick="startRedirect()">انتقل الآن</button>
        <div id="statusAlert" class="status-alert"></div>
        <div class="qr-section">
            <img id="qr-code-img" src="" alt="QR">
            <p style="font-size: 0.7rem; color: #888;">باركود الموقع</p>
        </div>
        <div class="social-icons-row">
            <a href="https://x.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="https://instagram.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </div>
    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni, الكويت © 2026 High-Performance Architecture
    </div>
    <script>
        window.onload = function() {
            const currentPath = window.location.href.split('?')[0];
            document.getElementById('qr-code-img').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentPath)}&color=072ac8`;
        };
        function startRedirect() {
            const val = document.getElementById('linkId').value;
            const alertBox = document.getElementById('statusAlert');
            if (!val) {
                alertBox.className = "status-alert alert-error";
                alertBox.innerHTML = "يرجى إدخال رقم صحيح";
                alertBox.style.display = "block";
                return;
            }
            let seconds = 3;
            alertBox.className = "status-alert alert-success";
            alertBox.style.display = "block";
            const timer = setInterval(() => {
                alertBox.innerHTML = `جاري التحويل خلال ${seconds} ثانية`;
                if (seconds <= 0) { clearInterval(timer); window.location.href = "https://electrwni.com/" + val; }
                seconds--;
            }, 1000);
        }
    </script>
</body>
</html>
