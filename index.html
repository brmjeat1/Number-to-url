<div class="white-wrapper">
    <div class="input-group" id="main-interface">
        <div id="visitor-view">
            <span class="input-label">أدخل الرقم الآن</span>
            <input type="text" id="linkId" inputmode="numeric" placeholder="أدخل الرقم هنا...">
            <div id="error-msg" class="error-msg">لا يوجد هذا الرقم بالمدخلات</div>
            <button class="btn-go" onclick="redirect()">انتقل الآن</button>
            <p style="margin-top:15px; font-size:13px; color:#666;">
                ليس لديك حساب؟ <span onclick="toggleAuth('signup')" style="color:var(--primary); cursor:pointer; font-weight:bold;">Sign Up</span>
            </p>
        </div>

        <div id="signup-view" style="display:none;">
            <span class="input-label" style="font-size:1.5rem;">إنشاء حساب جديد</span>
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني" style="margin-bottom:10px;">
            <input type="password" id="regPass" placeholder="كلمة المرور">
            <button class="btn-go" onclick="handleAuth('signup')" style="background:var(--box-blue);">إنشاء الحساب (Sign Up)</button>
            <p style="margin-top:15px; font-size:13px; color:#666;">
                لديك حساب بالفعل؟ <span onclick="toggleAuth('visitor')" style="color:var(--primary); cursor:pointer; font-weight:bold;">دخول</span>
            </p>
        </div>
    </div>

    <div class="social-links">
        <a href="https://t.me/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-telegram"></i></a>
        <a href="https://www.instagram.com/electrwni" target="_blank" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        <div class="social-icon" onclick="openQR()"><i class="fas fa-qrcode"></i></div>
    </div>

    <div class="info-box-wrapper">
        <div class="blue-part"><span id="typing-text">حقق وصول أسرع لبيتك الرقمي ..</span></div>
        <div class="yellow-part">رقم روابطك</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";
    import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
        authDomain: "electrwni-link.firebaseapp.com",
        databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "electrwni-link",
        storageBucket: "electrwni-link.firebasestorage.app",
        messagingSenderId: "712490301263",
        appId: "1:712490301263:web:2084210da3f687285ab73a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // دالة التبديل بين الواجهات
    window.toggleAuth = (view) => {
        document.getElementById('visitor-view').style.display = (view === 'visitor') ? 'block' : 'none';
        document.getElementById('signup-view').style.display = (view === 'signup') ? 'block' : 'none';
    };

    // معالجة التسجيل والدخول
    window.handleAuth = async (type) => {
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        
        try {
            if(type === 'signup') {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                // إعداد ملف المستخدم لأول مرة
                await set(ref(db, 'users/' + cred.user.uid), {
                    email: email,
                    plan: 'Free',
                    slug: email.split('@')[0] + Math.floor(Math.random()*1000)
                });
                alert("تم إنشاء حسابك بنجاح!");
            }
            window.location.href = "admin.html";
        } catch (e) { alert("خطأ: " + e.message); }
    };

    // دالة التوجيه للزوار (Redirect)
    window.redirect = async () => {
        const val = document.getElementById('linkId').value;
        const error = document.getElementById('error-msg');
        if(!val) return;

        const dbRef = ref(db);
        const snapshot = await get(child(dbRef, `links/${val}`));
        if (snapshot.exists()) {
            window.location.href = snapshot.val();
        } else {
            error.style.display = 'block';
        }
    };

    // مراقبة حالة المستخدم
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("User is logged in");
            // يمكن هنا إضافة زر "انتقل للوحة تحكمك" بدلاً من الحقول
        }
    });
</script>
