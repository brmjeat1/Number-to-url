<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrwni - نظام إدارة الروابط</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">Electrwni</div>
            <h1>نظام إدارة التوجيه الرقمي</h1>
        </header>

        <main class="card">
            <div class="card-header">
                <span class="icon">📝</span>
                <h2>أدخل الروابط</h2>
            </div>
            <div class="input-group">
                <input type="text" placeholder="الرقم" class="input-small">
                <input type="text" placeholder="الرابط المخصص" class="input-large">
                <button class="btn-add">أضف</button>
            </div>
        </main>

        <section class="card">
            <div class="card-header">
                <span class="icon">📊</span>
                <h2>إحصاءات الروابط</h2>
            </div>
            <div class="stats-placeholder">
                قائمة الروابط ستظهر هنا...
            </div>
        </section>

        <footer>
            تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت <br>
            Built with High-Performance Architecture
        </footer>
    </div>

</body>
</html>
