<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script>
window.location.replace('./signin.html');

    </script>
    
    <title>إلكتروني - تسجيل وتخصيص حساب جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #072AC8; 
            --primary-light: #1e46f5;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.7);
            --text-dark: #0f172a !important;
            --text-muted: #475569 !important;
            --success: #16a34a;
        }
        
        body { 
            margin: 0; 
            font-family: 'Tajawal', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #f8fafc !important;
            background-image: 
                radial-gradient(at top left, #e0f2fe 0px, transparent 50%),
                radial-gradient(at bottom right, #eff6ff 0px, transparent 50%) !important;
            background-attachment: fixed;
            align-items: center; 
            justify-content: space-between; 
        }

        .header-box { 
            background: rgba(255, 255, 255, 0.7) !important; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            width: 100%; 
            min-height: 65px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px 0; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
        }
        
        .header-text { color: var(--text-dark); font-size: 1.1rem; font-weight: 500; }
        .highlight-text { color: var(--primary); font-size: 1.3rem; font-weight: 700; margin: 0 5px; }
        
        .white-wrapper { 
            background: var(--glass-bg) !important; 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            width: 92%; 
            max-width: 520px; 
            margin: 30px auto; 
            border-radius: 28px; 
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.06); 
            padding: 35px 28px; 
            box-sizing: border-box; 
        }

        .steps-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; position: relative; padding: 0 10px; }
        .steps-indicator::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: rgba(0,0,0,0.05); z-index: 1; transform: translateY(-50%); }
        .step-dot { width: 35px; height: 35px; border-radius: 50%; background: #fff; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text-muted); z-index: 2; font-size: 0.9rem; }
        .step-dot.active { border-color: var(--primary); background: var(--primary); color: #fff; box-shadow: 0 0 12px rgba(7, 42, 200, 0.2); }
        .step-dot.completed { border-color: var(--success); background: var(--success); color: #fff; }

        .step-content { display: none; }
        .step-content.active { display: block; }

        .welcome-title { color: var(--text-dark); font-weight: 700; font-size: 1.35rem; margin-bottom: 6px; text-align: center; }
        .welcome-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; text-align: center; }

        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
        .form-group label { color: var(--text-dark); font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; padding-right: 4px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.field-icon { position: absolute; right: 16px; color: #94a3b8; font-size: 1rem; z-index: 10; }

        input, select, textarea { 
            width: 100%; 
            padding: 13px 44px 13px 16px !important; 
            font-size: 0.95rem; 
            font-weight: 500;
            border: 2px solid rgba(7, 42, 200, 0.08) !important; 
            border-radius: 14px !important; 
            outline: none; 
            box-sizing: border-box; 
            background: #ffffff !important;
            color: var(--text-dark) !important;
            font-family: 'Tajawal', sans-serif;
        }

        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .category-card { background: #fff; border: 2px solid rgba(7, 42, 200, 0.05); border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; color: var(--text-dark); font-weight: 600; font-size: 0.9rem; }
        .category-card.selected { border-color: var(--primary); background: rgba(7, 42, 200, 0.04); color: var(--primary); }

        .network-row { background: rgba(255,255,255,0.9); border: 1px solid rgba(0,0,0,0.06); padding: 14px; border-radius: 16px; margin-bottom: 12px; }
        .network-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .network-title { font-weight: 700; font-size: 0.9rem; color: var(--text-dark); display: flex; align-items: center; gap: 8px; }
        .toggle-group { display: flex; background: rgba(0,0,0,0.04); padding: 3px; border-radius: 8px; }
        .toggle-btn { padding: 4px 10px; font-size: 0.75rem; font-weight: 700; border: none; background: transparent; border-radius: 6px; cursor: pointer; color: var(--text-muted); }
        .toggle-btn.active { background: #fff; color: var(--primary); }

        .nav-buttons { display: flex; gap: 12px; margin-top: 25px; }
        .btn-action { flex: 1; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .btn-next { background: var(--primary); color: #fff; }
        .btn-prev { background: rgba(0,0,0,0.05); color: var(--text-dark); }

        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: var(--text-muted); font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(0, 0, 0, 0.06); }

        .btn-google { width: 100%; padding: 12px; background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 14px; color: var(--text-dark); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; }
        .auth-footer { margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); text-align: center; }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }

        .footer { background: rgba(255, 255, 255, 0.7); border-top: 1px solid var(--glass-border); width: 100%; padding: 20px; color: var(--text-muted); font-size: 0.85rem; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="header-text">منصة <span class="highlight-text">إلكتروني</span> الرقمية</div>
    </div>

    <div class="white-wrapper">
        <div class="steps-indicator">
            <div class="step-dot active" id="dot1">1</div>
            <div class="step-dot" id="dot2">2</div>
            <div class="step-dot" id="dot3">3</div>
        </div>

        <form id="multiStepForm" onsubmit="event.preventDefault();">
            <div class="step-content active" id="step1">
                <div class="welcome-title">إنشاء حساب جديد</div>
                <div class="welcome-sub">احجز اسمك الرقمي وابدأ مشاركة روابطك بذكاء</div>

                <div class="form-group">
                    <label>اسم المستخدم (رابط صفحتك)</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" placeholder="username" required autocomplete="off">
                        <i class="fa-solid fa-at field-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="name@example.com" required>
                        <i class="fa-solid fa-envelope field-icon"></i>
                    </div>
                </div>

                <div class="nav-buttons">
                    <button type="button" class="btn-action btn-next" onclick="nextStep(2)">المتابعة والتخصيص</button>
                </div>

                <div class="divider">أو سجل سريعاً عبر</div>
                <button type="button" class="btn-google">سجل باستخدام حساب Google</button>
                <div class="auth-footer">لديك حساب بالفعل؟ <a href="signin.html">تسجيل الدخول</a></div>
            </div>
            
            <div class="step-content" id="step2"></div>
            <div class="step-content" id="step3"></div>
        </form>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت بنية بمعمارية عالية الأداء <br>
        Built with High-Performance Architecture, by electrwni, kuwait
    </div>

    <script>
        function nextStep(stepNumber) {
            document.querySelectorAll('.step-content').forEach(content => content.classList.remove('active'));
            document.getElementById(`step${stepNumber}`).classList.add('active');
        }
    </script>
</body>
</html>
