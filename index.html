<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrwni - نظام إدارة الروابط</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div class="main-container">
        <header class="header">
            <div class="logo-area">
                <span class="logo-text">Electrwni</span>
            </div>
            <h1 class="header-title">نظام إدارة التوجيه الرقمي لروابط منصة إلكتروني</h1>
        </header>

        <div class="content-body">
            <section class="card input-card">
                <div class="card-header">
                    <img src="https://img.icons8.com/fluency/48/checked-user-male.png" alt="icon-check" class="card-icon">
                    <h2 class="card-title-text">أدخل الروابط</h2>
                </div>
                <div class="input-form-group">
                    <div class="input-wrapper">
                        <input type="number" id="input-number" placeholder="الرقم" class="input-field num-input">
                        <input type="url" id="input-link" placeholder="الرابط" class="input-field link-input">
                    </div>
                    <button class="btn btn-add">أضف</button>
                </div>
            </section>

            <section class="card stats-card">
                <div class="card-header">
                    <img src="https://img.icons8.com/fluency/48/bar-chart.png" alt="icon-stats" class="card-icon">
                    <h2 class="card-title-text">إحصاءات الروابط</h2>
                </div>
                <div class="stats-display-area">
                    <p class="placeholder-text">الإحصائيات ستظهر هنا...</p>
                </div>
            </section>
        </div>

        <footer class="footer">
            <p>تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت، بنية بمعمارية عالية الأداء.</p>
            <p>Built with High-Performance Architecture, by electrwni, kuwait</p>
        </footer>
    </div>
</body>
</html>
