<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electrwni | مستعرض الروابط</title>
    <style>
        :root {
            --primary-bg: #007bff;
            --ig-gradient: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            --x-color: #000000;
            --tg-color: #0088cc;
            --screen-margin: 15px; /* القيمة الموحدة للبعد عن الشاشة */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* الإطار المنقط الموزون علوياً وسفلياً */
        body::before {
            content: '';
            position: absolute;
            top: var(--screen-margin); 
            bottom: var(--screen-margin); 
            left: 25px; 
            right: 25px;
            border: 3px dashed rgba(255, 255, 255, 0.4);
            pointer-events: none;
            border-radius: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            gap: 30px;
            z-index: 1;
        }

        /* صندوق الإدخال */
        input {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            background: white;
            border: none;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: #333;
            box-sizing: border-box;
            outline: none;
            font-weight: bold;
        }

        /* الزر */
        .go-btn {
            background-color: #00d9ff;
            color: white;
            border: 2px dashed white;
            padding: 15px 70px;
            font-size: 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        /* أيقونات التواصل */
        .social-icons {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            width: 75px;
        }

        .icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-bg);
            border: 2px solid white;
            transition: all 0.4s ease;
        }

        .icon img {
            width: 32px;
            height: 32px;
            filter: brightness(0) invert(1); /* شعار أبيض */
            transition: all 0.4s ease;
        }

        .username {
            font-size: 11px;
            color: white;
            margin-top: 8px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        /* تأثيرات اللمس (Hover/Touch) */
        .icon-wrapper:hover .username { opacity: 1; transform: translateY(0); }
        .icon-wrapper:hover .icon img { filter: none; } /* عودة لون الشعار الأصلي */

        /* تخصيص ألوان الخلفية عند اللمس لكل تطبيق */
        .ig-link:hover .icon { background: var(--ig-gradient); border-color: transparent; }
        .x-link:hover .icon { background: var(--x-color); border-color: #444; }
        .tg-link:hover .icon { background: var(--tg-color); border-color: transparent; }

    </style>
</head>
<body>

<div class="container">
    <div class="input-box" style="width: 100%;">
        <input type="number" id="codeNumber" placeholder="أدخل رقم التحويل" autofocus>
    </div>

    <button class="go-btn" onclick="redirect()">أذهب</button>

    <div class="social-icons">
        <a href="https://www.instagram.com/electrwni" target="_blank" class="icon-wrapper ig-link">
            <div class="icon">
                <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
            </div>
            <span class="username">electrwni</span>
        </a>
        
        <a href="https://x.com/electrwni" target="_blank" class="icon-wrapper x-link">
            <div class="icon">
                <img src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="X">
            </div>
            <span class="username">electrwni</span>
        </a>

        <a href="https://t.me/electrwni" target="_blank" class="icon-wrapper tg-link">
            <div class="icon">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
            </div>
            <span class="username">electrwni</span>
        </a>
    </div>
</div>

<script>
    function redirect() {
        var num = document.getElementById("codeNumber").value;
        const links = JSON.parse(localStorage.getItem('myLinks')) || {};
        if (links[num]) { window.location.href = links[num]; } 
        else { alert("عذراً، هذا الرقم غير مسجل!"); }
    }
    document.getElementById("codeNumber").addEventListener("keypress", function(e) {
        if (e.key === "Enter") redirect();
    });
</script>

</body>
</html>
