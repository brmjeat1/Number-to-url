<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>electrwni.link — منصة تسويق المشاريع</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#ffffff;color:#0f1535;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.container{max-width:500px;width:100%;background:#f9f9f9;border-radius:20px;padding:48px 32px;text-align:center;border:1px solid #e8ecf5;}
.brand{margin-bottom:40px;}
.brand-title{font-size:2.2rem;font-weight:900;margin-bottom:12px;letter-spacing:-1px;line-height:1.3;}
.brand-title .light{color:#6c8fff;display:block;}
.brand-title .dark{color:#0f1535;display:block;}
.brand-subtitle{font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;color:#6c8fff;margin-bottom:28px;}
.tagline{font-size:0.95rem;font-weight:700;color:#ffffff;background:linear-gradient(135deg,#3d5af1,#6c8fff);padding:16px 20px;border-radius:12px;margin-bottom:40px;line-height:1.6;}
.buttons{display:flex;flex-direction:column;gap:12px;}
.btn{padding:14px 28px;border:none;border-radius:10px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:'Tajawal',sans-serif;transition:all .2s;}
.btn-primary{background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#ffffff;}
.btn-primary:active{transform:scale(0.98);}
.btn-primary:hover{box-shadow:0 6px 20px rgba(61,90,241,0.2);}
.btn-secondary{background:#f0f4ff;color:#3d5af1;border:2px solid #3d5af1;}
.btn-secondary:active{transform:scale(0.98);}
@media(max-width:600px){.container{padding:32px 20px;}.brand-title{font-size:1.8rem;}.brand-subtitle{font-size:1rem;}}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="brand-title">
      <span class="light">منصة</span>
      <span class="dark">إلكتروني</span>
    </div>
    <div class="brand-subtitle">Electrwni</div>
    <div class="tagline">سهل الوصول لك في عالم تسويق المشاريع</div>
  </div>
  <div class="buttons">
    <button class="btn btn-primary" onclick="window.location.href='signin.html'">🔓 تسجيل الدخول · Sign In</button>
    <button class="btn btn-secondary" onclick="window.location.href='signup.html'">✨ إنشاء حساب · Create Account</button>
  </div>
</div>
</body>
</html>
