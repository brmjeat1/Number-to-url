<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electrwni | التوجيه الرقمي السريع</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: #f0f0f0; font-size: 16px; }
        .loading-text { color: #ffeb3b; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بك في منصة إلكتروني</h1>
        <p>يرجى إدخال الرقم في نهاية الرابط للتوجيه التلقائي.</p>
        <div id="status" class="loading-text">جاري التحقق من الرقم الممرر...</div>
    </div>

    <script>
        // هنا تم وضع بيانات Config الحقيقية الخاصة بك لتتصل بقاعدتك فوراً
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a",
            measurementId: "G-LCCGHWKH87"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        function convertArabicNumbers(str) {
            const arabicNums = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
            return str.replace(/[٠-٩]/g, (w) => arabicNums.indexOf(w));
        }

        const urlParams = new URLSearchParams(window.location.search);
        let numKey = urlParams.get('num') || window.location.hash.substring(1);

        if (numKey) {
            numKey = convertArabicNumbers(numKey.trim());
            db.ref('links/' + numKey).once('value').then((snap) => {
                if (snap.exists()) {
                    let data = snap.val();
                    let targetUrl = typeof data === 'object' ? data.url : data;
                    
                    if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                        targetUrl = 'https://' + targetUrl;
                    }
                    document.getElementById('status').innerText = "تم العثور على الرابط! جاري التوجيه الآن...";
                    window.location.href = targetUrl;
                } else {
                    document.getElementById('status').style.color = '#ff4d4d';
                    document.getElementById('status').innerText = "عذراً، هذا الرقم غير مسجل في النظام.";
                }
            }).catch((err) => {
                document.getElementById('status').innerText = "حدث خطأ أثناء الاتصال بقاعدة البيانات.";
            });
        } else {
            document.getElementById('status').innerText = "جاهز لاستقبال الطلبات الرقمية.";
        }
    </script>
</body>
</html>
