<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electrwni | مستعرض الروابط</title>
    <style>
        :root {
            --primary-bg: #007bff;
            --neon-glow: 0 0 15px #00e5ff, 0 0 30px #00e5ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* الإطار المنقط المحيط بالصفحة */
        body::before {
            content: '';
            position: absolute;
            top: 15px; bottom: 15px; left: 15px; right: 15px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            pointer-events: none;
            border-radius: 15px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            gap: 25px;
            z-index: 1;
        }

        /* تنسيق أيقونات التواصل */
        .social-icons {
            display: flex;
            gap: 20px;
        }

        .icon {
            width: 65px; height: 65px;
            border-radius: 15px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            text-decoration: none;
            overflow: hidden;
        }

        .icon:hover { transform: translateY(-5px); }

        .icon img { width: 100%; height: 100%; object-fit: cover; }

        /* صندوق الإدخال */
        .input-box { width: 100%; }

        input {
            width: 100%;
            padding: 22px;
            font-size: 20px;
            background: white;
            border: none;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--neon-glow);
            color: #333;
            box-sizing: border-box;
            font-weight: bold;
        }

        /* زر التحويل */
        .go-btn {
            background-color: #00d9ff;
            color: white;
            border: 2px dashed white;
            padding: 18px 60px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .go-btn:hover { box-shadow: var(--neon-glow); transform: scale(1.05); }

        .footer-logo { font-size: 18px; opacity: 0.8; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="social-icons">
        <a href="https://www.instagram.com/electrwni" target="_blank" class="icon">
            <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
        </a>
        <a href="https://x.com/electrwni" target="_blank" class="icon">
            <img src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="X">
        </a>
        <a href="https://t.me/electrwni" target="_blank" class="icon">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram">
        </a>
    </div>

    <div class="input-box">
        <input type="number" id="codeNumber" placeholder="أدخل رقم التحويل" autofocus>
    </div>

    <button class="go-btn" onclick="redirect()">أذهب</button>

    <div class="footer-logo">@electrwni</div>
</div>

<script>
    function redirect() {
        var num = document.getElementById("codeNumber").value;
        const links = JSON.parse(localStorage.getItem('myLinks')) || {};

        if (links[num]) {
            window.location.href = links[num];
        } else {
            alert("عذراً، هذا الرقم غير مسجل!");
        }
    }

    // دعم زر Enter
    document.getElementById("codeNumber").addEventListener("keypress", function(event) {
        if (event.key === "Enter") { redirect(); }
    });
</script>

</body>
</html>
