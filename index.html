<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التوجيه الرقمي لروابط منصة إلكتروني</title>
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* الهوية البصرية العلوية */
        .header-rect { background-color: #072AC8; width: 100%; height: 44px; }
        .yellow-divider { background-color: #FCF300; width: 100%; height: 3px; }

        .content {
            margin-top: 60px; text-align: center;
            width: 90%; max-width: 400px; flex-grow: 1;
        }

        h1 { font-size: 1.3rem; color: #333; margin-bottom: 30px; }

        /* حقل الإدخال */
        .input-field {
            width: 100%; padding: 15px; font-size: 18px;
            border: 2px solid #072AC8; border-radius: 12px;
            outline: none; text-align: center; box-sizing: border-box;
        }

        /* زر الانتقال */
        .btn-go {
            margin-top: 20px; width: 100%; padding: 15px;
            background-color: #072AC8; color: white;
            border: none; border-radius: 12px;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: 0.3s;
        }
        .btn-go:active { transform: scale(0.98); background-color: #051d8c; }

        /* التوقيع السفلي */
        .footer-signature {
            padding: 20px; text-align: center;
            color: #1E96FC; font-size: 0.85rem;
            line-height: 1.6; border-top: 1px solid #f0f0f0;
            width: 100%; background: #fafafa;
        }
    </style>
</head>
<body>

    <div class="header-rect"></div>
    <div class="yellow-divider"></div>

    <div class="content">
