<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electrwni | مستعرض الروابط</title>
    <style>
        :root {
            --primary-bg: #007bff;
            --neon-glow: 0 0 15px #00e5ff, 0 0 30px #00e5ff;
            --ig-gradient: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            --sky-blue: #00e5ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 25px; bottom: 25px; left: 15px; right: 15px;
            border: 3px dashed rgba(255, 255, 255, 0.6);
            pointer-events: none;
            border-radius: 15px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 400px;
            height: 85vh; /* لتوزيع العناصر طولياً */
            justify-content: space-between;
            z-index: 1;
            padding-bottom: 30px; /* لرفع العناصر عن الخط السفلي قليلاً */
        }

        .top-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            background: white;
            border: none;
            border-radius: 10px;
            text-align: center;
            box-shadow: var(--neon-glow);
            color: #333;
            box-sizing: border-box;
            font-weight: bold;
            outline: none;
            pointer-events: none;
        }

        .custom-kbd {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 15px;
        }

        .kbd-btn {
            background: white;
            color: var(--primary-bg);
            border: none;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            /* لضمان أرقام إنجليزية */
            font-family: Arial, sans-serif; 
        }

        .kbd-btn:active { background: var(--sky-blue); color: white; }
        .clear-btn { background: #ff4d4d; color: white; font-size: 14px; }
        .clear-all-btn { background: #333; color: white; font-size: 14px; }

        .go-btn {
            background-color: #00d9ff;
            color: white;
            border: 2px dashed white;
            padding: 12px 60px;
            font-size: 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        /* الجزء السفلي المطلوب تعديله */
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .icon {
            width: 60px; height: 60px;
            border-radius: 15px;
            background-color: var(--sky-blue);
            border: 2px dashed white;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            position: relative;
        }

        .circle-bg {
            width: 40px; height: 40px;
            background-color: var(--primary-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            transition: all 0.4s ease;
        }

        .icon svg { width: 22px; height: 22px; fill: white; }

        .username {
            font-size: 11px;
            color: white;
            margin-top: 5px;
            font-weight: bold;
            visibility: hidden; opacity: 0;
            transition: 0.3s;
        }

        #touch-hint {
            color: var(--sky-blue);
            font-size: 12px;
            font-weight: bold;
            opacity: 0;
            transition: 0.5s;
            height: 15px;
        }

        .active .username { visibility: visible; opacity: 1; }
        .active.ig-link .circle-bg { background: var(--ig-gradient); }
        .active.x-link .circle-bg { background: #000; }
        .active.tg-link .circle-bg { background: #0088cc; }

    </style>
</head>
<body>

<div class="container">
    <!-- الجزء العلوي: الإدخال والكيبورد والزر -->
    <div class="top-section">
        <input type="text" id="codeNumber" placeholder="0000" readonly>
        <div class="custom-kbd">
            <button class="kbd-btn" onclick="addNum('1')">1</button>
            <button class="kbd-btn" onclick="addNum('2')">2</button>
            <button class="kbd-btn" onclick="addNum('3')">3</button>
            <button class="kbd-btn" onclick="addNum('4')">4</button>
            <button class="kbd-btn" onclick="addNum('5')">5</button>
            <button class="kbd-btn" onclick="addNum('6')">6</button>
            <button class="kbd-btn" onclick="addNum('7')">7</button>
            <button class="kbd-btn" onclick="addNum('8')">8</button>
            <button class="kbd-btn" onclick="addNum('9')">9</button>
            <button class="kbd-btn clear-btn" onclick="delLast()">Delete</button>
            <button class="kbd-btn" onclick="addNum('0')">0</button>
            <button class="kbd-btn clear-all-btn" onclick="delAll()">Clear All</button>
        </div>
        <button class="go-btn" onclick="redirect()">أذهب</button>
    </div>

    <!-- الجزء السفلي: الحسابات والمعرفات والرسالة -->
    <div class="bottom-section">
        <div class="social-icons">
            <div class="icon-wrapper ig-link" onclick="handleSocialClick(this, 'https://www.instagram.com/electrwni')">
                <div class="icon"><div class="circle-bg"><svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.919-.058-1.265-.069-1.646-.069-4.849 0-3.204.013-3.583.069-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg></div></div><span class="username">electrwni@</span>
            </div>
            <div class="icon-wrapper x-link" onclick="handleSocialClick(this, 'https://x.com/electrwni')">
                <div class="icon"><div class="circle-bg"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.25 2.25h6.74l4.717 6.233 5.537-6.233zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/></svg></div></div><span class="username">electrwni@</span>
            </div>
            <div class="icon-wrapper tg-link" onclick="handleSocialClick(this, 'https://t.me/electrwni')">
                <div class="icon"><div class="circle-bg"><svg viewBox="0 0 24 24"><path d="M22.028 2.073a.853.853 0 0 0-.742-.036L1.657 10.4a.853.853 0 0 0-.095 1.545l4.89 2.115l1.69 5.378a.851.851 0 0 0 1.52.262l2.766-3.805l5.222 3.86a.85.85 0 0 0 1.344-.572l3.255-16a.853.853 0 0 0-.271-.75zm-14.73 12.33l1.196 4.31l-.813 1.118l-.383-5.428zm12.39-10.74l-2.614 12.834l-5.642-4.17l-.145-.107l-2.73-1.182l11.131-7.375z"/></svg></div></div><span class="username">electrwni@</span>
            </div>
        </div>
        <div id="touch-hint">ألمس مرة ثانية للذهاب للحساب</div>
    </div>
</div>

<script>
    const inputField = document.getElementById('codeNumber');
    let hintTimeout;

    function addNum(n) { inputField.value += n; }
    function delLast() { inputField.value = inputField.value.slice(0, -1); }
    function delAll() { inputField.value = ''; }

    function handleSocialClick(element, url) {
        const hint = document.getElementById('touch-hint');
        if (element.classList.contains('active')) {
            window.open(url, '_blank');
        } else {
            element.classList.add('active');
            hint.style.opacity = '1';
            clearTimeout(hintTimeout);
            hintTimeout = setTimeout(() => { hint.style.opacity = '0'; }, 5000);
        }
    }

    function redirect() {
        var num = inputField.value;
        const links = JSON.parse(localStorage.getItem('myLinks')) || {};
        if (links[num]) { window.location.href = links[num]; } 
        else { alert("عذراً، هذا الرقم غير مسجل!"); }
    }
</script>

</body>
</html>
