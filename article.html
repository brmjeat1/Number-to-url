<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مقالة — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --text:#000000;
    --link:#1a3fd6;
    --muted:#767676;
    --border:#e8e8e8;
    --header-bg:#ffffff;
    --header-text:#3d5af1;
  }
  html[data-theme="1"]{ --bg:#DAD7CD; --text:#344E41; --link:#588157; --muted:#5c6f63; --border:#c3c0b3; }
  html[data-theme="2"]{ --bg:#FEFAE0; --text:#BB3E03; --link:#EE9A00; --muted:#a37a4a; --border:#eee3bd; }
  html[data-theme="3"]{ --bg:#F1DEDE; --text:#80727B; --link:#BBACC1; --muted:#9a8f96; --border:#e2cfcf; }
  html[data-theme="4"]{ --bg:#EEF0F2; --text:#0D21A1; --link:#EEC643; --muted:#6b7280; --border:#dbdfe4; }
  html[data-theme="5"]{ --bg:#12141c; --text:#f0f1f5; --link:#8fb0ff; --muted:#9aa0ae; --border:#2a2d3a; }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100vh;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;flex-direction:column;
    transition:background .25s ease,color .25s ease;
  }

  /* ===== الرأس: هوية ثابتة لا تتأثر بالسمات أو الطباعة ===== */
  .art-header{
    background:#ffffff !important;
    border-bottom:1px solid #eeeeee;
    padding:14px 20px;
    display:flex;align-items:center;justify-content:flex-start;
    flex-shrink:0;
  }
  .art-header .wordmark{
    font-family:'Space Mono',monospace;font-weight:700;font-size:0.92rem;
    color:#3d5af1 !important;
    direction:ltr;
  }
  .art-header .wordmark .u{color:#3d5af1;opacity:0.65;}

  /* ===== جسم المقالة ===== */
  .art-shell{
    flex:1;width:100%;max-width:680px;margin:0 auto;
    padding:44px 24px 100px;
  }
  .art-title{
    font-weight:800;font-size:2rem;line-height:1.35;letter-spacing:-0.3px;
    margin-bottom:18px;word-wrap:break-word;
  }
  .art-meta{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-bottom:24px;margin-bottom:32px;border-bottom:1px solid var(--border);
    color:var(--muted);font-size:0.85rem;
  }
  .art-meta .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
    font-weight:700;color:var(--text);
  }
  .art-meta .avatar img{width:100%;height:100%;object-fit:cover;}
  .art-meta .author-name{font-weight:700;color:var(--text);}
  .art-meta .edited-badge{
    background:rgba(0,0,0,0.06);border-radius:20px;padding:2px 10px;font-size:0.75rem;
  }
  .art-body{
    font-size:1.08rem;line-height:2;word-wrap:break-word;
  }
  .art-body p{margin-bottom:1.4em;}
  .art-body a{color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px;}
  .art-body mark{background:#ffe58a;color:#000;border-radius:3px;padding:0 2px;}
  .art-body mark.current{background:#ffb84d;}

  .preview-banner{
    background:#000;color:#fff;text-align:center;padding:8px;font-size:0.78rem;font-weight:700;
  }
  .art-empty{text-align:center;padding:80px 20px;color:var(--muted);}
  .art-empty .icon{font-size:2.5rem;margin-bottom:14px;}

  /* ===== الزر العائم القابل للسحب (واحد فقط) ===== */
  .fab{
    position:fixed;z-index:400;width:56px;height:56px;border-radius:16px;
    background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#fff;
    border:none;box-shadow:0 6px 18px rgba(0,0,0,0.22);
    display:flex;align-items:center;justify-content:center;cursor:grab;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  .fab:active{cursor:grabbing;}
  .fab svg{width:26px;height:26px;pointer-events:none;}
  #menuFab{bottom:24px;left:20px;}

  /* ===== شاشة الخيارات المنزلقة: طبقة نمطية بدون تظليل، تمنع التفاعل مع الخلفية ===== */
  .sheet-overlay{
    position:fixed;inset:0;background:transparent;z-index:500;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-overlay.open{display:flex;}
  .sheet-panel{
    background:var(--bg);color:var(--text);width:100%;max-width:680px;
    border-radius:20px 20px 0 0;max-height:82vh;display:flex;flex-direction:column;
    border:1px solid var(--border);border-bottom:none;
    transform:translateY(100%);transition:transform .28s ease;
  }
  .sheet-overlay.open .sheet-panel{transform:translateY(0);}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:3px;margin:10px auto 4px;flex-shrink:0;}
  .sheet-body{padding:20px;overflow-y:auto;}

  /* قائمة الخيارات الرأسية (طولية تحت بعض) */
  .menu-list{display:flex;flex-direction:column;gap:8px;}
  .menu-list-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:15px 14px;
    border-radius:12px;border:1px solid var(--border);background:none;color:var(--text);
    font-family:inherit;font-weight:700;font-size:0.92rem;cursor:pointer;text-align:right;
  }
  .menu-list-item svg{width:19px;height:19px;flex-shrink:0;color:var(--link);}
  .menu-list-item .chev{margin-inline-start:auto;color:var(--muted);width:14px;height:14px;flex-shrink:0;}

  .sheet-back-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .sheet-back-btn{
    background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
    font-family:inherit;color:var(--text);cursor:pointer;font-weight:700;font-size:0.85rem;
    display:flex;align-items:center;gap:4px;
  }
  .sheet-title{font-weight:800;font-size:1rem;}

  .theme-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .theme-swatch{
    width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;
  }
  .theme-swatch:active{transform:scale(0.9);}
  .theme-swatch.active{border-color:var(--link);}
  .theme-swatch[data-t="0"]{
    background:var(--site-gradient, linear-gradient(135deg,#3d5af1,#6c8fff));
    display:flex;align-items:center;justify-content:center;
    color:#ffffff;font-weight:900;font-size:13px;font-family:'Space Mono',monospace;
  }
  .theme-swatch[data-t="1"]{background:#DAD7CD;}
  .theme-swatch[data-t="2"]{background:#FEFAE0;}
  .theme-swatch[data-t="3"]{background:#F1DEDE;}
  .theme-swatch[data-t="4"]{background:#EEF0F2;}
  .theme-swatch[data-t="5"]{
    background:radial-gradient(circle at 30% 25%, #3a1670, #150533 70%);
    position:relative;overflow:hidden;
  }
  .theme-swatch[data-t="5"]::before{
    content:'';position:absolute;inset:0;
    background-image:
      radial-gradient(1.4px 1.4px at 22% 28%, #ffffff, transparent),
      radial-gradient(1.2px 1.2px at 62% 18%, #ffffff, transparent),
      radial-gradient(1px 1px at 78% 55%, #ffffff, transparent),
      radial-gradient(1px 1px at 38% 68%, #ffffff, transparent),
      radial-gradient(1.4px 1.4px at 72% 78%, #ffffff, transparent);
  }
  .sheet-action-btn{
    width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;margin-bottom:10px;
    border-radius:12px;border:1px solid var(--border);background:none;color:var(--text);
    font-family:inherit;font-weight:700;font-size:0.9rem;cursor:pointer;
  }
  .sheet-action-btn svg{width:18px;height:18px;flex-shrink:0;}

  .toc-stat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:0.9rem;}
  .toc-stat-row span:first-child{color:var(--muted);}
  .toc-stat-row span:last-child{font-weight:700;}

  .search-box{display:flex;gap:8px;margin-bottom:14px;}
  .search-box input{
    flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);
    font-family:inherit;font-size:0.9rem;background:var(--bg);color:var(--text);outline:none;
  }
  .search-box input:focus{border-color:var(--link);}
  .search-nav{display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;color:var(--muted);}
  .search-nav button{
    background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;
    font-family:inherit;color:var(--text);cursor:pointer;font-weight:700;
  }

  @media print{
    .fab,.sheet-overlay,.preview-banner{display:none !important;}
    .art-header{background:#ffffff !important;color:#3d5af1 !important;border-bottom:1px solid #ccc;}
    .art-header .wordmark{color:#3d5af1 !important;}
  }
</style>
</head>

// ===== الثيمات =====
function setTheme(t){
  document.documentElement.setAttribute('data-theme', String(t));
  document.querySelectorAll('.theme-swatch').forEach(s=>s.classList.toggle('active', s.getAttribute('data-t')===String(t)));
  try{ localStorage.setItem('el_article_theme', String(t)); }catch(e){}

// ===== تحويل الروابط الخام داخل النص لروابط فعّالة قابلة للضغط =====
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function linkify(text){
  const escaped = escapeHtml(text);
  const urlRe = /((https?:\/\/|www\.)[^\s<]+)/gi;
  return escaped.replace(urlRe, (m)=>{
    const href = m.startsWith('http') ? m : 'https://'+m;
    return `<a href="${href}" target="_blank" rel="noopener">${m}</a>`;
  });
}
function renderBody(text){
  const paragraphs = String(text||'').split(/\n+/).filter(p=>p.trim());
  return paragraphs.map(p=>`<p>${linkify(p)}</p>`).join('');
}
function formatDate(iso){
  try{
    const d = new Date(iso);
    const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }catch(e){ return ''; }
}

function renderArticle(data){
  currentArticleData = data;
  const {title, text, displayName, avatar, createdAt, updatedAt} = data;
  document.title = (title || 'مقالة') + ' — electrwni.link';
  const edited = updatedAt && createdAt && (new Date(updatedAt).getTime() - new Date(createdAt).getTime() > 60000);
  const avatarHtml = avatar
    ? `<img src="${avatar}">`
    : (displayName ? displayName.trim()[0] : '📄');
  document.getElementById('artShell').innerHTML = `
    <h1 class="art-title">${escapeHtml(title || 'بدون عنوان')}</h1>
    <div class="art-meta">
      <div class="avatar">${avatarHtml}</div>
      <span class="author-name">${escapeHtml(displayName || 'حساب electrwni.link')}</span>
      <span>·</span>
      <span>${formatDate(createdAt)}</span>
      ${edited ? `<span class="edited-badge">✏️ آخر تعديل: ${formatDate(updatedAt)}</span>` : ''}
    </div>
    <div class="art-body" id="artBody">${renderBody(text)}</div>
  `;
}

// ===== الأزرار العائمة: سحب وإفلات =====
function makeDraggable(el){
  let dragging=false, startX=0, startY=0, origX=0, origY=0, moved=false;
  const rect0 = el.getBoundingClientRect();
  el.style.left = rect0.left + 'px';
  el.style.top = rect0.top + 'px';
  el.style.right = 'auto';
  el.style.bottom = 'auto';

  function onDown(e){
    dragging = true; moved = false;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    const r = el.getBoundingClientRect();
    origX = r.left; origY = r.top;
    el.setPointerCapture && e.pointerId!=null && el.setPointerCapture(e.pointerId);
  }
  function onMove(e){
    if(!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX, dy = p.clientY - startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
    let nx = origX + dx, ny = origY + dy;
    nx = Math.max(4, Math.min(window.innerWidth - el.offsetWidth - 4, nx));
    ny = Math.max(4, Math.min(window.innerHeight - el.offsetHeight - 4, ny));
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
  }
  function onUp(){ dragging = false; }

  el.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  el.__wasMoved = () => moved;
}

// ===== المشاركة =====
async function shareArticle(){
  closeSheet();
  const url = window.location.href;
  const title = currentArticleData.title || 'مقالة من electrwni.link';
  try{
    if(navigator.share){
      await navigator.share({ title, url });
    } else {
      await navigator.clipboard.writeText(url);
      alert('تم نسخ رابط المقالة · Link copied');
    }
  }catch(e){ /* المستخدم ألغى المشاركة */ }
}

}
function closeSheet(){

}

  } else if(tab==='settings'){

      </div>
      <button type="button" class="sheet-action-btn" onclick="window.print()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        طباعة المقالة · Print
      </button>
    `;
    const savedTheme = document.documentElement.getAttribute('data-theme') || '0';
    document.querySelectorAll('#themeRow .theme-swatch').forEach(s=>s.classList.toggle('active', s.getAttribute('data-t')===savedTheme));
  } else if(tab==='search'){
    body.innerHTML = sheetBackRow('أبحث في المقالة') + `
      <div class="search-box">
        <input type="text" id="artSearchInput" placeholder="ابحث داخل نص المقالة..." oninput="doArticleSearch()">
      </div>
      <div class="search-nav">
        <span id="searchResultCount">اكتب كلمة للبحث</span>
        <div style="display:flex;gap:6px;">
          <button type="button" onclick="jumpSearch(-1)">السابق ↑</button>
          <button type="button" onclick="jumpSearch(1)">التالي ↓</button>
        </div>
      </div>
    `;
    document.getElementById('artSearchInput').focus();
  }
}
window.showRootMenu = showRootMenu;

// ===== البحث داخل نص المقالة =====
let searchMatches = [];
let searchIndex = -1;
function doArticleSearch(){
  const q = document.getElementById('artSearchInput').value.trim();
  const bodyEl = document.getElementById('artBody');
  const countEl = document.getElementById('searchResultCount');
  if(!bodyEl) return;
  // إعادة الأصل قبل التمييز الجديد
  bodyEl.querySelectorAll('mark').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
  bodyEl.normalize();
  searchMatches = [];
  searchIndex = -1;
  if(!q){ countEl.textContent = 'اكتب كلمة للبحث'; return; }

  const walker = document.createTreeWalker(bodyEl, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let node;
  while(node = walker.nextNode()){ textNodes.push(node); }
  const qLower = q.toLowerCase();

  textNodes.forEach(tn=>{
    const val = tn.nodeValue;
    const lower = val.toLowerCase();
    if(!lower.includes(qLower)) return;
    const frag = document.createDocumentFragment();
    let last = 0, idx;
    while((idx = lower.indexOf(qLower, last)) !== -1){
      frag.appendChild(document.createTextNode(val.slice(last, idx)));
      const mark = document.createElement('mark');
      mark.textContent = val.slice(idx, idx+q.length);
      frag.appendChild(mark);
      searchMatches.push(mark);
      last = idx + q.length;
    }
    frag.appendChild(document.createTextNode(val.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  });

  countEl.textContent = searchMatches.length ? `${searchMatches.length} نتيجة` : 'لا نتائج';
  if(searchMatches.length){ searchIndex = 0; highlightCurrentMatch(); }
}
function highlightCurrentMatch(){
  searchMatches.forEach((m,i)=>m.classList.toggle('current', i===searchIndex));
  if(searchMatches[searchIndex]){
    searchMatches[searchIndex].scrollIntoView({behavior:'smooth', block:'center'});
  }
}
function jumpSearch(dir){
  if(!searchMatches.length) return;
  searchIndex = (searchIndex + dir + searchMatches.length) % searchMatches.length;
  highlightCurrentMatch();
}
window.doArticleSearch = doArticleSearch;
window.jumpSearch = jumpSearch;
window.setTheme = setTheme;
window.showSheetTab = showSheetTab;
window.closeSheet = closeSheet;

// السمة الأولى (٠) تتبع ألوان الموقع الحقيقية لصاحب الحساب، بدل لون أزرق ثابت
function applySiteColors(data){
  const p1 = data.primaryColor || data.themeColor || '#3d5af1';
  const p2 = data.primaryColor2 || '#6c8fff';
  const txt = data.textColor || '#000000';
  const bg = data.bgColor || '#ffffff';
  document.documentElement.style.setProperty('--site-gradient', `linear-gradient(135deg, ${p1}, ${p2})`);
  const styleTag = document.createElement('style');
  styleTag.textContent = `html[data-theme="0"]{ --bg:${bg}; --text:${txt}; --link:${p1}; }`;
  document.head.appendChild(styleTag);
}

async function init(){
  const params = new URLSearchParams(window.location.search);

  // ===== وضع المعاينة قبل النشر (بدون حفظ فعلي) =====
  if(params.get('preview') === '1'){
    document.getElementById('previewBanner').innerHTML = '<div class="preview-banner">👁 معاينة قبل النشر — هذه ليست نسخة منشورة · Preview only, not published</div>';
    document.getElementById('headerWordmark').innerHTML = `electrwni.link<span class="u">/اسمك</span>`;
    let draft = null;
    try{ draft = JSON.parse(sessionStorage.getItem('el_article_draft') || 'null'); }catch(e){}
    if(!draft){ renderEmpty('لا توجد بيانات معاينة · No preview data found'); return; }
    applySiteColors(draft);
    renderArticle({
      title: draft.title, text: draft.text, displayName: draft.displayName,
      avatar: draft.avatar, createdAt: draft.createdAt, updatedAt: draft.createdAt
    });
    return;
  }

  // ===== وضع العرض الحقيقي: جلب من قاعدة البيانات =====
  const uname = (params.get('u') || '').trim().toLowerCase();
  const num = parseInt(params.get('n'));
  if(!uname || !num){ renderEmpty('رابط المقالة غير صالح · Invalid article link'); return; }
  document.getElementById('headerWordmark').innerHTML = `electrwni.link<span class="u">/${uname}</span>`;
  if(!db){ renderEmpty('تعذّر الاتصال بالخادم، أعد تحميل الصفحة · Connection error'); return; }

  try{
    const idxDoc = await db.collection('usernames').doc(uname).get();
    if(!idxDoc.exists){ renderEmpty(`الحساب "${uname}" غير مسجّل بالنظام · Account not found`); return; }
    const uid = idxDoc.data().uid;
    const userDoc = await db.collection('users').doc(uid).get();
    if(!userDoc.exists){ renderEmpty('تعذّر العثور على بيانات الحساب · Account data not found'); return; }
    const data = userDoc.data();
    applySiteColors(data);
    const links = Array.isArray(data.links) ? data.links : [];
    const link = links.find(l => (parseInt(l.number ?? l.num)) === num);
    if(!link || link.type !== 'text'){ renderEmpty('لم يتم العثور على هذه المقالة · Article not found'); return; }

    renderArticle({
      title: link.title ?? link.label,
      text: link.text,
      displayName: data.displayName || data.fullName || uname,
      avatar: data.avatar || '',
      createdAt: link.createdAt || new Date().toISOString(),
      updatedAt: link.updatedAt
    });

    // احتساب مشاهدة (نفس آلية عدّاد الروابط بصفحة الملف العام)
    try{
      await db.runTransaction(async (tx) => {
        const ref = db.collection('users').doc(uid);
        const snap = await tx.get(ref);
        if(!snap.exists) return;
        const d = snap.data();
        const ls = Array.isArray(d.links) ? d.links : [];
        const idx = ls.findIndex(l => (parseInt(l.number ?? l.num)) === num);
        if(idx === -1) return;
        const updated = ls.slice();
        updated[idx] = { ...updated[idx], views: (updated[idx].views||0) + 1 };
        tx.update(ref, { links: updated });
      });
    }catch(e){ console.error('article view count failed:', e.code || e.message); }

  }catch(e){
    console.error('article load error:', e);
    renderEmpty('حدث خطأ أثناء تحميل المقالة · Error loading article');
  }
}

// ربط الزر العائم
makeDraggable(document.getElementById('menuFab'));
document.getElementById('menuFab').addEventListener('click', (e)=>{
  if(document.getElementById('menuFab').__wasMoved()) return;
  openSheet();
});

init();
</script>
