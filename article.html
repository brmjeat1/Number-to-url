<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>مقالة — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Light.otf') format('opentype');
    font-weight:300;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Regular.otf') format('opentype');
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Medium.otf') format('opentype');
    font-weight:500;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Bold.otf') format('opentype');
    font-weight:700;
    font-display:swap;
  }
  @font-face{
    font-family:'ThmanyahSerif';
    src:url('fonts/thmanyahseriftext-Black.otf') format('opentype');
    font-weight:900;
    font-display:swap;
  }
  :root{
    --bg:#ffffff;
    --text:#000000;
    --link:#1a3fd6;
    --muted:#767676;
    --border:#e8e8e8;
    --header-bg:#ffffff;
    --header-text:#3d5af1;
  }
  html[data-theme="1"]{ --bg:#DAD7CD; --text:#344E41; --link:#588157; --muted:#5c6f63; --border:#c3c0b3; }
  html[data-theme="2"]{ --bg:#FEFAE0; --text:#BB3E03; --link:#EE9A00; --muted:#a37a4a; --border:#eee3bd; }
  html[data-theme="3"]{ --bg:#EEF0F2; --text:#0D21A1; --link:#EEC643; --muted:#6b7280; --border:#dbdfe4; }
  html[data-theme="4"]{ --bg:#12141c; --text:#f0f1f5; --link:#8fb0ff; --muted:#9aa0ae; --border:#2a2d3a; }
  html[data-theme="5"]{ --bg:#FDF6EC; --text:#7C4A03; --link:#C97D34; --muted:#a67c4d; --border:#efe0c8; }
  html[data-theme="6"]{ --bg:#E6F4F1; --text:#0B4F4A; --link:#2A9D8F; --muted:#5f8f89; --border:#c9e6e1; }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100vh;}
  body{
    font-family:'ThmanyahSerif',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;flex-direction:column;
    transition:background .25s ease,color .25s ease;
  }

  /* ===== الرأس: هوية ثابتة لا تتأثر بالسمات أو الطباعة ===== */
  .art-header{
    background:#ffffff !important;
    border-bottom:1px solid #eeeeee;
    padding:14px 20px;
    display:flex;align-items:center;justify-content:flex-start;
    flex-shrink:0;
  }
  .art-header .wordmark{
    font-family:'Space Mono',monospace;font-weight:700;font-size:0.92rem;
    color:#3d5af1 !important;
    direction:ltr;
  }
  .art-header .wordmark .u{color:#3d5af1;opacity:0.65;}

  /* ===== جسم المقالة ===== */
  .art-shell{
    flex:1;width:100%;max-width:680px;margin:0 auto;
    padding:44px 24px 100px;
  }
  .art-title{
    font-weight:700;font-size:2rem;line-height:1.35;letter-spacing:-0.3px;
    margin-bottom:18px;word-wrap:break-word;
  }
  .art-meta{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-bottom:24px;margin-bottom:32px;border-bottom:1px solid var(--border);
    color:var(--muted);font-size:0.85rem;
  }
  .art-meta .avatar{
    width:34px;height:34px;border-radius:50%;background:var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
    font-weight:700;color:var(--text);
  }
  .art-meta .avatar img{width:100%;height:100%;object-fit:cover;}
  .art-meta .author-name{font-weight:700;color:var(--text);}
  .art-meta .edited-badge{
    background:rgba(0,0,0,0.06);border-radius:20px;padding:2px 10px;font-size:0.75rem;
  }
  .art-body{
    font-size:calc(1.08rem * var(--font-scale, 1));line-height:2;word-wrap:break-word;
    transition:font-size .15s ease;
  }
  .art-body p{margin-bottom:1.4em;}
  .art-body a{color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:3px;}
  .art-body mark{background:#ffe58a;color:#000;border-radius:3px;padding:0 2px;}
  .art-body mark.current{background:#ffb84d;}

  .preview-banner{
    background:#000;color:#fff;text-align:center;padding:8px;font-size:0.78rem;font-weight:700;
  }
  .art-empty{text-align:center;padding:80px 20px;color:var(--muted);}
  .art-empty .icon{font-size:2.5rem;margin-bottom:14px;}

  /* ===== شاشة تحميل بشكل هيكلي (Skeleton) بدل الإيموجي الثابت ===== */
  .skeleton-shimmer{
    background:linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,0.5) 50%, var(--border) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
    border-radius:8px;
  }
  html[data-theme="4"] .skeleton-shimmer{
    background:linear-gradient(90deg, var(--border) 25%, rgba(255,255,255,0.08) 50%, var(--border) 75%);
    background-size:200% 100%;
  }
  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }
  .skel-title{height:28px;width:85%;margin-bottom:12px;}
  .skel-title.short{width:55%;margin-bottom:26px;}
  .skel-meta{display:flex;align-items:center;gap:10px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border);}
  .skel-avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;}
  .skel-meta-line{height:12px;width:120px;}
  .skel-line{height:14px;margin-bottom:12px;}
  .skel-line.w-full{width:100%;}
  .skel-line.w-90{width:92%;}
  .skel-line.w-75{width:76%;}
  .skel-line.w-60{width:60%;}
  .skel-para-gap{margin-bottom:26px;}

  /* ===== الزر العائم: ثابت بمنتصف أسفل الشاشة ===== */
  .fab{
    position:fixed;z-index:410;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#fff;
    border:none;box-shadow:0 6px 18px rgba(0,0,0,0.28);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    bottom:24px;left:50%;transform:translateX(-50%);transition:transform .2s ease;
  }
  .fab.open{transform:translateX(-50%) rotate(45deg);}
  .fab svg{width:26px;height:26px;pointer-events:none;}

  /* الأيقونات التي تتمحور حول الزر بشكل قوس */
  .arc-item{
    position:fixed;z-index:405;bottom:24px;left:50%;
    width:48px;height:48px;border-radius:50%;
    background:#ffffff;border:1px solid #e2e2e2;box-shadow:0 4px 14px rgba(0,0,0,0.2);
    display:flex;align-items:center;justify-content:center;color:#3d5af1;
    cursor:pointer;transform:translate(-50%,0) scale(0);opacity:0;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;
    pointer-events:none;
  }
  .arc-item.arc-inner{width:38px;height:38px;z-index:406;}
  .arc-item svg{width:20px;height:20px;pointer-events:none;}
  .arc-item.open{opacity:1;pointer-events:auto;}
  .arc-item .arc-label{
    position:absolute;top:56px;left:50%;transform:translateX(-50%);
    font-size:0.68rem;font-weight:700;color:var(--text);white-space:nowrap;
    background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--border);
  }
  .arc-item.arc-inner .arc-label{top:44px;font-size:0.62rem;padding:1px 6px;}

  /* ===== شاشة الخيارات المنزلقة: طبقة نمطية بدون تظليل، تمنع التفاعل مع الخلفية ===== */
  .sheet-overlay{
    position:fixed;inset:0;background:transparent;z-index:500;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-overlay.open{display:flex;}
  .sheet-panel{
    background:var(--bg);color:var(--text);width:100%;max-width:680px;
    border-radius:20px 20px 0 0;max-height:82vh;display:flex;flex-direction:column;
    border:1px solid var(--border);border-bottom:none;
    transform:translateY(100%);transition:transform .28s ease;
  }
  .sheet-overlay.open .sheet-panel{transform:translateY(0);}
  .sheet-handle{width:40px;height:4px;background:var(--border);border-radius:3px;margin:10px auto 4px;flex-shrink:0;}
  .sheet-body{padding:20px;overflow-y:auto;}

  .sheet-back-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .sheet-back-btn{
    background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;
    font-family:inherit;color:var(--text);cursor:pointer;font-weight:700;font-size:0.85rem;
    display:flex;align-items:center;gap:4px;
  }
  .sheet-title{font-weight:800;font-size:1rem;}

  .theme-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
  .theme-box{
    cursor:pointer;border:2px solid var(--border);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform .15s,border-color .15s;
    background:var(--bg);
  }
  .theme-box:active{transform:scale(0.96);}
  .theme-box.active{border-color:var(--link);}
  .theme-box .swatch-preview{height:34px;width:100%;position:relative;}
  .theme-box .swatch-label{
    font-size:0.68rem;font-weight:700;text-align:center;padding:6px 4px;color:var(--text);
    background:var(--bg);
  }
  .theme-box[data-t="0"] .swatch-preview{
    background:var(--site-gradient, linear-gradient(135deg,#3d5af1,#6c8fff));
    display:flex;align-items:center;justify-content:center;
    color:#ffffff;font-weight:900;font-size:13px;font-family:'Space Mono',monospace;
  }
  .theme-box[data-t="1"] .swatch-preview{background:#DAD7CD;}
  .theme-box[data-t="2"] .swatch-preview{background:#FEFAE0;}
  .theme-box[data-t="3"] .swatch-preview{background:#EEF0F2;}
  .theme-box[data-t="4"] .swatch-preview{
    background:radial-gradient(circle at 30% 25%, #3a1670, #150533 70%);
    position:relative;overflow:hidden;
  }
  .theme-box[data-t="4"] .swatch-preview::before{
    content:'';position:absolute;inset:0;
    background-image:
      radial-gradient(1.4px 1.4px at 22% 28%, #ffffff, transparent),
      radial-gradient(1.2px 1.2px at 62% 18%, #ffffff, transparent),
      radial-gradient(1px 1px at 78% 55%, #ffffff, transparent),
      radial-gradient(1px 1px at 38% 68%, #ffffff, transparent),
      radial-gradient(1.4px 1.4px at 72% 78%, #ffffff, transparent);
  }
  .theme-box[data-t="5"] .swatch-preview{background:#FDF6EC;}
  .theme-box[data-t="6"] .swatch-preview{background:#E6F4F1;}
  .sheet-action-btn{
    width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;margin-bottom:10px;
    border-radius:12px;border:1px solid var(--border);background:none;color:var(--text);
    font-family:inherit;font-weight:700;font-size:0.9rem;cursor:pointer;
  }
  .sheet-action-btn svg{width:18px;height:18px;flex-shrink:0;}

  .toc-stat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:0.9rem;}
  .toc-stat-row span:first-child{color:var(--muted);}
  .toc-stat-row span:last-child{font-weight:700;}

  .search-box{display:flex;gap:8px;margin-bottom:14px;}
  .search-box input{
    flex:1;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);
    font-family:inherit;font-size:0.9rem;background:var(--bg);color:var(--text);outline:none;
  }
  .search-box input:focus{border-color:var(--link);}
  .search-nav{display:flex;align-items:center;justify-content:space-between;font-size:0.85rem;color:var(--muted);}
  .search-nav button{
    background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;
    font-family:inherit;color:var(--text);cursor:pointer;font-weight:700;
  }

  @media print{
    .fab,.arc-item,.sheet-overlay,.preview-banner,.font-size-popover,.font-size-btn{display:none !important;}
    .art-header{background:#ffffff !important;color:#3d5af1 !important;border-bottom:1px solid #ccc;}
    .art-header .wordmark{color:#3d5af1 !important;}
  }
</style>
</head>

<script>
const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
let db=null;
try{
  if(!firebase.apps.length)firebase.initializeApp(cfg);
  db=firebase.firestore();
}catch(e){ console.error('Firebase init failed:', e); }

let currentArticleData = { title:'', text:'', displayName:'', createdAt:'' };

// ===== الثيمات =====
function setTheme(t){
  document.documentElement.setAttribute('data-theme', String(t));
  document.querySelectorAll('.theme-box').forEach(s=>s.classList.toggle('active', s.getAttribute('data-t')===String(t)));
  try{ localStorage.setItem('el_article_theme', String(t)); }catch(e){}
}
(function initTheme(){
  let saved = '0';
  try{ saved = localStorage.getItem('el_article_theme') || '0'; }catch(e){}
  setTheme(parseInt(saved) || 0);
})();

// ===== تحويل الروابط الخام داخل النص لروابط فعّالة قابلة للضغط =====
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function linkify(text){
  const escaped = escapeHtml(text);
  const urlRe = /((https?:\/\/|www\.)[^\s<]+)/gi;
  return escaped.replace(urlRe, (m)=>{
    const href = m.startsWith('http') ? m : 'https://'+m;
    return `<a href="${href}" target="_blank" rel="noopener">${m}</a>`;
  });
}
function renderBody(text){
  const paragraphs = String(text||'').split(/\n+/).filter(p=>p.trim());
  return paragraphs.map(p=>`<p>${linkify(p)}</p>`).join('');
}
function formatDate(iso){
  try{
    const d = new Date(iso);
    const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  }catch(e){ return ''; }
}

// ===== التحكم بحجم الخط =====
const DEFAULT_FONT_SCALE = 1.4;
let fontScale = DEFAULT_FONT_SCALE;
(function initFontScale(){
  try{
    const saved = localStorage.getItem('el_article_font_scale');
    fontScale = saved!=null ? parseFloat(saved) : DEFAULT_FONT_SCALE;
  }catch(e){}
  document.documentElement.style.setProperty('--font-scale', fontScale);
})();
function adjustFontSize(dir){
  if(dir === 0){ fontScale = DEFAULT_FONT_SCALE; }
  else{ fontScale = Math.max(0.8, Math.min(1.8, fontScale + dir*0.1)); }
  document.documentElement.style.setProperty('--font-scale', fontScale);
  try{ localStorage.setItem('el_article_font_scale', String(fontScale)); }catch(e){}
}
window.adjustFontSize = adjustFontSize;

function renderArticle(data){
  currentArticleData = data;
  const {title, text, displayName, avatar, createdAt, updatedAt} = data;
  document.title = (title || 'مقالة') + ' — electrwni.link';
  const edited = updatedAt && createdAt && (new Date(updatedAt).getTime() - new Date(createdAt).getTime() > 60000);
  const avatarHtml = avatar
    ? `<img src="${avatar}">`
    : (displayName ? displayName.trim()[0] : '📄');
  document.getElementById('artShell').innerHTML = `
    <h1 class="art-title">${escapeHtml(title || 'بدون عنوان')}</h1>
    <div class="art-meta">
      <div class="avatar">${avatarHtml}</div>
      <span class="author-name">${escapeHtml(displayName || 'حساب electrwni.link')}</span>
      <span>·</span>
      <span>${formatDate(createdAt)}</span>
      ${edited ? `<span class="edited-badge">✏️ آخر تعديل: ${formatDate(updatedAt)}</span>` : ''}
    </div>
    <div class="art-body" id="artBody">${renderBody(text)}</div>
  `;
}

function renderEmpty(msg){
  document.getElementById('artShell').innerHTML = `
    <div class="art-empty">
      <div class="icon">🔍</div>
      <div>${msg}</div>
    </div>`;
}

// ===== الزر العائم: يفتح/يقفل قوس الأيقونات حوله =====
const ARC_OUTER = ['arcShare','arcPrint','arcToc','arcSettings','arcSearch'];
const ARC_INNER = ['arcFontMinus','arcFontReset','arcFontPlus'];
const ARC_IDS = [...ARC_OUTER, ...ARC_INNER];
let arcOpen = false;

function layoutArcGroup(ids, radius, startDeg, endDeg){
  const n = ids.length;
  ids.forEach((id, i) => {
    const el = document.getElementById(id);
    if(!el) return;
    const deg = n===1 ? (startDeg+endDeg)/2 : startDeg - (i * (startDeg-endDeg) / (n-1));
    const rad = deg * Math.PI/180;
    const x = radius * Math.cos(rad);
    const y = -radius * Math.sin(rad);
    el.style.setProperty('--arc-x', x+'px');
    el.style.setProperty('--arc-y', y+'px');
  });
}
function layoutArc(){
  layoutArcGroup(ARC_OUTER, 115, 168, 12);   // القوس الخارجي: الإجراءات الخمسة الرئيسية
  layoutArcGroup(ARC_INNER, 62, 130, 50);    // القوس الداخلي: التحكم بحجم الخط
}

function toggleArc(){
  arcOpen = !arcOpen;
  document.getElementById('menuFab').classList.toggle('open', arcOpen);
  ARC_IDS.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.toggle('open', arcOpen);
    if(arcOpen){
      const x = el.style.getPropertyValue('--arc-x');
      const y = el.style.getPropertyValue('--arc-y');
      el.style.transform = `translate(calc(-50% + ${x}), ${y}) scale(1)`;
    } else {
      el.style.transform = 'translate(-50%,0) scale(0)';
    }
  });
}
function closeArc(){
  if(arcOpen) toggleArc();
}

function printAndClose(){
  closeArc();
  window.print();
}

// ===== المشاركة =====
async function shareArticle(){
  closeArc();
  const url = window.location.href;
  const title = currentArticleData.title || 'مقالة من electrwni.link';
  try{
    if(navigator.share){
      await navigator.share({ title, url });
    } else {
      await navigator.clipboard.writeText(url);
      alert('تم نسخ رابط المقالة · Link copied');
    }
  }catch(e){ /* المستخدم ألغى المشاركة */ }
}

// ===== شاشة الخيارات (تُفتح مباشرة على قسم محدد من القوس) =====
function openSheet(){
  document.getElementById('optionsSheet').classList.add('open');
  document.body.style.overflow = 'hidden'; // يمنع تمرير الخلفية أثناء فتح الطبقة النمطية
}
function closeSheet(){
  document.getElementById('optionsSheet').classList.remove('open');
  document.body.style.overflow = '';
}

function sheetBackRow(title){
  return `<div class="sheet-back-row">
    <button type="button" class="sheet-back-btn" onclick="closeSheet()">✕ إغلاق</button>
    <span class="sheet-title">${title}</span>
  </div>`;
}

function showSheetTab(tab){
  openSheet();
  const body = document.getElementById('sheetBody');

  if(tab==='toc'){
    const text = currentArticleData.text || '';
    const words = text.trim().split(/\s+/).filter(Boolean).length;
    const minutes = Math.max(1, Math.round(words/180));
    body.innerHTML = sheetBackRow('ملخص المحتويات') + `
      <div class="toc-stat-row"><span>العنوان</span><span>${escapeHtml(currentArticleData.title||'—')}</span></div>
      <div class="toc-stat-row"><span>الكاتب</span><span>${escapeHtml(currentArticleData.displayName||'—')}</span></div>
      <div class="toc-stat-row"><span>تاريخ النشر</span><span>${formatDate(currentArticleData.createdAt)}</span></div>
      <div class="toc-stat-row"><span>عدد الكلمات</span><span>${words}</span></div>
      <div class="toc-stat-row" style="border-bottom:none;"><span>وقت القراءة التقديري</span><span>~${minutes} دقيقة</span></div>
    `;
  } else if(tab==='settings'){
    body.innerHTML = sheetBackRow('الإعدادات والسمات') + `
      <div style="font-weight:700;margin-bottom:10px;font-size:0.85rem;color:var(--muted);">الألوان · Theme</div>
      <div class="theme-row" id="themeRow">
        <div class="theme-box active" data-t="0" onclick="setTheme(0)"><div class="swatch-preview">e</div><div class="swatch-label">الافتراضي</div></div>
        <div class="theme-box" data-t="1" onclick="setTheme(1)"><div class="swatch-preview"></div><div class="swatch-label">طبيعي</div></div>
        <div class="theme-box" data-t="2" onclick="setTheme(2)"><div class="swatch-preview"></div><div class="swatch-label">دافئ</div></div>
        <div class="theme-box" data-t="3" onclick="setTheme(3)"><div class="swatch-preview"></div><div class="swatch-label">هادئ</div></div>
        <div class="theme-box" data-t="4" onclick="setTheme(4)"><div class="swatch-preview"></div><div class="swatch-label">ليلي</div></div>
        <div class="theme-box" data-t="5" onclick="setTheme(5)"><div class="swatch-preview"></div><div class="swatch-label">ترابي</div></div>
        <div class="theme-box" data-t="6" onclick="setTheme(6)"><div class="swatch-preview"></div><div class="swatch-label">منعش</div></div>
      </div>
    `;
    const savedTheme = document.documentElement.getAttribute('data-theme') || '0';
    document.querySelectorAll('#themeRow .theme-box').forEach(s=>s.classList.toggle('active', s.getAttribute('data-t')===savedTheme));
  } else if(tab==='search'){
    body.innerHTML = sheetBackRow('أبحث في المقالة') + `
      <div class="search-box">
        <input type="text" id="artSearchInput" placeholder="ابحث داخل نص المقالة..." oninput="doArticleSearch()">
      </div>
      <div class="search-nav">
        <span id="searchResultCount">اكتب كلمة للبحث</span>
        <div style="display:flex;gap:6px;">
          <button type="button" onclick="jumpSearch(-1)">السابق ↑</button>
          <button type="button" onclick="jumpSearch(1)">التالي ↓</button>
        </div>
      </div>
    `;
    document.getElementById('artSearchInput').focus();
  }
}

// ===== البحث داخل نص المقالة =====
let searchMatches = [];
let searchIndex = -1;
function doArticleSearch(){
  const q = document.getElementById('artSearchInput').value.trim();
  const bodyEl = document.getElementById('artBody');
  const countEl = document.getElementById('searchResultCount');
  if(!bodyEl) return;
  // إعادة الأصل قبل التمييز الجديد
  bodyEl.querySelectorAll('mark').forEach(m=>{ m.replaceWith(document.createTextNode(m.textContent)); });
  bodyEl.normalize();
  searchMatches = [];
  searchIndex = -1;
  if(!q){ countEl.textContent = 'اكتب كلمة للبحث'; return; }

  const walker = document.createTreeWalker(bodyEl, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  let node;
  while(node = walker.nextNode()){ textNodes.push(node); }
  const qLower = q.toLowerCase();

  textNodes.forEach(tn=>{
    const val = tn.nodeValue;
    const lower = val.toLowerCase();
    if(!lower.includes(qLower)) return;
    const frag = document.createDocumentFragment();
    let last = 0, idx;
    while((idx = lower.indexOf(qLower, last)) !== -1){
      frag.appendChild(document.createTextNode(val.slice(last, idx)));
      const mark = document.createElement('mark');
      mark.textContent = val.slice(idx, idx+q.length);
      frag.appendChild(mark);
      searchMatches.push(mark);
      last = idx + q.length;
    }
    frag.appendChild(document.createTextNode(val.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  });

  countEl.textContent = searchMatches.length ? `${searchMatches.length} نتيجة` : 'لا نتائج';
  if(searchMatches.length){ searchIndex = 0; highlightCurrentMatch(); }
}
function highlightCurrentMatch(){
  searchMatches.forEach((m,i)=>m.classList.toggle('current', i===searchIndex));
  if(searchMatches[searchIndex]){
    searchMatches[searchIndex].scrollIntoView({behavior:'smooth', block:'center'});
  }
}
function jumpSearch(dir){
  if(!searchMatches.length) return;
  searchIndex = (searchIndex + dir + searchMatches.length) % searchMatches.length;
  highlightCurrentMatch();
}
window.doArticleSearch = doArticleSearch;
window.jumpSearch = jumpSearch;
window.setTheme = setTheme;
window.showSheetTab = showSheetTab;
window.closeSheet = closeSheet;

// السمة الأولى (٠) تتبع ألوان الموقع الحقيقية لصاحب الحساب، بدل لون أزرق ثابت
function applySiteColors(data){
  const p1 = data.primaryColor || data.themeColor || '#3d5af1';
  const p2 = data.primaryColor2 || '#6c8fff';
  const txt = data.textColor || '#000000';
  const bg = data.bgColor || '#ffffff';
  document.documentElement.style.setProperty('--site-gradient', `linear-gradient(135deg, ${p1}, ${p2})`);
  const styleTag = document.createElement('style');
  styleTag.textContent = `html[data-theme="0"]{ --bg:${bg}; --text:${txt}; --link:${p1}; }`;
  document.head.appendChild(styleTag);
}

async function init(){
  const params = new URLSearchParams(window.location.search);

  // ===== وضع المعاينة قبل النشر (بدون حفظ فعلي) =====
  if(params.get('preview') === '1'){
    document.getElementById('previewBanner').innerHTML = '<div class="preview-banner">👁 معاينة قبل النشر — هذه ليست نسخة منشورة · Preview only, not published</div>';
    document.getElementById('headerWordmark').innerHTML = `electrwni.link<span class="u">/اسمك</span>`;
    let draft = null;
    try{ draft = JSON.parse(sessionStorage.getItem('el_article_draft') || 'null'); }catch(e){}
    if(!draft){ renderEmpty('لا توجد بيانات معاينة · No preview data found'); return; }
    applySiteColors(draft);
    renderArticle({
      title: draft.title, text: draft.text, displayName: draft.displayName,
      avatar: draft.avatar, createdAt: draft.createdAt, updatedAt: draft.createdAt
    });
    return;
  }

  // ===== وضع العرض الحقيقي: جلب من قاعدة البيانات =====
  const uname = (params.get('u') || '').trim().toLowerCase();
  const num = parseInt(params.get('n'));
  if(!uname || !num){ renderEmpty('رابط المقالة غير صالح · Invalid article link'); return; }
  document.getElementById('headerWordmark').innerHTML = `electrwni.link<span class="u">/${uname}</span>`;
  if(!db){ renderEmpty('تعذّر الاتصال بالخادم، أعد تحميل الصفحة · Connection error'); return; }

  try{
    const idxDoc = await db.collection('usernames').doc(uname).get();
    if(!idxDoc.exists){ renderEmpty(`الحساب "${uname}" غير مسجّل بالنظام · Account not found`); return; }
    const uid = idxDoc.data().uid;
    const userDoc = await db.collection('users').doc(uid).get();
    if(!userDoc.exists){ renderEmpty('تعذّر العثور على بيانات الحساب · Account data not found'); return; }
    const data = userDoc.data();
    applySiteColors(data);
    const links = Array.isArray(data.links) ? data.links : [];
    const link = links.find(l => (parseInt(l.number ?? l.num)) === num);
    if(!link || link.type !== 'text' || link.hidden){ renderEmpty('لم يتم العثور على هذه المقالة · Article not found'); return; }

    renderArticle({
      title: link.title ?? link.label,
      text: link.text,
      displayName: data.displayName || data.fullName || uname,
      avatar: data.avatar || '',
      createdAt: link.createdAt || new Date().toISOString(),
      updatedAt: link.updatedAt
    });

    // احتساب مشاهدة (نفس آلية عدّاد الروابط بصفحة الملف العام)
    try{
      await db.runTransaction(async (tx) => {
        const ref = db.collection('users').doc(uid);
        const snap = await tx.get(ref);
        if(!snap.exists) return;
        const d = snap.data();
        const ls = Array.isArray(d.links) ? d.links : [];
        const idx = ls.findIndex(l => (parseInt(l.number ?? l.num)) === num);
        if(idx === -1) return;
        const updated = ls.slice();
        updated[idx] = { ...updated[idx], views: (updated[idx].views||0) + 1 };
        tx.update(ref, { links: updated });
      });
    }catch(e){ console.error('article view count failed:', e.code || e.message); }

  }catch(e){
    console.error('article load error:', e);
    renderEmpty('حدث خطأ أثناء تحميل المقالة · Error loading article');
  }
}

// ربط الزر العائم: يفتح/يقفل قوس الأيقونات
layoutArc();
window.addEventListener('resize', layoutArc);
document.getElementById('menuFab').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleArc();
});

  if(!arcOpen) return;
  const isArcArea = e.target.closest('.arc-item') || e.target.closest('#menuFab');
  if(!isArcArea) closeArc();
});

init();
</script>
