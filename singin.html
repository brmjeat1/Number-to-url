<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Electrwni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #072AC8; --accent: #FCF300; --dark-bg: #0f172a; }
        body { 
            background: var(--dark-bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(10px); 
            padding: 2.5rem; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .brand-icon {
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 15px;
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            background: rgba(255, 255, 255, 0.08); 
            color: white; 
            box-sizing: border-box; 
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.15); }
        button { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            background: var(--primary); 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 15px;
            font-size: 1rem;
        }
        button:hover { background: #0622a3; transform: translateY(-2px); }
        button:disabled { background: #475569; cursor: not-allowed; }
        .links { margin-top: 25px; font-size: 0.9rem; }
        a { color: var(--accent); text-decoration: none; transition: 0.3s; }
        a:hover { opacity: 0.8; text-decoration: underline; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 10px; display: none; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="brand-icon"><i class="fas fa-bolt"></i></div>
        <h2 style="margin: 0;">مرحباً بك مجدداً</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">سجل دخولك لإدارة روابطك</p>
        
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        
        <div id="error-box" class="error-msg"></div>
        
        <button id="login-btn" onclick="login()">دخول <i class="fas fa-sign-in-alt"></i></button>
        
        <div class="links">
            <p>ليس لديك حساب؟ <a href="signup.html">أنشئ حسابك الآن</a></p>
            <p><a href="index.html" style="color: #94a3b8;"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    
    <script>
        // إعدادات Firebase الحقيقية الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        firebase.initializeApp(firebaseConfig);

        // وظيفة تسجيل الدخول
        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-box');

            if (!email || !pass) {
                showError("يرجى إدخال البريد وكلمة المرور");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الدخول...';
            errorBox.style.display = 'none';

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .then(() => {
                    window.location.href = 'dashboard.html';
                })
                .catch((error) => {
                    btn.disabled = false;
                    btn.innerHTML = 'دخول <i class="fas fa-sign-in-alt"></i>';
                    
                    // ترجمة أخطاء تسجيل الدخول
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        showError("خطأ في البريد الإلكتروني أو كلمة المرور");
                    } else if (error.code === 'auth/invalid-email') {
                        showError("صيغة البريد الإلكتروني غير صحيحة");
                    } else {
                        showError("حدث خطأ غير متوقع، حاول ثانية");
                    }
                });
        }

        function showError(msg) {
            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'block';
            errorBox.innerText = msg;
        }

        // تسجيل الدخول عند ضغط زر Enter
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
