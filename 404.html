<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحويل…</title>
<style>
  html,body{margin:0;height:100%;background:#ffffff;font-family:-apple-system,'Segoe UI',sans-serif;}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  .spin{width:38px;height:38px;border:3px solid #e8ecf5;border-top-color:#3d5af1;border-radius:50%;animation:r .8s linear infinite;}
  @keyframes r{to{transform:rotate(360deg);}}
  .t{color:#9aa2c8;font-size:0.85rem;font-weight:700;}
</style>
<script>
  // حيلة اختصار الروابط على GitHub Pages:
  // electrwni.link/abcd  →  يحوّل إلى  page.html#abcd
  (function(){
    var path = window.location.pathname.replace(/^\/+|\/+$/g,''); // إزالة السلاشات الطرفية
    var seg = path.split('/').filter(Boolean);
    var username = seg.length ? seg[seg.length-1] : '';
    // تجاهل أسماء الملفات الفعلية حتى لا ندخل في حلقة
    var ignore = ['page.html','dashboard.html','signin.html','signup.html','index.html','404.html',''];
    if(username && ignore.indexOf(username.toLowerCase()) === -1 && !/\.[a-z]{2,5}$/i.test(username)){
      window.location.replace('/page.html#' + username);
    } else {
      // رابط مجهول حقيقي → الرئيسية
      window.location.replace('/index.html');
    }
  })();
</script>
</head>
<body>
  <div class="wrap">
    <div class="spin"></div>
    <div class="t">جاري فتح الصفحة… · Loading…</div>
  </div>
</body>
</html>
