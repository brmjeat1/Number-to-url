<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة إلكتروني - الموظف المحترف</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #072AC8; --accent: #FCF300; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        
        .admin-card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap; }
        
        .filter-group { display: flex; align-items: center; gap: 8px; flex-grow: 1; }
        select { padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 0.9rem; outline: none; background: white; }

        /* CSS الخاص بزر التحميل المطور */
        .download-button { position: relative; border-width: 0; color: white; font-size: 15px; font-weight: 600; cursor: pointer; border-radius: 4px; z-index: 1; background: none; }
        .download-button .docs { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 4px; z-index: 1; background-color: #242a35; border: solid 1px #e8e8e82d; transition: all 0.5s cubic-bezier(0.77, 0, 0.175, 1); }
        .download-button:hover .docs { background-color: #242a35; }
        .download { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; max-width: 90%; margin: 0 auto; z-index: -1; border-radius: 4px; transform: translateY(0%); background-color: #01e056; border: solid 1px #01e0572d; transition: all 0.5s cubic-bezier(0.77, 0, 0.175, 1); }
        .download-button:hover .download { transform: translateY(100%); }
        .download svg polyline, .download svg line { animation: docs 1s infinite; }
        @keyframes docs { 0% { transform: translateY(0%); } 50% { transform: translateY(-15%); } 100% { transform: translateY(0%); } }

        /* الجدول */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f1f5f9; color: var(--primary); padding: 12px; }
        td { padding: 12px; border-bottom: 1px solid #edf2f7; text-align: center; }
        .btn-action { margin: 0 10px; padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
        .edit-btn { background: var(--primary); color: white; }
        .del-btn { background: #e53e3e; color: white; }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="toolbar">
        <div class="filter-group">
            <i class="fas fa-filter" style="color: var(--primary)"></i>
            <select onchange="handleFilterChange(this.value)">
                <option>الأكثر شهرة</option>
                <option>اليوم</option>
                <option>الأسبوع</option>
                <option>الشهر</option>
                <option value="custom">تخصيص مقارنة...</option>
            </select>
        </div>

        <!-- زر التحميل الاحترافي -->
        <button class="download-button" onclick="alert('جاري تجهيز ملف الـ PDF...')">
            <div class="docs">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> 
                تنزيل PDF
            </div>
            <div class="download">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><polyline points="8 17 12 21 16 17"></polyline><line x1="12" y1="12" x2="12" y2="21"></line><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"></path></svg>
            </div>
        </button>
    </div>

    <table>
        <thead>
            <tr>
                <th>الرقم</th>
                <th>الرابط</th>
                <th>الإجراءات</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>707</td>
                <td><a href="#" style="color: var(--primary)">electrwni.com/707</a></td>
                <td>
                    <button class="btn-action edit-btn">تعديل</button>
                    <!-- تنبيه الحذف المحدث -->
                    <button class="btn-action del-btn" onclick="confirmDelete()">حذف</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function confirmDelete() {
        const response = confirm("هل أنت متأكد من حذف هذا الرابط؟\nموافق: نعم أو لا");
        if (response) {
            alert("تم الحذف بنجاح.");
            // كود الحذف الفعلي يوضع هنا
        }
    }

    function handleFilterChange(val) {
        if(val === 'custom') alert("سيتم فتح واجهة التخصيص المقارنة");
    }
</script>

</body>
</html>
