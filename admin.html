<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Electrwni Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --primary: #0071e3; --danger: #ff3b30; --bg: #f5f5f7; --border: #e5e5e7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1d1d1f; }
        .container { width: 100%; max-width: 850px; margin: 0 auto; }
        
        details { background: #fff; border-radius: 14px; margin-bottom: 12px; border: 1px solid var(--border); overflow: hidden; }
        summary { padding: 15px; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
        .content { padding: 20px; border-top: 1px solid var(--border); }

        input, textarea { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 10px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-main { width: 100%; background: var(--primary); color: #fff; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* الجدول المنسق بدون عمود تسلسل في العرض الرئيسي */
        .table-wrapper { width: 100%; overflow-x: auto; background: #fff; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th, td { padding: 14px 10px; border: 1px solid #f0f0f2; text-align: center; vertical-align: middle; }
        th { background: #fafafa; font-size: 13px; color: #86868b; }
        
        .link-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .site-link { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 15px; }
        .edit-trigger { color: #ff9500; font-size: 11px; cursor: pointer; text-decoration: underline; }

        /* أزرار الفلترة والـ PDF */
        .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
        .chip { padding: 6px 15px; background: #eee; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .chip.active { background: var(--primary); color: #fff; }
        .pdf-trigger { background: var(--danger); color: #fff; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; display: block; margin: 10px auto; font-weight: bold; }

        /* مودال التعديل */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .modal-card { background: #fff; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px; }
        .modal-footer { display: flex; justify-content: space-between; margin-top: 20px; gap: 15px; }
        .btn-save { flex: 1; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-del { flex: 1; background: var(--danger); color: #fff; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        /* تنسيق PDF المخفي (يحتوي على التسلسل) */
        #pdf-export { display: none; padding: 40px; background: #fff; direction: rtl; }
        .pdf-header { display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .pdf-table th, .pdf-table td { border: 1px solid #ccc; padding: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center;">لوحة تحكم إلكتروني</h2>

    <!-- قسم الإضافة -->
    <details open>
        <summary>إضافة بيانات جديدة</summary>
        <div class="content">
            <input type="text" id="idInp" placeholder="ID الرابط">
            <input type="text" id="urlInp" placeholder="ضع الرابط هنا">
            <textarea id="descInp" placeholder="وصف الرابط"></textarea>
            <button class="btn-main" onclick="addItem()">حفظ البيانات</button>
        </div>
    </details>

    <!-- قسم الإحصائيات -->
    <details open>
        <summary>التقارير والإحصائيات</summary>
        <div class="content">
            <div class="filter-bar">
                <div class="chip active">أسبوع</div>
                <div class="chip">شهر</div>
                <div class="chip">سنة</div>
            </div>
            <button class="pdf-trigger" onclick="generatePDF()">تنزيل تقرير PDF</button>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>الرابط / تعديل</th>
                            <th style="width: 20%">ID</th>
                            <th style="width: 40%">الوصف</th>
                            <th style="width: 15%">👁</th>
                        </tr>
                    </thead>
                    <tbody id="mainTableBody"></tbody>
                </table>
            </div>
        </div>
    </details>
</div>

<!-- مودال التعديل -->
<div class="modal" id="editModal">
    <div class="modal-card">
        <h3 style="text-align: center;">تعديل البيانات</h3>
        <label style="font-size: 12px; color: #666;">ID</label>
        <input type="text" id="mId">
        <label style="font-size: 12px; color: #666;">الرابط</label>
        <input type="text" id="mUrl">
        <label style="font-size: 12px; color: #666;">الوصف</label>
        <textarea id="mDesc"></textarea>
        <div class="modal-footer">
            <button class="btn-save" onclick="confirmSave()">حفظ</button>
            <button class="btn-del" onclick="confirmDelete()">حذف</button>
        </div>
        <center><button onclick="closeModal()" style="margin-top:15px; background:none; border:none; color: #888; cursor:pointer;">إغلاق</button></center>
    </div>
</div>

<!-- هيكل التقرير المخصص للـ PDF (يظهر فيه التسلسل) -->
<div id="pdf-export">
    <div class="pdf-header">
        <div style="text-align: right;">
            <h2 style="margin:0;">إلكتروني | Electrwni</h2>
            <p style="margin:5px 0;">لوحة تحكم إدارة الروابط</p>
        </div>
        <div style="text-align: left;">
            <p id="pdfDate" style="font-weight: bold;"></p>
        </div>
    </div>
    <h3 style="text-align: center; text-decoration: underline;">تقرير إحصائيات الروابط</h3>
    <table class="pdf-table">
        <thead>
            <tr>
                <th>#</th>
                <th>الرابط الأصلي</th>
                <th>ID</th>
                <th>الوصف</th>
                <th>مشاهدات</th>
            </tr>
        </thead>
        <tbody id="pdfTableBody"></tbody>
    </table>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('electrwni_db')) || [];
    let curIdx = null;

    // استخراج اسم الموقع المختصر
    function shortUrl(url) {
        try {
            let domain = url.replace(/^(https?:\/\/)?(www\.)?/, "");
            domain = domain.split('.')[0]; 
            return domain.charAt(0).toUpperCase() + domain.slice(1);
        } catch(e) { return "الرابط"; }
    }

    function render() {
        const body = document.getElementById('mainTableBody');
        body.innerHTML = '';
        db.forEach((item, i) => {
            body.innerHTML += `
                <tr>
                    <td>
                        <div class="link-group">
                            <a href="${item.url}" target="_blank" class="site-link">${shortUrl(item.url)}</a>
                            <span class="edit-trigger" onclick="openModal(${i})">تعديل</span>
                        </div>
                    </td>
                    <td><b>${item.id}</b></td>
                    <td><div style="font-size:12px; line-height:1.4;">${item.desc}</div></td>
                    <td>${item.views || 0}</td>
                </tr>`;
        });
    }

    function addItem() {
        const id = document.getElementById('idInp').value;
        const url = document.getElementById('urlInp').value;
        const desc = document.getElementById('descInp').value;
        if(!id || !url) return alert("يرجى إكمال الحقول");
        db.push({ id, url, desc, views: 0, timestamp: Date.now() });
        localStorage.setItem('electrwni_db', JSON.stringify(db));
        render();
        ['idInp','urlInp','descInp'].forEach(i => document.getElementById(i).value = '');
    }

    function openModal(i) {
        curIdx = i;
        document.getElementById('mId').value = db[i].id;
        document.getElementById('mUrl').value = db[i].url;
        document.getElementById('mDesc').value = db[i].desc;
        document.getElementById('editModal').classList.add('active');
    }

    function closeModal() { document.getElementById('editModal').classList.remove('active'); }

    function confirmSave() {
        db[curIdx].id = document.getElementById('mId').value;
        db[curIdx].url = document.getElementById('mUrl').value;
        db[curIdx].desc = document.getElementById('mDesc').value;
        localStorage.setItem('electrwni_db', JSON.stringify(db));
        render(); closeModal();
    }

    function confirmDelete() {
        if(confirm("حذف الرابط نهائياً؟")) {
            db.splice(curIdx, 1);
            localStorage.setItem('electrwni_db', JSON.stringify(db));
            render(); closeModal();
        }
    }

    function generatePDF() {
        const container = document.getElementById('pdf-export');
        const pdfBody = document.getElementById('pdfTableBody');
        const dateEl = document.getElementById('pdfDate');
        const now = new Date();
        dateEl.innerText = `طبع بتاريخ: ${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
        
        pdfBody.innerHTML = '';
        db.forEach((item, i) => {
            pdfBody.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td dir="ltr" style="font-size:10px;">${item.url}</td>
                    <td>${item.id}</td>
                    <td>${item.desc}</td>
                    <td>${item.views}</td>
                </tr>`;
        });

        container.style.display = 'block';
        const opt = {
            margin: 10,
            filename: 'Electrwni_Report.pdf',
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(container).set(opt).save().then(() => {
            container.style.display = 'none';
        });
    }

    window.onload = render;
</script>
</body>
</html>
