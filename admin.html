<!-- أضف مكتبات Firebase في نهاية الـ Body قبل الـ Script -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

<script>
    // إعدادات قاعدة البيانات (تحتاج وضع بياناتك من Firebase Console لاحقاً)
    const firebaseConfig = {
        databaseURL: "https://your-project-id.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function add() {
        let n = document.getElementById('n').value;
        let u = document.getElementById('u').value;
        
        if(n && u) {
            // حفظ الرقم والرابط في السحابة فوراً
            db.ref('links/' + n).set(u).then(() => {
                alert("تم التحديث العالمي للرقم: " + n);
                location.reload();
            });
        }
    }

    // جلب وعرض الأرقام من السحابة
    db.ref('links').on('value', (snapshot) => {
        const links = snapshot.val() || {};
        let list = document.getElementById('list');
        list.innerHTML = '';
        Object.keys(links).forEach(num => {
            let item = document.createElement('div');
            item.className = 'num-item';
            item.innerText = num;
            item.onclick = () => openControl(num, links[num]);
            list.appendChild(item);
        });
        document.querySelector('.kpi-card strong').innerText = Object.keys(links).length;
    });

    function deleteLink() {
        if(window.currentActive) {
            db.ref('links/' + window.currentActive).remove().then(() => {
                closeControl();
            });
        }
    }
</script>
