<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني | لوحة التحكم</title>
    <style>
        :root {
            --bg-color: #000;
            --card-bg: #1c1c1e;
            --accent-color: #0a84ff;
            --text-color: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2c2c2e;
            color: white;
            box-sizing: border-box;
        }
        /* لوحة المفاتيح الرقمية للحماية */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .num-btn {
            background: #2c2c2e;
            padding: 20px;
            border-radius: 50%;
            text-align: center;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="admin-container" id="adminApp">
    <!-- قسم الحماية -->
    <div id="lockScreen" class="card">
        <h2 style="text-align: center;">رمز الدخول</h2>
        <input type="password" id="pinDisplay" readonly style="text-align: center; font-size: 1.5rem;">
        <div class="numpad">
            <div class="num-btn" onclick="addPin('1')">1</div>
            <div class="num-btn" onclick="addPin('2')">2</div>
            <div class="num-btn" onclick="addPin('3')">3</div>
            <div class="num-btn" onclick="addPin('4')">4</div>
            <div class="num-btn" onclick="addPin('5')">5</div>
            <div class="num-btn" onclick="addPin('6')">6</div>
            <div class="num-btn" onclick="addPin('7')">7</div>
            <div class="num-btn" onclick="addPin('8')">8</div>
            <div class="num-btn" onclick="addPin('9')">9</div>
            <div></div>
            <div class="num-btn" onclick="addPin('0')">0</div>
            <div class="num-btn" onclick="clearPin()" style="color: #ff453a;">C</div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية (مخفية افتراضياً) -->
    <div id="mainDashboard" style="display: none;">
        <div class="header">
            <h1>إلكتروني | الآدمن</h1>
        </div>

        <div class="stat-grid">
            <div class="card">
                <small>إجمالي الروابط</small>
                <div id="totalLinks" style="font-size: 1.5rem; font-weight: bold;">0</div>
            </div>
            <div class="card">
                <small>عدد الزيارات</small>
                <div id="totalClicks" style="font-size: 1.5rem; font-weight: bold;">0</div>
            </div>
        </div>

        <div class="card">
            <h3>إضافة رابط جديد</h3>
            <input type="text" id="linkTitle" placeholder="عنوان الرابط (مثلاً: واتساب)">
            <input type="url" id="linkUrl" placeholder="https://example.com">
            <button class="btn-action" onclick="addNewLink()">حفظ الرابط</button>
        </div>

        <div id="linksList">
            <!-- الروابط المضافة تظهر هنا -->
        </div>
    </div>
</div>

<script>
    let currentPin = "";
    const correctPin = "1234"; // يمكنك تغييره لاحقاً

    function addPin(num) {
        if (currentPin.length < 4) {
            currentPin += num;
            document.getElementById('pinDisplay').value = "*".repeat(currentPin.length);
            if (currentPin === correctPin) {
                unlock();
            }
        }
    }

    function clearPin() {
        currentPin = "";
        document.getElementById('pinDisplay').value = "";
    }

    function unlock() {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('mainDashboard').style.display = 'block';
        loadLinks();
    }

    function addNewLink() {
        const title = document.getElementById('linkTitle').value;
        const url = document.getElementById('linkUrl').value;
        if(title && url) {
            // هنا يتم الربط مع الـ Database أو LocalStorage
            alert('تم حفظ الرابط بنجاح');
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkUrl').value = '';
        }
    }

    function loadLinks() {
        // وظيفة جلب البيانات وعرضها في السجل
        console.log("جارِ تحميل البيانات...");
    }
</script>

</body>
</html>
