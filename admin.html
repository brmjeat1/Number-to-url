    * { margin: 0; padding: 0; box-sizing: border-box; }

/* Auth Gate */
.auth-gate {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 5;
}
.auth-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 44px 40px; max-width: 380px; width: 100%; margin: 20px;
}
.auth-card h1 { font-size: 1.5rem; font-weight: 900; margin-bottom: 6px; }
.auth-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
.auth-card input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; padding: 13px 16px; color: var(--text);
  font-family: 'Tajawal', sans-serif; font-size: 1rem; outline: none;
  margin-bottom: 12px; transition: border-color 0.2s;
}
.auth-card input:focus { border-color: var(--accent); }
.auth-card button {
  width: 100%; background: var(--accent); color: #fff; border: none;
  border-radius: 10px; padding: 13px; font-family: 'Tajawal', sans-serif;
  font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
}
.auth-card button:hover { background: #7d75ff; }

/* Main admin UI */
#adminUI { display: none; }

header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(5,5,8,0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  padding: 16px 32px;
}
.header-logo { font-family: 'Space Mono', monospace; font-size: 1rem; color: var(--accent); }
.header-logo span { color: var(--accent2); }
.header-badge {
  background: rgba(255,77,109,0.15); border: 1px solid rgba(255,77,109,0.3);
  border-radius: 6px; padding: 3px 10px;
  font-size: 0.75rem; color: var(--error); font-weight: 700;
}
header .spacer { flex: 1; }
.logout-btn {
  background: transparent; border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 16px; color: var(--muted);
  font-family: 'Tajawal', sans-serif; font-size: 0.85rem; cursor: pointer;
  transition: all 0.2s;
}
.logout-btn:hover { border-color: var(--error); color: var(--error); }

.admin-wrap {
  max-width: 1200px; margin: 0 auto; padding: 32px;
  position: relative; z-index: 5;
}

.stats-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  margin-bottom: 32px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 20px;
}
.stat-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
.stat-value { font-size: 1.8rem; font-weight: 900; font-family: 'Space Mono', monospace; }
.stat-value.accent { color: var(--accent); }
.stat-value.success { color: var(--success); }
.stat-value.accent2 { color: var(--accent2); }
.stat-value.warning { color: var(--warning); }

.section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 24px; overflow: hidden; }
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px; border-bottom: 1px solid var(--border);
}
.section-header h2 { font-size: 1rem; font-weight: 700; }

table { width: 100%; border-collapse: collapse; }
th {
  text-align: right; padding: 12px 24px;
  font-size: 0.8rem; color: var(--muted); font-weight: 700;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
td { padding: 14px 24px; border-bottom: 1px solid rgba(30,30,48,0.5); font-size: 0.9rem; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.01); }

.badge {
  display: inline-block; padding: 3px 10px; border-radius: 6px;
  font-size: 0.75rem; font-weight: 700;
}
.badge-active { background: rgba(78,204,163,0.15); color: var(--success); }
.badge-inactive { background: rgba(107,107,138,0.15); color: var(--muted); }

.mono { font-family: 'Space Mono', monospace; font-size: 0.82rem; color: var(--accent); }

.action-btn {
  background: transparent; border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 12px;
  font-family: 'Tajawal', sans-serif; font-size: 0.8rem;
  color: var(--muted); cursor: pointer; transition: all 0.2s;
  margin-left: 4px;
}
.action-btn:hover { border-color: var(--error); color: var(--error); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px;
  font-family: 'Tajawal', sans-serif; font-size: 0.85rem; font-weight: 700;
  cursor: pointer; border: none; transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #7d75ff; }

.search-input {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px; color: var(--text);
  font-family: 'Tajawal', sans-serif; font-size: 0.9rem;
  outline: none; width: 220px; transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }

.empty-row td { text-align: center; color: var(--muted); padding: 40px; }

@media (max-width: 900px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  header { padding: 14px 20px; }
  .admin-wrap { padding: 20px; }
}

  <script>
    const ADMIN_PASS = 'admin123'; // في الإنتاج: يُخزن بشكل آمن في الخادم

    function checkAdmin() {
      const pass = document.getElementById('adminPass').value;
      if (pass === ADMIN_PASS) {
        sessionStorage.setItem('adminAuth', '1');
        document.getElementById('authGate').style.display = 'none';
        document.getElementById('adminUI').style.display = 'block';
        loadAdmin();
      } else {
        alert('كلمة المرور غير صحيحة');
      }
    }

    function adminLogout() {
      sessionStorage.removeItem('adminAuth');
      location.reload();
    }

    function getAllUsers() {
      // In production: API call. For demo: localStorage
      const u = localStorage.getItem('elUser');
      return u ? [JSON.parse(u)] : [];
    }

    function loadAdmin() {
      const users = getAllUsers();
      const allLinks = users.flatMap(u => (u.links||[]).map(l => ({...l, username: u.username})));
      const totalClicks = allLinks.reduce((s,l)=>s+(l.clicks||0),0);
      const active = users.filter(u=>(u.links||[]).length>0).length;

      document.getElementById('aUsers').textContent = users.length;
      document.getElementById('aLinks').textContent = allLinks.length;
      document.getElementById('aClicks').textContent = totalClicks;
      document.getElementById('aActive').textContent = active;

      renderUsers();
      renderLinks();
    }

    function renderUsers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const users = getAllUsers().filter(u =>
        !search || u.username.includes(search) || (u.displayName||'').includes(search) || (u.email||'').includes(search)
      );
      const tb = document.getElementById('usersTable');
      if (!users.length) {
        tb.innerHTML = `<tr><td colspan="7" class="empty-row">لا يوجد مستخدمون</td></tr>`;
        return;
      }
      tb.innerHTML = users.map(u => {
        const links = u.links || [];
        const clicks = links.reduce((s,l)=>s+(l.clicks||0),0);
        return `
          <tr>
            <td><span class="mono">@${u.username}</span></td>
            <td>${u.displayName || '—'}</td>
            <td style="color:var(--muted); font-size:0.82rem;">${u.email || '—'}</td>
            <td><span class="mono">${links.length}</span></td>
            <td><span class="mono">${clicks}</span></td>
            <td><span class="badge ${links.length ? 'badge-active' : 'badge-inactive'}">${links.length ? 'نشط' : 'جديد'}</span></td>
            <td>
              <button class="action-btn" onclick="viewUser('${u.username}')">عرض</button>
              <button class="action-btn" onclick="deleteUser('${u.username}')">حذف</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderLinks() {
      const users = getAllUsers();
      const allLinks = users.flatMap(u => (u.links||[]).map(l => ({...l, username: u.username})));
      const tb = document.getElementById('linksTable');
      if (!allLinks.length) {
        tb.innerHTML = `<tr><td colspan="5" class="empty-row">لا توجد روابط</td></tr>`;
        return;
      }
      tb.innerHTML = allLinks.sort((a,b)=>(b.clicks||0)-(a.clicks||0)).map(l => `
        <tr>
          <td><span class="mono">@${l.username}</span></td>
          <td><span class="mono" style="color:var(--accent);">${l.num}</span></td>
          <td>${l.label}</td>
          <td style="direction:ltr; text-align:right; color:var(--muted); font-size:0.8rem; max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${l.url}</td>
          <td><span class="mono" style="color:var(--success);">${l.clicks||0}</span></td>
        </tr>
      `).join('');
    }

    function viewUser(username) {
      window.open('page.html?u=' + username, '_blank');
    }

    function deleteUser(username) {
      if (!confirm(`هل تريد حذف المستخدم @${username}؟`)) return;
      localStorage.removeItem('elUser');
      loadAdmin();
    }

    // Auto-check auth on load
    if (sessionStorage.getItem('adminAuth') === '1') {
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('adminUI').style.display = 'block';
      loadAdmin();
    }
  </script>
