<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم | electrwni</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --ios-blue: #007AFF; --ios-bg: #F2F2F7; --glass: rgba(255, 255, 255, 0.8); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--ios-bg); margin: 0; padding: 10px; color: #000; overflow-x: hidden; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        /* شريط السطر الواحد */
        .compact-toolbar { display: flex; gap: 8px; background: #E9E9EB; padding: 8px; border-radius: 12px; margin-bottom: 20px; align-items: center; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; background: #fff; border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .save-btn { background: var(--ios-blue); color: white; font-weight: bold; padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; }

        /* الشاشات المنبثقة (Overlay) */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: flex-end; }
        .sheet { width: 100%; max-width: 500px; background: var(--ios-bg); border-radius: 20px 20px 0 0; padding: 20px; animation: slideUp 0.3s ease-out; box-sizing: border-box; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* محاكاة اتصال iOS */
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; justify-items: center; padding: 20px 0; }
        .key { width: 60px; height: 60px; background: #E5E5EA; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.2s; }
        .key:active { background: #D1D1D6; }
        .display-num { width: 100%; text-align: center; font-size: 32px; margin-bottom: 15px; min-height: 40px; }

        /* مدخل الرابط الذكي */
        .url-input-area { display: flex; flex-direction: column; gap: 15px; }
        .input-box { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #D1D1D6; font-size: 16px; box-sizing: border-box; }
        .domain-picker { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; }
        .domain-tag { background: #fff; padding: 8px 15px; border-radius: 20px; font-size: 13px; border: 1px solid #D1D1D6; cursor: pointer; white-space: nowrap; }
        .domain-tag.active { background: var(--ios-blue); color: white; border-color: var(--ios-blue); }

        /* الجدول */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 12px 5px; border-bottom: 1px solid #E5E5EA; font-size: 13px; text-align: center; }
        .desc-text { color: var(--ios-blue); cursor: pointer; font-weight: 500; }

        .footer { text-align: center; font-size: 10px; color: #8E8E93; margin-top: 30px; }
    </style>
</head>
<body>

<div class="container">
    <div class="compact-toolbar">
        <button class="tab-btn" onclick="openSheet('numSheet')">🔢 <span id="btnNum">الرقم</span></button>
        <button class="tab-btn" onclick="openSheet('urlSheet')">🔗 <span id="btnUrl">الرابط</span></button>
        <button class="tab-btn" onclick="openSheet('descSheet')">📝 <span id="btnDesc">الوصف</span></button>
        <button class="save-btn" onclick="addLink()">حفظ</button>
    </div>

    <table>
        <tbody id="linksTable"></tbody>
    </table>

    <div class="footer">برمجة إلكتروني | Electrwni & brmjeat1</div>
</div>

<div id="numSheet" class="overlay" onclick="closeSheet(event)">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="display-num" id="keypadDisplay">---</div>
        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div><div class="key" onclick="pressKey('2')">2</div><div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div><div class="key" onclick="pressKey('5')">5</div><div class="key" onclick="pressKey('6')">6</div>
            <div class="key" onclick="pressKey('7')">7</div><div class="key" onclick="pressKey('8')">8</div><div class="key" onclick="pressKey('9')">9</div>
            <div class="key" style="background:none"></div><div class="key" onclick="pressKey('0')">0</div>
            <div class="key" onclick="pressKey('C')" style="font-size:16px; color:red">مسح</div>
        </div>
        <button class="save-btn" style="width:100%" onclick="confirmValue('num')">تم</button>
    </div>
</div>

<div id="urlSheet" class="overlay" onclick="closeSheet(event)">
    <div class="sheet" onclick="event.stopPropagation()">
        <div class="url-input-area">
            <input type="text" id="urlInput" class="input-box" placeholder="اكتب الرابط هنا...">
            <div class="domain-picker">
                <div class="domain-tag" onclick="appendDomain('.com')">.com</div>
                <div class="domain-tag" onclick="appendDomain('.net')">.net</div>
                <div class="domain-tag" onclick="appendDomain('.org')">.org</div>
                <div class="domain-tag" onclick="appendDomain('.edu')">.edu</div>
                <div class="domain-tag" onclick="appendDomain('.me')">.me</div>
            </div>
            <button class="save-btn" style="width:100%" onclick="confirmValue('url')">تم</button>
        </div>
    </div>
</div>

<div id="descSheet" class="overlay" onclick="closeSheet(event)">
    <div class="sheet" onclick="event.stopPropagation()">
        <input type="text" id="descInput" class="input-box" placeholder="وصف الرابط (مثلاً: سناب فلان)">
        <button class="save-btn" style="width:100%; margin-top:15px;" onclick="confirmValue('desc')">تم</button>
    </div>
</div>

<script>
    let currentData = { num: '', url: '', desc: '' };

    function openSheet(id) { document.getElementById(id).style.display = 'flex'; }
    function closeSheet(e) { e.currentTarget.style.display = 'none'; }

    function pressKey(k) {
        let disp = document.getElementById('keypadDisplay');
        if(k === 'C') currentData.num = '';
        else currentData.num += k;
        disp.innerText = currentData.num || '---';
    }

    function appendDomain(d) { document.getElementById('urlInput').value += d; }

    function confirmValue(type) {
        if(type === 'num') document.getElementById('btnNum').innerText = currentData.num || 'الرقم';
        if(type === 'url') {
            currentData.url = document.getElementById('urlInput').value;
            document.getElementById('btnUrl').innerText = 'جاهز ✅';
        }
        if(type === 'desc') {
            currentData.desc = document.getElementById('descInput').value;
            document.getElementById('btnDesc').innerText = 'تم الوصف';
        }
        document.querySelectorAll('.overlay').forEach(o => o.style.display = 'none');
    }

    function addLink() {
        if(!currentData.num || !currentData.url) return alert("أكمل الرقم والرابط!");
        const links = JSON.parse(localStorage.getItem('electrwni_data')) || [];
        links.push({...currentData});
        localStorage.setItem('electrwni_data', JSON.stringify(links));
        location.reload();
    }

    function loadLinks() {
        const links = JSON.parse(localStorage.getItem('electrwni_data')) || [];
        const tableBody = document.getElementById('linksTable');
        tableBody.innerHTML = links.map((item, index) => `
            <tr>
                <td width="20%">#${item.code || item.num}</td>
                <td width="60%"><span class="desc-text" onclick="alert('${item.url}')">${item.desc || 'رابط'}</span></td>
                <td width="20%" onclick="deleteLink(${index})" style="color:red; cursor:pointer;">🗑️</td>
            </tr>
        `).join('');
    }

    function deleteLink(i) {
        if(confirm('حذف؟')) {
            const links = JSON.parse(localStorage.getItem('electrwni_data')) || [];
            links.splice(i, 1);
            localStorage.setItem('electrwni_data', JSON.stringify(links));
            loadLinks();
        }
    }

    window.onload = loadLinks;
</script>
</body>
</html>
