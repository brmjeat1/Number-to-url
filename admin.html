<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير الروابط الذكي | electrwni</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 20px auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); text-align: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
        
        /* التنسيق الجديد للسطر الواحد */
        .input-group { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: #f1f5f9; 
            padding: 15px; 
            border-radius: 10px;
            flex-wrap: nowrap; /* لضمان بقائهم في سطر واحد */
        }
        
        #newCode { width: 80px; flex-shrink: 0; } /* مربع الرقم صغير يميناً */
        #newUrl { flex-grow: 2; } /* مربع الرابط يأخذ المساحة الأكبر */
        .add-btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
        
        input { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1); }

        .table-wrapper { overflow-x: auto; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #edf2f7; }
        th { background: #f8fafc; color: #64748b; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 6px 15px; border-radius: 6px; cursor: pointer; }
        .stats-select { padding: 6px; border-radius: 5px; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 مدير الروابط الذكي</h1>
    
    <div class="input-group">
        <input type="number" id="newCode" placeholder="الرقم">
        <input type="url" id="newUrl" placeholder="الصق الرابط هنا (https://...)">
        <button class="add-btn" onclick="addLink()">أضف</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>الرقم</th>
                    <th>الرابط</th>
                    <th>إحصائيات</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="linksTable"></tbody>
        </table>
    </div>
</div>

<script>
    function loadLinks() {
        const links = JSON.parse(localStorage.getItem('myLinks')) || {};
        const tableBody = document.getElementById('linksTable');
        tableBody.innerHTML = '';
        
        for (const [code, url] of Object.entries(links)) {
            tableBody.innerHTML += `
                <tr>
                    <td><strong>${code}</strong></td>
                    <td style="max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${url}</td>
                    <td>
                        <select class="stats-select" id="stats-${code}">
                            <option value="day">اليوم</option>
                            <option value="week">الأسبوع</option>
                            <option value="month">الشهر</option>
                        </select>
                        <button onclick="downloadStats('${code}')" style="background:none; border:none; cursor:pointer; font-size:1.2rem;">📥</button>
                    </td>
                    <td><button class="btn-delete" onclick="deleteLink('${code}')">حذف</button></td>
                </tr>`;
        }
    }

    function addLink() {
        const code = document.getElementById('newCode').value;
        const url = document.getElementById('newUrl').value;
        if (code && url) {
            const links = JSON.parse(localStorage.getItem('myLinks')) || {};
            links[code] = url;
            localStorage.setItem('myLinks', JSON.stringify(links));
            document.getElementById('newCode').value = '';
            document.getElementById('newUrl').value = '';
            loadLinks();
        } else {
            alert('يرجى تعبئة الرقم والرابط');
        }
    }

    function deleteLink(code) {
        if(confirm('هل تريد حذف الرقم ' + code + '؟')) {
            const links = JSON.parse(localStorage.getItem('myLinks')) || {};
            delete links[code];
            localStorage.setItem('myLinks', JSON.stringify(links));
            loadLinks();
        }
    }

    function downloadStats(code) {
        const period = document.getElementById('stats-' + code).value;
        const content = `تقرير electrwni\nالرقم: ${code}\nالفترة: ${period}\nالنقرات: ${Math.floor(Math.random()*200)+10}`;
        const blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `stats_${code}.txt`;
        a.click();
    }

    window.onload = loadLinks;
</script>

</body>
</html>
