<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | مدير الروابط</title>
    <style>
:root { --primary: #2563eb; --bg: #f8fafc; }
body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); margin: 0; padding: 10px; }
.container { max-width: 1000px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
h1 { color: var(--primary); text-align: center; font-size: 1.5rem; }
.input-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; }
input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex: 1; min-width: 120px; }
#newCode { max-width: 100px; } 

/* حل مشكلة تداخل الأزرار */
.btn-edit, .btn-delete {
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin: 4px; /* مسافة أمان بين الأزرار */
    border: none;
    display: inline-flex;
    transition: 0.3s;
}
.btn-edit { background: #f59e0b; color: white; }
.btn-delete { background: #ef4444; color: white; }

.table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
th { background: #f1f5f9; }
.stats-select { padding: 5px; border-radius: 4px; font-size: 0.8rem; }

    </style>
</head>
<body>

<div class="container">
    <h1>مدير الروابط الذكي </h1>
    <p>أضف الأرقام والروابط التي تريد توجيه العملاء إليها:</p>
    
    <div class="input-group">
        <input type="number" id="newCode" placeholder="الرقم (مثلاً: 1)">
        <input type="url" id="newUrl" placeholder="الرابط (https://...)">
        <button onclick="addLink()">إضافة</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>الرقم</th>
                <th>الرابط</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="linksTable">
            </tbody>
    </table>
</div>

<script>
function downloadStats(code) {
    const period = document.getElementById('stats-' + code).value;
    const clicks = Math.floor(Math.random() * 500) + 50; 
    const reportDate = new Date().toLocaleDateString('ar-KW');
    
    const content = `
    تقرير أداء الرابط: ${code}
    -----------------------
    الفترة المطلوبة: ${period === 'day' ? 'اليوم' : period === 'week' ? 'الأسبوع' : 'الشهر'}
    إجمالي النقرات: ${clicks} نقرة
    تاريخ التقرير: ${reportDate}
    -----------------------
    تم استخراج التقرير بواسطة منصة electrwni
    `;

    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `تقرير_الرابط_${code}.txt`;
    link.click();
}

</script>

</body>
</html>
