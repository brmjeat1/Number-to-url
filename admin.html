<script>
    function loadLinks() {
        const links = JSON.parse(localStorage.getItem('myLinksData')) || [];
        const tableBody = document.getElementById('linksTable');
        tableBody.innerHTML = '';
        
        links.forEach((item, index) => {
            tableBody.innerHTML += `
                <tr>
                    <td><strong>${item.code}</strong></td>
                    <td class="url-cell">
                        <span class="url-truncated" onclick="toggleUrl(${index})">${item.url}</span>
                        <div id="expanded-${index}" class="url-expanded">
                            ${item.url}
                            <div class="action-links">
                                <a href="javascript:void(0)" onclick="toggleUrl(${index})">إغلاق</a>
                                <a href="${item.url}" target="_blank">انتقال</a>
                            </div>
                        </div>
                    </td>
                    <td style="color:#64748b;">${item.desc || '-'}</td>
                    <td>
                        <select class="stats-select" id="stats-${index}" style="width:100%; padding:5px; border-radius:4px; border:1px solid #ddd;">
                            <option value="يومي">تقرير: اليوم</option>
                            <option value="أسبوعي">تقرير: الأسبوع</option>
                            <option value="شهري">تقرير: الشهر</option>
                            <option value="سنوي">تقرير: السنة</option>
                            <option value="شامل">كل الوقت</option>
                        </select>
                    </td>
                    <td>
                        <button class="pdf-btn" onclick="downloadPDF(${index})" style="background:#fff; border:1px solid #ccc; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;">تنزيل PDF</button>
                        <button class="btn-delete" onclick="deleteLink(${index})" style="color:red; background:none; border:none; cursor:pointer; font-size:11px; display:block; margin:5px auto; text-decoration:underline;">حذف</button>
                    </td>
                </tr>`;
        });
    }
    // بقية الدوال (addLink, toggleUrl, deleteLink) تبقى كما هي
</script>
