<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>electrwni | لوحة التحكم</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg-color: #f4f7f6; --card-bg: #ffffff; --text-color: #333333; --primary: #000000; --accent: #555555; --border-color: #e0e0e0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .header .brand { font-size: 24px; font-weight: bold; color: var(--primary); }
        .header .user-info { font-size: 16px; color: var(--accent); display: flex; align-items: center; gap: 15px; }
        .logout-btn { background: #ff4d4d; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .main-container { max-width: 1100px; margin: 0 auto; }
        .form-card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; }
        .btn-pdf { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; margin-bottom: 15px; }
        .table-container { background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px; border-bottom: 1px solid var(--border-color); }
        th { background-color: #fafafa; color: var(--accent); font-weight: 600; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; text-decoration: none; display: inline-block; font-size: 13px; }
        .btn-go { background-color: #007bff; color: white; }
        .btn-view { background-color: #17a2b8; color: white; margin-right: 3px; }
        .btn-edit { background-color: #ffc107; color: #333; margin-right: 3px; }
        .btn-delete { background-color: #dc3545; color: white; margin-right: 3px; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background-color: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; position: relative; }
        .close-modal { position: absolute; top: 15px; left: 15px; font-size: 24px; cursor: pointer; color: #aaa; }
        #protected-content { display: none; }
    </style>
</head>
<body>
    <div id="protected-content" class="main-container">
        <div class="header">
            <div class="brand">electrwni | إلكتروني</div>
            <div class="user-info">
                <span>مرحباً: <strong id="user-display-name">جاري التحميل...</strong></span>
                <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>
        <div class="form-card">
            <h3>إضافة توجيه رقمي جديد</h3>
            <div class="form-grid">
                <input type="number" id="input-number" placeholder="الرقم الافتراضي">
                <input type="url" id="input-url" placeholder="الرابط الموجه إليه">
                <input type="text" id="input-desc" placeholder="الوصف أو اسم الجهة">
            </div>
            <button class="btn-submit" onclick="addNewLink()">حفظ البيانات التوجيهية</button>
        </div>
        <button class="btn-pdf" onclick="exportToPDF()">🖨️ طباعة السجلات كـ PDF</button>
        <div class="table-container" id="pdf-table-area">
            <table>
                <thead>
                    <tr><th>الرقم</th><th>الوصف</th><th>الرابط الوجهة</th><th>الإجراءات</th></tr>
                </thead>
                <tbody id="data-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="editModal" class="modal" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-content">
            <span class="close-modal" onclick="closeEditModal()">&times;</span>
            <h3>تعديل البيانات الرقمية</h3>
            <input type="hidden" id="edit-key">
            <div style="margin-bottom:15px;"><label>الرابط:</label><input type="url" id="edit-url"></div>
            <div style="margin-bottom:20px;"><label>الوصف:</label><input type="text" id="edit-desc"></div>
            <div style="display:flex; gap:10px;">
                <button class="btn-submit" onclick="saveEditedLink()" style="background:#007bff;">حفظ التعديلات</button>
                <button class="btn-submit" id="modal-delete-btn" style="background:#dc3545;">حذف</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a",
            measurementId: "G-LCCGHWKH87"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('protected-content').style.display = 'block';
                if (user.displayName && user.displayName.trim() !== "") {
                    document.getElementById('user-display-name').innerText = user.displayName;
                } else {
                    document.getElementById('user-display-name').innerText = user.email.split('@')[0];
                }
                fetchTableData();
            } else {
                window.location.href = "login.html";
            }
        });

        function fetchTableData() {
            const tableBody = document.getElementById('data-table-body');
            db.ref('links').on('value', (snapshot) => {
                tableBody.innerHTML = "";
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const numberKey = childSnapshot.key;
                        const data = childSnapshot.val();
                        let targetUrl = typeof data === 'object' ? data.url : data;
                        let description = typeof data === 'object' && data.description ? data.description : "لا يوجد وصف";

                        const row = `
                            <tr>
                                <td><strong>${numberKey}</strong></td>
                                <td>${description}</td>
                                <td><span style="color:#007bff;">${targetUrl}</span></td>
                                <td>
                                    <a href="${targetUrl}" target="_blank" class="action-btn btn-go">اذهب</a>
                                    <button class="action-btn btn-view" onclick="alert('الرابط:\\n' + '${targetUrl}')">مشاهدة</button>
                                    <button class="action-btn btn-edit" onclick="openEditModal('${numberKey}', '${targetUrl}', '${description}')">تعديل</button>
                                    <button class="action-btn btn-delete" onclick="deleteLink('${numberKey}')">حذف</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                } else {
                    tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">لا توجد بيانات.</td></tr>`;
                }
            });
        }

        function addNewLink() {
            const number = document.getElementById('input-number').value.trim();
            const url = document.getElementById('input-url').value.trim();
            const desc = document.getElementById('input-desc').value.trim();
            if (!number || !url) { alert("أدخل الرقم والرابط!"); return; }
            db.ref('links/' + number).set({ url: url, description: desc ? desc : "لا يوجد وصف" }).then(() => {
                document.getElementById('input-number').value = ""; document.getElementById('input-url').value = ""; document.getElementById('input-desc').value = "";
            });
        }

        function openEditModal(key, url, desc) {
            document.getElementById('edit-key').value = key; document.getElementById('edit-url').value = url; document.getElementById('edit-desc').value = desc;
            document.getElementById('modal-delete-btn').onclick = function() { deleteLink(key); closeEditModal(); };
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }
        function closeModalOnOutsideClick(e) { if(e.target.id === 'editModal') closeEditModal(); }

        function saveEditedLink() {
            const key = document.getElementById('edit-key').value;
            const url = document.getElementById('edit-url').value.trim();
            const desc = document.getElementById('edit-desc').value.trim();
            db.ref('links/' + key).update({ url: url, description: desc }).then(() => { closeEditModal(); });
        }

        function deleteLink(key) { if (confirm("حذف الرقم " + key + "؟")) { db.ref('links/' + key).remove(); } }
        function exportToPDF() { html2pdf().set({ margin: 10, filename: 'report.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(document.getElementById('pdf-table-area')).save(); }
        function logout() { auth.signOut().then(() => { window.location.href = "login.html"; }); }
    </script>
</body>
</html>
