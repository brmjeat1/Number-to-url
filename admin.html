<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إلكتروني | Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        :root {
            --primary-blue: #00224d;
            --accent-blue: #0056D2;
            --bg-light: #f4f7f6;
            --white: #ffffff;
            --yellow: #ffcc00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .admin-container {
            width: 100%;
            max-width: 800px;
            background: var(--white);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        header {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--yellow);
        }

        .content { padding: 30px; }

        .form-group {
            background: #eef2f7;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Cairo';
        }

        #inID { width: 100px; }
        #inURL { flex-grow: 1; }

        button {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background: var(--primary-blue); }

        .list-section h2 {
            color: var(--primary-blue);
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-right: 4px solid var(--yellow);
            padding-right: 10px;
        }

        .link-table { width: 100%; border-collapse: collapse; }
        .link-table th, .link-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        .btn-delete { background: #ff4d4d; padding: 5px 15px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="admin-container">
        <header>
            <h1>لوحة إدارة الروابط - Electrwni</h1>
        </header>

        <div class="content">
            <div class="form-group">
                <input type="number" id="inID" placeholder="الرقم">
                <input type="url" id="inURL" placeholder="أدخل الرابط كاملاً">
                <button onclick="saveLink()">حفظ الرابط</button>
            </div>

            <div class="list-section">
                <h2>الروابط المسجلة حالياً</h2>
                <table class="link-table">
                    <thead>
                        <tr>
                            <th>الرقم</th>
                            <th>الرابط</th>
                            <th>الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('electrwni_links')) || [];

        function render() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = db.map((item, index) => `
                <tr>
                    <td><strong>${item.id}</strong></td>
                    <td><a href="${item.url}" target="_blank">${item.url}</a></td>
                    <td><button class="btn-delete" onclick="remove(${index})">حذف</button></td>
                </tr>
            `).join('');
        }

        function saveLink() {
            const id = document.getElementById('inID').value;
            const url = document.getElementById('inURL').value;

            if(id && url) {
                db.push({id, url});
                localStorage.setItem('electrwni_links', JSON.stringify(db));
                render();
                document.getElementById('inID').value = '';
                document.getElementById('inURL').value = '';
            } else {
                alert("يرجى تعبئة الخانات");
            }
        }

        function remove(idx) {
            db.splice(idx, 1);
            localStorage.setItem('electrwni_links', JSON.stringify(db));
            render();
        }

        render();
    </script>
</body>
</html>
