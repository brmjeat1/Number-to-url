<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>لوحة الإدارة — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4ff;--text:#0f1535;--text2:#3a4270;--accent:#3d5af1;--accent2:#c9a961;--border:rgba(100,130,255,0.18);--surface:#ffffff;--muted:#7b84b0;--error:#e8436a;}
[data-theme="dark"]{--bg:#050810;--text:#e8eeff;--text2:#a0aad0;--accent:#6c8fff;--accent2:#d9c08a;--border:rgba(100,130,255,0.16);--surface:rgba(12,18,45,0.9);--muted:#5a6490;--error:#ff6584;}
*{margin:0;padding:0;box-sizing:border-box;touch-action:manipulation;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:1px solid var(--border);background:var(--surface);}
.logo{font-family:'Space Mono',monospace;font-size:1.1rem;color:var(--accent);text-decoration:none;font-weight:700;}
.logo em{color:var(--accent2);}
.nav-right{display:flex;align-items:center;gap:12px;}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:0.85rem;transition:transform .15s;}
.btn:active{transform:scale(0.96);}
.btn-primary{background:var(--accent);color:#fff;}
.container{max-width:1200px;margin:0 auto;padding:40px 20px;}
h1{font-size:2rem;margin-bottom:10px;}
.subtitle{color:var(--muted);margin-bottom:30px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;}
.stat-num{font-size:2rem;font-weight:900;color:var(--accent);}
.stat-label{color:var(--muted);font-size:0.85rem;margin-top:6px;}
.search-box{margin-bottom:20px;}
input{width:100%;max-width:400px;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:'Tajawal',sans-serif;background:var(--surface);color:var(--text);outline:none;}
input:focus{border-color:var(--accent);}
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
th,td{padding:14px;text-align:right;border-bottom:1px solid var(--border);}
th{font-weight:900;background:rgba(100,130,255,0.08);}
tr:last-child td{border:none;}
.user-link{color:var(--accent);text-decoration:none;font-weight:700;}
.badge{display:inline-block;padding:4px 10px;border-radius:100px;font-size:0.75rem;font-weight:700;}
.badge-ok{background:rgba(10,184,122,0.2);color:#0ab87a;}
.footer{text-align:center;color:var(--muted);font-size:0.8rem;margin-top:60px;padding-top:20px;border-top:1px solid var(--border);}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">electrwni<em>.link</em></a>
  <div class="nav-right">
    <button class="btn btn-primary" onclick="logout()">خروج</button>
  </div>
</nav>

<div class="container">
  <h1>لوحة الإدارة</h1>
  <p class="subtitle">إدارة المستخدمين والإحصائيات</p>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="totalUsers">0</div>
      <div class="stat-label">المستخدمين</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="totalLinks">0</div>
      <div class="stat-label">الروابط</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="totalClicks">0</div>
      <div class="stat-label">الضغطات</div>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="البحث عن مستخدم..." oninput="filterUsers()">
  </div>

  <table>
    <thead>
      <tr>
        <th>المستخدم</th>
        <th>الاسم</th>
        <th>البريد</th>
        <th>الروابط</th>
        <th>الضغطات</th>
        <th>التاريخ</th>
        <th>الحالة</th>
      </tr>
    </thead>
    <tbody id="usersList"></tbody>
  </table>

  <div class="footer">
    <p>© 2026 electrwni.link Admin Panel</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

const ADMIN_PASS='Electrwni@2026!';
let allUsers=[];

async function checkAuth(){
  const pass=prompt('كلمة المرور:');
  if(pass!==ADMIN_PASS){alert('كلمة المرور خاطئة');window.location.href='index.html';return;}
  loadData();
}

async function loadData(){
  try{
    const snap=await db.collection('users').get();
    allUsers=snap.docs.map(d=>d.data());
    const totalLinks=allUsers.reduce((s,u)=>s+(u.links||[]).length,0);
    const totalClicks=allUsers.reduce((s,u)=>s+(u.links||[]).reduce((ss,l)=>ss+(l.clicks||0),0),0);
    document.getElementById('totalUsers').textContent=allUsers.length;
    document.getElementById('totalLinks').textContent=totalLinks;
    document.getElementById('totalClicks').textContent=totalClicks;
    renderUsers();
  }catch(e){alert('خطأ: '+e.message);}
}

function renderUsers(){
  const html=allUsers.map(u=>{
    const clicks=(u.links||[]).reduce((s,l)=>s+(l.clicks||0),0);
    const created=u.createdAt?new Date(u.createdAt).toLocaleDateString('ar-SA'):'—';
    return `<tr>
      <td><a href="page.html#${u.username}" target="_blank" class="user-link">${u.username}</a></td>
      <td>${u.displayName||'—'}</td>
      <td style="font-family:'Space Mono',monospace;font-size:0.8rem;direction:ltr;text-align:left;">${u.email||'—'}</td>
      <td>${(u.links||[]).length}</td>
      <td>${clicks}</td>
      <td style="font-size:0.82rem;">${created}</td>
      <td><span class="badge badge-ok">✓ نشط</span></td>
    </tr>`;
  }).join('');
  document.getElementById('usersList').innerHTML=html;
}

function filterUsers(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  if(!q){renderUsers();return;}
  const filtered=allUsers.filter(u=>u.username.includes(q)||u.displayName.toLowerCase().includes(q)||u.email.toLowerCase().includes(q));
  const html=filtered.map(u=>{
    const clicks=(u.links||[]).reduce((s,l)=>s+(l.clicks||0),0);
    const created=u.createdAt?new Date(u.createdAt).toLocaleDateString('ar-SA'):'—';
    return `<tr>
      <td><a href="page.html#${u.username}" target="_blank" class="user-link">${u.username}</a></td>
      <td>${u.displayName||'—'}</td>
      <td style="font-family:'Space Mono',monospace;font-size:0.8rem;direction:ltr;text-align:left;">${u.email||'—'}</td>
      <td>${(u.links||[]).length}</td>
      <td>${clicks}</td>
      <td style="font-size:0.82rem;">${created}</td>
      <td><span class="badge badge-ok">✓ نشط</span></td>
    </tr>`;
  }).join('');
  document.getElementById('usersList').innerHTML=html||'<tr><td colspan="7" style="text-align:center;color:var(--muted);">لا توجد نتائج</td></tr>';
}

function logout(){if(confirm('تسجيل خروج؟')){window.location.href='index.html';}}

checkAuth();
</script>
</body>
</html>
