<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إلكتروني | Admin Secure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        :root { --primary: #0056D2; --bg: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg); display: flex; justify-content: center; padding: 20px; }
        
        /* واجهة القفل */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--primary); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .login-box { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        /* واجهة الإدارة */
        .main-container { width: 100%; max-width: 800px; background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); overflow: hidden; display: none; }
        header { background: #00224d; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #ffcc00; }
        .content { padding: 30px; }
        .section-box { text-align: center; margin-bottom: 25px; }
        .input-group { background: #f1f5f9; padding: 20px; border-radius: 15px; display: flex; gap: 10px; }
        input { padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 0 30px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .link-card { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; }
        .btn-delete { background: #ef4444; color: white; border: none; padding: 5px 15px; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 15px;">دخول المسؤول</h2>
            <input type="password" id="passInput" placeholder="أدخل كلمة المرور" style="width: 100%; margin-bottom: 15px;">
            <button class="btn-add" style="height: 45px; width: 100%;" onclick="checkPass()">دخول</button>
        </div>
    </div>

    <div class="main-container" id="admin-panel">
        <header><h1>لوحة إدارة الروابط | Electrwni</h1></header>
        <div class="content">
            <div class="section-box">
                <img src="https://img.icons8.com/fluency/96/todo-list.png" style="width: 60px;">
                <h2 style="color: var(--primary);">إدارة الروابط</h2>
            </div>
            <div class="input-group">
                <input type="number" id="inID" placeholder="الرقم" style="width: 80px;">
                <input type="url" id="inURL" placeholder="الرابط المستهدف" style="flex-grow: 1;">
                <button class="btn-add" onclick="saveLink()">حفظ</button>
            </div>
            <div id="list" style="margin-top: 30px;"></div>
        </div>
    </div>

    <script>
        // كلمة المرور الافتراضية (يمكنك تغييرها من هنا)
        const MASTER_PASS = "1234"; 

        function checkPass() {
            const val = document.getElementById('passInput').value;
            if(val === MASTER_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                render();
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        let db = JSON.parse(localStorage.getItem('electrwni_links')) || [];

        function render() {
            const list = document.getElementById('list');
            list.innerHTML = db.map((item, index) => `
                <div class="link-card">
                    <span><strong>#${item.id}</strong> - ${item.url}</span>
                    <button class="btn-delete" onclick="remove(${index})">حذف</button>
                </div>
            `).join('');
        }

        function saveLink() {
            const id = document.getElementById('inID').value;
            const url = document.getElementById('inURL').value;
            if(id && url) {
                db.push({id, url});
                localStorage.setItem('electrwni_links', JSON.stringify(db));
                render();
                document.getElementById('inID').value = '';
                document.getElementById('inURL').value = '';
            }
        }

        function remove(idx) {
            db.splice(idx, 1);
            localStorage.setItem('electrwni_links', JSON.stringify(db));
            render();
        }
    </script>
</body>
</html>
