<!DOCTYPE html>

<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة الإدارة — electrwni.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f0f4ff;--bg2:#e8eeff;--surface:rgba(255,255,255,0.9);--surface-solid:#fff;--border:rgba(100,130,255,0.18);--border-strong:rgba(100,130,255,0.35);--accent:#3d5af1;--accent2:#e8436a;--accent-light:rgba(61,90,241,0.09);--text:#0f1535;--text2:#3a4270;--muted:#7b84b0;--glass:rgba(255,255,255,0.7);--success:#0ab87a;--error:#e8436a;--shadow:0 6px 28px rgba(61,90,241,0.09);}
    [data-theme="dark"]{--bg:#050810;--bg2:#080d1a;--surface:rgba(15,20,50,0.9);--surface-solid:#0f1535;--border:rgba(100,130,255,0.18);--accent:#6c8fff;--accent2:#ff6584;--accent-light:rgba(108,143,255,0.09);--text:#e8eeff;--text2:#a0aad0;--muted:#5a6490;--glass:rgba(15,20,50,0.7);--success:#4ecca3;--error:#ff6584;--shadow:0 6px 28px rgba(0,0,0,0.25);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 700px 500px at 60% 0%,rgba(61,90,241,0.06),transparent);}
    .auth-gate{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:5;}
    .auth-card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:44px 40px;max-width:380px;width:100%;margin:20px;box-shadow:var(--shadow);}
    .auth-card h1{font-size:1.6rem;font-weight:900;margin-bottom:6px;}
    .auth-card p{color:var(--muted);font-size:0.88rem;margin-bottom:28px;}
    .auth-card input{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:1rem;outline:none;margin-bottom:12px;transition:border-color .2s;}
    .auth-card input:focus{border-color:var(--accent);}
    .auth-card button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;}
    #adminUI{display:none;}
    header{position:sticky;top:0;z-index:100;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:14px 32px;}
    .hlogo{font-family:'Space Mono',monospace;font-size:1rem;color:var(--accent);}
    .hlogo em{color:var(--accent2);font-style:normal;}
    .hbadge{background:rgba(232,67,106,0.12);border:1px solid rgba(232,67,106,0.3);border-radius:6px;padding:3px 10px;font-size:0.72rem;font-weight:700;color:var(--error);}
    .spacer{flex:1;}
    .theme-toggle{width:34px;height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:0.9rem;transition:all .2s;}
    .hbtn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--muted);font-family:'Tajawal',sans-serif;font-size:0.82rem;cursor:pointer;transition:all .2s;}
    .hbtn:hover{border-color:var(--error);color:var(--error);}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 24px;position:relative;z-index:5;}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
    .stat-card{background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);}
    .slabel{font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
    .sval{font-size:1.9rem;font-weight:900;font-family:'Space Mono',monospace;}
    .sval.ca{color:var(--accent);} .sval.cs{color:var(--success);} .sval.cb{color:var(--accent2);}
    .section{background:var(--surface);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;margin-bottom:22px;overflow:hidden;box-shadow:var(--shadow);}
    .sec-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
    .sec-head h2{font-size:0.95rem;font-weight:700;}
    .search-in{background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;padding:7px 13px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:0.88rem;outline:none;width:200px;transition:border-color .2s;}
    .search-in:focus{border-color:var(--accent);}
    table{width:100%;border-collapse:collapse;}
    th{text-align:right;padding:10px 20px;font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg2);}
    td{padding:13px 20px;border-bottom:1px solid rgba(100,130,255,0.07);font-size:0.87rem;vertical-align:middle;}
    tr:last-child td{border-bottom:none;}
    .mono{font-family:'Space Mono',monospace;font-size:0.8rem;color:var(--accent);}
    .badge{display:inline-block;padding:3px 9px;border-radius:5px;font-size:0.72rem;font-weight:700;}
    .b-on{background:rgba(10,184,122,0.12);color:var(--success);}
    .b-off{background:rgba(123,132,176,0.12);color:var(--muted);}
    .act-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 11px;font-family:'Tajawal',sans-serif;font-size:0.78rem;color:var(--muted);cursor:pointer;transition:all .2s;margin-left:4px;}
    .act-btn:hover{border-color:var(--error);color:var(--error);}
    .empty-row td{text-align:center;color:var(--muted);padding:36px;}
    .loading{text-align:center;padding:40px;color:var(--muted);}
    @media(max-width:860px){.stats-grid{grid-template-columns:repeat(2,1fr);}header{padding:12px 18px;}.wrap{padding:18px 14px;}}
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
      authDomain: "electrwni-link.firebaseapp.com",
      projectId: "electrwni-link",
      storageBucket: "electrwni-link.firebasestorage.app",
      messagingSenderId: "712490301263",
      appId: "1:712490301263:web:2084210da3f687285ab73a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const PASS = 'admin123';
    let allUsers = [];

    const th = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', th);

    function toggleTheme() {
      const c = document.documentElement.getAttribute('data-theme');
      const n = c === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      localStorage.setItem('theme', n);
      document.getElementById('themeBtn').textContent = n === 'dark' ? '☀️' : '🌙';
    }

    function checkAdmin() {
      if (document.getElementById('adminPass').value === PASS) {
        sessionStorage.setItem('adminAuth', '1');
        showAdminUI();
      } else {
        alert('كلمة المرور غير صحيحة');
      }
    }

    function showAdminUI() {
      document.getElementById('authGate').style.display = 'none';
      document.getElementById('adminUI').style.display = 'block';
      const t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
      loadFromFirebase();
    }

    function adminLogout() { sessionStorage.removeItem('adminAuth'); location.reload(); }

    async function loadFromFirebase() {
      try {
        const snap = await db.collection('users').get();
        allUsers = snap.docs.map(d => d.data());

        const totalLinks   = allUsers.reduce((s,u) => s + (u.links||[]).length, 0);
        const totalClicks  = allUsers.reduce((s,u) => s + (u.links||[]).reduce((c,l) => c + (l.clicks||0), 0), 0);
        const totalSocials = allUsers.reduce((s,u) => s + (u.socials||[]).length, 0);

        document.getElementById('aU').textContent = allUsers.length;
        document.getElementById('aL').textContent = totalLinks;
        document.getElementById('aC').textContent = totalClicks;
        document.getElementById('aS').textContent = totalSocials;

        document.getElementById('usersLoading').style.display = 'none';
        document.getElementById('usersTable').style.display = '';
        renderUsers(allUsers);
        renderLinks(allUsers);
      } catch(e) {
        document.getElementById('usersLoading').textContent = 'خطأ في التحميل: ' + e.message;
      }
    }

    function filterUsers() {
      const q = (document.getElementById('searchIn').value || '').toLowerCase();
      const filtered = q ? allUsers.filter(u =>
        (u.username||'').includes(q) || (u.displayName||'').includes(q) || (u.email||'').includes(q)
      ) : allUsers;
      renderUsers(filtered);
    }

    function renderUsers(users) {
      const tb = document.getElementById('usersBody');
      if (!users.length) { tb.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">لا يوجد مستخدمون</td></tr>'; return; }
      tb.innerHTML = users.map(u => {
        const lks  = u.links || [];
        const scs  = u.socials || [];
        const clks = lks.reduce((s,l) => s + (l.clicks||0), 0);
        return `<tr>
          <td><span class="mono">@${u.username}</span></td>
          <td>${u.displayName || '—'}</td>
          <td style="color:var(--muted);font-size:.8rem;">${u.email || '—'}</td>
          <td><span class="mono">${lks.length}</span></td>
          <td><span class="mono">${scs.length}</span></td>
          <td><span class="mono" style="color:var(--success);">${clks}</span></td>
          <td><span class="badge ${lks.length ? 'b-on' : 'b-off'}">${lks.length ? 'نشط' : 'جديد'}</span></td>
          <td>
            <button class="act-btn" onclick="window.open('page.html#${u.username}','_blank')">عرض</button>
            <button class="act-btn" onclick="delUser('${u.username}')">حذف</button>
          </td>
        </tr>`;
      }).join('');
    }

    function renderLinks(users) {
      const links = users.flatMap(u => (u.links||[]).map(l => ({...l, username: u.username})));
      const tb = document.getElementById('linksBody');
      if (!links.length) { tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">لا توجد روابط</td></tr>'; return; }
      tb.innerHTML = links.sort((a,b) => (b.clicks||0) - (a.clicks||0)).map(l => `
        <tr>
          <td><span class="mono">@${l.username}</span></td>
          <td><span class="mono" style="color:var(--accent);font-size:1.1rem;">${l.num}</span></td>
          <td style="font-weight:700;">${l.label}</td>
          <td style="color:var(--muted);font-size:.8rem;">${l.desc || '—'}</td>
          <td style="direction:ltr;text-align:right;color:var(--muted);font-size:.78rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.url}</td>
          <td><span class="mono" style="color:var(--success);">${l.clicks||0}</span></td>
        </tr>
      `).join('');
    }

    async function delUser(username) {
      if (!confirm('حذف المستخدم @' + username + '؟ هذا لا يمكن التراجع عنه.')) return;
      try {
        await db.collection('users').doc(username).delete();
        allUsers = allUsers.filter(u => u.username !== username);
        renderUsers(allUsers); renderLinks(allUsers);
        alert('تم حذف المستخدم');
      } catch(e) {
        alert('خطأ: ' + e.message);
      }
    }

    if (sessionStorage.getItem('adminAuth') === '1') showAdminUI();
  </script>

</body>
