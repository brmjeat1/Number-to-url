<!-- التعديلات المطلوبة على الهيكل والتنسيق -->
<style>
    /* 1. ضبط السقف ليكون مكتملاً */
    .header-ceiling {
        width: 100%;
        height: 20px;

    }

    /* 2. خدمة الروابط: يمين + زوايا حادة مائلة */
    .links-service {
        display: flex;

        padding: 10px 20px;

    }

    .box-container {
        display: flex;
        flex-direction: column;
        gap: 0px; /* ضمان عدم التداخل */
    }
    .blue-box {
        background-color: #2980b9;
        padding: 20px;
        z-index: 1;
    }
    .yellow-box {
        background-color: #f1c40f;
        margin-top: 0; /* إلغاء التداخل العلوي */
        z-index: 2;
    }

    /* 4. مربع التوقيع في ذيل الصفحة */
    .footer-signature {
        background-color: inherit; /* نفس لون الصفحة */
        color: #ffffff; /* خط أبيض */
        font-weight: bold; /* خط عريض */
        text-align: center;
        padding: 15px;
        border-top: 1px solid rgba(255,255,255,0.1);
    }
