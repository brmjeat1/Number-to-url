<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Electrwni</title>
    <style>
        :root {
            --whatsapp-green: #25D366;
            --bg-gray: #f0f2f5;
            --text-main: #111b21;
            --border-light: #e9edef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(11,20,26,0.08);
        }

        h2 {
            text-align: center;
            font-size: 20px;
            color: #41525d;
            margin-bottom: 25px;
        }

        /* هندسة حقول الإدخال الجديدة */
        .input-box {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 10px;
        }

        input {
            padding: 12px;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #f8f9fa;
        }

        input:focus { border-color: var(--whatsapp-green); }

        .btn-add {
            background-color: var(--whatsapp-green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* الجدول المبسط (رقم، رابط، وصف، مشاهدات) */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }

        th {
            text-align: right;
            font-size: 12px;
            color: #667781;
            padding: 10px;
            border-bottom: 1px solid var(--border-light);
        }

        td {
            padding: 15px 10px;
            font-size: 14px;
            border-bottom: 1px solid #f5f6f6;
        }

        .col-num { width: 10%; color: #8696a0; }
        .col-link { width: 20%; color: #008069; font-weight: 500; }
        .col-desc { width: 55%; color: var(--text-main); }
        .col-views { width: 15%; text-align: center; color: #54656f; font-size: 12px; }

        .truncate {
            display: inline-block;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة التحكم بروابط الموقع</h2>

    <div class="input-form">
        <div class="input-box">
            <input type="number" id="code" placeholder="الرقم">
            <input type="text" id="desc" placeholder="الوصف (اكتب وصف الرابط هنا)">
        </div>
        <div class="row-2">
            <input type="text" id="url" placeholder="الرابط (URL)">
            <button class="btn-add" onclick="addData()">إضافة</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>رقم</th>
                <th>رابط</th>
                <th>وصف</th>
                <th style="text-align: center;">مشاهدات</th>
            </tr>
        </thead>
        <tbody id="dataTable">
            <!-- البيانات ستظهر هنا -->
        </tbody>
    </table>
</div>

<script>
    // وظيفة تلخيص الرابط (Extract Domain)
    function shortenUrl(url) {
        try {
            let domain = new URL(url).hostname;
            return domain.replace('www.', '');
        } catch(e) {
            return "link";
        }
    }

    function addData() {
        const code = document.getElementById('code').value;
        const url = document.getElementById('url').value;
        const desc = document.getElementById('desc').value;
        
        if(!code || !url) return;

        const table = document.getElementById('dataTable');
        const row = table.insertRow(0);

        row.innerHTML = `
            <td class="col-num">${code}</td>
            <td class="col-link"><span class="truncate">${shortenUrl(url)}</span></td>
            <td class="col-desc">${desc || 'بدون وصف'}</td>
            <td class="col-views">0</td>
        `;

        // تصفير الحقول
        document.getElementById('code').value = '';
        document.getElementById('url').value = '';
        document.getElementById('desc').value = '';
    }
</script>

</body>
</html>
