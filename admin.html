<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة تحكم Electrwni</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <style>
        :root { --primary: #0071e3; --bg: #f5f5f7; --danger: #ff3b30; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 800px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-right { font-weight: bold; font-size: 18px; }

        details { background: white; border-radius: 18px; margin-bottom: 12px; border: 1px solid #e5e5e7; overflow: hidden; }
        summary { padding: 18px; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
        .content { padding: 15px; border-top: 1px solid #eee; }

        /* الفلتر */
        .filter-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .filter-chip { padding: 8px 12px; border-radius: 20px; background: #e5e5e7; font-size: 12px; cursor: pointer; }
        .filter-chip.active { background: var(--primary); color: white; }
        
        #customDateBox { display: none; text-align: center; margin-bottom: 15px; gap: 5px; justify-content: center; }
        #customDateBox.active { display: flex; }
        input[type="date"] { padding: 5px; border-radius: 8px; border: 1px solid #ddd; }

        .pdf-btn-red { background: var(--danger); color: white; border: none; padding: 12px 25px; border-radius: 12px; cursor: pointer; display: block; margin: 15px auto; font-weight: bold; }
        
        .table-wrapper { width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid #e5e5e7; }
        table { width: 100%; border-collapse: collapse; background: #fff; table-layout: fixed; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #f0f0f2; font-size: 13px; }
        th { background: #fafafa; color: #86868b; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: 18px; padding: 25px; width: 85%; max-width: 350px; position: relative; }
        .close-x { position: absolute; top: 15px; left: 15px; cursor: pointer; font-weight: bold; }
        .btn-action { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        #pdf-template { display: none; padding: 40px; background: #fff; direction: rtl; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header-top"><div class="brand-right">electrwni | إلكتروني</div></div>

    <details open>
        <summary>إضافة رابط جديد</summary>
        <div class="content">
            <input type="text" id="numInp" placeholder="رقم ID" style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
            <input type="text" id="urlInp" placeholder="https://..." style="width:100%; padding:12px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd;">
            <button class="btn-action" onclick="saveData()">حفظ</button>
        </div>
    </details>

    <details open>
        <summary>الإحصائيات</summary>
        <div class="content">
            <div class="filter-grid">
                <div class="filter-chip active" onclick="updateFilter(this, 'all')">الكل</div>
                <div class="filter-chip" onclick="updateFilter(this, 'day')">اليوم</div>
                <div class="filter-chip" onclick="updateFilter(this, 'week')">الأسبوع</div>
                <div class="filter-chip" onclick="updateFilter(this, 'month')">الشهر</div>
                <div class="filter-chip" onclick="updateFilter(this, 'year')">السنة</div>
                <div class="filter-chip" onclick="updateFilter(this, 'custom')">مخصص</div>
            </div>

            <div id="customDateBox">
                <input type="date" id="dateStart" onchange="renderTable()">
                <input type="date" id="dateEnd" onchange="renderTable()">
            </div>

            <button class="pdf-btn-red" onclick="downloadPDF()">تنزيل PDF</button>

            <div class="table-wrapper">
                <table>
                    <thead><tr><th>الرابط</th><th>ID</th><th>مشاهدة</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </details>
</div>

<!-- Modal -->
<div class="modal-overlay" id="editModal" onclick="this.classList.remove('active')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <span class="close-x" onclick="document.getElementById('editModal').classList.remove('active')">X</span>
        <h3>تعديل الرابط</h3>
        <input type="text" id="editUrl" style="width:100%; padding:10px; margin-bottom:10px;">
        <button class="btn-action" onclick="saveEdit()">تحديث</button>
    </div>
</div>

<!-- PDF -->
<div id="pdf-template">
    <div style="display:flex; justify-content:space-between; border-bottom:2px solid #000; padding-bottom:10px;">
        <strong>electrwni | إلكتروني</strong>
        <span id="pdf-date"></span>
    </div>
    <h2 style="text-align:center">تقرير النقرات الإحصائي</h2>
    <table style="width:100%; border-collapse:collapse; border:1px solid #000; text-align:center;">
        <thead><tr style="background:#eee;"><th>ID</th><th>الرابط</th><th>النقرات</th></tr></thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<script>
    let linksData = JSON.parse(localStorage.getItem('electrwni_db')) || [];
    let currentFilter = 'all';

    function saveData() {
        const num = document.getElementById('numInp').value;
        const url = document.getElementById('urlInp').value;
        if(!num || !url) return alert("أكمل البيانات");
        linksData.push({ id: num, url: url, clicks: [] });
        localStorage.setItem('electrwni_db', JSON.stringify(linksData));
        renderTable();
    }

    function updateFilter(el, type) {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        currentFilter = type;
        document.getElementById('customDateBox').classList.toggle('active', type === 'custom');
        renderTable();
    }

    function getFilteredViews(clicks) {
        if (!clicks) return 0;
        if (currentFilter === 'all') return clicks.length;
        
        const now = moment();
        if (currentFilter === 'custom') {
            const start = document.getElementById('dateStart').value;
            const end = document.getElementById('dateEnd').value;
            if (!start || !end) return clicks.length;
            return clicks.filter(c => moment(c).isBetween(start, end, 'day', '[]')).length;
        }
        
        // الفلاتر الزمنية الثابتة
        const duration = currentFilter === 'day' ? 'day' : currentFilter === 'week' ? 'week' : currentFilter === 'month' ? 'month' : 'year';
        return clicks.filter(c => moment(c).isAfter(now.clone().subtract(1, duration))).length;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        linksData.forEach((item, index) => {
            tbody.innerHTML += `<tr>
                <td><a href="#" onclick="trackClick(${index}); window.open('${item.url}')">رابط</a></td>
                <td><b>${item.id}</b></td>
                <td>${getFilteredViews(item.clicks)}</td>
            </tr>`;
        });
    }

    function trackClick(index) {
        linksData[index].clicks.push(Date.now());
        localStorage.setItem('electrwni_db', JSON.stringify(linksData));
        renderTable();
    }

    function downloadPDF() {
        const pdfBody = document.getElementById('pdf-body');
        const d = new Date();
        document.getElementById('pdf-date').innerText = `طبع بتاريخ: ${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
        
        pdfBody.innerHTML = '';
        linksData.forEach(item => {
            pdfBody.innerHTML += `<tr>
                <td style="border:1px solid #000; padding:8px;">${item.id}</td>
                <td style="border:1px solid #000; padding:8px;">${item.url}</td>
                <td style="border:1px solid #000; padding:8px;">${getFilteredViews(item.clicks)}</td>
            </tr>`;
        });

        const template = document.getElementById('pdf-template');
        template.style.display = 'block';
        html2pdf().from(template).set({
            margin: 10,
            filename: 'Report.pdf',
            html2canvas: { scale: 2, letterRendering: false, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        }).save().then(() => template.style.display = 'none');
    }

    window.onload = renderTable;
</script>
</body>
</html>
