<!DOCTYPE html>

<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إنشاء حساب — electrwni.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f0f4ff;--bg2:#e8eeff;--surface:rgba(255,255,255,0.85);--border:rgba(100,130,255,0.2);--accent:#3d5af1;--accent2:#e8436a;--accent-light:rgba(61,90,241,0.1);--text:#0f1535;--text2:#3a4270;--muted:#7b84b0;--glass:rgba(255,255,255,0.7);--error:#e8436a;--success:#0ab87a;}
    [data-theme="dark"]{--bg:#050810;--bg2:#080d1a;--surface:rgba(15,20,50,0.85);--border:rgba(100,130,255,0.2);--accent:#6c8fff;--accent2:#ff6584;--accent-light:rgba(108,143,255,0.1);--text:#e8eeff;--text2:#a0aad0;--muted:#5a6490;--glass:rgba(15,20,50,0.7);--error:#ff6584;--success:#4ecca3;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .4s,color .4s;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 600px 500px at 30% 10%,rgba(61,90,241,0.07),transparent),radial-gradient(ellipse 500px 400px at 70% 90%,rgba(232,67,106,0.05),transparent);}
    nav{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px);}
    .logo{font-family:'Space Mono',monospace;font-size:1.1rem;color:var(--accent);text-decoration:none;}
    .logo em{color:var(--accent2);font-style:normal;}
    .theme-toggle{width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;}
    .page-wrap{flex:1;position:relative;z-index:5;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:44px 40px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(61,90,241,0.12);}
    .card-header{text-align:center;margin-bottom:32px;}
    .card-header .icon{font-size:2.5rem;margin-bottom:10px;}
    .card-header h1{font-size:1.8rem;font-weight:900;margin-bottom:6px;}
    .card-header p{color:var(--muted);font-size:0.9rem;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:0.85rem;font-weight:700;margin-bottom:7px;color:var(--text2);}
    .input-wrap{position:relative;}
    .input-prefix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:'Space Mono',monospace;font-size:0.8rem;pointer-events:none;white-space:nowrap;}
    input[type=text],input[type=email],input[type=password]{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:0.97rem;outline:none;transition:border-color .2s,box-shadow .2s;}
    input.with-prefix{padding-right:145px;}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
    input.error-inp{border-color:var(--error);}
    .ucheck{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:0.9rem;}
    .hint.err{font-size:0.78rem;color:var(--error);margin-top:5px;display:none;}
    .hint.err.show{display:block;}
    .strength-bars{display:flex;gap:4px;margin-top:7px;}
    .sbar{height:4px;flex:1;border-radius:2px;background:var(--border);transition:background .3s;}
    .sbar.weak{background:var(--error);}
    .sbar.mid{background:orange;}
    .sbar.strong{background:var(--success);}
    .err-banner{background:rgba(232,67,106,0.1);border:1px solid rgba(232,67,106,0.2);color:var(--error);padding:12px;border-radius:10px;font-size:0.88rem;margin-bottom:16px;display:none;text-align:center;font-weight:700;}
    .err-banner.show{display:block;}
    .btn-submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:8px;transition:all .2s;box-shadow:0 4px 20px rgba(61,90,241,0.3);}
    .btn-submit:hover{filter:brightness(1.1);transform:translateY(-1px);}
    .btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .alt-link{text-align:center;font-size:0.88rem;color:var(--muted);margin-top:18px;}
    .alt-link a{color:var(--accent);text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">electrwni<em>.link</em></a>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </nav>
  <div class="page-wrap">
    <div class="card">
      <div class="card-header">
        <div class="icon">✦</div>
        <h1>أنشئ حسابك</h1>
        <p>ابدأ في دقيقة — مجاناً</p>
      </div>
      <div class="err-banner" id="errBanner"></div>
      <form id="signupForm">
        <div class="form-group">
          <label>اسم المستخدم (رابط صفحتك)</label>
          <div class="input-wrap">
            <span class="input-prefix">electrwni.link/</span>
            <input type="text" id="username" class="with-prefix" placeholder="myname" autocomplete="off" oninput="checkUsername(this)">
            <span class="ucheck" id="ucheck"></span>
          </div>
          <div class="hint err" id="unErr">أحرف إنجليزية وأرقام وشرطة فقط (3 أحرف على الأقل)</div>
        </div>
        <div class="form-group">
          <label>الاسم المعروض</label>
          <input type="text" id="displayName" placeholder="اسم مشروعك أو حسابك">
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>كلمة المرور (8 أحرف على الأقل)</label>
          <input type="password" id="password" placeholder="••••••••" oninput="checkStr(this.value)">
          <div class="strength-bars">
            <div class="sbar" id="sb1"></div>
            <div class="sbar" id="sb2"></div>
            <div class="sbar" id="sb3"></div>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="subBtn">إنشاء الحساب ✦</button>
      </form>
      <div class="alt-link">لديك حساب؟ <a href="signin.html">سجل الدخول</a></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
      authDomain: "electrwni-link.firebaseapp.com",
      projectId: "electrwni-link",
      storageBucket: "electrwni-link.firebasestorage.app",
      messagingSenderId: "712490301263",
      appId: "1:712490301263:web:2084210da3f687285ab73a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const t = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
    document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
    function toggleTheme() {
      const c = document.documentElement.getAttribute('data-theme');
      const n = c === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      localStorage.setItem('theme', n);
      document.getElementById('themeBtn').textContent = n === 'dark' ? '☀️' : '🌙';
    }

    const reserved = ['admin','root','api','www','app','demo','test','page','signin','signup','dashboard'];

    function checkUsername(inp) {
      const v = inp.value.trim().toLowerCase();
      const c = document.getElementById('ucheck');
      const e = document.getElementById('unErr');
      if (!v) { c.textContent = ''; inp.classList.remove('error-inp'); e.classList.remove('show'); return; }
      if (!/^[a-z0-9_-]+$/.test(v) || v.length < 3) {
        inp.classList.add('error-inp'); e.classList.add('show'); c.textContent = ''; return;
      }
      inp.classList.remove('error-inp'); e.classList.remove('show');
      if (reserved.includes(v)) { c.textContent = '❌'; c.style.color = 'var(--error)'; }
      else { c.textContent = '✅'; c.style.color = 'var(--success)'; }
    }

    function checkStr(v) {
      const bars = [document.getElementById('sb1'), document.getElementById('sb2'), document.getElementById('sb3')];
      bars.forEach(b => b.className = 'sbar');
      if (!v) return;
      let s = 0;
      if (v.length >= 8) s++;
      if (/[A-Z]/.test(v) || /[0-9]/.test(v)) s++;
      if (/[^A-Za-z0-9]/.test(v)) s++;
      const cls = s === 1 ? 'weak' : s === 2 ? 'mid' : 'strong';
      for (let i = 0; i < s; i++) bars[i].classList.add(cls);
    }

    function showErr(msg) {
      const b = document.getElementById('errBanner');
      b.textContent = msg;
      b.classList.add('show');
    }

    async function handleSignup(e) {
      e.preventDefault();
      document.getElementById('errBanner').classList.remove('show');

      const username    = document.getElementById('username').value.trim().toLowerCase();
      const displayName = document.getElementById('displayName').value.trim();
      const email       = document.getElementById('email').value.trim().toLowerCase();
      const password    = document.getElementById('password').value;

      if (!username || !displayName || !email || !password) { showErr('يرجى تعبئة جميع الحقول'); return; }
      if (reserved.includes(username)) { showErr('اسم المستخدم محجوز، اختر اسماً آخر'); return; }
      if (!/^[a-z0-9_-]+$/.test(username) || username.length < 3) { showErr('اسم المستخدم غير صالح'); return; }
      if (password.length < 8) { showErr('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }

      const btn = document.getElementById('subBtn');
      btn.textContent = '⏳ جاري الإنشاء...';
      btn.disabled = true;

      try {
        // تحقق: هل اسم المستخدم مأخوذ؟
        const existDoc = await db.collection('users').doc(username).get();
        if (existDoc.exists) {
          showErr('اسم المستخدم مأخوذ، اختر اسماً آخر');
          btn.textContent = 'إنشاء الحساب ✦'; btn.disabled = false; return;
        }

        // تحقق: هل الإيميل مسجل مسبقاً؟
        const emailSnap = await db.collection('users').where('email', '==', email).get();
        if (!emailSnap.empty) {
          showErr('هذا البريد الإلكتروني مسجل مسبقاً');
          btn.textContent = 'إنشاء الحساب ✦'; btn.disabled = false; return;
        }

        await db.collection('users').doc(username).set({
          username, displayName, email, password,
          bio: '', links: [], socials: [],
          createdAt: new Date().toISOString()
        });

        localStorage.setItem('elLoggedIn', '1');
        localStorage.setItem('elUserUsername', username);
        btn.textContent = '✅ تم! جاري التوجيه...';
        setTimeout(() => window.location.href = 'dashboard.html', 700);

      } catch (err) {
        showErr('خطأ: ' + err.message);
        btn.textContent = 'إنشاء الحساب ✦'; btn.disabled = false;
      }
    }

    document.getElementById('signupForm').addEventListener('submit', handleSignup);
  </script>

</body>
</html>
