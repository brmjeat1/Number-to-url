<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>إنشاء حساب — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#ffffff;color:#0f1535;min-height:100vh;}
nav{display:flex;align-items:center;justify-content:center;padding:14px 20px;border-bottom:1px solid #e8ecf5;background:#fff;position:relative;}
.nav-logo{font-family:'Space Mono',monospace;font-size:1rem;font-weight:900;color:#3d5af1;text-decoration:none;}
.nav-logo em{color:#f5c518;font-style:normal;}
.nav-displayname{position:absolute;right:20px;font-size:0.85rem;font-weight:700;color:#3a4270;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.container{max-width:450px;margin:0 auto;padding:36px 24px 40px;}
.header{text-align:center;margin-bottom:32px;}
.title{font-size:1.7rem;font-weight:900;margin-bottom:6px;}
.subtitle{font-size:0.88rem;color:#3a4270;}
.form-group{margin-bottom:15px;}
label{display:block;font-size:0.84rem;font-weight:700;margin-bottom:5px;color:#3a4270;}
label .lbl-en{font-size:0.7rem;font-weight:400;color:#9aa2c8;}
input[type=email],input[type=text],input[type=password],textarea{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:0.93rem;outline:none;transition:border .2s;background:#fff;}
textarea{resize:vertical;min-height:72px;}
input:focus,textarea:focus{border-color:#3d5af1;box-shadow:0 0 0 3px rgba(61,90,241,0.1);}
.hint{font-size:0.74rem;color:#9aa2c8;margin-top:4px;}
.btn-signup{width:100%;padding:14px;background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#fff;border:none;border-radius:10px;font-weight:700;font-family:'Tajawal',sans-serif;font-size:0.95rem;cursor:pointer;transition:all .2s;margin-top:20px;}
.btn-signup:active{transform:scale(0.98);}
.btn-signup:disabled{opacity:0.5;cursor:not-allowed;}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:0.85rem;}
.links a{color:#3d5af1;text-decoration:none;font-weight:700;}
.error{background:#fee;border:1px solid #fcc;color:#c33;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;}
.error.show{display:block;}
.success{background:#efe;border:1px solid #cfc;color:#3c3;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;}
.success.show{display:block;}
#displayPreview{display:inline-block;margin-top:6px;padding:3px 10px;background:#f0f4ff;border-radius:20px;font-size:0.78rem;color:#3d5af1;font-weight:700;opacity:0;transition:opacity .2s;}
#displayPreview.show{opacity:1;}
@media(max-width:600px){.container{padding:24px 16px;}}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">electrwni<em>.link</em></a>
  <div class="nav-displayname" id="navDisplayName"></div>
</nav>
<div class="container">
  <div class="header">
    <div class="title">إنشاء حساب <span style="font-size:1rem;font-weight:400;color:#9aa2c8;">Create Account</span></div>
    <div class="subtitle">انضم إلى منصتنا · Join our platform</div>
  </div>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <form onsubmit="return false;">
    <div class="form-group">
      <label>الاسم المعروض <span class="lbl-en">/ Display Name</span></label>
      <input type="text" id="displayName" placeholder="الاسم الذي يراه الجمهور · Public display name" oninput="onDisplayNameInput(this.value)">
      <span id="displayPreview"></span>
    </div>
    <div class="form-group">
      <label>اسم المستخدم <span class="lbl-en">/ Username</span></label>
      <input type="text" id="username" placeholder="a-z, 0-9, _" dir="ltr">
      <div class="hint">رابطك · Your link: electrwni.link/<strong id="usernameHint">اسم_المستخدم</strong></div>
    </div>
    <div class="form-group">
      <label>البريد الإلكتروني <span class="lbl-en">/ Email</span></label>
      <input type="email" id="email" placeholder="your@email.com" dir="ltr">
    </div>
    <div class="form-group">
      <label>كلمة المرور <span class="lbl-en">/ Password</span></label>
      <input type="password" id="password" placeholder="6 أحرف على الأقل · Min 6 chars">
    </div>
    <div class="form-group">
      <label>تأكيد كلمة المرور <span class="lbl-en">/ Confirm Password</span></label>
      <input type="password" id="confirmPassword" placeholder="أعد كتابة الكلمة · Repeat password">
    </div>
    <div class="form-group">
      <label>الوصف / النبذة <span class="lbl-en">/ Bio</span></label>
      <textarea id="bio" placeholder="عرّف نفسك باختصار · Briefly introduce yourself"></textarea>
    </div>
    <button type="button" class="btn-signup" id="submitBtn" onclick="signup()">✨ إنشاء حساب · Create Account</button>
  </form>
  <div class="links">
    <a href="index.html">← العودة · Back</a>
    <a href="signin.html">لدي حساب · Sign In</a>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth();
const db=firebase.firestore();
const reserved=['admin','root','api','www','app','demo','test','page','signin','signup','dashboard','index'];

function onDisplayNameInput(val){
  const prev=document.getElementById('displayPreview');
  const nav=document.getElementById('navDisplayName');
  if(val.trim()){prev.textContent='👤 '+val.trim();prev.classList.add('show');nav.textContent=val.trim();}
  else{prev.classList.remove('show');nav.textContent='';}
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('username').addEventListener('input',function(){
    document.getElementById('usernameHint').textContent=this.value||'اسم_المستخدم';
  });
});
function showError(msg){const el=document.getElementById('error');document.getElementById('success').classList.remove('show');el.textContent=msg;el.classList.add('show');}
function showSuccess(msg){const el=document.getElementById('success');document.getElementById('error').classList.remove('show');el.textContent=msg;el.classList.add('show');}
function showSignupSuccess(username){
  const el=document.getElementById('success');
  document.getElementById('error').classList.remove('show');
  const link='electrwni.link/page.html#'+username;
  el.innerHTML='تم إنشاء حسابك! ✅ افتح بريدك الإلكتروني واضغط رابط التحقق.<br><span style="font-size:0.8rem;">Account created! Check your email for a verification link.</span><div style="margin-top:10px;padding:10px;background:#fff;border-radius:8px;border:1px solid #cfc;"><div style="font-size:0.8rem;color:#3a4270;margin-bottom:4px;">رابط صفحتك · Your page link:</div><div dir="ltr" style="font-family:\'Space Mono\',monospace;font-weight:700;word-break:break-all;">'+link+'</div></div>';
  el.classList.add('show');
}
function setLoading(v){const b=document.getElementById('submitBtn');b.disabled=v;b.textContent=v?'⏳ جاري الإنشاء...':'✨ إنشاء حساب · Create Account';}

async function signup(){
  const displayName=document.getElementById('displayName').value.trim();
  const usernameRaw=document.getElementById('username').value.trim();
  const username=usernameRaw.toLowerCase();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;
  const bio=document.getElementById('bio').value.trim();
  if(!displayName||!username||!email||!password||!confirmPassword){showError('⚠️ يرجى ملء جميع الحقول الإلزامية');return;}
  if(!/^[a-z0-9_]{3,20}$/.test(username)){showError('❌ اسم المستخدم: حروف إنجليزية صغيرة وأرقام و_ فقط (3-20 حرف)');return;}
  if(password.length<6){showError('❌ كلمة المرور 6 أحرف على الأقل');return;}
  if(password!==confirmPassword){showError('❌ كلمتا المرور غير متطابقتين');return;}
  if(reserved.includes(username)){showError('❌ هذا الاسم محجوز');return;}
  setLoading(true);
  try{
    const ud=await db.collection('usernames').doc(username).get();
    if(ud.exists){showError('❌ اسم المستخدم مستخدم بالفعل');setLoading(false);return;}
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    const uid=cred.user.uid;
    await cred.user.sendEmailVerification();
    await db.collection('users').doc(uid).set({uid,username,email,displayName,bio:bio||'',avatar:'',bannerImage:'',links:[],socials:[],phones:[],website:'',mapUrl:'',createdAt:new Date().toISOString()});
    await db.collection('usernames').doc(username).set({uid});
    await auth.signOut();
    showSignupSuccess(username);
    document.querySelector('form').reset();
    document.getElementById('navDisplayName').textContent='';
    document.getElementById('displayPreview').classList.remove('show');
    setLoading(false);
  }catch(e){
    setLoading(false);
    if(e.code==='auth/email-already-in-use')showError('❌ هذا البريد مستخدم بالفعل');
    else if(e.code==='auth/weak-password')showError('❌ كلمة المرور ضعيفة جداً');
    else if(e.code==='auth/invalid-email')showError('❌ صيغة البريد غير صحيحة');
    else showError('❌ خطأ: '+e.message);
  }
}
</script>
</body>
</html>
