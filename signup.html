nav {
  position: relative; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 40px;
  border-bottom: 1px solid var(--border);
}
.logo { font-family: 'Space Mono', monospace; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
.logo span { color: var(--accent2); }

.page-wrap {
  flex: 1; position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 44px 40px;
  width: 100%; max-width: 460px;
  box-shadow: 0 0 60px rgba(108,99,255,0.08);
}

.card-header { text-align: center; margin-bottom: 36px; }
.card-header .icon { font-size: 2.5rem; margin-bottom: 12px; }
.card-header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 8px; }
.card-header p { color: var(--muted); font-size: 0.95rem; }

.form-group { margin-bottom: 20px; }
label {
  display: block;
  font-size: 0.9rem; font-weight: 700;
  margin-bottom: 8px; color: var(--text);
}
.input-wrap { position: relative; }
.input-prefix {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-family: 'Space Mono', monospace; font-size: 0.85rem;
}
input[type=text], input[type=email], input[type=password] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type=text].with-prefix { padding-right: 120px; }
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
}
input.error { border-color: var(--error); }
.hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
.hint.error-msg { color: var(--error); display: none; }
.hint.error-msg.show { display: block; }

.username-check {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  font-size: 0.85rem;
}

.btn-submit {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none; border-radius: 10px;
  padding: 14px;
  font-family: 'Tajawal', sans-serif;
  font-size: 1.05rem; font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  box-shadow: 0 0 20px rgba(108,99,255,0.3);
}
.btn-submit:hover { background: #7d75ff; transform: translateY(-1px); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.divider { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 20px 0; position: relative; }
.divider::before, .divider::after {
  content: ''; position: absolute; top: 50%;
  width: 40%; height: 1px; background: var(--border);
}
.divider::before { right: 0; }
.divider::after { left: 0; }

.signin-link { text-align: center; font-size: 0.9rem; color: var(--muted); }
.signin-link a { color: var(--accent); text-decoration: none; font-weight: 700; }
.signin-link a:hover { text-decoration: underline; }

.terms { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 16px; line-height: 1.5; }
.terms a { color: var(--accent); text-decoration: none; }

.password-strength { margin-top: 8px; display: flex; gap: 4px; }
.strength-bar {
  height: 4px; flex: 1; border-radius: 2px;
  background: var(--border); transition: background 0.3s;
}
.strength-bar.active-weak { background: var(--error); }
.strength-bar.active-medium { background: #ffa500; }
.strength-bar.active-strong { background: var(--success); }

@media (max-width: 520px) {
  .card { padding: 32px 24px; }
  nav { padding: 16px 20px; }
}

  </div>

  <script>
    const taken = ['admin','noon','test','user','electrwni'];

    function checkUsername(input) {
      const val = input.value.trim().toLowerCase();
      const check = document.getElementById('usernameCheck');
      const err = document.getElementById('usernameError');
      if (!val) { check.textContent = ''; return; }
      if (!/^[a-z0-9_-]+$/.test(val)) {
        input.classList.add('error');
        err.classList.add('show');
        check.textContent = '';
        return;
      }
      input.classList.remove('error');
      err.classList.remove('show');
      if (taken.includes(val)) {
        check.textContent = '❌';
        check.style.color = 'var(--error)';
      } else if (val.length >= 3) {
        check.textContent = '✅';
        check.style.color = 'var(--success)';
      } else {
        check.textContent = '';
      }
    }

    function checkStrength(val) {
      const bars = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];
      bars.forEach(b => { b.className = 'strength-bar'; });
      if (!val) return;
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val) || /[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const cls = score === 1 ? 'active-weak' : score === 2 ? 'active-medium' : 'active-strong';
      for (let i = 0; i < score; i++) bars[i].classList.add(cls);
    }

    function handleSignup(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim().toLowerCase();
      const displayName = document.getElementById('displayName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !displayName || !email || !password) {
        alert('يرجى تعبئة جميع الحقول');
        return;
      }
      if (taken.includes(username)) { alert('اسم المستخدم محجوز، اختر اسماً آخر'); return; }
      if (password.length < 8) { alert('كلمة المرور يجب أن تكون 8 أحرف على الأقل'); return; }

      // Save to localStorage as demo
      const user = { username, displayName, email, links: [] };
      localStorage.setItem('elUser', JSON.stringify(user));
      localStorage.setItem('elLoggedIn', '1');

      document.getElementById('submitBtn').textContent = '✅ تم إنشاء الحساب...';
      document.getElementById('submitBtn').disabled = true;
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }
  </script>
