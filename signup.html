<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>إنشاء حساب — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4ff;--bg2:#e8eeff;--surface:rgba(255,255,255,0.85);--border:rgba(100,130,255,0.2);--accent:#3d5af1;--accent2:#e8436a;--accent-light:rgba(61,90,241,0.1);--text:#0f1535;--text2:#3a4270;--muted:#7b84b0;--glass:rgba(255,255,255,0.7);--error:#e8436a;--success:#0ab87a;}
[data-theme="dark"]{--bg:#050810;--bg2:#080d1a;--surface:rgba(15,20,50,0.85);--border:rgba(100,130,255,0.2);--accent:#6c8fff;--accent2:#ff6584;--accent-light:rgba(108,143,255,0.1);--text:#e8eeff;--text2:#a0aad0;--muted:#5a6490;--glass:rgba(15,20,50,0.7);--error:#ff6584;--success:#4ecca3;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 600px 500px at 30% 10%,rgba(61,90,241,0.07),transparent),radial-gradient(ellipse 500px 400px at 70% 90%,rgba(232,67,106,0.05),transparent);}
nav{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px);}
.logo{font-family:'Space Mono',monospace;font-size:1.1rem;color:var(--accent);text-decoration:none;}
.logo em{color:var(--accent2);font-style:normal;}
.theme-toggle{width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;}
.page-wrap{flex:1;position:relative;z-index:5;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
.card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:40px 36px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(61,90,241,0.12);}
.card-header{text-align:center;margin-bottom:26px;}
.card-header .icon{font-size:2.4rem;margin-bottom:8px;}
.card-header h1{font-size:1.7rem;font-weight:900;margin-bottom:6px;}
.card-header p{color:var(--muted);font-size:0.88rem;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{margin-bottom:14px;}
label{display:block;font-size:0.82rem;font-weight:700;margin-bottom:6px;color:var(--text2);}
.input-wrap{position:relative;}
.input-prefix{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:'Space Mono',monospace;font-size:0.78rem;pointer-events:none;white-space:nowrap;}
input[type=text],input[type=email],input[type=password],input[type=tel]{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:0.94rem;outline:none;}
input.with-prefix{padding-right:142px;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
input.error-inp{border-color:var(--error);}
input.ok-inp{border-color:var(--success);}
.ucheck{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:0.9rem;}
.hint{font-size:0.74rem;color:var(--muted);margin-top:4px;}
.hint.err{color:var(--error);display:none;}
.hint.err.show{display:block;}
.strength-bars{display:flex;gap:4px;margin-top:6px;}
.sbar{height:4px;flex:1;border-radius:2px;background:var(--border);}
.sbar.weak{background:var(--error);} .sbar.mid{background:orange;} .sbar.strong{background:var(--success);}
.err-banner{background:rgba(232,67,106,0.1);border:1px solid rgba(232,67,106,0.2);color:var(--error);padding:11px;border-radius:10px;font-size:0.85rem;margin-bottom:14px;display:none;text-align:center;font-weight:700;}
.err-banner.show{display:block;}
.btn-submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-top:6px;box-shadow:0 4px 20px rgba(61,90,241,0.3);}
.btn-submit:hover{filter:brightness(1.1);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}
.alt-link{text-align:center;font-size:0.86rem;color:var(--muted);margin-top:16px;}
.alt-link a{color:var(--accent);text-decoration:none;font-weight:700;}
.section-divider{font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px;border-top:1px solid var(--border);padding-top:14px;}
</style>
</head>
<body>
<nav><a href="index.html" class="logo">electrwni<em>.link</em></a><button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button></nav>
<div class="page-wrap">
  <div class="card">
    <div class="card-header"><div class="icon">✦</div><h1>أنشئ حسابك</h1><p>ابدأ في دقيقة — مجاناً</p></div>
    <div class="err-banner" id="errBanner"></div>
    <form id="signupForm">
      <div class="form-group">
        <label>اسم المستخدم (رابط صفحتك)</label>
        <div class="input-wrap">
          <span class="input-prefix">electrwni.link/</span>
          <input type="text" id="username" class="with-prefix" placeholder="myname" autocomplete="off" oninput="checkUsername(this)">
          <span class="ucheck" id="ucheck"></span>
        </div>
        <div class="hint err" id="unErr">أحرف إنجليزية وأرقام وشرطة فقط (3 أحرف على الأقل)</div>
      </div>
      <div class="form-group"><label>الاسم المعروض</label><input type="text" id="displayName" placeholder="اسمك أو اسم مشروعك"></div>

      <div class="section-divider">بيانات الدخول</div>
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" placeholder="you@example.com" dir="ltr"></div>
      <div class="form-group"><label>رقم الجوال (مع كود الدولة)</label><input type="tel" id="phone" placeholder="+965xxxxxxxx" dir="ltr"></div>

      <div class="form-row">
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••" oninput="checkStr(this.value);checkMatch();">
          <div class="strength-bars"><div class="sbar" id="sb1"></div><div class="sbar" id="sb2"></div><div class="sbar" id="sb3"></div></div>
        </div>
        <div class="form-group">
          <label>تأكيد كلمة المرور</label>
          <input type="password" id="password2" placeholder="••••••••" oninput="checkMatch()">
          <div class="hint err" id="pwErr">كلمتا المرور غير متطابقتين</div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="subBtn">إنشاء الحساب ✦</button>
    </form>
    <div class="alt-link">لديك حساب؟ <a href="signin.html">سجل الدخول</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
  authDomain: "electrwni-link.firebaseapp.com",
  projectId: "electrwni-link",
  storageBucket: "electrwni-link.firebasestorage.app",
  messagingSenderId: "712490301263",
  appId: "1:712490301263:web:2084210da3f687285ab73a"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const t = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', t);
document.getElementById('themeBtn').textContent = t==='dark'?'☀️':'🌙';
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}

const reserved=['admin','root','api','www','app','demo','test','page','signin','signup','dashboard'];

function checkUsername(inp){
  const v=inp.value.trim().toLowerCase();
  const c=document.getElementById('ucheck'); const e=document.getElementById('unErr');
  if(!v){c.textContent='';inp.classList.remove('error-inp','ok-inp');e.classList.remove('show');return;}
  if(!/^[a-z0-9_-]+$/.test(v)||v.length<3){inp.classList.add('error-inp');inp.classList.remove('ok-inp');e.classList.add('show');c.textContent='';return;}
  inp.classList.remove('error-inp');inp.classList.add('ok-inp');e.classList.remove('show');
  c.textContent=reserved.includes(v)?'❌':'✅'; c.style.color=reserved.includes(v)?'var(--error)':'var(--success)';
}
function checkStr(v){
  const bars=[document.getElementById('sb1'),document.getElementById('sb2'),document.getElementById('sb3')];
  bars.forEach(b=>b.className='sbar');
  if(!v)return;
  let s=0; if(v.length>=8)s++; if(/[A-Z]/.test(v)||/[0-9]/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++;
  const cls=s===1?'weak':s===2?'mid':'strong';
  for(let i=0;i<s;i++)bars[i].classList.add(cls);
}
function checkMatch(){
  const p1=document.getElementById('password').value, p2=document.getElementById('password2').value;
  const inp2=document.getElementById('password2'); const err=document.getElementById('pwErr');
  if(!p2){inp2.classList.remove('error-inp','ok-inp');err.classList.remove('show');return;}
  if(p1!==p2){inp2.classList.add('error-inp');inp2.classList.remove('ok-inp');err.classList.add('show');}
  else{inp2.classList.remove('error-inp');inp2.classList.add('ok-inp');err.classList.remove('show');}
}
function showErr(msg){const b=document.getElementById('errBanner');b.textContent=msg;b.classList.add('show');}

async function handleSignup(e){
  e.preventDefault();
  document.getElementById('errBanner').classList.remove('show');

  const username=document.getElementById('username').value.trim().toLowerCase();
  const displayName=document.getElementById('displayName').value.trim();
  const email=document.getElementById('email').value.trim().toLowerCase();
  const phone=document.getElementById('phone').value.trim();
  const password=document.getElementById('password').value;
  const password2=document.getElementById('password2').value;

  if(!username||!displayName||!email||!password||!password2){showErr('يرجى تعبئة جميع الحقول');return;}
  if(reserved.includes(username)){showErr('اسم المستخدم محجوز، اختر اسماً آخر');return;}
  if(!/^[a-z0-9_-]+$/.test(username)||username.length<3){showErr('اسم المستخدم غير صالح');return;}
  if(password.length<8){showErr('كلمة المرور يجب أن تكون 8 أحرف على الأقل');return;}
  if(password!==password2){showErr('كلمتا المرور غير متطابقتين');return;}

  const btn=document.getElementById('subBtn');
  btn.textContent='⏳ جاري الإنشاء...'; btn.disabled=true;

  try{
    const existDoc=await db.collection('users').doc(username).get();
    if(existDoc.exists){showErr('اسم المستخدم مأخوذ، اختر اسماً آخر');btn.textContent='إنشاء الحساب ✦';btn.disabled=false;return;}

    // إنشاء حساب مصادقة Firebase Auth (يتحقق من صحة البريد عند الإرسال)
    const cred=await auth.createUserWithEmailAndPassword(email,password);

    // إرسال رابط تأكيد البريد
    await cred.user.sendEmailVerification();

    // إنشاء وثيقة المستخدم في Firestore
    await db.collection('users').doc(username).set({
      username, displayName, email, phone, authUid:cred.user.uid,
      bio:'', links:[], socials:[], createdAt:new Date().toISOString()
    });

    // تسجيل الخروج فوراً لحين تأكيد البريد
    await auth.signOut();

    btn.textContent='✅ تم! تحقق من بريدك';
    document.getElementById('signupForm').innerHTML =
      `<div style="text-align:center;padding:20px 0;">
        <div style="font-size:2.5rem;margin-bottom:10px;">📧</div>
        <h3 style="margin-bottom:8px;font-weight:900;">تم إنشاء حسابك!</h3>
        <p style="color:var(--muted);font-size:0.9rem;line-height:1.7;">
          أرسلنا رابط تأكيد إلى<br><strong style="color:var(--accent);direction:ltr;display:inline-block;">${email}</strong><br>
          افتح بريدك واضغط على رابط التأكيد، ثم سجّل الدخول.
        </p>
        <a href="signin.html" class="btn-submit" style="display:block;text-decoration:none;text-align:center;margin-top:18px;">الانتقال لتسجيل الدخول →</a>
      </div>`;

  }catch(err){
    let msg='حدث خطأ: '+err.message;
    if(err.code==='auth/email-already-in-use')msg='هذا البريد الإلكتروني مسجل مسبقاً';
    else if(err.code==='auth/invalid-email')msg='البريد الإلكتروني غير صالح';
    else if(err.code==='auth/weak-password')msg='كلمة المرور ضعيفة جداً';
    showErr(msg);
    btn.textContent='إنشاء الحساب ✦'; btn.disabled=false;
  }
}
document.getElementById('signupForm').addEventListener('submit', handleSignup);
</script>
</body>
</html>
