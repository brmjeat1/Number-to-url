<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنضم إلينا | Electrwni</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 2rem; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: rgba(255, 255, 255, 0.1); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }
        a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2>إنشاء حساب جديد</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="signUp()">تسجيل</button>
        <p><a href="login.html">لديك حساب؟ سجل دخولك</a></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-auth-compat.js"></script>
    <script>
        // ضع إعدادات Firebase الخاصة بك هنا
        const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "...", projectId: "..." };
        firebase.initializeApp(firebaseConfig);

        function signUp() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            firebase.auth().createUserWithEmailAndPassword(email, pass)
                .then(() => { window.location.href = 'dashboard.html'; })
                .catch((error) => { alert(error.message); });
        }
    </script>
</body>
</html>
