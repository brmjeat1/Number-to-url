<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني | تسجيل مشترك جديد</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; direction: rtl; }
        .auth-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); max-width: 450px; width: 100%; }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input, select { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #38bdf8; outline: none; background: rgba(255, 255, 255, 0.15); }
        select option { background: #1e293b; color: #fff; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 13px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 700; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #0ea5e9; transform: translateY(-1px); }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .toggle-link a { color: #38bdf8; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="auth-title">إنشاء حساب شريك جديد</h2>
        <form id="auth-form" onsubmit="handleAuth(event)">
            
            <div class="form-group" id="name-group">
                <label>اسم المشترك / المؤسسة الشخصية:</label>
                <input type="text" id="user-name" placeholder="مثال: مشترك إلكتروني رقم 1">
            </div>

            <div class="form-group" id="platform-group">
                <label>اسم المنصة الرقمية (للبايو):</label>
                <input type="text" id="user-platform" placeholder="مثال: بوابة التوجيه الرقمي">
            </div>

            <div class="form-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="user-email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="user-password" required placeholder="••••••••" minlength="6">
            </div>

            <div class="form-group" id="plan-group">
                <label>باقة الاشتراك الحالية:</label>
                <select id="user-plan">
                    <option value="Free">الباقة المجانية (Free)</option>
                    <option value="Pro">الباقة المحترفة (Pro)</option>
                    <option value="Business">باقة الأعمال (Business)</option>
                </select>
            </div>

            <button type="submit" id="submit-btn">سجل حسابك الآن</button>
        </form>

        <div class="toggle-link">
            <a href="#" id="switch-mode-btn" onclick="toggleMode(event)">لديك حساب بالفعل؟ تسجيل الدخول للمنصة</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();
        let isSignUpMode = true;

        function toggleMode(e) {
            e.preventDefault();
            isSignUpMode = !isSignUpMode;
            
            const nameGrp = document.getElementById('name-group');
            const platGrp = document.getElementById('platform-group');
            const planGrp = document.getElementById('plan-group');
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('submit-btn');
            const switchBtn = document.getElementById('switch-mode-btn');

            if (isSignUpMode) {
                title.innerText = "إنشاء حساب شريك جديد";
                btn.innerText = "سجل حسابك الآن";
                switchBtn.innerText = "لديك حساب بالفعل؟ تسجيل الدخول للمنصة";
                nameGrp.style.display = 'block';
                platGrp.style.display = 'block';
                planGrp.style.display = 'block';
            } else {
                title.innerText = "تسجيل الدخول للمنصة";
                btn.innerText = "دخول";
                switchBtn.innerText = "مشترك جديد? إنشاء حساب";
                nameGrp.style.display = 'none';
                platGrp.style.display = 'none';
                planGrp.style.display = 'none';
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('user-email').value.trim();
            const password = document.getElementById('user-password').value;

            if (isSignUpMode) {
                const name = document.getElementById('user-name').value.trim();
                const platform = document.getElementById('user-platform').value.trim();
                const plan = document.getElementById('user-plan').value;

                if(!name || !platform) { alert("يرجى تعبئة حقول الهوية والمنصة!"); return; }

                auth.createUserWithEmailAndPassword(email, password).then((userCredential) => {
                    const uid = userCredential.user.uid;
                    db.ref('users/' + uid + '/profile').set({
                        fullName: name,
                        platformName: platform,
                        subscriptionPlan: plan,
                        createdAt: new Date().toISOString()
                    }).then(() => {
                        window.location.href = "dashboard.html";
                    });
                }).catch(err => alert("فشل التسجيل: " + err.message));

            } else {
                auth.signInWithEmailAndPassword(email, password).then(() => {
                    window.location.href = "dashboard.html";
                }).catch(err => alert("خطأ في بيانات الدخول: " + err.message));
            }
        }
    </script>
</body>
</html>
