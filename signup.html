<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>إنشاء حساب — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#ffffff;color:#0f1535;min-height:100vh;padding:20px;}

.container{max-width:450px;margin:0 auto;padding:40px 24px;}

.header{text-align:center;margin-bottom:40px;}

.logo{
  font-family:'Space Mono',monospace;font-size:1.3rem;
  font-weight:900;color:#3d5af1;margin-bottom:24px;
}

.title{font-size:1.8rem;font-weight:900;margin-bottom:8px;}
.subtitle{font-size:0.9rem;color:#3a4270;}

.form-group{margin-bottom:16px;}

label{
  display:block;font-size:0.85rem;font-weight:700;
  margin-bottom:6px;color:#3a4270;
}

input[type=email],input[type=text],input[type=password]{
  width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;
  border-radius:10px;font-family:'Tajawal',sans-serif;
  font-size:0.95rem;outline:none;transition:border .2s;
}

input:focus{border-color:#3d5af1;box-shadow:0 0 0 3px rgba(61,90,241,0.1);}

.btn-signup{
  width:100%;padding:14px;background:linear-gradient(135deg,#3d5af1,#6c8fff);
  color:#fff;border:none;border-radius:10px;font-weight:700;
  font-family:'Tajawal',sans-serif;font-size:0.95rem;cursor:pointer;
  transition:all .2s;margin-top:24px;
}

.btn-signup:active{transform:scale(0.98);}

.links{
  display:flex;justify-content:space-between;margin-top:16px;
  font-size:0.85rem;
}

.links a{color:#3d5af1;text-decoration:none;font-weight:700;}

.error{
  background:#fee;border:1px solid #fcc;color:#c33;padding:12px;
  border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;
}

.error.show{display:block;}

.success{
  background:#efe;border:1px solid #cfc;color:#3c3;padding:12px;
  border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;
}

.success.show{display:block;}

@media(max-width:600px){
  .container{padding:24px 16px;}
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">electrwni.link</div>
    <div class="title">إنشاء حساب</div>
    <div class="subtitle">انضم إلى منصتنا</div>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <form onsubmit="return false;">
    <div class="form-group">
      <label>البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="your@email.com">
    </div>

    <div class="form-group">
      <label>اسم المستخدم</label>
      <input type="text" id="username" placeholder="اسم فريد (بدون مسافات)">
    </div>

    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="كلمة قوية">
    </div>

    <div class="form-group">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" placeholder="أعد الكلمة">
    </div>

    <button type="button" class="btn-signup" onclick="signup()">✨ إنشاء حساب</button>
  </form>

  <div class="links">
    <a href="index.html">← العودة</a>
    <a href="signin.html">دخول موجود</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth();
const db=firebase.firestore();

const reserved=['admin','root','api','www','app','demo','test','page','signin','signup','dashboard'];

function showError(msg){
  const el=document.getElementById('error');
  el.textContent=msg;
  el.classList.add('show');
}

function showSuccess(msg){
  const el=document.getElementById('success');
  el.textContent=msg;
  el.classList.add('show');
}

async function signup(){
  const email=document.getElementById('email').value.trim();
  const username=document.getElementById('username').value.trim().toLowerCase();
  const password=document.getElementById('password').value;
  const confirmPassword=document.getElementById('confirmPassword').value;

  if(!email||!username||!password||!confirmPassword){
    showError('⚠️ ملء جميع الحقول');return;
  }

  if(password.length<6){showError('❌ كلمة المرور 6 أحرف على الأقل');return;}
  if(password!==confirmPassword){showError('❌ كلمات المرور غير متطابقة');return;}
  if(reserved.includes(username)){showError('❌ هذا الاسم محجوز');return;}

  try{
    // التحقق من وجود username
    const existing=await db.collection('users').where('username','==',username).limit(1).get();
    if(!existing.empty){showError('❌ اسم المستخدم مستخدم بالفعل');return;}

    // إنشاء الحساب
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    
    // إرسال بريد التحقق
    await cred.user.sendEmailVerification();

    // حفظ البيانات في Firestore
    await db.collection('users').doc(username).set({
      username:username,
      email:email,
      authUid:cred.user.uid,
      displayName:username,
      phone:'',
      bio:'',
      location:'',
      avatar:'',
      bannerImage:'',
      links:[],
      socials:[],
      createdAt:new Date().toISOString()
    });

    // تسجيل الخروج
    await auth.signOut();

    showSuccess('✅ تم الإنشاء! تحقق من بريدك للتأكيد');
    setTimeout(()=>{
      document.getElementById('email').value='';
      document.getElementById('username').value='';
      document.getElementById('password').value='';
      document.getElementById('confirmPassword').value='';
      document.getElementById('success').classList.remove('show');
    },3000);
  }catch(e){
    console.error(e);
    if(e.code==='auth/email-already-in-use')showError('❌ البريد مستخدم بالفعل');
    else if(e.code==='auth/weak-password')showError('❌ كلمة المرور ضعيفة جداً');
    else showError('❌ خطأ: '+e.message);
  }
}
</script>
</body>
</html>
