<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
  // إعدادات Firebase الخاصة بمشروعك
  const firebaseConfig = {
    apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
    authDomain: "electrwni-link.firebaseapp.com",
    databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "electrwni-link",
    storageBucket: "electrwni-link.firebasestorage.app",
    messagingSenderId: "712490301263",
    appId: "1:712490301263:web:2084210da3f687285ab73a",
    measurementId: "G-LCCGHWKH87"
  };
  
  // تشغيل Firebase بأمان
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  // إعدادات المظهر بأمان (حتى لا تعطل الصفحة إذا لم يُعثر على الزر)
  const th = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', th);
  
  const tBtn = document.getElementById('themeBtn');
  if(tBtn) tBtn.textContent = th === 'dark' ? '☀️' : '🌙';

  function toggleTheme(){
    const c = document.documentElement.getAttribute('data-theme');
    const n = c === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', n);
    localStorage.setItem('theme', n);
    const btn = document.getElementById('themeBtn');
    if(btn) btn.textContent = n === 'dark' ? '☀️' : '🌙';
  }

  // دالة تسجيل الدخول المحدثة والمصلحة
  async function handleSignin(e){
    if(e && e.preventDefault) e.preventDefault();
    
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    
    if(!emailEl || !passEl) {
      alert('خطأ في التعرف على حقول الإدخال بالصفحة');
      return;
    }

    const email = emailEl.value.trim();
    const password = passEl.value;
    
    if(!email || !password){ alert('يرجى تعبئة جميع الحقول'); return; }
    
    try {
      // البحث في Firestore عن الحساب
      const snapshot = await db.collection('users')
                                 .where('email', '==', email)
                                 .where('password', '==', password)
                                 .get();
                                 
      if(!snapshot.empty) {
        const userDoc = snapshot.docs[0];
        const userData = userDoc.data();
        
        localStorage.setItem('elLoggedIn', '1');
        localStorage.setItem('elUserUsername', userData.username || 'demo'); 
        
        window.location.href = 'dashboard.html';
      } else {
        const errB = document.getElementById('errBanner');
        if(errB) {
          errB.classList.add('show');
        } else {
          alert('خطأ: البريد الإلكتروني أو كلمة المرور غير صحيحة');
        }
      }
    } catch (error) {
      console.error("خطأ أثناء تسجيل الدخول:", error);
      alert("حدث خطأ أثناء الاتصال بالسيرفر السحابي.");
    }
  }

  // دالة الدخول السريع التجريبي المصلحة
  async function quickLogin(){
    const demoUser = {
      username: 'demo',
      displayName: 'حساب تجريبي',
      email: 'demo@electrwni.link',
      password: 'demo',
      bio: 'منصة تجريبية لـ electrwni.link',
      links: [
        {id:1, num:1, label:'العروض', url:'https://example.com/deals', desc:'أحدث العروض', clicks:42},
        {id:2, num:2, label:'تواصل معنا', url:'https://wa.me/966500000000', desc:'واتساب مباشر', clicks:18},
        {id:3, num:3, label:'المتجر', url:'https://example.com', desc:'متجرنا الرئيسي', clicks:73},
      ],
      socials: [
        {id:'ig', platform:'instagram', username:'demo_ig'},
        {id:'tt', platform:'tiktok', username:'demo_tt'},
      ]
    };

    try {
      await db.collection('users').doc('demo').set(demoUser, { merge: true });
    } catch(e) {
      console.warn("تم التخطّي لحفظ محلي نتيجة لقواعد الحماية:", e);
    }
    
    localStorage.setItem('elLoggedIn', '1');
    localStorage.setItem('elUserUsername', 'demo');
    window.location.href = 'dashboard.html';
  }

  // 🚀 ربط تلقائي وذكي فور تحميل الصفحة لضمان تشغيل الأزرار والفورم بدون أخطاء
  window.addEventListener('DOMContentLoaded', () => {
    // ربط استمارة تسجيل الدخول تلقائياً
    const form = document.querySelector('form');
    if(form) {
      form.addEventListener('submit', handleSignin);
    }
    
    // البحث عن زر الدخول السريع وربطه تلقائياً برمجياً في حال لم يكن مفعلاً بالـ HTML
    const allBtns = document.querySelectorAll('button');
    allBtns.forEach(btn => {
      if(btn.textContent.includes('تجريبي') || btn.textContent.includes('السريع') || btn.getAttribute('onclick')?.includes('quickLogin')) {
        btn.removeAttribute('onclick');
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          quickLogin();
        });
      }
    });
  });
</script>
