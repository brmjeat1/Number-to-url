<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تسجيل الدخول — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#ffffff;color:#0f1535;min-height:100vh;padding:20px;}
.container{max-width:450px;margin:0 auto;padding:40px 24px;}
.header{text-align:center;margin-bottom:40px;}
.logo{font-family:'Space Mono',monospace;font-size:1.3rem;font-weight:900;color:#3d5af1;margin-bottom:24px;}
.logo em{color:#f5c518;font-style:normal;}
.title{font-size:1.8rem;font-weight:900;margin-bottom:8px;}
.subtitle{font-size:0.9rem;color:#3a4270;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:0.85rem;font-weight:700;margin-bottom:6px;color:#3a4270;}
label .lbl-en{font-size:0.7rem;font-weight:400;color:#9aa2c8;}
input[type=email],input[type=text],input[type=password]{width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;font-family:'Tajawal',sans-serif;font-size:0.95rem;outline:none;transition:border .2s;}
input:focus{border-color:#3d5af1;box-shadow:0 0 0 3px rgba(61,90,241,0.1);}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#fff;border:none;border-radius:10px;font-weight:700;font-family:'Tajawal',sans-serif;font-size:0.95rem;cursor:pointer;transition:all .2s;margin-top:24px;}
.btn-login:active{transform:scale(0.98);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:0.85rem;}
.links a{color:#3d5af1;text-decoration:none;font-weight:700;}
.error{background:#fee;border:1px solid #fcc;color:#c33;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;}
.error.show{display:block;}
.success{background:#efe;border:1px solid #cfc;color:#3c3;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;}
.success.show{display:block;}
.resend{font-size:0.8rem;color:#3d5af1;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Tajawal',sans-serif;margin-top:8px;}
@media(max-width:600px){.container{padding:24px 16px;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">electrwni<em>.link</em></div>
    <div class="title">تسجيل الدخول <span style="font-size:1rem;font-weight:400;color:#9aa2c8;">Sign In</span></div>
    <div class="subtitle">أدخل بيانات حسابك · Enter your credentials</div>
  </div>
  <div class="error" id="error"></div>
  <div class="success" id="success"></div>
  <form onsubmit="return false;">
    <div class="form-group">
      <label>البريد الإلكتروني أو اسم المستخدم <span class="lbl-en">/ Email or Username</span></label>
      <input type="text" id="emailOrUsername" placeholder="بريدك أو اسم المستخدم" dir="ltr">
    </div>
    <div class="form-group">
      <label>كلمة المرور <span class="lbl-en">/ Password</span></label>
      <input type="password" id="password" placeholder="كلمة المرور · Password">
    </div>
    <button type="button" class="btn-login" id="submitBtn" onclick="login()">🔓 دخول · Sign In</button>
  </form>
  <div class="links">
    <a href="index.html">← العودة · Back</a>
    <a href="signup.html">إنشاء حساب · Sign Up</a>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(function(e){console.error('persistence:',e);});
const db=firebase.firestore();
let unverifiedUser=null;
function showError(msg){document.getElementById('success').classList.remove('show');const el=document.getElementById('error');el.innerHTML=msg;el.classList.add('show');}
function showSuccess(msg){document.getElementById('error').classList.remove('show');const el=document.getElementById('success');el.textContent=msg;el.classList.add('show');}
function setLoading(v){const b=document.getElementById('submitBtn');b.disabled=v;b.textContent=v?'⏳ جاري الدخول...':'🔓 دخول · Sign In';}
async function resendVerification(){if(!unverifiedUser)return;try{await unverifiedUser.sendEmailVerification();showSuccess('✅ تم إرسال رابط تحقق جديد');}catch(e){showError('❌ '+e.message);}}
window.resendVerification=resendVerification;
async function login(){
  const input=document.getElementById('emailOrUsername').value.trim();
  const password=document.getElementById('password').value;
  if(!input||!password){showError('⚠️ يرجى ملء جميع الحقول');return;}
  setLoading(true);
  try{
    let email=input;
    if(!input.includes('@')){
      const idx=await db.collection('usernames').doc(input.toLowerCase()).get();
      if(!idx.exists){showError('❌ اسم المستخدم غير موجود — جرّب الدخول بالبريد الإلكتروني');setLoading(false);return;}
      const ud=await db.collection('users').doc(idx.data().uid).get();
      if(!ud.exists || !ud.data().email){
        // فهرس يتيم: البيانات محذوفة. اطلب الدخول بالبريد لإعادة البناء تلقائياً
        showError('❌ بيانات هذا الاسم ناقصة. الرجاء الدخول بالبريد الإلكتروني مباشرةً وسيُصلَح تلقائياً.');
        setLoading(false);return;
      }
      email=ud.data().email;
    }
    const cred=await auth.signInWithEmailAndPassword(email,password);
    if(!cred.user.emailVerified){
      unverifiedUser=cred.user;
      showError('⚠️ يرجى تأكيد بريدك أولاً. <button class="resend" onclick="resendVerification()">إعادة إرسال</button>');
      await auth.signOut();setLoading(false);return;
    }
    // تعافٍ تلقائي: إن كانت بيانات المستخدم مفقودة، أعد إنشاءها
    const uid=cred.user.uid;
    const ud=await db.collection('users').doc(uid).get();
    if(!ud.exists){
      // استخرج اسم مستخدم من البريد كبداية، وأعد بناء الوثيقة
      const base=(cred.user.email.split('@')[0]||'user').toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,18)||'user';
      let uname=base, n=1;
      // تأكد أن الاسم غير محجوز لمستخدم آخر
      while(true){
        const ex=await db.collection('usernames').doc(uname).get();
        if(!ex.exists || ex.data().uid===uid) break;
        uname=base+(n++);
      }
      await db.collection('users').doc(uid).set({
        uid, username:uname, email:cred.user.email, displayName:cred.user.displayName||uname,
        bio:'', avatar:'', bannerImage:'', links:[], socials:[], phones:[], website:'', mapUrl:'',
        createdAt:new Date().toISOString()
      },{merge:true});
      await db.collection('usernames').doc(uname).set({uid});
      localStorage.setItem('elUserUsername',uname);
      showSuccess('✅ تم استعادة حسابك! جاري الانتقال...');
    } else {
      localStorage.setItem('elUserUsername',ud.data().username);
      showSuccess('✅ تم تسجيل الدخول! جاري الانتقال...');
    }
    setTimeout(()=>{window.location.href='dashboard.html';},900);
  }catch(e){
    setLoading(false);
    if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential')showError('❌ بيانات غير صحيحة · Invalid credentials');
    else if(e.code==='auth/wrong-password')showError('❌ كلمة المرور غير صحيحة');
    else if(e.code==='auth/too-many-requests')showError('❌ محاولات كثيرة، حاول لاحقاً');
    else showError('❌ خطأ: '+e.message);
  }
}
document.addEventListener('keypress',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
