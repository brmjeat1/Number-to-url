<!DOCTYPE html> 
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --primary: #072AC8; 
            --primary-light: #1e46f5;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.7);
            --text-dark: #0f172a !important;
            --text-muted: #475569 !important;
            --success: #16a34a;
        }
        
        body { 
            margin: 0; 
            font-family: 'Tajawal', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            background-color: #f8fafc !important;
            background-image: 
                radial-gradient(at top left, #e0f2fe 0px, transparent 50%),
                radial-gradient(at bottom right, #eff6ff 0px, transparent 50%) !important;
            background-attachment: fixed;
            align-items: center; 
            justify-content: space-between; 
        }

        .header-box { 
            background: rgba(255, 255, 255, 0.7) !important; 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            width: 100%; 
            min-height: 65px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px 0; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.02);
            position: relative;
        }
        
        .header-text { color: var(--text-dark); font-size: 1.1rem; font-weight: 500; }
        .highlight-text { color: var(--primary); font-size: 1.3rem; font-weight: 700; margin: 0 5px; }
        
        /* تنسيق زر صفحة البايو الجديد في مقدمة وأعلى الصفحة */
        .bio-page-nav {
            width: 92%;
            max-width: 520px;
            margin: 20px auto 0 auto;
            display: flex;
            justify-content: flex-start;
        }

        .btn-bio-link {
            background: #ffffff;
            color: var(--primary);
            border: 2px solid rgba(7, 42, 200, 0.15);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(7, 42, 200, 0.04);
        }

        .btn-bio-link:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .white-wrapper { 
            background: var(--glass-bg) !important; 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            width: 92%; 
            max-width: 520px; 
            margin: 15px auto 30px auto; 
            border-radius: 28px; 
            box-shadow: 0 25px 50px rgba(15, 23, 42, 0.06); 
            padding: 35px 28px; 
            box-sizing: border-box; 
        }

        .welcome-title { color: var(--text-dark); font-weight: 700; font-size: 1.35rem; margin-bottom: 6px; text-align: center; }
        .welcome-sub { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; text-align: center; }

        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
        .form-group label { color: var(--text-dark); font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; padding-right: 4px; }

        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i.field-icon { position: absolute; right: 16px; color: #94a3b8; font-size: 1rem; z-index: 10; }

        input { 
            width: 100%; 
            padding: 13px 44px 13px 16px !important; 
            font-size: 0.95rem; 
            font-weight: 500;
            border: 2px solid rgba(7, 42, 200, 0.08) !important; 
            border-radius: 14px !important; 
            outline: none; 
            box-sizing: border-box; 
            background: #ffffff !important;
            color: var(--text-dark) !important;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }
        input:focus { border-color: var(--primary) !important; box-shadow: 0 0 15px rgba(7, 42, 200, 0.08) !important; }

        .nav-buttons { display: flex; gap: 12px; margin-top: 25px; }
        .btn-action { flex: 1; padding: 14px; border-radius: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.3s ease; border: none; }
        .btn-next { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(7, 42, 200, 0.15); }
        .btn-next:hover { background: var(--primary-light); transform: translateY(-1px); }

        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: var(--text-muted); font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(0, 0, 0, 0.06); }
        .divider:not(:empty)::before { margin-left: .5em; } .divider:not(:empty)::after { margin-right: .5em; }

        .btn-google { width: 100%; padding: 12px; background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 14px; color: var(--text-dark); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; transition: all 0.2s; }
        .btn-google:hover { background: #f8fafc; }
        .btn-google svg { width: 18px; height: 18px; }

        .auth-footer { margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); text-align: center; }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 700; }

        .toast-notification { position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%); background: #fff; border: 1px solid var(--glass-border); padding: 15px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; z-index: 9999; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-notification.show { bottom: 40px; }
        .toast-icon { width: 24px; height: 24px; background: var(--success); border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        .footer { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--glass-border); width: 100%; padding: 20px; color: var(--text-muted); font-size: 0.85rem; text-align: center; line-height: 1.7; box-sizing: border-box; font-weight: 500; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="header-text">منصة <span class="highlight-text">إلكتروني</span> الرقمية</div>
    </div>

    <div class="bio-page-nav">
        <button type="button" class="btn-bio-link" onclick="window.location.href='bio.html'">
            <i class="fa-solid fa-user-gear"></i> صفحة البايو
        </button>
    </div>

    <div class="white-wrapper">
        <div class="welcome-title">تسجيل الدخول</div>
        <div class="welcome-sub">مرحباً بك مجدداً في لوحة التحكم الخاصة بك</div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin(); return false;">
            
            <div class="form-group">
                <label>اسم المستخدم أو البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="text" id="loginIdentifier" placeholder="username or email" required autocomplete="off">
                    <i class="fa-solid fa-user field-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                    <i class="fa-solid fa-lock field-icon"></i>
                </div>
            </div>

            <div class="nav-buttons">
                <button type="submit" class="btn-action btn-next">الدخول لمدير الروابط</button>
            </div>

            <div class="divider">أو دخول سريع عبر</div>
            <button type="button" class="btn-google" id="googleLoginBtn">
                <svg viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5.04c1.65 0 3.14.57 4.31 1.69l3.22-3.22C17.58 1.63 14.98 1 12 1 7.35 1 3.4 3.65 1.45 7.5l3.85 2.99C6.23 7.04 8.89 5.04 12 5.04z"/>
                    <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.34H12v4.43h6.44c-.28 1.47-1.11 2.71-2.36 3.55l3.66 2.84c2.14-1.97 3.38-4.88 3.38-8.48z"/>
                    <path fill="#FBBC05" d="M5.3 14.49c-.23-.69-.36-1.42-.36-2.19s.13-1.5.36-2.19L1.45 7.5C.52 9.35 0 11.42 0 13.6s.52 4.25 1.45 6.1l3.85-2.99z"/>
                    <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.92l-3.66-2.84c-1.01.68-2.31 1.08-4.3 1.08-3.11 0-5.77-2-6.7-4.46L1.45 16.85C3.4 20.7 7.35 23 12 23z"/>
                </svg>
                الدخول باستخدام حساب Google
            </button>
            
            <div class="auth-footer">ليس لديك حساب؟ <a href="signup.html">حساب جديد</a></div>
        </form>
    </div>

    <div class="toast-notification" id="loginToast">
        <div class="toast-icon"><i class="fa-solid fa-check"></i></div>
        <div style="font-weight:700; font-size:0.95rem; color:var(--text-dark);">تم تسجيل الدخول بنجاح! جاري الانتقال...</div>
    </div>

    <div class="footer">
        تم تطوير المحرك البرمجي بواسطة Electrwni، الكويت بنية بمعمارية عالية الأداء <br>
        Built with High-Performance Architecture, by electrwni, kuwait
    </div>

    <script>
        document.getElementById('googleLoginBtn').onclick = () => { alert("ارتباط الدخول السريع بجوجل قيد التهيئة برمجياً!"); };

        // دالة الدخول التي تضمن التوجيه الصارم والمباشر إلى مدير الروابط dashboard.html
        function handleLogin() {
            const toast = document.getElementById('loginToast');
            toast.classList.add('show');
            
            const submitBtn = document.querySelector('button[type="submit"]');
            if(submitBtn) submitBtn.disabled = true;

            setTimeout(() => {
                toast.classList.remove('show');
                // توجيه إجباري إلى مدير الروابط لقتل التوجيه الدائري الخاطئ لقاعدة البيانات
                window.location.replace('dashboard.html');
            }, 1800);
        }
    </script>
</body>
</html>
