<!DOCTYPE html>

<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل الدخول — electrwni.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f0f4ff;--bg2:#e8eeff;--surface:rgba(255,255,255,0.85);--border:rgba(100,130,255,0.2);--border-strong:rgba(100,130,255,0.4);--accent:#3d5af1;--accent2:#e8436a;--accent-light:rgba(61,90,241,0.1);--text:#0f1535;--text2:#3a4270;--muted:#7b84b0;--glass:rgba(255,255,255,0.7);--error:#e8436a;}
    [data-theme="dark"]{--bg:#050810;--bg2:#080d1a;--surface:rgba(15,20,50,0.85);--border:rgba(100,130,255,0.2);--border-strong:rgba(100,130,255,0.4);--accent:#6c8fff;--accent2:#ff6584;--accent-light:rgba(108,143,255,0.1);--text:#e8eeff;--text2:#a0aad0;--muted:#5a6490;--glass:rgba(15,20,50,0.7);--error:#ff6584;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .4s,color .4s;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 600px 500px at 30% 10%,rgba(61,90,241,0.07),transparent);}
    nav{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px);}
    .logo{font-family:'Space Mono',monospace;font-size:1.1rem;color:var(--accent);text-decoration:none;}
    .logo em{color:var(--accent2);font-style:normal;}
    .theme-toggle{width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:1rem;cursor:pointer;transition:all .2s;}
    .page-wrap{flex:1;position:relative;z-index:5;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:24px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(61,90,241,0.12);}
    .card-header{text-align:center;margin-bottom:32px;}
    .card-header .icon{font-size:2.5rem;margin-bottom:10px;}
    .card-header h1{font-size:1.8rem;font-weight:900;margin-bottom:6px;}
    .card-header p{color:var(--muted);font-size:0.9rem;}
    .demo-hint{background:var(--accent-light);border:1px dashed var(--border-strong);border-radius:10px;padding:12px 16px;font-size:0.82rem;color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.5;}
    .demo-hint strong{color:var(--accent);}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:0.85rem;font-weight:700;margin-bottom:7px;color:var(--text2);}
    input[type=email],input[type=password]{width:100%;background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:0.97rem;outline:none;transition:border-color .2s,box-shadow .2s;}
    input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
    .error-banner{background:rgba(232,67,106,0.1);border:1px solid rgba(232,67,106,0.3);border-radius:10px;padding:11px 14px;font-size:0.88rem;color:var(--error);margin-bottom:14px;display:none;}
    .error-banner.show{display:block;}
    .btn-submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Tajawal',sans-serif;font-size:1.05rem;font-weight:700;cursor:pointer;margin-top:6px;transition:all .2s;box-shadow:0 4px 20px rgba(61,90,241,0.3);}
    .btn-submit:hover{filter:brightness(1.1);transform:translateY(-1px);}
    .btn-quick{width:100%;background:transparent;border:1.5px solid var(--border);border-radius:10px;padding:12px;font-family:'Tajawal',sans-serif;font-size:0.97rem;color:var(--text2);cursor:pointer;margin-top:10px;transition:all .2s;}
    .btn-quick:hover{border-color:var(--accent);color:var(--accent);}
    .forgot{text-align:left;margin-top:5px;}<br>
    .forgot a{font-size:0.8rem;color:var(--accent);text-decoration:none;}
    .alt-link{text-align:center;font-size:0.88rem;color:var(--muted);margin-top:18px;}
    .alt-link a{color:var(--accent);text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="logo">electrwni<em>.link</em></a>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </nav>
  <div class="page-wrap">
    <div class="card">
      <div class="card-header">
        <div class="icon">🔐</div>
        <h1>أهلاً بعودتك</h1>
        <p>سجّل الدخول لإدارة صفحتك</p>
      </div>
      <div class="demo-hint">للتجربة السريعة: اضغط <strong>دخول تجريبي</strong></div>
      <div class="error-banner" id="errBanner">البريد أو كلمة المرور غير صحيحة</div>
      <form id="signinForm" onsubmit="handleSignin(event)">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="password" placeholder="••••••••">
          <div class="forgot"><a href="#">نسيت كلمة المرور؟</a></div>
        </div>
        <button type="submit" class="btn-submit">تسجيل الدخول</button>
        <button type="button" class="btn-quick" onclick="quickLogin()"> دخول تجريبي</button>
      </form>
      <div class="alt-link">ليس لديك حساب؟ <a href="signup.html">أنشئ حساباً</a></div>
    </div>
  </div>
  <script>
    const th = localStorage.getItem('theme')||'light';
    document.documentElement.setAttribute('data-theme',th);
    document.getElementById('themeBtn').textContent = th==='dark'?'☀️':'🌙';
    function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}

function handleSignin(e){
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){alert('يرجى تعبئة جميع الحقول');return;}
  const stored=JSON.parse(localStorage.getItem('elUser')||'{}');
  if(stored.email&&stored.email===email){localStorage.setItem('elLoggedIn','1');window.location.href='dashboard.html';}
  else{document.getElementById('errBanner').classList.add('show');}
}
function quickLogin(){
  if(!localStorage.getItem('elUser')){
    localStorage.setItem('elUser',JSON.stringify({
      username:'demo',displayName:'حساب تجريبي',email:'demo@electrwni.link',bio:'منصة تجريبية لـ electrwni.link',
      links:[
        {id:1,num:1,label:'العروض',url:'https://example.com/deals',desc:'أحدث العروض',clicks:42},
        {id:2,num:2,label:'تواصل معنا',url:'https://wa.me/966500000000',desc:'واتساب مباشر',clicks:18},
        {id:3,num:3,label:'المتجر',url:'https://example.com',desc:'متجرنا الرئيسي',clicks:73},
      ],
      socials:[
        {id:'ig',platform:'instagram',username:'demo_ig'},
        {id:'tt',platform:'tiktok',username:'demo_tt'},
      ]
    }));
  }
  localStorage.setItem('elLoggedIn','1');
  window.location.href='dashboard.html';
}
