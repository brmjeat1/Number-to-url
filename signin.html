<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني | بوابة الوصول والتسجيل</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; direction: rtl; }
        .auth-container { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #666; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .btn-login { background-color: #000; color: #fff; }
        .btn-register { background-color: #28a745; color: #fff; }
        button:hover { opacity: 0.9; }
        .toggle-text { text-align: center; color: #007bff; cursor: pointer; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="auth-title">تسجيل الدخول للمنصة</h2>
        
        <div class="form-group">
            <label>البريد الإلكتروني:</label>
            <input type="email" id="auth-email" placeholder="name@example.com">
        </div>
        
        <div class="form-group">
            <label>كلمة المرور:</label>
            <input type="password" id="auth-password" placeholder="••••••••">
        </div>

        <button class="btn-login" id="main-btn" onclick="handleAuth()">دخول إلى حسابي</button>
        <button class="btn-register" id="sub-btn" onclick="toggleMode()" style="background:#6c757d;">ليس لديك حساب؟ سجل الآن</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        let isLoginMode = true;

        function toggleMode() {
            isLoginMode = !isLoginMode;
            if(!isLoginMode) {
                document.getElementById('auth-title').innerText = "إنشاء حساب مستخدم جديد";
                document.getElementById('main-btn').innerText = "إتمام التسجيل والاشتراك";
                document.getElementById('main-btn').className = "btn-register";
                document.getElementById('sub-btn').innerText = "لديك حساب بالفعل؟ سجل دخول";
            } else {
                document.getElementById('auth-title').innerText = "تسجيل الدخول للمنصة";
                document.getElementById('main-btn').innerText = "دخول إلى حسابي";
                document.getElementById('main-btn').className = "btn-login";
                document.getElementById('sub-btn').innerText = "ليس لديك حساب؟ سجل الآن";
            }
        }

        function handleAuth() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if(!email || !password) { alert("يرجى ملء كافة الحقول!"); return; }

            if(isLoginMode) {
                auth.signInWithEmailAndPassword(email, password)
                    .then(() => { window.location.href = "dashboard.html"; })
                    .catch(err => alert("خطأ في الدخول: " + err.message));
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(() => { window.location.href = "dashboard.html"; })
                    .catch(err => alert("خطأ أثناء إنشاء الحساب: " + err.message));
            }
        }
    </script>
</body>
</html>
