<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>تسجيل الدخول — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Tajawal',sans-serif;background:#ffffff;color:#0f1535;min-height:100vh;padding:20px;}
.container{max-width:450px;margin:0 auto;padding:40px 24px;}
.header{text-align:center;margin-bottom:40px;}
.logo{font-family:'Space Mono',monospace;font-size:1.3rem;font-weight:900;color:#3d5af1;margin-bottom:24px;}
.title{font-size:1.8rem;font-weight:900;margin-bottom:8px;}
.subtitle{font-size:0.9rem;color:#3a4270;}
.form-group{margin-bottom:16px;}
label{display:block;font-size:0.85rem;font-weight:700;margin-bottom:6px;color:#3a4270;}
input[type=email],input[type=text],input[type=password]{
  width:100%;padding:12px 14px;border:1.5px solid #e0e0e0;border-radius:10px;
  font-family:'Tajawal',sans-serif;font-size:0.95rem;outline:none;transition:border .2s;
}
input:focus{border-color:#3d5af1;box-shadow:0 0 0 3px rgba(61,90,241,0.1);}
.btn-login{
  width:100%;padding:14px;background:linear-gradient(135deg,#3d5af1,#6c8fff);color:#fff;
  border:none;border-radius:10px;font-weight:700;font-family:'Tajawal',sans-serif;
  font-size:0.95rem;cursor:pointer;transition:all .2s;margin-top:24px;
}
.btn-login:active{transform:scale(0.98);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;}
.links{display:flex;justify-content:space-between;margin-top:16px;font-size:0.85rem;}
.links a{color:#3d5af1;text-decoration:none;font-weight:700;}
.error{background:#fee;border:1px solid #fcc;color:#c33;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;}
.error.show{display:block;}
.success{background:#efe;border:1px solid #cfc;color:#3c3;padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.9rem;display:none;}
.success.show{display:block;}
.resend{font-size:0.8rem;color:#3d5af1;text-decoration:underline;cursor:pointer;background:none;border:none;font-family:'Tajawal',sans-serif;margin-top:8px;}
@media(max-width:600px){.container{padding:24px 16px;}}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">electrwni.link</div>
    <div class="title">تسجيل الدخول</div>
    <div class="subtitle">أدخل بيانات حسابك</div>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <form onsubmit="return false;">
    <div class="form-group">
      <label>البريد الإلكتروني أو اسم المستخدم</label>
      <input type="text" id="emailOrUsername" placeholder="بريدك أو اسم المستخدم" dir="ltr">
    </div>
    <div class="form-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="كلمة المرور">
    </div>
    <button type="button" class="btn-login" id="submitBtn" onclick="login()">🔓 دخول</button>
  </form>

  <div class="links">
    <a href="index.html">← العودة</a>
    <a href="signup.html">إنشاء حساب جديد</a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<script>
const cfg={apiKey:"AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",authDomain:"electrwni-link.firebaseapp.com",projectId:"electrwni-link",storageBucket:"electrwni-link.firebasestorage.app",messagingSenderId:"712490301263",appId:"1:712490301263:web:2084210da3f687285ab73a"};
if(!firebase.apps.length)firebase.initializeApp(cfg);
const auth=firebase.auth();
const db=firebase.firestore();

let unverifiedUser=null;

function showError(msg){
  document.getElementById('success').classList.remove('show');
  const el=document.getElementById('error');
  el.innerHTML=msg;
  el.classList.add('show');
}

function showSuccess(msg){
  document.getElementById('error').classList.remove('show');
  const el=document.getElementById('success');
  el.textContent=msg;
  el.classList.add('show');
}

function setLoading(loading){
  const btn=document.getElementById('submitBtn');
  btn.disabled=loading;
  btn.textContent=loading?'⏳ جاري الدخول...':'🔓 دخول';
}

async function resendVerification(){
  if(!unverifiedUser)return;
  try{
    await unverifiedUser.sendEmailVerification();
    showSuccess('✅ تم إرسال رابط تحقق جديد لبريدك');
  }catch(e){
    showError('❌ تعذر إرسال البريد: '+e.message);
  }
}
window.resendVerification=resendVerification;

async function login(){
  const input=document.getElementById('emailOrUsername').value.trim();
  const password=document.getElementById('password').value;

  if(!input||!password){showError('⚠️ يرجى ملء جميع الحقول');return;}

  setLoading(true);

  try{
    let email=input;

    // إذا أدخل username بدل البريد، نبحث عبر مجموعة الفهرسة
    if(!input.includes('@')){
      const username=input.toLowerCase();
      const idxDoc=await db.collection('usernames').doc(username).get();
      if(!idxDoc.exists){
        showError('❌ اسم المستخدم غير موجود');
        setLoading(false);
        return;
      }
      const uid=idxDoc.data().uid;
      const userDoc=await db.collection('users').doc(uid).get();
      if(!userDoc.exists){
        showError('❌ خطأ في بيانات الحساب');
        setLoading(false);
        return;
      }
      email=userDoc.data().email;
    }

    // تسجيل الدخول الفعلي عبر Firebase Auth
    const cred=await auth.signInWithEmailAndPassword(email,password);

    if(!cred.user.emailVerified){
      unverifiedUser=cred.user;
      showError('⚠️ يرجى تأكيد بريدك الإلكتروني أولاً. <button class="resend" onclick="resendVerification()">إعادة إرسال رابط التحقق</button>');
      await auth.signOut();
      setLoading(false);
      return;
    }

    // حفظ username بـ localStorage فقط كـ cache للعرض السريع (الهوية الحقيقية تبقى auth.currentUser.uid)
    const userDoc=await db.collection('users').doc(cred.user.uid).get();
    if(userDoc.exists){
      localStorage.setItem('elUserUsername',userDoc.data().username);
    }

    showSuccess('✅ تم تسجيل الدخول! جاري الانتقال...');
    setTimeout(()=>{window.location.href='dashboard.html';},1000);

  }catch(e){
    console.error(e);
    setLoading(false);
    if(e.code==='auth/user-not-found')showError('❌ المستخدم غير موجود');
    else if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')showError('❌ كلمة المرور غير صحيحة');
    else if(e.code==='auth/invalid-email')showError('❌ صيغة البريد غير صحيحة');
    else if(e.code==='auth/too-many-requests')showError('❌ محاولات كثيرة، حاول لاحقاً');
    else showError('❌ خطأ: '+e.message);
  }
}

document.addEventListener('keypress',e=>{if(e.key==='Enter')login();});
</script>
</body>
</html>
