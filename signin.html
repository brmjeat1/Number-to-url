  <title>تسجيل الدخول — electrwni.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508; --surface: #0d0d14; --border: #1e1e30;
      --accent: #6c63ff; --accent2: #ff6584;
      --text: #e8e8f0; --muted: #6b6b8a; --error: #ff4d6d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 0;
    }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 350px; height: 350px; background: rgba(108,99,255,0.12); top: -80px; left: 50%; transform: translateX(-50%); }

```
nav {
  position: relative; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 40px; border-bottom: 1px solid var(--border);
}
.logo { font-family: 'Space Mono', monospace; font-size: 1.1rem; color: var(--accent); text-decoration: none; }
.logo span { color: var(--accent2); }

.page-wrap {
  flex: 1; position: relative; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  padding: 40px 20px;
}

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 44px 40px;
  width: 100%; max-width: 420px;
  box-shadow: 0 0 60px rgba(108,99,255,0.08);
}

.card-header { text-align: center; margin-bottom: 36px; }
.card-header .icon { font-size: 2.5rem; margin-bottom: 12px; }
.card-header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 8px; }
.card-header p { color: var(--muted); font-size: 0.95rem; }

.form-group { margin-bottom: 20px; }
label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; }

input[type=email], input[type=password] {
  width: 100%; background: var(--bg);
  border: 1px solid var(--border); border-radius: 10px;
  padding: 13px 16px; color: var(--text);
  font-family: 'Tajawal', sans-serif; font-size: 1rem;
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
}

.forgot { text-align: left; margin-top: 6px; }
.forgot a { font-size: 0.82rem; color: var(--accent); text-decoration: none; }

.error-banner {
  background: rgba(255,77,109,0.1);
  border: 1px solid rgba(255,77,109,0.3);
  border-radius: 10px; padding: 12px 16px;
  font-size: 0.9rem; color: var(--error);
  margin-bottom: 16px; display: none;
}
.error-banner.show { display: block; }

.btn-submit {
  width: 100%; background: var(--accent); color: #fff;
  border: none; border-radius: 10px; padding: 14px;
  font-family: 'Tajawal', sans-serif; font-size: 1.05rem; font-weight: 700;
  cursor: pointer; margin-top: 8px; transition: all 0.2s;
  box-shadow: 0 0 20px rgba(108,99,255,0.3);
}
.btn-submit:hover { background: #7d75ff; transform: translateY(-1px); }

.divider { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 20px 0; position: relative; }
.divider::before, .divider::after {
  content: ''; position: absolute; top: 50%;
  width: 42%; height: 1px; background: var(--border);
}
.divider::before { right: 0; }
.divider::after { left: 0; }

.signup-link { text-align: center; font-size: 0.9rem; color: var(--muted); }
.signup-link a { color: var(--accent); text-decoration: none; font-weight: 700; }

/* Demo hint */
.demo-hint {
  background: rgba(108,99,255,0.08);
  border: 1px dashed rgba(108,99,255,0.3);
  border-radius: 10px; padding: 12px 16px;
  font-size: 0.82rem; color: var(--muted);
  margin-bottom: 20px; text-align: center; line-height: 1.5;
}
.demo-hint strong { color: var(--accent); }

@media (max-width: 520px) {
  .card { padding: 32px 24px; }
  nav { padding: 16px 20px; }
}

  </div>

  <script>
    function handleSignin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const stored = JSON.parse(localStorage.getItem('elUser') || '{}');

      if (!email || !password) { alert('يرجى تعبئة جميع الحقول'); return; }
      if (stored.email && stored.email === email) {
        localStorage.setItem('elLoggedIn', '1');
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('errorBanner').classList.add('show');
      }
    }

    function quickLogin() {
      // Demo user
      if (!localStorage.getItem('elUser')) {
        localStorage.setItem('elUser', JSON.stringify({
          username: 'demo',
          displayName: 'حساب تجريبي',
          email: 'demo@electrwni.link',
          links: [
            { id: 1, num: 1, label: 'العروض اليومية', url: 'https://example.com/deals', clicks: 42 },
            { id: 2, num: 2, label: 'تواصل معنا', url: 'https://wa.me/966500000000', clicks: 18 },
            { id: 3, num: 3, label: 'متجرنا', url: 'https://example.com/store', clicks: 73 },
          ]
        }));
      }
      localStorage.setItem('elLoggedIn', '1');
      window.location.href = 'dashboard.html';
    }
  </script>
