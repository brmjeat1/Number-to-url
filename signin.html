<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلكتروني | تسجيل الدخول الذكي</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #fff; margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; align-items: center; direction: rtl; }
        .auth-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); max-width: 400px; width: 100%; }
        h2 { text-align: center; margin-bottom: 20px; color: #10b981; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input { width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #10b981; outline: none; background: rgba(255, 255, 255, 0.15); }
        button { background: #10b981; color: #0f172a; border: none; padding: 13px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: 700; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #059669; transform: translateY(-1px); }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .toggle-link a { color: #10b981; text-decoration: none; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="auth-title">تسجيل حساب بالاسم التجاري</h2>
        <form id="auth-form" onsubmit="handleUsernameAuth(event)">
            
            <div class="form-group">
                <label>اسم المستخدم للمنصة (Username بالإنجليزية):</label>
                <input type="text" id="user-username" required placeholder="مثال: store1">
            </div>

            <div class="form-group" id="fullName-group">
                <label>الاسم الظهوري الكامل للمشترك:</label>
                <input type="text" id="user-fullname" placeholder="مثال: منصة إلكتروني">
            </div>

            <div class="form-group">
                <label>كلمة المرور السريّة:</label>
                <input type="password" id="user-password" required placeholder="••••••••" minlength="6">
            </div>

            <button type="submit" id="submit-btn">إنشاء الحساب الفوري</button>
        </form>

        <div class="toggle-link">
            <a href="#" id="switch-mode-btn" onclick="toggleUsernameMode(event)">لديك اسم مستخدم؟ دخول</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
            authDomain: "electrwni-link.firebaseapp.com",
            databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "electrwni-link",
            storageBucket: "electrwni-link.firebasestorage.app",
            messagingSenderId: "712490301263",
            appId: "1:712490301263:web:2084210da3f687285ab73a"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        const db = firebase.database();
        let isSignUpMode = true;

        function toggleUsernameMode(e) {
            e.preventDefault();
            isSignUpMode = !isSignUpMode;
            
            const nameGrp = document.getElementById('fullName-group');
            const title = document.getElementById('auth-title');
            const btn = document.getElementById('submit-btn');
            const switchBtn = document.getElementById('switch-mode-btn');

            if (isSignUpMode) {
                title.innerText = "تسجيل حساب بالاسم التجاري";
                btn.innerText = "إنشاء الحساب الفوري";
                switchBtn.innerText = "لديك اسم مستخدم؟ دخول";
                nameGrp.style.display = 'block';
            } else {
                title.innerText = "تسجيل الدخول بالـ Username";
                btn.innerText = "تسجيل الدخول كشريك";
                switchBtn.innerText = "مشترك جديد؟ سجل اسمك";
                nameGrp.style.display = 'none';
            }
        }

        function handleUsernameAuth(e) {
            e.preventDefault();
            const username = document.getElementById('user-username').value.trim().toLowerCase();
            const password = document.getElementById('user-password').value;
            
            const dynamicEmail = `${username}@electrwni.link`;

            if (isSignUpMode) {
                const fullname = document.getElementById('user-fullname').value.trim();
                if(!fullname) { alert("يرجى كتابة الاسم الظهوري!"); return; }

                auth.createUserWithEmailAndPassword(dynamicEmail, password).then((userCredential) => {
                    const uid = userCredential.user.uid;
                    db.ref('users/' + uid + '/profile').set({
                        username: username,
                        fullName: fullname,
                        createdAt: new Date().toISOString()
                    }).then(() => {
                        window.location.href = "dashboard.html";
                    });
                }).catch(err => alert("اسم المستخدم مأخوذ أو حدث خطأ: " + err.message));

            } else {
                auth.signInWithEmailAndPassword(dynamicEmail, password).then(() => {
                    window.location.href = "dashboard.html";
                }).catch(err => alert("فشل الدخول، تحقق من اسم المستخدم أو كلمة المرور"));
            }
        }
    </script>
</body>
</html>
