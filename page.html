<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>صفحتك الشخصية — electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;--surface:#f9f9f9;--border:#e8ecf5;
  --accent:#3d5af1;--accent-light:#6c8fff;--accent2:#f5c518;--text:#0f1535;--text2:#3a4270;--muted:#9aa2c8;
  --user-gradient:linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);
}


@media (prefers-color-scheme: dark){
  :root{
    --bg:#15171c;--surface:#1e2128;--border:#2a2e37;
    --text:#f0f2f8;--text2:#b8c0d8;--muted:#7a83a0;
  }
  /* إن اختار صاحب الصفحة خلفية فاتحة، نُبقي السواد متناسقاً عبر طبقة شفافة */
  body{background:var(--bg);}
  .social-btn{background:var(--surface);border-color:var(--border);}
  .contact-card{background:var(--surface);border-color:var(--border);color:var(--text);}
  .overlay-item{background:var(--surface);border-color:var(--border);color:var(--text);}
  .input-box{background:#fff;color:var(--accent);}
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ========== NAVBAR (قسمان: شعار ثابت يسار + زر ذكي يمين) ========== */
nav{
  position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;
  align-items:center;padding:10px 16px;background:#ffffff;
  border-bottom:1px solid #e8ecf5;gap:8px;
}
/* الشعار: ألوان ثابتة وخلفية بيضاء دائماً، لا تتأثر بألوان الموقع */
.logo{font-family:'Space Mono',monospace;font-size:0.95rem;color:#3d5af1;text-decoration:none;font-weight:700;white-space:nowrap;}
.logo em{color:#f5c518;font-style:normal;}
.nav-cta{background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;font-size:0.82rem;font-weight:900;text-decoration:none;white-space:nowrap;text-align:center;border:none;cursor:pointer;font-family:'Tajawal',sans-serif;}
.nav-cta .nav-cta-sub{font-size:0.6rem;font-weight:400;opacity:0.85;display:block;text-align:center;}
/* ========== HERO BANNER ========== */
.hero-banner{
  position:relative;width:100%;height:240px;
  background:var(--user-gradient);
  overflow:hidden;display:flex;align-items:flex-end;justify-content:center;
  background-size:cover;background-position:center;
}
.avatar-container{
  position:relative;z-index:10;margin-top:-60px;margin-bottom:10px;
  display:flex;justify-content:center;
}
.avatar-circle{
  width:120px;height:120px;border-radius:50%;background:var(--surface);
  border:6px solid transparent;display:flex;align-items:center;justify-content:center;
  color:var(--accent);font-weight:900;font-size:2.6rem;overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.15);
}
.avatar-circle img{width:100%;height:100%;object-fit:cover;}

/* ========== CONTENT ========== */
.content{padding:0 24px 30px;max-width:500px;margin:0 auto;}
.profile-info{text-align:center;margin-bottom:30px;}
.profile-name{font-size:1.6rem;font-weight:900;margin-bottom:6px;}
.profile-handle{font-family:'Space Mono',monospace;font-size:0.8rem;color:var(--text2);direction:ltr;margin-bottom:10px;}
.profile-bio{font-size:0.9rem;color:var(--text2);line-height:1.6;}

/* ========== INPUT SECTION ========== */
.input-section{
  background:var(--user-gradient);border-radius:16px;
  padding:24px;margin-bottom:30px;
}
.input-box{
  width:100%;background:#fff;border:2.5px solid #fff;border-radius:12px;
  padding:16px;color:var(--accent);font-size:1.2rem;font-weight:700;
  font-family:'Space Mono',monospace;outline:none;text-align:center;
  margin-bottom:12px;
}
.input-box::placeholder{color:var(--muted);}
.btn-go{
  width:100%;background:#fff;color:var(--accent);border:3px solid var(--bg);border-radius:12px;
  padding:16px;font-size:1rem;font-weight:700;cursor:pointer;
}
.btn-go:active{transform:scale(0.98);}
.error-msg{color:#ffeb3b;font-size:0.85rem;margin-top:8px;text-align:center;display:none;font-weight:700;}
.error-msg.show{display:block;}

/* ========== SECTION TITLE ========== */
.section-title{font-size:1.1rem;font-weight:900;color:var(--accent);text-align:center;margin:32px 0 18px;}

/* ========== SOCIALS ROW ========== */
.socials-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:32px;}

/* أيقونات المنصات الاجتماعية - دائرية */
.social-btn{
  display:flex;align-items:center;justify-content:center;width:64px;height:64px;
  border-radius:50%;background:var(--accent);border:3px solid var(--accent-light);
  text-decoration:none;transition:transform .15s;overflow:hidden;
}
.social-btn:active{transform:scale(0.92);}
.social-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.social-btn svg{width:28px;height:28px;}

/* بطاقات التواصل (أرقام/موقع/خريطة) */
.contact-card{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:14px;
  padding:12px 16px;text-decoration:none;color:var(--text);
  font-weight:700;font-size:0.9rem;transition:transform .15s,box-shadow .15s;
  width:100%;
}
.contact-card:active{transform:scale(0.97);}
.contact-card:hover{box-shadow:0 4px 14px rgba(0,0,0,0.08);}
.contact-card .cc-icon{
  width:38px;height:38px;border-radius:10px;
  background:var(--user-gradient);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:1.1rem;color:#fff;
}
.contact-card .cc-body{flex:1;}
.contact-card .cc-label{font-size:0.75rem;color:var(--muted);margin-bottom:2px;}
.contact-card .cc-value{font-size:0.9rem;font-weight:700;direction:ltr;text-align:right;}

.contacts-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}

/* ========== اخترنا لك / آخر روابط ========== */
.pick-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px;}
.pick-box{
  background:var(--bg);border:2px solid var(--accent);border-radius:12px;
  padding:14px 12px;color:var(--accent);display:flex;align-items:center;justify-content:center;
  min-height:54px;cursor:pointer;width:100%;
  font-family:'Tajawal',sans-serif;transition:transform .15s,filter .15s;
}
.pick-box:active{transform:scale(0.97);filter:brightness(0.95);}
.pick-title{font-size:0.95rem;font-weight:900;text-align:center;line-height:1.4;color:var(--accent);}
.pick-sub{font-size:0.65rem;opacity:0.75;display:block;color:var(--accent);}

/* ========== OVERLAY ========== */
.section-overlay{
  position:fixed;inset:0;background:var(--bg);z-index:250;
  display:none;flex-direction:column;overflow-y:auto;
}
.section-overlay.open{display:flex;}
.section-overlay-header{
  position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 20px;display:flex;align-items:center;gap:12px;z-index:5;
}
.section-overlay-back{
  background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:var(--text);
  padding:4px 8px;font-family:'Tajawal',sans-serif;
}
.section-overlay-title{font-size:1.05rem;font-weight:900;}
.section-overlay-body{padding:20px;max-width:500px;margin:0 auto;width:100%;}
.overlay-list{display:flex;flex-direction:column;gap:8px;}
.overlay-item{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px;text-decoration:none;color:var(--text);font-weight:700;
  display:flex;align-items:center;justify-content:space-between;transition:transform .15s;
}
.overlay-item:active{transform:scale(0.98);}
.overlay-item .ov-num{font-family:'Space Mono',monospace;color:var(--accent);font-weight:900;}

/* ========== FOOTER ========== */
.footer{
  background:#ffffff;
  text-align:center;padding:22px 16px 28px;margin-top:30px;
  margin-left:-24px;margin-right:-24px;margin-bottom:-30px;
}
.footer .psb-text{display:block;color:#3d5af1;font-weight:700;font-size:0.82rem;line-height:1.6;margin-bottom:6px;}
.footer .psb-link{color:#3d5af1;text-decoration:none;font-weight:900;font-size:0.82rem;}


/* ========== EMPTY / LOADING ========== */
.empty-state{text-align:center;padding:30px 20px;color:var(--muted);}
.loading{text-align:center;padding:60px 20px;}

@media(max-width:600px){
  .content{padding:0 16px 20px;}
  .hero-banner{height:200px;}
  .avatar-circle{width:100px;height:100px;font-size:2.2rem;}
  .profile-name{font-size:1.4rem;}
  .social-btn{width:56px;height:56px;border-radius:16px;}
}
</style>
</head>

function arabicToEnglish(s){
  let r='';
  for(const ch of s){
    const code=ch.codePointAt(0);
    if(code>=0x0660&&code<=0x0669){r+=String(code-0x0660);continue;}
    if(code>=0x06F0&&code<=0x06F9){r+=String(code-0x06F0);continue;}
    if(code>=0x0966&&code<=0x096F){r+=String(code-0x0966);continue;}
    if(code>=0x09E6&&code<=0x09EF){r+=String(code-0x09E6);continue;}
    r+=ch;
  }
  return r;
}

function detectPlat(url){
  const u=(url||'').toLowerCase();
  if(u.includes('instagram'))return 'instagram';
  if(u.includes('x.com')||u.includes('twitter'))return 'twitter';
  if(u.includes('snapchat'))return 'snapchat';
  if(u.includes('tiktok'))return 'tiktok';
  if(u.includes('wa.me')||u.includes('whatsapp'))return 'whatsapp';
  if(u.includes('t.me')||u.includes('telegram'))return 'telegram';
  if(u.includes('youtube')||u.includes('youtu.be'))return 'youtube';
  if(u.includes('facebook')||u.includes('fb.com'))return 'facebook';
  if(u.includes('linkedin'))return 'linkedin';
  if(u.includes('wechat')||u.includes('weixin'))return 'wechat';
  if(u.includes('imessage')||u.startsWith('sms:'))return 'imessage';
  return null;
}
function platColor(id){
  return {instagram:'#E1306C',twitter:'#000000',snapchat:'#FFC400',tiktok:'#000000',whatsapp:'#25D366',telegram:'#229ED9',youtube:'#FF0000',facebook:'#1877F2',linkedin:'#0A66C2',wechat:'#07C160',imessage:'#34DA50'}[id]||'var(--accent)';
}

let userLinks=[];

async function init(){
  const u=getUsername();
  if(!u){show404('لم يتم تحديد المستخدم في الرابط');return;}
  const username=u.toLowerCase();
  try{
    const idxDoc=await db.collection('usernames').doc(username).get();
    if(!idxDoc.exists){show404('الحساب "'+username+'" غير مسجّل في النظام. تأكد من اسم المستخدم.');return;}
    const uid=idxDoc.data().uid;
    setupSmartNav(uid);
    const ref=db.collection('users').doc(uid);
    const docSnap=await ref.get();
    if(!docSnap.exists){show404('بيانات الحساب "'+username+'" غير موجودة (uid: '+uid+').');return;}
    const user=docSnap.data();
    userLinks=(user.links||[]).map(l=>({...l,num:l.num??l.number,label:l.label??l.title})).sort((a,b)=>(a.num||0)-(b.num||0));
    render(user);
    ref.onSnapshot(d=>{
      if(d.exists){
        const updated=d.data();
        userLinks=(updated.links||[]).map(l=>({...l,num:l.num??l.number,label:l.label??l.title})).sort((a,b)=>(a.num||0)-(b.num||0));
        render(updated);
      }
    });
  }catch(e){show404('خطأ في التحميل: '+e.message);}
}

// الزر الذكي: لو المستخدم مسجّل ويتصفح صفحته → لوحة التحكم، وإلا → ابدأ الآن
function setupSmartNav(pageUid){
  try{
    firebase.auth().onAuthStateChanged(authUser=>{
      const cta=document.getElementById('navCta');
      if(!cta)return;
      if(authUser && authUser.uid===pageUid){
        cta.innerHTML='لوحة التحكم<span class="nav-cta-sub">Dashboard</span>';
        cta.setAttribute('href','dashboard.html');
      }else{
        cta.innerHTML='ابدأ الآن<span class="nav-cta-sub">Start Now</span>';
        cta.setAttribute('href','signup.html');
      }
    });
  }catch(e){}
}

function applyThemeColor(hex){
  if(!/^#[0-9A-Fa-f]{6}$/.test(hex))return;
  document.documentElement.style.setProperty('--accent',hex);
  const r=parseInt(hex.slice(1,3),16);
  const g=parseInt(hex.slice(3,5),16);
  const b=parseInt(hex.slice(5,7),16);
  const lighten=v=>Math.min(255,Math.round(v+(255-v)*0.35));
  const lightHex='#'+[lighten(r),lighten(g),lighten(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
  document.documentElement.style.setProperty('--accent-light',lightHex);
}

// حساب سطوع لون وإرجاع نص معاكس (غامق للفاتح، فاتح للغامق)
function luminance(hex){
  const m=/^#([0-9a-f]{6})$/i.exec(hex);
  if(!m){
    // قد تكون القيمة rgb(...) من المتصفح
    const rgb=/(\d+),\s*(\d+),\s*(\d+)/.exec(hex);
    if(rgb){
      const r=+rgb[1],g=+rgb[2],b=+rgb[3];
      return (0.299*r+0.587*g+0.114*b)/255;
    }
    return 1;
  }
  const v=m[1];
  const r=parseInt(v.slice(0,2),16),g=parseInt(v.slice(2,4),16),b=parseInt(v.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)/255;
}

function applyAutoTextContrast(){
  // نقرأ الخلفية الفعلية المطبّقة على الجذر
  const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const lum=luminance(bg);
  // خلفية فاتحة (سطوع عالٍ) → نص غامق، والعكس
  if(lum>0.6){
    document.documentElement.style.setProperty('--text','#1a1d24');
    document.documentElement.style.setProperty('--text2','#4a5160');
    document.documentElement.style.setProperty('--muted','#8a91a3');
  }else{
    document.documentElement.style.setProperty('--text','#f4f6fb');
    document.documentElement.style.setProperty('--text2','#c2c9da');
    document.documentElement.style.setProperty('--muted','#8a92a8');
  }
}

function buildContactsHtml(user){
  const phones=user.phones||[];
  const website=user.website||'';
  const mapUrl=user.mapUrl||'';

  let html='';

  if(!phones.length&&!website&&!mapUrl)return '';

  html+=`<div class="section-title">تواصل <span style="font-size:0.7rem;font-weight:400;color:var(--muted);display:block;">Contact</span></div>`;
  html+=`<div class="contacts-list">`;

  phones.forEach(p=>{
    const label=p.label||'هاتف / Phone';
    const num=p.number||'';
    if(!num)return;
    html+=`
      <a href="tel:${num}" class="contact-card">
        <div class="cc-icon">${PAGE_SVG.phone}</div>
        <div class="cc-body">
          <div class="cc-label">${label}</div>
          <div class="cc-value">${num}</div>
        </div>
      </a>`;
  });

  if(website){
    html+=`
      <a href="${website}" target="_blank" class="contact-card">
        <div class="cc-icon">${PAGE_SVG.website}</div>
        <div class="cc-body">
          <div class="cc-label">موقع إلكتروني / Website</div>
          <div class="cc-value">${website.replace(/^https?:\/\//,'')}</div>
        </div>
      </a>`;
  }

  if(mapUrl){
    const mapTitle=user.mapTitle||'خريطة موقعنا / Our Location';
    html+=`
      <a href="${mapUrl}" target="_blank" class="contact-card">
        <div class="cc-icon">${PAGE_SVG.map}</div>
        <div class="cc-body">
          <div class="cc-label">${mapTitle}</div>
          <div class="cc-value">افتح الخريطة · Open Map</div>
        </div>
      </a>`;
  }

  html+=`</div>`;
  return html;
}

function render(user){
  // نظام الألوان: لون١ (خلفية الأيقونة) + لون٢ (الإطار) + نص + خلفية
  const primary = user.primaryColor || user.themeColor || '#3d5af1';
  const primary2 = user.primaryColor2 || '#6c8fff';
  applyThemeColor(primary);
  // لون٢ = إطار الأيقونات (--accent-light)
  if(/^#[0-9A-Fa-f]{6}$/.test(primary2)){
    document.documentElement.style.setProperty('--accent-light', primary2);
  }
  // لون الخلفية (الافتراضي أبيض، أو وضع ليلي لو جهاز الزائر ليلي ولا خلفية مختارة)
  const chosenBg = user.bgColor && /^#[0-9A-Fa-f]{6}$/.test(user.bgColor) ? user.bgColor : null;
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  if(chosenBg){
    document.documentElement.style.setProperty('--bg', chosenBg);
    document.documentElement.style.setProperty('--surface', chosenBg);
  } else if(prefersDark){
    document.documentElement.style.setProperty('--bg', '#15171c');
    document.documentElement.style.setProperty('--surface', '#1e2128');
    document.documentElement.style.setProperty('--border', '#2a2e37');
  } else {
    document.documentElement.style.setProperty('--bg', '#ffffff');
    document.documentElement.style.setProperty('--surface', '#f9f9f9');
  }
  // لون النص: صريح من اختيار المستخدم، وإلا تباين تلقائي مع الخلفية
  if(user.textColor && /^#[0-9A-Fa-f]{6}$/.test(user.textColor)){
    document.documentElement.style.setProperty('--text', user.textColor);
    document.documentElement.style.setProperty('--text2', user.textColor);
  } else {
    applyAutoTextContrast();
  }

  const avatarHtml=user.avatar?`<img src="${user.avatar}">`:(user.displayName?user.displayName[0].toUpperCase():'-');
  document.getElementById('avatar').innerHTML=avatarHtml;

  if(user.bannerImage){
    document.getElementById('heroBanner').style.backgroundImage=`url(${user.bannerImage})`;
  }

  // حسابات التواصل الاجتماعي (الأيقونات الدائرية)
  const socials=user.socials||[];
  let socialsHtml='';
  if(socials.length){
    const btns=socials.map(s=>{
      const pid=s.platformId||detectPlat(s.url);
      const svg=pid&&PAGE_SVG[pid]?PAGE_SVG[pid]:null;
      // النمط: upload=صورة مرفوعة، site=لون موقعك، brand=لون التطبيق (الافتراضي)
      const mode = s.styleMode || 'brand';
      // صورة مرفوعة تملأ الدائرة
      if(mode==='upload' && s.icon && String(s.icon).startsWith('data:')){
        return `<a href="${s.url}" target="_blank" class="social-btn" title="${s.name||''}" style="border-color:var(--accent-light);"><img src="${s.icon}"></a>`;
      }
      // لون١=خلفية المربع، لون٢=الإطار، الشعار=لون النص (نمط site)
      let circleBg, borderCol, iconColor;
      if(mode==='site'){
        circleBg='var(--accent)'; borderCol='var(--accent-light)'; iconColor='var(--text)';
      } else {
        // لون التطبيق الرسمي
        circleBg=s.brandColor||platColor(pid); borderCol='var(--accent-light)'; iconColor='#ffffff';
      }
      const inner = svg ? svg : `<span style="font-weight:900;font-size:1.4rem;">${(s.name||'?')[0].toUpperCase()}</span>`;
      return `<a href="${s.url}" target="_blank" class="social-btn" title="${s.name||pid}" style="background:${circleBg};border-color:${borderCol};color:${iconColor};">${inner}</a>`;
    }).join('');
    // أيقونة QR دائرية في بداية الصف (خلفية لون١، إطار لون٢، الشعار لون النص)
    const qrBtn=`<button class="social-btn" title="رمز QR" onclick="openPageQr()" style="background:var(--accent);color:var(--text);border-color:var(--accent-light);cursor:pointer;">${PAGE_SVG.qr}</button>`;
    socialsHtml=`
      <div class="section-title">حسابات التواصل <span style="font-size:0.7rem;font-weight:400;color:var(--muted);display:block;">Social Accounts</span></div>
      <div class="socials-row">${qrBtn}${btns}</div>
    `;
  } else {
    // حتى لو لا سوشيال، نعرض أيقونة QR وحدها
    socialsHtml=`<div class="socials-row"><button class="social-btn" title="رمز QR" onclick="openPageQr()" style="background:var(--accent);color:var(--text);border-color:var(--accent-light);cursor:pointer;">${PAGE_SVG.qr}</button></div>`;
  }

  // بطاقات التواصل (أرقام/موقع/خريطة)
  const contactsHtml=buildContactsHtml(user);

  let signYear=new Date().getFullYear();
  if(user.createdAt){
    const d=new Date(user.createdAt); if(!isNaN(d))signYear=d.getFullYear();
  }
  const featuredLinks=userLinks.filter(l=>l.featured);
  const recentLinks=[...userLinks].slice(-5).reverse();
  window.__pageData={featuredLinks,recentLinks,allLinks:userLinks};

  document.getElementById('content').innerHTML=`
    <div class="profile-info">
      <div class="profile-name">${user.displayName||user.username}</div>
      <div class="profile-handle">electrwni.link/${user.username}</div>
      ${user.bio?`<div class="profile-bio">${user.bio}</div>`:''}
    </div>

    <div class="input-section">
      <input class="input-box" type="text" id="numIn"
        placeholder="أكتب الرقم · Enter Number"
        maxlength="6" inputmode="numeric" oninput="convertNum()"
        onkeydown="if(event.key==='Enter'){event.preventDefault();goNav();}">
      <button type="button" class="btn-go" onclick="goNav()">أذهب الآن · Go Now</button>
      <div class="error-msg" id="errMsg">الرقم غير موجود · Number not found</div>
    </div>

    <div class="pick-row">
      <button class="pick-box" onclick="openSection('featured')">
        <div class="pick-title">روابط مختارة<span class="pick-sub">Selected Links</span></div>
      </button>
      <button class="pick-box" onclick="openSection('recent')">
        <div class="pick-title">سجل الروابط<span class="pick-sub">Links Registry</span></div>
      </button>
    </div>

    ${socialsHtml}
    ${contactsHtml}

    <div class="footer">
      <span class="psb-text">بُني بمعمارية عالية الأداء، الكويت، 2026.</span>
      <a href="https://electrwni.link/electrwni" class="psb-link">حساب المنصة · Platform Account</a>
    </div>
  `;

  // تخزين رابط الصفحة للـ QR المنبثق
  window.__pageQrUrl = 'https://electrwni.link/' + user.username;
  window.__pageQrName = user.displayName || user.username;
}

// فتح نافذة QR كبيرة عند الضغط على أيقونة QR
window.openPageQr = function(){
  const modal=document.getElementById('qrModal');
  const holder=document.getElementById('qrModalCanvas');
  if(!modal||!holder||!window.QRCode)return;
  holder.innerHTML='';
  new QRCode(holder,{text:window.__pageQrUrl||location.href,width:220,height:220,colorDark:'#1a1d24',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
  document.getElementById('qrModalName').textContent=window.__pageQrName||'';
  modal.style.display='flex';
};
window.closePageQr = function(){ document.getElementById('qrModal').style.display='none'; };

// تكبير صورة البروفايل/الشعار عند الضغط
window.zoomAvatar = function(){
  const av=document.getElementById('avatar');
  const img=av?av.querySelector('img'):null;
  if(!img||!img.src)return; // لا صورة (حرف فقط)
  const modal=document.getElementById('imgZoomModal');
  document.getElementById('imgZoomTarget').src=img.src;
  modal.style.display='flex';
};
window.closeImgZoom = function(){ document.getElementById('imgZoomModal').style.display='none'; };

function openSection(type){
  const data=window.__pageData;
  if(!data)return;
  let title='',links=[];
  if(type==='featured'){title='روابط مختارة · Selected Links';links=data.featuredLinks;}
  else if(type==='recent'){title='سجل الروابط · Links Registry';links=data.recentLinks;}
  document.getElementById('sectionOverlayTitle').textContent=title;
  const body=document.getElementById('sectionOverlayBody');
  if(!links.length){
    body.innerHTML='<div class="empty-state">لا توجد روابط هنا بعد · No links yet</div>';
  }else{
    body.innerHTML=`
      <div class="overlay-list">
        ${links.map(l=>`<a href="${l.url}" target="_blank" class="overlay-item"><span>${l.label}</span><span class="ov-num">${l.num}</span></a>`).join('')}
      </div>`;
  }
  document.getElementById('sectionOverlay').classList.add('open');
}

function closeSection(){
  document.getElementById('sectionOverlay').classList.remove('open');
}

function convertNum(){
  const inp=document.getElementById('numIn');
  inp.value=arabicToEnglish(inp.value);
}

function goNav(){
  const raw=document.getElementById('numIn').value;
  const n=parseInt(arabicToEnglish(raw));
  if(isNaN(n)){
    const err=document.getElementById('errMsg');
    err.classList.add('show');
    setTimeout(()=>err.classList.remove('show'),2000);
    return;
  }
  const l=userLinks.find(x=>(x.num??x.number)===n);
  if(!l || !l.url){
    const err=document.getElementById('errMsg');
    err.classList.add('show');
    setTimeout(()=>err.classList.remove('show'),2000);
    return;
  }
  let url=l.url.trim();
  if(!/^https?:\/\//i.test(url) && !/^(mailto:|tel:|sms:)/i.test(url)){
    url='https://'+url;
  }
  window.open(url,'_blank');
}

function show404(msg){
  document.getElementById('content').innerHTML=`
    <div class="empty-state" style="padding:80px 20px;">
      <h2 style="font-weight:900;margin-bottom:10px;font-size:1.2rem;">${msg}</h2>
      <a href="index.html" style="display:inline-block;margin-top:20px;padding:10px 24px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-weight:700;">العودة للرئيسية · Back Home</a>
    </div>`;
}

init();
</script>
