<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>electrwni.link</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Tajawal', sans-serif; background-color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
.wrapper { width: 100%; max-width: 480px; min-height: 100vh; background: #ffffff; display: flex; flex-direction: column; position: relative; }

/* البانر العلوي المتطابق مع image_2.png */
.banner { width: 100%; height: 180px; background: linear-gradient(135deg, #1d3557, #457b9d); position: relative; border-bottom: 4px solid #ffd166; overflow: hidden; }
.banner::before { content: ""; position: absolute; top: -20%; left: -20%; width: 60%; height: 140%; background: #112233; transform: skewX(-25deg); opacity: 0.8; }
.banner-dots { position: absolute; bottom: 15px; left: 30%; width: 80px; height: 50px; background-image: radial-gradient(#ffffff 2px, transparent 2px); background-size: 8px 8px; opacity: 0.3; }
.banner-zigzag { position: absolute; top: 30px; right: 30px; font-size: 1.5rem; color: #ffd166; transform: rotate(15deg); opacity: 0.7; letter-spacing: -2px; font-weight: 900; }
.banner-triangle { position: absolute; bottom: 40px; right: 25%; width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-bottom: 25px solid #ff007f; transform: rotate(25deg); }

/* الصورة الرمزية الدائرية الوسطى */
.avatar-container { width: 110px; height: 110px; border-radius: 50%; background: #ffffff; position: absolute; top: 125px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 10; border: 3px solid #ffffff; }
.avatar-inner { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #00f2fe, #4facfe); border: 3px solid #ffd166; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #ffffff; font-weight: 900; position: relative; overflow: hidden; }
.avatar-inner svg { width: 45px; height: 45px; fill: #ffffff; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

/* منطقة المحتوى والمدخلات */
.content { margin-top: 90px; padding: 20px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
.input-field { width: 100%; max-width: 320px; height: 52px; border: 3px solid #3a86ff; border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 1.2rem; font-weight: 700; text-align: center; color: #333333; outline: none; margin-bottom: 12px; background: #ffffff; transition: border-color 0.2s; }
.input-field::placeholder { color: #888888; font-weight: 700; }
.input-field:focus { border-color: #0056b3; }

.action-btn { width: 100%; max-width: 320px; height: 52px; background-color: #3a86ff; color: #ffffff; border: none; border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 1.2rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(58, 134, 255, 0.2); transition: background 0.2s; margin-bottom: 40px; }
.action-btn:active { transform: scale(0.98); }
.action-btn:hover { background-color: #0056b3; }

/* قسم روابط التواصل الاجتماعي السفلي */
.social-section { text-align: center; margin-top: auto; padding-bottom: 40px; }
.social-title { color: #3a86ff; font-weight: 900; font-size: 1.1rem; margin-bottom: 15px; }
.social-icons { display: flex; justify-content: center; gap: 15px; }
.social-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s; text-decoration: none; }
.social-icon:active { transform: scale(0.9); }
.instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%); }
.telegram { background: #0088cc; }
.snapchat { background: #fffc00; }
.social-icon svg { width: 22px; height: 22px; fill: #ffffff; }
.snapchat svg { fill: #000000; }
</style>
</head>
<body>

<div class="wrapper">
  <!-- البانر العلوي الهندسي هندسة محاكية للصورة المرفقة -->
  <div class="banner">
    <div class="banner-dots"></div>
    <div class="banner-zigzag">⌇⌇⌇</div>
    <div class="banner-triangle"></div>
  </div>

  <!-- حاوية الصورة الرمزية الدائرية (شعار المشاركة المتصلة) -->
  <div class="avatar-container">
    <div class="avatar-inner">
      <svg viewBox="0 0 24 24">
        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
      </svg>
    </div>
  </div>

  <!-- حقول الإدخال والتحويل الفوري للرابط -->
  <div class="content">
    <input type="tel" id="codeRange" class="input-field" placeholder="أكتب الرقم" autocomplete="off" inputmode="numeric">
    <button class="action-btn" onclick="redirectToLink()">أذهب الآن</button>
  </div>

  <!-- قسم قنوات التواصل المحددة بالهوية البصرية المتناسقة -->
  <div class="social-section">
    <div class="social-title">تابعنا</div>
    <div class="social-icons">
      <a href="#" class="social-icon instagram" id="instaLink">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
      <a href="#" class="social-icon telegram" id="teleLink">
        <svg viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.565 8.161l-1.897 8.944c-.143.633-.519.79-.1047.319l-2.887-2.13-1.392 1.34c-.154.154-.284.284-.583.284l.207-2.936 5.344-4.828c.232-.207-.051-.322-.361-.115l-6.604 4.157-2.845-.89c-.619-.193-.632-.619.129-.916l11.12-4.288c.515-.193.966.115.753.992z"/></svg>
      </a>
      <a href="#" class="social-icon snapchat" id="snapLink">
        <svg viewBox="0 0 24 24"><path d="M12 2c-5.522 0-10 4.477-10 10s4.477 10 10 10 10-4.477 10-10-4.477-10-10-10zm5.176 13.917c-.31.111-.645.215-.99.309-.327.344-.754.717-1.259.957-.406.192-.857.291-1.336.291-.04 0-.08-.002-.12-.005-.173-.012-.349-.039-.523-.081-.692-.164-1.347-.562-1.895-1.15-.36.436-.838.742-1.366.89-.138.039-.279.06-.421.066-.021.001-.041.001-.062.001-.444 0-.868-.093-1.251-.271-.462-.216-.856-.549-1.163-.863-.377-.099-.743-.211-1.085-.333-.373-.133-.561-.299-.561-.497 0-.361.621-.628.988-.748.118-.328.291-.849.441-1.373.088-.305.166-.613.23-.915-.246-.192-.455-.456-.598-.755-.162-.338-.201-.723-.111-1.082.083-.332.285-.615.568-.799.043-.497.169-.997.387-1.464.444-.951 1.258-1.637 2.294-1.933.565-.162 1.161-.225 1.769-.187.575-.308 1.246-.481 1.954-.481.657 0 1.282.149 1.823.419.645-.04 1.278.026 1.879.197 1.036.296 1.85 1.002 2.294 1.953.21.451.334.931.378 1.411.291.183.497.472.58.813.094.385.048.796-.13 1.151-.15.297-.362.557-.611.745.064.298.141.602.228.903.149.522.321 1.041.439 1.368.37.12.996.388.996.75 0 .197-.189.363-.563.497z"/></svg>
      </a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<script>
// الإعداد الفعلي المتناسق مع الخادم المركزي
const firebaseConfig = {
  apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
  authDomain: "electrwni-link.firebaseapp.com",
  projectId: "electrwni-link",
  storageBucket: "electrwni-link.firebasestorage.app",
  messagingSenderId: "712490301263",
  appId: "1:712490301263:web:2084210da3f687285ab73a",
  databaseURL: "https://electrwni-link-default-rtdb.firebaseio.com/"
};

if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const rtdb = firebase.database();

// استخراج اسم المستخدم تلقائياً من الـ Hash للرابط الحالي (مثال: page.html#khaled)
const currentUsername = window.location.hash.substring(1).trim().toLowerCase() || 'default';

// تفعيل وتعبئة روابط شبكات التواصل الخاصة بصاحب الحساب تلقائياً عند التشغيل
function loadSocialLinks() {
  rtdb.ref(`links/${currentUsername}`).once('value').then(snapshot => {
    const data = snapshot.val();
    if(data) {
      if(data.instagram) document.getElementById('instaLink').href = data.instagram;
      if(data.telegram) document.getElementById('teleLink').href = data.telegram;
      if(data.snapchat) document.getElementById('snapLink').href = data.snapchat;
    }
  }).catch(e => console.log("Social fetch pass: ", e));
}

// محرك فحص الرقم والتحويل اللحظي مع احتساب زيادة العداد (Clicks) بدقة
function redirectToLink() {
  const codeInput = document.getElementById('codeRange').value.trim();
  
  if (!codeInput) {
    alert('⚠️ الرجاء إدخال الرقم أولاً للانتقال.');
    return;
  }

  // البحث المباشر داخل مصفوفة أو كائن الروابط الخاص بالمستخدم الحالي
  const userRef = rtdb.ref(`links/${currentUsername}`);
  
  userRef.once('value').then(snapshot => {
    const userData = snapshot.val();
    if (!userData || !userData.links) {
      alert('❌ لا توجد روابط مسجلة لهذا الحساب حالياً.');
      return;
    }

    let foundLink = null;
    let foundIndex = -1;

    // معالجة بنية تخزين الروابط وسحب الرابط المرادف للرقم المكتوب
    if (Array.isArray(userData.links)) {
      foundIndex = userData.links.findIndex(l => l && String(l.number || l.code) === codeInput);
      if (foundIndex !== -1) foundLink = userData.links[foundIndex];
    } else if (typeof userData.links === 'object') {
      const keys = Object.keys(userData.links);
      for (let k of keys) {
        if (String(userData.links[k].number || userData.links[k].code) === codeInput) {
          foundLink = userData.links[k];
          foundIndex = k;
          break;
        }
      }
    }

    if (foundLink && (foundLink.url || foundLink.link)) {
      const targetUrl = foundLink.url || foundLink.link;
      const currentClicks = parseInt(foundLink.clicks || 0, 10);
      
      // تحديث فوري تصاعدي لعداد النقرات لضمان قراءتها في لوحة التحكم الإدارية
      const clickPath = `links/${currentUsername}/links/${foundIndex}/clicks`;
      rtdb.ref(clickPath).set(currentClicks + 1).then(() => {
        // التحويل المباشر للرابط المقصود
        window.location.href = targetUrl;
      }).catch(() => {
        // تحويل احتياطي مباشر في حال حدوث بطء في اتصال الشبكة
        window.location.href = targetUrl;
      });
    } else {
      alert('❌ الرقم الذي أدخلته غير صحيح أو غير متوفر حالياً.');
    }
  }).catch(err => {
    alert('حدث خطأ في الاتصال بالخادم: ' + err.message);
  });
}

// انطلاق الوظائف التمهيدية فور تحميل الصفحة
window.onload = loadSocialLinks;
</script>
</body>
</html>
