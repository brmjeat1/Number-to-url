<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحميل... — electrwni.link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="themeBtn" class="theme-toggle" onclick="toggleTheme()">☀️</button>

  <div class="container" id="mainContent">
    <div class="profile-card">
      <div class="avatar" id="profileAvatar">
        <span id="avatarText"></span>
      </div>
      <h1 class="profile-title" id="profileName"></h1>
      <p class="profile-username" id="profileHandle"></p>
      <p class="profile-bio" id="profileBio"></p>
      
      <div class="socials-row" id="socialsRow"></div>
    </div>

    <div class="num-box">
      <input type="number" id="numIn" placeholder="00" oninput="handleIn()" pattern="[0-9]*" inputmode="numeric">
      <button class="go-btn" onclick="goNav()">اذهب</button>
      <div id="errMsg" class="err-msg">الرقم غير مسجل لهذا المستخدم!</div>
    </div>

    <div class="quick-buttons" id="quickBtns"></div>

    <div class="links-list" id="linksList"></div>

    <footer class="footer">
      بواسطة <a href="https://electrwni.link" target="_blank">electrwni.link</a>
    </footer>
  </div>

  <div class="container" id="notFound" style="display: none; text-align: center; padding-top: 80px;">
    <div style="font-size: 64px; margin-bottom: 20px;">🔍</div>
    <h2 style="margin-bottom: 10px;">الحساب غير موجود!</h2>
    <p style="color: #666; margin-bottom: 30px;">تأكد من كتابة اسم المستخدم بشكل صحيح في الرابط.</p>
    <a href="https://electrwni.link" class="go-btn" style="text-decoration: none; display: inline-block;">العودة للرئيسية</a>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    // تم دمج مفاتيح مشروعك الحقيقية هنا بنجاح ليرتبط السيرفر تلقائياً بالزوار
    const firebaseConfig = {
      apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
      authDomain: "electrwni-link.firebaseapp.com",
      databaseURL: "https://electrwni-link-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "electrwni-link",
      storageBucket: "electrwni-link.firebasestorage.app",
      messagingSenderId: "712490301263",
      appId: "1:712490301263:web:2084210da3f687285ab73a",
      measurementId: "G-LCCGHWKH87"
    };
    
    // بدء تشغيل Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // إدارة الثيم والمظهر
    const th = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', th);
    document.getElementById('themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
    
    function toggleTheme(){
      const c = document.documentElement.getAttribute('data-theme');
      const n = c === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      localStorage.setItem('theme', n);
      document.getElementById('themeBtn').textContent = n === 'dark' ? '☀️' : '🌙';
    }

    // استخراج اسم المستخدم تلقائياً من الرابط (سواء u= أو هاشتاج #)
    function getUsername(){
      const hash = location.hash.replace('#','').split('?')[0];
      if(hash) return hash;
      const qp = new URLSearchParams(location.search).get('u');
      if(qp) return qp;
      const path = location.pathname.replace(/\//g,'');
      if(path && path !== 'page.html') return path;
      return null;
    }

    // أيقونات ورموز مواقع التواصل الاجتماعي
    const socIcons = {instagram:'📷', tiktok:'🎵', twitter:'✖', youtube:'▶', snapchat:'👻', whatsapp:'💬', telegram:'✈', linkedin:'💼', facebook:'👤', website:'🌐'};
    const socUrls = {
      instagram: u => 'https://instagram.com/'+u.replace('@',''),
      tiktok: u => 'https://tiktok.com/@'+u.replace('@',''),
      twitter: u => 'https://x.com/'+u.replace('@',''),
      youtube: u => u.startsWith('http')?u:'https://youtube.com/@'+u.replace('@',''),
      snapchat: u => 'https://snapchat.com/add/'+u.replace('@',''),
      whatsapp: u => 'https://wa.me/'+u.replace(/\D/g,''),
      telegram: u => 'https://t.me/'+u.replace('@',''),
      linkedin: u => u.startsWith('http')?u:'https://linkedin.com/in/'+u.replace('@',''),
      facebook: u => u.startsWith('http')?u:'https://facebook.com/'+u.replace('@',''),
      website: u => u.startsWith('http')?u:'https://'+u,
    };

    let globalUserLinks = []; // مصفوفة لتخزين الروابط محلياً لتسريع توجيه الأرقام

    // تشغيل الصفحة وجلب البيانات سحابياً
    async function init(){
      const username = getUsername();
      
      if(!username){
        showNotFound();
        return;
      }

      try {
        // جلب مستند اليوزر ديناميكياً من جدول الـ users في Firestore
        const userDoc = await db.collection('users').doc(username).get();

        if (!userDoc.exists) {
          showNotFound();
          return;
        }

        const user = userDoc.data();
        document.title = (user.displayName || username) + ' — electrwni.link';
        globalUserLinks = (user.links || []).sort((a,b) => a.num - b.num);
        const socials = user.socials || [];

        // معالجة صورة الحساب الشخصية (Avatar)
        if(user.avatar){
          document.getElementById('avatarText').style.display = 'none';
          const img = document.createElement('img');
          img.src = user.avatar;
          img.onerror = () => { img.remove(); document.getElementById('avatarText').style.display = ''; };
          document.getElementById('profileAvatar').appendChild(img);
        } else {
          document.getElementById('avatarText').textContent = (user.displayName || username)[0].toUpperCase();
        }

        // عرض نصوص الحساب الأساسية في الواجهة
        document.getElementById('profileName').textContent = user.displayName || username;
        document.getElementById('profileBio').textContent = user.bio || '';
        document.getElementById('profileHandle').textContent = 'electrwni.link/' + username;

        // بناء صف أزرار التواصل الاجتماعي
        const sr = document.getElementById('socialsRow');
        sr.innerHTML = socials.map(s => {
          const url = (socUrls[s.platform] || ((u)=>u))(s.username);
          return `<a class="social-btn" href="${url}" target="_blank" rel="noopener" title="${s.username}">${socIcons[s.platform] || '🌐'}</a>`;
        }).join('');

        // بناء مفاتيح الأرقام للاختصارات السريعة
        document.getElementById('quickBtns').innerHTML = globalUserLinks.map(l =>
          `<button class="qbtn" onclick="quickGo(${l.num})">${l.num}</button>`
        ).join('');

        // بناء قائمة الروابط الكلاسيكية للزوار في الأسفل
        document.getElementById('linksList').innerHTML = globalUserLinks.map(l =>
          `<a class="link-row" href="${l.url}" onclick="trackClick('${username}', ${l.id}, event)">
            <div class="link-num-badge">${l.num}</div>
            <div class="link-info">
              <div class="link-lbl">${l.label}</div>
              ${l.desc ? `<div class="link-desc">${l.desc}</div>` : ''}
            </div>
            <div class="link-arrow">→</div>
          </a>`
        ).join('');

      } catch (error) {
        console.error("خطأ في جلب بيانات Firestore:", error);
        showNotFound();
      }
    }

    // عرض واجهة الحساب غير موجود
    function showNotFound() {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('notFound').style.display = 'block';
    }

    // التوجيه عند إدخال الأرقام
    function handleIn(){
      document.getElementById('errMsg').classList.remove('show');
      const v = document.getElementById('numIn').value;
      if(v.length === 2) setTimeout(goNav, 350); 
    }
    
    function goNav(){ navigate(parseInt(document.getElementById('numIn').value)); }
    function quickGo(n){ document.getElementById('numIn').value = n; goNav(); }
    
    function navigate(n){
      if(!globalUserLinks) return;
      const lnk = globalUserLinks.find(l => l.num === n);
      if(lnk){
        const username = getUsername();
        trackClick(username, lnk.id, null);
        window.location.href = lnk.url;
      } else {
        const inp = document.getElementById('numIn');
        inp.classList.add('shake');
        document.getElementById('errMsg').classList.add('show');
        setTimeout(() => inp.classList.remove('shake'), 400);
      }
    }
    
    // دالة زيادة عدد الضغطات تلقائياً وحساب الإحصائيات في السيرفر
    async function trackClick(username, linkId, event) {
      try {
        const userRef = db.collection('users').doc(username);
        db.runTransaction(async (transaction) => {
          const sfDoc = await transaction.get(userRef);
          if (!sfDoc.exists) return;
          
          let links = sfDoc.data().links || [];
          const i = links.findIndex(l => l.id === linkId);
          if (i !== -1) {
            links[i].clicks = (links[i].clicks || 0) + 1;
            transaction.update(userRef, { links: links });
          }
        });
      } catch (e) {
        console.error("فشل تحديث الإحصائيات:", e);
      }
    }
    
    // بدء التنفيذ الذاتي عند تشغيل المتصفح
    init();
  </script>
</body>
</html>
