<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Electrwni</title>
    <style>
        /* التنسيقات الأساسية وهيكلة اللوحة */
        :root {
            --primary-color: #4f46e5;
            --bg-solid-white: #ffffff;
            --text-dark: #1f2937;
            --sidebar-width: 260px;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: var(--text-dark);
            display: flex;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-solid-white);
            height: 100vh;
            border-left: 1px solid #e5e7eb;
            position: fixed;
            right: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        .sidebar-brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #f3f4f6;
            color: var(--primary-color);
        }

        .nav-tabs-container {
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-tab {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-tab:hover {
            background-color: #f9fafb;
        }

        .nav-tab.active {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        /*منطقة المحتوى والصفحات */
        .main-content {
            margin-right: var(--var-sidebar-width, 260px);
            padding: 30px;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* آلية الإخفاء والإظهار الآمنة */
        .page {
            display: none; 
            background: var(--bg-solid-white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .page.active {
            display: block; /* يظهر فقط عند التنشيط */
        }

        /* أدوات التحكم بالخلفية المباشرة (دون تعقيد وقفل) */
        .theme-controls {
            margin-top: auto;
            padding: 20px;
            border-top: 1px solid #f3f4f6;
        }

        .color-picker-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية المحدثة -->
    <aside class="sidebar">
        <div class="sidebar-brand">Electrwni Dashboard</div>
        <nav class="nav-tabs-container">
            <div class="nav-tab active" onclick="showPage('analytics', this)">الإحصائيات</div>
            <div class="nav-tab" onclick="showPage('links', this)">إدارة الروابط</div>
            <div class="nav-tab" onclick="showPage('settings', this)">الإعدادات</div>
        </nav>
        
        <!-- التحكم المباشر بالخلفية بعد حذف التعقيدات القديمة -->
        <div class="theme-controls">
            <label style="font-size: 0.85rem; display:block; margin-bottom:5px;">لون الخلفية المخصص:</label>
            <input type="color" class="color-picker-btn" oninput="changeCanvasBg(this.value)">
        </div>
    </aside>

    <!-- منطقة الأقسام الموحدة المعرفات -->
    <main class="main-content">
        
        <!-- قسم الإحصائيات -->
        <section id="page-analytics" class="page active">
            <h2>لوحة الإحصائيات العامة</h2>
            <p>مرحباً بك في نظام إدارة المنصة الرقمية.</p>
        </section>

        <!-- قسم الروابط (تم إصلاح الـ ID ليتطابق مع زر الاستدعاء) -->
        <section id="page-links" class="page">
            <h2>إدارة الروابط والمسارات</h2>
            <p>هنا يمكنك إضافة وتعديل روابط التوجيه الخاصة بـ Electrwni.</p>
        </section>

        <!-- قسم الإعدادات -->
        <section id="page-settings" class="page">
            <h2>إعدادات الحساب والمظهر</h2>
            <p>تخصيص الهوية البصرية وإعدادات الأمان الخاصة بك.</p>
        </section>

    </main>

    <!-- السكربت البرمجي المطهّر والمعزول -->
    <script>
        /**
         * 1. دالة التنقل الرئيسية (مستقلة ومحمية في أعلى السكربت)
         * تم حل مشكلة عدم التنقل بربط الممرر 'pageId' بالبادئة '-page'
         */
        function showPage(pageId, btn) {
            try {
                // إخفاء كافة الأقسام النشطة
                document.querySelectorAll('.page').forEach(page => {
                    page.classList.remove('active');
                });

                // إظهار القسم المطلوب بناءً على المعرف الصحيح
                const targetPage = document.getElementById('page-' + pageId);
                if (targetPage) {
                    targetPage.classList.add('active');
                } else {
                    console.warn(`القسم page-${pageId} غير موجود في هيكل HTML.`);
                }

                // إزالة التنشيط من أزرار القائمة السابقة وتمريره للزر الحالي
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.classList.remove('active');
                });
                if (btn) {
                    btn.classList.add('active');
                }
            } catch (error) {
                console.error("عطل في دالة التنقل الرئيسية:", error);
            }
        }

        /**
         * 2. دالة التحكم المباشر بالخلفية
         * تم إزالة شروط الفحص المعقدة وقفل الـ Pointer-Events لضمان الاستجابة السريعة
         */
        function changeCanvasBg(colorValue) {
            document.body.style.backgroundColor = colorValue;
            // يمكنك هنا حفظ القيمة في localStorage بشكل مباشر ومستقر
            localStorage.setItem('custom_bg_color', colorValue);
        }

        // استعادة اللون المفضل للمستخدم فور التحميل دون انتظار جلب Firebase
        window.addEventListener('DOMContentLoaded', () => {
            const savedColor = localStorage.getItem('custom_bg_color');
            if (savedColor) {
                document.body.style.backgroundColor = savedColor;
            }
        });
    </script>

    <!-- 3. تضمين مكتبات Firebase والعمليات المستندة للبيانات (معزولة تماماً في الأسفل) -->
    <script type="module">
        // استيراد الحزم وإعداد الاتصال بقاعدة البيانات هنا
        // كافة عمليات Auth و Firestore/Realtime DB تُكتب هنا داخل النطاق المعزول
        // حتى لو فشل الاتصال بالإنترنت أو تعطل الحساب، لن تتأثر دالة showPage العلوية.
    </script>
</body>
</html>
