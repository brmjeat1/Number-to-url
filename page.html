  <style>
    :root{--bg:#f0f4ff;--bg2:#e8eeff;--surface:rgba(255,255,255,0.85);--border:rgba(100,130,255,0.2);--border-strong:rgba(100,130,255,0.4);--accent:#3d5af1;--accent2:#e8436a;--accent-light:rgba(61,90,241,0.1);--text:#0f1535;--text2:#3a4270;--muted:#7b84b0;--shadow:0 8px 32px rgba(61,90,241,0.1);}
    [data-theme="dark"]{--bg:#050810;--bg2:#080d1a;--surface:rgba(15,20,50,0.85);--border:rgba(100,130,255,0.2);--border-strong:rgba(100,130,255,0.4);--accent:#6c8fff;--accent2:#ff6584;--accent-light:rgba(108,143,255,0.1);--text:#e8eeff;--text2:#a0aad0;--muted:#5a6490;--shadow:0 8px 32px rgba(0,0,0,0.3);}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;transition:background .3s,color .3s;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 700px 600px at 50% -10%,rgba(61,90,241,0.08),transparent),radial-gradient(ellipse 500px 400px at 80% 90%,rgba(232,67,106,0.05),transparent);}

.theme-btn{position:fixed;top:16px;left:16px;z-index:100;width:36px;height:36px;border-radius:50%;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:1rem;backdrop-filter:blur(10px);transition:all .2s;}
.theme-btn:hover{transform:scale(1.1);}

.page-wrap{position:relative;z-index:5;width:100%;max-width:420px;padding:40px 20px 80px;display:flex;flex-direction:column;align-items:center;}

/* NOT FOUND */
.not-found{text-align:center;padding:80px 20px;}
.not-found .big{font-size:4rem;margin-bottom:16px;}
.not-found h2{font-size:1.6rem;font-weight:900;margin-bottom:8px;}
.not-found p{color:var(--muted);}
.not-found a{color:var(--accent);text-decoration:none;}

/* PROFILE */
.profile{text-align:center;margin-bottom:32px;width:100%;}
.avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:900;color:#fff;box-shadow:0 8px 32px rgba(61,90,241,0.25);}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
.pname{font-size:1.6rem;font-weight:900;margin-bottom:6px;}
.pbio{font-size:0.92rem;color:var(--text2);line-height:1.5;max-width:300px;margin:0 auto 10px;}
.phandle{display:inline-block;font-family:'Space Mono',monospace;font-size:0.75rem;color:var(--accent);background:var(--accent-light);border:1px solid var(--border-strong);border-radius:100px;padding:4px 14px;}

/* SOCIAL ICONS */
.socials-row{display:flex;gap:10px;justify-content:center;margin-bottom:28px;flex-wrap:wrap;}
.social-btn{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;text-decoration:none;transition:all .15s;backdrop-filter:blur(10px);}
.social-btn:hover{border-color:var(--accent);background:var(--accent-light);transform:translateY(-2px);}

/* NUMBER INPUT */
.input-box{width:100%;background:var(--surface);backdrop-filter:blur(20px);border:1.5px solid var(--border);border-radius:22px;padding:28px 24px;margin-bottom:22px;box-shadow:var(--shadow);}
.input-label{text-align:center;font-size:0.88rem;color:var(--muted);margin-bottom:16px;line-height:1.6;}
.input-label strong{color:var(--text);}
.big-row{display:flex;gap:10px;}
.big-in{flex:1;font-family:'Space Mono',monospace;font-size:2.8rem;font-weight:700;text-align:center;background:var(--bg2);border:2px solid var(--border-strong);border-radius:14px;padding:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;-moz-appearance:textfield;}
.big-in::-webkit-outer-spin-button,.big-in::-webkit-inner-spin-button{-webkit-appearance:none;}
.big-in:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-light);}
.big-in.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.go-btn{background:var(--accent);border:none;border-radius:14px;width:68px;color:#fff;font-size:1.6rem;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(61,90,241,0.3);}
.go-btn:hover{filter:brightness(1.1);transform:scale(1.05);}
.quick-row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.qbtn{width:44px;height:44px;border-radius:10px;background:var(--bg2);border:1.5px solid var(--border);color:var(--muted);font-family:'Space Mono',monospace;font-size:1rem;cursor:pointer;transition:all .15s;}
.qbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.error-msg{text-align:center;color:var(--accent2);font-size:0.88rem;padding:8px;display:none;}
.error-msg.show{display:block;}

/* LINKS LIST */
.links-list{width:100%;display:flex;flex-direction:column;gap:8px;}
.link-row{display:flex;align-items:center;gap:12px;background:var(--surface);backdrop-filter:blur(10px);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:all .2s;text-decoration:none;color:var(--text);}
.link-row:hover{border-color:var(--border-strong);transform:translateX(-2px);box-shadow:var(--shadow);}
.link-num-badge{width:38px;height:38px;border-radius:9px;background:var(--accent-light);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:1.1rem;font-weight:700;color:var(--accent);flex-shrink:0;}
.link-info{flex:1;}
.link-lbl{font-weight:700;font-size:0.95rem;}
.link-desc{font-size:0.78rem;color:var(--muted);margin-top:2px;}
.link-arrow{color:var(--muted);font-size:0.9rem;}

/* FOOTER */
.page-footer{position:relative;z-index:5;text-align:center;padding:20px;font-size:0.75rem;color:var(--muted);}
.page-footer a{color:var(--accent);font-family:'Space Mono',monospace;text-decoration:none;}

  <div class="page-footer">بُنيت بـ <a href="index.html">electrwni.link</a></div>

  <script>
    const th=localStorage.getItem('theme')||'light';
    document.documentElement.setAttribute('data-theme',th);
    document.getElementById('themeBtn').textContent=th==='dark'?'☀️':'🌙';
    function toggleTheme(){const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}

    // ===== FIX: رابط يعمل بدون # =====
    // يدعم: page.html#username  AND  page.html?u=username  AND  /username
    function getUsername(){
      // 1. Hash: page.html#username
      const hash=location.hash.replace('#','').split('?')[0];
      if(hash)return hash;
      // 2. Query: ?u=username
      const qp=new URLSearchParams(location.search).get('u');
      if(qp)return qp;
      // 3. Path: /username (for real hosting via CNAME)
      const path=location.pathname.replace(/\//g,'');
      if(path&&path!=='page.html')return path;
      return null;
    }

    const socIcons={instagram:'📷',tiktok:'🎵',twitter:'✖',youtube:'▶',snapchat:'👻',whatsapp:'💬',telegram:'✈',linkedin:'💼',facebook:'👤',website:'🌐'};
    const socUrls={
      instagram:u=>'https://instagram.com/'+u.replace('@',''),
      tiktok:u=>'https://tiktok.com/@'+u.replace('@',''),
      twitter:u=>'https://x.com/'+u.replace('@',''),
      youtube:u=>u.startsWith('http')?u:'https://youtube.com/@'+u.replace('@',''),
      snapchat:u=>'https://snapchat.com/add/'+u.replace('@',''),
      whatsapp:u=>'https://wa.me/'+u.replace(/\D/g,''),
      telegram:u=>'https://t.me/'+u.replace('@',''),
      linkedin:u=>u.startsWith('http')?u:'https://linkedin.com/in/'+u.replace('@',''),
      facebook:u=>u.startsWith('http')?u:'https://facebook.com/'+u.replace('@',''),
      website:u=>u.startsWith('http')?u:'https://'+u,
    };

    function init(){
      const username=getUsername();
      const user=JSON.parse(localStorage.getItem('elUser')||'null');

      if(!user||!username||(user.username!==username)){
        document.getElementById('mainContent').style.display='none';
        document.getElementById('notFound').style.display='block';
        return;
      }

      document.title=(user.displayName||username)+' — electrwni.link';
      const links=(user.links||[]).sort((a,b)=>a.num-b.num);
      const socials=user.socials||[];

      // Avatar
      if(user.avatar){
        document.getElementById('avatarText').style.display='none';
        const img=document.createElement('img');
        img.src=user.avatar;
        img.onerror=()=>{img.remove();document.getElementById('avatarText').style.display='';};
        document.getElementById('profileAvatar').appendChild(img);
      } else {
        document.getElementById('avatarText').textContent=(user.displayName||username)[0].toUpperCase();
      }

      document.getElementById('profileName').textContent=user.displayName||username;
      document.getElementById('profileBio').textContent=user.bio||'';
      document.getElementById('profileHandle').textContent='electrwni.link/'+username;

      // Socials
      const sr=document.getElementById('socialsRow');
      sr.innerHTML=socials.map(s=>{
        const url=(socUrls[s.platform]||((u)=>u))(s.username);
        return `<a class="social-btn" href="${url}" target="_blank" rel="noopener" title="${s.username}">${socIcons[s.platform]||'🌐'}</a>`;
      }).join('');

      // Quick buttons
      document.getElementById('quickBtns').innerHTML=links.map(l=>
        `<button class="qbtn" onclick="quickGo(${l.num})">${l.num}</button>`
      ).join('');

      // Links list
      document.getElementById('linksList').innerHTML=links.map(l=>
        `<a class="link-row" href="${l.url}" onclick="track(${l.id},event)">
          <div class="link-num-badge">${l.num}</div>
          <div class="link-info">
            <div class="link-lbl">${l.label}</div>
            ${l.desc?`<div class="link-desc">${l.desc}</div>`:''}
          </div>
          <div class="link-arrow">→</div>
        </a>`
      ).join('');
    }

    function handleIn(){
      document.getElementById('errMsg').classList.remove('show');
      const v=document.getElementById('numIn').value;
      if(v.length===1)setTimeout(goNav,350);
    }
    function goNav(){navigate(parseInt(document.getElementById('numIn').value));}
    function quickGo(n){document.getElementById('numIn').value=n;document.querySelectorAll('.qbtn').forEach(b=>b.style.background=parseInt(b.textContent)===n?'var(--accent-light)':'');navigate(n);}
    function navigate(n){
      const user=JSON.parse(localStorage.getItem('elUser')||'null');
      if(!user||!user.links)return;
      const lnk=user.links.find(l=>l.num===n);
      if(lnk){track(lnk.id,null);window.location.href=lnk.url;}
      else{const inp=document.getElementById('numIn');inp.classList.add('shake');document.getElementById('errMsg').classList.add('show');setTimeout(()=>inp.classList.remove('shake'),400);}
    }
    function track(id,e){
      const user=JSON.parse(localStorage.getItem('elUser')||'null');
      if(!user||!user.links)return;
      const i=user.links.findIndex(l=>l.id===id);
      if(i!==-1){user.links[i].clicks=(user.links[i].clicks||0)+1;localStorage.setItem('elUser',JSON.stringify(user));}
    }

    init();
  </script>
