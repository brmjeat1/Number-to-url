<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>جاري التحميل... — electrwni.link</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#ffffff;--bg2:#f6f8ff;--surface:#ffffff;--border:rgba(100,130,255,0.14);--accent:#3d5af1;--accent2:#e8436a;--accent-light:rgba(61,90,241,0.08);--text:#0f1535;--text2:#3a4270;--muted:#9aa2c8;--card:#ffffff;--success:#0ab87a;}
    [data-theme="dark"]{--bg:#060912;--bg2:#0c1020;--surface:rgba(15,20,50,0.85);--border:rgba(100,130,255,0.18);--accent:#6c8fff;--accent2:#ff6584;--accent-light:rgba(108,143,255,0.12);--text:#e8eeff;--text2:#a0aad0;--muted:#5a6490;--card:rgba(15,22,55,0.92);--success:#4ecca3;}
    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      font-family:'Tajawal',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      transition:background .4s,color .4s;
    }

    /* BG GLOW — خفيف جداً ليبقى البياض هو الطاغي */
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        radial-gradient(ellipse 500px 400px at 50% -5%,rgba(108,143,255,0.06),transparent);
    }
    [data-theme="dark"] body::before{
      background:
        radial-gradient(ellipse 600px 600px at 50% -10%,rgba(108,143,255,0.18),transparent),
        radial-gradient(ellipse 400px 400px at 80% 80%,rgba(255,101,132,0.1),transparent);
    }

    .page-wrap{
      position:relative;z-index:5;
      max-width:480px;
      margin:0 auto;
      padding:48px 20px 70px;
    }

    /* THEME BTN */
    .theme-btn{
      position:fixed;top:16px;left:16px;z-index:100;
      width:38px;height:38px;border-radius:10px;
      background:var(--card);border:1px solid var(--border);
      color:var(--text);font-size:1rem;cursor:pointer;
      backdrop-filter:blur(12px);transition:all .2s;
    }

    /* PROFILE CARD */
    /* IDENTITY STRIP */
    .identity-strip{
      display:flex;flex-direction:column;align-items:center;
      text-align:center;margin-bottom:14px;
    }
    .id-username{
      font-family:'Space Mono',monospace;font-size:0.78rem;
      color:var(--accent);background:var(--accent-light);
      border:1px solid var(--border);border-radius:100px;
      padding:4px 14px;margin-bottom:14px;direction:ltr;
    }
    .id-avatar{
      width:104px;height:104px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;
      font-size:2.6rem;font-weight:900;color:#fff;
      border:3px solid var(--border);overflow:hidden;
      margin-bottom:14px;position:relative;
    }
    .id-avatar img{width:100%;height:100%;object-fit:cover;}
    .id-name{font-size:1.4rem;font-weight:900;margin-bottom:6px;}
    .id-bio{font-size:0.88rem;color:var(--text2);line-height:1.6;max-width:320px;margin:0 auto 4px;}

    .profile-card{
      background:var(--card);
      backdrop-filter:blur(8px);
      border:1px solid var(--border);
      border-radius:24px;
      padding:32px 24px 28px;
      text-align:center;
      margin-bottom:18px;
      box-shadow:0 20px 60px rgba(0,0,0,0.2);
    }

    .avatar-wrap{
      position:relative;
      display:inline-block;
      margin-bottom:16px;
    }
    .avatar{
      width:96px;height:96px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;align-items:center;justify-content:center;
      font-size:2.4rem;font-weight:900;color:#fff;
      border:3px solid var(--border);
      overflow:hidden;
      margin:0 auto;
    }
    .avatar img{width:100%;height:100%;object-fit:cover;}
    .online-dot{
      position:absolute;bottom:4px;right:4px;
      width:14px;height:14px;border-radius:50%;
      background:var(--success);
      border:2px solid var(--bg);
      animation:pulse 2s infinite;
    }
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(10,184,122,.5);}50%{box-shadow:0 0 0 5px rgba(10,184,122,0);}}
    .active-badge{
      display:inline-flex;align-items:center;gap:5px;
      font-size:0.72rem;color:var(--success);font-weight:700;
      background:rgba(10,184,122,0.1);border:1px solid rgba(10,184,122,0.25);
      border-radius:100px;padding:3px 10px;margin-top:8px;
    }
    .active-badge .d{width:6px;height:6px;border-radius:50%;background:var(--success);animation:pulse 2s infinite;}

    /* FEATURED ROTATING LINKS */
    .featured-section{margin-bottom:18px;}
    .featured-title{font-size:0.78rem;font-weight:700;color:var(--muted);text-align:center;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
    .featured-grid{display:flex;gap:8px;}
    .featured-card{
      flex:1;background:var(--card);backdrop-filter:blur(6px);
      border:1px solid var(--border);border-radius:14px;
      padding:12px 8px;text-align:center;text-decoration:none;color:var(--text);
      transition:all .2s;
    }
    .featured-card:hover{border-color:var(--accent);transform:translateY(-2px);}
    .featured-card .fnum{
      font-family:'Space Mono',monospace;font-weight:700;color:var(--accent);
      font-size:1.1rem;margin-bottom:4px;
    }
    .featured-card .flabel{font-size:0.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .profile-name{font-size:1.5rem;font-weight:900;margin-bottom:4px;}
    .profile-handle{
      font-family:'Space Mono',monospace;font-size:0.75rem;
      color:var(--accent);margin-bottom:10px;
    }
    .profile-bio{font-size:0.88rem;color:var(--text2);line-height:1.6;max-width:320px;margin:0 auto 18px;}

    /* SOCIALS ROW */
    .socials-row{
      display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
      margin-bottom:4px;
    }
    .social-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:7px 14px;border-radius:100px;
      background:var(--bg2);border:1px solid var(--border);
      font-size:0.82rem;font-weight:700;color:var(--text2);
      text-decoration:none;transition:all .2s;
    }
    .social-pill:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
    .social-pill .si{font-size:1rem;display:inline-flex;align-items:center;}
    .social-pill .si svg{width:16px;height:16px;}

    /* LOCATION */
    .location-pill{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 14px;border-radius:100px;
      background:var(--bg2);border:1px solid var(--border);
      font-size:0.8rem;color:var(--muted);
      text-decoration:none;margin-top:10px;transition:all .2s;
    }
    .location-pill:hover{border-color:var(--accent2);color:var(--accent2);}
    .location-pill .si{display:inline-flex;align-items:center;}
    .location-pill .si svg{width:14px;height:14px;}

    /* NUMBER BOX */
    .num-section{
      background:var(--card);
      backdrop-filter:blur(8px);
      border:1px solid var(--border);
      border-radius:20px;
      padding:22px 20px;
      margin-bottom:18px;
      box-shadow:0 8px 32px rgba(0,0,0,0.12);
    }
    .num-label{
      font-size:0.78rem;font-weight:700;
      color:var(--muted);text-align:center;
      letter-spacing:1px;text-transform:uppercase;
      margin-bottom:14px;
    }
    .num-row{display:flex;gap:10px;}
    .num-input{
      flex:1;font-family:'Space Mono',monospace;
      font-size:2.8rem;font-weight:700;text-align:center;
      background:var(--bg2);border:2px solid var(--border);
      border-radius:14px;padding:14px 10px;
      color:var(--text);outline:none;
      transition:border-color .2s,box-shadow .2s;
      -moz-appearance:textfield;
    }
    .num-input::-webkit-outer-spin-button,.num-input::-webkit-inner-spin-button{-webkit-appearance:none;}
    .num-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-light);}
    .num-input.shake{animation:shake .3s;}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .go-btn{
      width:72px;background:var(--accent);color:#fff;
      border:none;border-radius:14px;font-size:1.6rem;
      cursor:pointer;transition:all .2s;
      box-shadow:0 4px 16px rgba(61,90,241,0.3);
    }
    .go-btn:hover{filter:brightness(1.1);transform:scale(1.04);}
    .err-msg{
      font-size:0.8rem;color:var(--accent2);text-align:center;
      margin-top:10px;display:none;font-weight:700;
    }
    .err-msg.show{display:block;}
    .quick-btns{
      display:flex;gap:8px;justify-content:center;
      margin-top:12px;flex-wrap:wrap;
    }
    .qbtn{
      width:44px;height:44px;border-radius:10px;
      background:var(--bg2);border:1px solid var(--border);
      color:var(--muted);font-family:'Space Mono',monospace;
      font-size:1rem;cursor:pointer;transition:all .15s;
    }
    .qbtn:hover{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}

    /* LINKS LIST */
    .links-section{display:flex;flex-direction:column;gap:10px;}
    .link-card{
      display:flex;align-items:center;gap:14px;
      background:var(--card);backdrop-filter:blur(6px);
      border:1px solid var(--border);border-radius:16px;
      padding:14px 16px;text-decoration:none;color:var(--text);
      transition:all .22s;
      box-shadow:0 2px 12px rgba(0,0,0,0.08);
    }
    .link-card:hover{
      border-color:var(--accent);
      transform:translateY(-2px);
      box-shadow:0 8px 28px rgba(61,90,241,0.15);
    }
    .link-num{
      min-width:42px;height:42px;border-radius:11px;
      background:var(--accent-light);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;
      color:var(--accent);flex-shrink:0;
    }
    .link-info{flex:1;min-width:0;}
    .link-label{font-size:0.95rem;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .link-desc{font-size:0.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .link-arrow{color:var(--muted);font-size:1.1rem;flex-shrink:0;}

    /* NOT FOUND */
    .not-found{text-align:center;padding:80px 20px;}
    .not-found .nf-icon{font-size:4rem;margin-bottom:16px;}
    .not-found h2{font-size:1.4rem;font-weight:900;margin-bottom:8px;}
    .not-found p{color:var(--muted);margin-bottom:24px;}
    .not-found a{display:inline-block;padding:12px 28px;background:var(--accent);color:#fff;border-radius:10px;text-decoration:none;font-weight:700;}

    /* LOADING */
    .loading-wrap{min-height:60vh;display:flex;align-items:center;justify-content:center;}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* FOOTER */
    .page-footer{text-align:center;margin-top:28px;font-size:0.75rem;color:var(--muted);}
    .page-footer a{color:var(--accent);text-decoration:none;font-family:'Space Mono',monospace;}
  </style>
</head>
<body>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>

  <div class="page-wrap" id="mainContent">
    <div class="loading-wrap"><div class="spinner"></div></div>
  </div>

  <div class="page-wrap" id="notFoundContent" style="display:none;">
    <div class="not-found">
      <div class="nf-icon">🔍</div>
      <h2>الحساب غير موجود</h2>
      <p>تأكد من كتابة اسم المستخدم بشكل صحيح في الرابط.</p>
      <a href="index.html">العودة للرئيسية</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAXGBAN7h493PqS8wNcQQ6N62SoSYz6wSg",
      authDomain: "electrwni-link.firebaseapp.com",
      projectId: "electrwni-link",
      storageBucket: "electrwni-link.firebasestorage.app",
      messagingSenderId: "712490301263",
      appId: "1:712490301263:web:2084210da3f687285ab73a"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Theme
    const th = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', th);
    document.getElementById('themeBtn').textContent = th === 'dark' ? '☀️' : '🌙';
    function toggleTheme() {
      const c = document.documentElement.getAttribute('data-theme');
      const n = c === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      localStorage.setItem('theme', n);
      document.getElementById('themeBtn').textContent = n === 'dark' ? '☀️' : '🌙';
    }

    function hashCode(s) {
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i) | 0;
      return h;
    }

    function getUsername() {
      const hash = location.hash.replace('#','').split('?')[0];
      if (hash) return hash;
      return new URLSearchParams(location.search).get('u');
    }

    // ═══ مكتبة الأيقونات الموحدة (تصميم خطي) ═══
    const ICONS = {
      instagram:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="3.8" stroke="currentColor" stroke-width="1.7"/><circle cx="17.2" cy="6.8" r="1" fill="currentColor"/></svg>',
      tiktok:'<svg viewBox="0 0 24 24" fill="none"><path d="M14 3v10.8a3.7 3.7 0 1 1-3.7-3.7c.3 0 .6.03.9.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M14 3c.3 2.2 2 3.9 4.2 4.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
      twitter:'<svg viewBox="0 0 24 24" fill="none"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
      youtube:'<svg viewBox="0 0 24 24" fill="none"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 9.3v5.4l4.5-2.7-4.5-2.7z" fill="currentColor"/></svg>',
      snapchat:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.2c3 0 4.6 2.3 4.6 5 0 .9.1 1.6.4 2 .4.5 1.2.7 1.2 1.3 0 .7-.9 1-1.6 1.2-.2 1-.6 1.7-1.2 2.2-.2.4.1.9.5 1 .6.3.1.9-.5 1-1.7.2-2.2.4-2.2.9-.6.7-1.4 1.3-2.1 1.3s-1.4-.6-2.1-1.3c-.4-.5-1.4-.7-2.2-.9-.6-.1-1.1-.7-.5-1 .4-.1.7-.6.5-1-.6-.5-1-1.2-1.2-2.2-.7-.2-1.6-.5-1.6-1.2 0-.6.8-.8 1.2-1.3.3-.4.4-1.1.4-2C7.4 5.5 9 3.2 12 3.2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
      whatsapp:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5a8.5 8.5 0 0 0-7.4 12.8L3.5 20.5l4.3-1.1A8.5 8.5 0 1 0 12 3.5z" stroke="currentColor" stroke-width="1.6"/><path d="M8.7 9.3c0 3.4 2.8 6.1 6.1 6.1l1-1.9-2.4-1-1 .9c-.9-.5-1.7-1.3-2.2-2.2l.9-1-1-2.4-2 .6z" fill="currentColor"/></svg>',
      telegram:'<svg viewBox="0 0 24 24" fill="none"><path d="M21 4L3 11l6 2.2L11 19l3-4 4 3 3-14z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 13.2L18 7" stroke="currentColor" stroke-width="1.4"/></svg>',
      linkedin:'<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="currentColor" stroke-width="1.7"/><circle cx="7.7" cy="8" r="1" fill="currentColor"/><path d="M7.7 11v6M11.3 17v-4.2c0-1.5 1-2.4 2.3-2.4s2.4 1 2.4 2.5V17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
      facebook:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M14 8.2h-1.3c-.9 0-1.5.6-1.5 1.5V11h2.6l-.4 2.1h-2.2V18h-2v-4.9H7.5V11h1.7V9.4c0-1.7 1.2-3 3-3H14v1.8z" fill="currentColor"/></svg>',
      website:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3 12h18M12 3c2.5 2.3 4 5.6 4 9s-1.5 6.7-4 9c-2.5-2.3-4-5.6-4-9s1.5-6.7 4-9z" stroke="currentColor" stroke-width="1.4"/></svg>',
      location:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-5.4-7-11a7 7 0 1 1 14 0c0 5.6-7 11-7 11z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.4"/></svg>'
    };
    const socNames  = {instagram:'إنستقرام',tiktok:'تيك توك',twitter:'تويتر',youtube:'يوتيوب',snapchat:'سناب',whatsapp:'واتساب',telegram:'تيليقرام',linkedin:'لينكدإن',facebook:'فيسبوك',website:'الموقع'};
    const socUrls   = {
      instagram: u => 'https://instagram.com/'  + u.replace('@',''),
      tiktok:    u => 'https://tiktok.com/@'    + u.replace('@',''),
      twitter:   u => 'https://x.com/'          + u.replace('@',''),
      youtube:   u => u.startsWith('http') ? u : 'https://youtube.com/@' + u.replace('@',''),
      snapchat:  u => 'https://snapchat.com/add/'+ u.replace('@',''),
      whatsapp:  u => 'https://wa.me/'           + u.replace(/\D/g,''),
      telegram:  u => 'https://t.me/'            + u.replace('@',''),
      linkedin:  u => u.startsWith('http') ? u : 'https://linkedin.com/in/' + u.replace('@',''),
      facebook:  u => u.startsWith('http') ? u : 'https://facebook.com/'   + u.replace('@',''),
      website:   u => u.startsWith('http') ? u : 'https://' + u,
    };

    let userLinks = [];
    let pageUsername = '';

    async function init() {
      const username = getUsername();
      if (!username) { showNotFound(); return; }
      pageUsername = username;

      try {
        const doc = await db.collection('users').doc(username).get();
        if (!doc.exists) { showNotFound(); return; }
        const user = doc.data();
        userLinks = (user.links || []).sort((a,b) => a.num - b.num);
        renderPage(user);
      } catch(e) {
        showNotFound();
      }
    }

    function renderPage(user) {
      const socials  = user.socials || [];
      const links    = userLinks;
      document.title = (user.displayName || user.username) + ' — electrwni.link';

      // Build avatar
      let avatarHTML = '';
      if (user.avatar) {
        avatarHTML = `<img src="${user.avatar}" alt="avatar" onerror="this.parentElement.innerHTML='${(user.displayName||user.username)[0].toUpperCase()}'">`;
      } else {
        avatarHTML = (user.displayName || user.username)[0].toUpperCase();
      }

      // Build socials
      const socialsHTML = socials.map(s => {
        const url = (socUrls[s.platform] || (u=>u))(s.username);
        return `<a class="social-pill" href="${url}" target="_blank" rel="noopener">
          <span class="si">${ICONS[s.platform]||ICONS.website}</span>
          <span>${socNames[s.platform]||s.platform}</span>
        </a>`;
      }).join('');

      // Location pill
      const locationHTML = user.location
        ? `<a class="location-pill" href="https://maps.google.com/?q=${encodeURIComponent(user.location)}" target="_blank">
            <span class="si">${ICONS.location}</span> ${user.location}
          </a>`
        : '';

      // Quick buttons
      const quickHTML = links.map(l =>
        `<button class="qbtn" onclick="quickGo(${l.num})">${l.num}</button>`
      ).join('');

      // Featured rotating links (changes every 2 hours)
      let featuredHTML = '';
      if (links.length >= 2) {
        const slot = Math.floor(Date.now() / (2*60*60*1000)); // يتغير كل ساعتين
        const shuffled = [...links].sort((a,b) => {
          const ha = hashCode(a.id + '-' + slot);
          const hb = hashCode(b.id + '-' + slot);
          return ha - hb;
        });
        const picked = shuffled.slice(0, Math.min(3, links.length));
        featuredHTML = `
          <div class="featured-section">
            <div class="featured-title">✨ روابط مميزة</div>
            <div class="featured-grid">
              ${picked.map(l => `
                <a class="featured-card" href="${l.url}" onclick="trackClick('${user.username}',${l.id},event)">
                  <div class="fnum">${l.num}</div>
                  <div class="flabel">${l.label}</div>
                </a>
              `).join('')}
            </div>
          </div>`;
      }

      // Build link cards
      const linksHTML = links.map(l =>
        `<a class="link-card" href="${l.url}" onclick="trackClick('${user.username}',${l.id},event)">
          <div class="link-num">${l.num}</div>
          <div class="link-info">
            <div class="link-label">${l.label}</div>
            ${l.desc ? `<div class="link-desc">${l.desc}</div>` : ''}
          </div>
          <div class="link-arrow">→</div>
        </a>`
      ).join('');

      document.getElementById('mainContent').innerHTML = `
        <!-- IDENTITY STRIP -->
        <div class="profile-card">
          <div class="identity-strip">
            <div class="id-username">electrwni.link/${user.username}</div>
            <div class="id-avatar">${avatarHTML}</div>
            <h1 class="id-name">${user.displayName || user.username}</h1>
            ${user.bio ? `<p class="id-bio">${user.bio}</p>` : ''}
          </div>
          <div class="socials-row">${socialsHTML}</div>
          ${locationHTML}
          <div><span class="active-badge"><span class="d"></span> نشط الآن</span></div>
        </div>

        ${featuredHTML}

        <!-- NUMBER BOX -->
        <div class="num-section">
          <div class="num-label">اكتب رقم للانتقال فوراً</div>
          <div class="num-row">
            <input class="num-input" type="number" id="numIn" placeholder="0" min="1" max="9" inputmode="numeric">
            <button class="go-btn" onclick="goNav()">→</button>
          </div>
          <div class="err-msg" id="errMsg">⚠ الرقم غير مسجل لهذا الحساب</div>
          <div class="quick-btns">${quickHTML}</div>
        </div>

        <!-- LINKS -->
        <div class="links-section">${linksHTML}</div>

        <div class="page-footer">
          بواسطة <a href="index.html">electrwni.link</a>
        </div>
      `;

      // Attach input listener
      document.getElementById('numIn').addEventListener('keydown', e => { if(e.key==='Enter') goNav(); });
      document.getElementById('numIn').addEventListener('input', () => {
        document.getElementById('errMsg').classList.remove('show');
        const v = document.getElementById('numIn').value;
        if (v.length >= 1) setTimeout(goNav, 400);
      });
    }

    function goNav() { navigate(parseInt(document.getElementById('numIn').value)); }
    function quickGo(n) { document.getElementById('numIn').value = n; navigate(n); }

    function navigate(n) {
      if (!n) return;
      const lnk = userLinks.find(l => l.num === n);
      if (lnk) {
        trackClick(pageUsername, lnk.id, null);
        window.location.href = lnk.url;
      } else {
        const inp = document.getElementById('numIn');
        inp.classList.add('shake');
        document.getElementById('errMsg').classList.add('show');
        setTimeout(() => inp.classList.remove('shake'), 400);
      }
    }

    async function trackClick(username, linkId, event) {
      if (event) event.preventDefault();
      try {
        const ref = db.collection('users').doc(username);
        await db.runTransaction(async tx => {
          const doc = await tx.get(ref);
          if (!doc.exists) return;
          let links = doc.data().links || [];
          
          // Track total clicks
          const i = links.findIndex(l => l.id === linkId);
          if (i !== -1) {
            links[i].clicks = (links[i].clicks || 0) + 1;
            
            // Track clicks by period
            const now = new Date();
            const todayKey = now.toISOString().slice(0,10); // YYYY-MM-DD
            const weekKey  = getWeekKey(now);
            const monthKey = now.toISOString().slice(0,7);  // YYYY-MM
            const yearKey  = now.getFullYear().toString();

            if (!links[i].clicksByDay)   links[i].clicksByDay   = {};
            if (!links[i].clicksByWeek)  links[i].clicksByWeek  = {};
            if (!links[i].clicksByMonth) links[i].clicksByMonth = {};
            if (!links[i].clicksByYear)  links[i].clicksByYear  = {};

            links[i].clicksByDay[todayKey]   = (links[i].clicksByDay[todayKey]   || 0) + 1;
            links[i].clicksByWeek[weekKey]   = (links[i].clicksByWeek[weekKey]   || 0) + 1;
            links[i].clicksByMonth[monthKey] = (links[i].clicksByMonth[monthKey] || 0) + 1;
            links[i].clicksByYear[yearKey]   = (links[i].clicksByYear[yearKey]   || 0) + 1;

            tx.update(ref, { links });
          }
        });
      } catch(e) { console.error('track error', e); }

      // Navigate after tracking
      const lnk = userLinks.find(l => l.id === linkId);
      if (lnk) window.location.href = lnk.url;
    }

    function getWeekKey(date) {
      const d = new Date(date);
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);
      const week1 = new Date(d.getFullYear(), 0, 4);
      const wn = 1 + Math.round(((d-week1)/86400000 - 3 + (week1.getDay()+6)%7)/7);
      return d.getFullYear() + '-W' + String(wn).padStart(2,'0');
    }

    function showNotFound() {
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('notFoundContent').style.display = 'block';
    }

    init();
  </script>
</body>
</html>
